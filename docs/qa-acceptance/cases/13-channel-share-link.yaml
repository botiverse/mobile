id: channel-share-link
title: "频道分享-获取并验证频道分享/邀请链接"
app: raft-android
tier: L1
version: "0.2"
description: |
  Regression case from Hands feedback: channel share link issues
  (ticket aa1ec18c). Verify that the channel info/settings page exposes
  a share or invite link that can be copied. This case tests the share
  link UI flow — generating and viewing the link, not deeplink routing
  (the app does not have a channel deeplink intent in AndroidManifest).
tags: [navigation, share, regression]
timeout_seconds: 90
max_retries: 1

device:
  type: emulator
  api_level: 34
  locale: en-US

environment:
  server: staging
  credentials_ref: qa-account:slock-test

preconditions:
  - type: app_installed
    params: { package: build.raft.app }
  - type: logged_in

cleanup:
  - action: stop_app

steps:
  - id: open-channel
    goal: "Open a channel to access its info page"
    action_category: navigate
    hint: "Use deeplink: compose_thread with channelId #all"
    capture: [screenshot]

  - id: wait-messages
    goal: "Wait for channel content to load"
    action_category: wait
    params:
      duration_ms: 1500

  - id: open-channel-info
    goal: "Open channel info/settings page"
    action_category: interact
    hint: "Tap the channel name header at the top of the screen"
    capture: [screenshot, dump_layout]

  - id: wait-info-load
    goal: "Wait for channel info page to load"
    action_category: wait
    params:
      duration_ms: 1500

  - id: find-share-section
    goal: "Look for a share, invite, or copy link section in the channel info"
    action_category: interact
    hint: "Scroll through the channel info page. Look for 'Share', 'Invite', 'Copy Link', 'Invite Link' or similar"
    capture: [screenshot, dump_layout]

  - id: tap-share-or-copy
    goal: "Tap the share/invite/copy link button"
    action_category: interact
    hint: "Tap the share or copy link button. A toast or confirmation should appear"
    on_failure: abort
    capture: [screenshot, dump_layout]

  - id: wait-confirmation
    goal: "Wait for share action confirmation"
    action_category: wait
    params:
      duration_ms: 1500

  - id: verify-share-result
    goal: "Capture the state after attempting to share/copy the link"
    action_category: verify
    capture: [screenshot, dump_layout]

assertions:
  - id: share-link-available
    goal: "A share link or invite option was found and is functional in the channel info page"
    type: visual_check
    after_step: verify-share-result
    severity: major
    highlight:
      description: "Share/invite section or copy confirmation"

  - id: share-success-indicator
    goal: "Some confirmation that the link was copied or shared (toast, snackbar, or clipboard indicator)"
    type: visual_check
    after_step: verify-share-result
    severity: major

  - id: no-share-error
    goal: "No error when accessing share functionality"
    type: text_absent
    params:
      text_match_regex: "(?i)(error|failed|unavailable|not supported)"
    after_step: verify-share-result
    severity: major

  - id: no-crash-share
    goal: "App must not crash during share flow"
    type: no_crash
    after_step: verify-share-result
    severity: critical

expected:
  result: pass
  notes: |
    Regression from Hands feedback aa1ec18c (channel share link issues).
    v0.2: Removed the deeplink/intent step — the app does not have a
    channel deeplink in AndroidManifest. This case now tests the share
    link UI flow (find → copy → confirm) rather than deeplink routing.
