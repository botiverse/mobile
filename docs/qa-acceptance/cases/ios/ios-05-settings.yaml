id: ios-settings-navigate
title: "[iOS] 设置页-打开设置并浏览子页面"
app: raft-ios
tier: L1
version: "0.1"
description: |
  iOS variant of case-05. Verify settings page opens and sub-pages are accessible.
tags: [settings, navigation, ios, regression]
timeout_seconds: 120
max_retries: 1
verdict_before_cleanup: true

device:
  type: ios-simulator
  device_name: iPhone 16
  locale: en-US

environment:
  server: staging
  credentials_ref: qa-account:slock-test

preconditions:
  - type: app_installed
    params: { bundle_id: build.raft.app }
  - type: logged_in

cleanup:
  - action: terminate_app

steps:
  - id: open-settings
    goal: "Open the Settings page"
    action_category: navigate
    hint: "Navigate to Settings from the app navigation"
    capture: [screenshot]

  - id: tap-account
    goal: "Tap 'Account' to open account settings"
    action_category: interact
    capture: [screenshot]

  - id: wait-account
    goal: "Wait for account page to load"
    action_category: wait
    params:
      duration_ms: 1500

  - id: capture-account
    goal: "Capture account settings page"
    action_category: verify
    capture: [screenshot]

  - id: go-back
    goal: "Navigate back to settings root"
    action_category: navigate
    hint: "Use the back button in the top-left (iOS style) or swipe from left edge"

  - id: tap-storage
    goal: "Tap 'Storage' to open storage settings"
    action_category: interact
    capture: [screenshot]

  - id: capture-storage
    goal: "Capture storage settings page"
    action_category: verify
    capture: [screenshot]

assertions:
  - id: settings-list-visible
    goal: "Settings root shows navigation items"
    type: visual_check
    after_step: open-settings
    severity: major

  - id: account-page-loaded
    goal: "Account page shows account info"
    type: visual_check
    after_step: capture-account
    severity: major

  - id: storage-page-loaded
    goal: "Storage page shows storage options"
    type: visual_check
    after_step: capture-storage
    severity: major

  - id: no-crash-settings
    goal: "No crashes during settings navigation"
    type: no_crash
    after_step: capture-storage
    severity: critical

expected:
  result: pass
  notes: "iOS variant. Back navigation uses iOS conventions (left-edge swipe or back button)."
