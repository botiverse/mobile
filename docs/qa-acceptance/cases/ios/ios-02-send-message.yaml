id: ios-send-message
title: "[iOS] 发送消息-频道内发送文本消息"
app: raft-ios
tier: L1
version: "0.1"
description: |
  iOS variant of case-02. Verify sending a text message in a channel.
tags: [messaging, send, critical, ios, regression]
timeout_seconds: 120
max_retries: 1
verdict_before_cleanup: true

device:
  type: ios-simulator
  device_name: iPhone 16
  locale: en-US

environment:
  server: staging
  credentials_ref: qa-account:slock-test

preconditions:
  - type: app_installed
    params: { bundle_id: build.raft.app }
  - type: logged_in

cleanup:
  - action: terminate_app

steps:
  - id: open-channel
    goal: "Open #all channel"
    action_category: navigate
    hint: "Navigate to #all channel from the channel list"
    capture: [screenshot]

  - id: focus-input
    goal: "Tap the message input field to focus it"
    action_category: interact
    capture: [screenshot]

  - id: type-message
    goal: "Type a test message"
    action_category: input
    params:
      text: "QA iOS test message - automated acceptance check"
    capture: [screenshot]

  - id: send-message
    goal: "Tap the send button"
    action_category: interact
    hint: "Send button, usually bottom-right of input field"
    on_failure: abort
    capture: [screenshot]

  - id: wait-delivery
    goal: "Wait for message delivery"
    action_category: wait
    params:
      duration_ms: 2000

  - id: verify-sent
    goal: "Capture conversation showing sent message"
    action_category: verify
    capture: [screenshot]

assertions:
  - id: message-appears
    goal: "Sent message appears in conversation"
    type: text_present
    params:
      text: "QA iOS test message"
    after_step: verify-sent
    severity: critical

  - id: input-cleared
    goal: "Input field cleared after sending"
    type: visual_check
    after_step: verify-sent
    severity: major

  - id: no-send-error
    goal: "No send errors"
    type: text_absent
    params:
      text_match_regex: "(?i)(failed|error|retry)"
    after_step: verify-sent
    severity: major

expected:
  result: pass
  notes: "iOS variant of send-message. iOS keyboard may need dismissal via swipe."
