id: ios-feedback-submit
title: "[iOS] 反馈上传-设置页提交反馈"
app: raft-ios
tier: L1
version: "0.1"
description: |
  iOS variant of case-06. Verify in-app feedback submission works.
  Includes api_check (hands feedback ticket server-side verification).
tags: [feedback, settings, hands-integration, ios, critical, regression]
timeout_seconds: 120
max_retries: 1
verdict_before_cleanup: true

device:
  type: ios-simulator
  device_name: iPhone 16
  locale: en-US

environment:
  server: staging
  credentials_ref: qa-account:slock-test

preconditions:
  - type: app_installed
    params: { bundle_id: build.raft.app }
  - type: logged_in

cleanup:
  - action: terminate_app

steps:
  - id: open-settings
    goal: "Open the Settings page"
    action_category: navigate
    capture: [screenshot]

  - id: find-feedback
    goal: "Find and tap 'Send feedback' in settings"
    action_category: interact
    hint: "Text says 'Send feedback', scroll if needed"
    capture: [screenshot]

  - id: write-message
    goal: "Type test feedback message"
    action_category: input
    params:
      text: "QA iOS feedback test argus-ios-c06-r1"
    capture: [screenshot]

  - id: submit-feedback
    goal: "Tap submit/send button"
    action_category: interact
    on_failure: abort
    capture: [screenshot]

  - id: wait-submission
    goal: "Wait for feedback submission"
    action_category: wait
    params: { duration_ms: 5000 }

  - id: verify-success
    goal: "Capture result after submission"
    action_category: verify
    capture: [screenshot]

assertions:
  - id: submission-success
    goal: "Success indicator visible (ticket number, 'Feedback sent', etc.)"
    type: visual_check
    after_step: verify-success
    severity: critical

  - id: no-error
    goal: "No error messages"
    type: text_absent
    params:
      text_match_regex: "(?i)(failed|error|try again|unable)"
    after_step: verify-success
    severity: critical

  - id: ticket-created-server-side
    goal: "Verify feedback ticket created in Hands"
    type: api_check
    params:
      service: quiver
      action: "feedback list raft-ios --json"
      assertion: "latest ticket message contains 'argus-ios-c06-r1'"
    after_step: verify-success
    severity: critical

  - id: no-crash
    goal: "No crash during feedback flow"
    type: no_crash
    after_step: verify-success
    severity: critical

expected:
  result: pass
  notes: |
    iOS variant with server-side verification (api_check).
    Marker 'argus-ios-c06-r1' for hands ticket lookup.
