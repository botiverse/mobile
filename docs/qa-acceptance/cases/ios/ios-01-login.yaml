id: ios-login-email-password
title: "[iOS] 登录-邮箱密码登录"
app: raft-ios
tier: L1
version: "0.1"
description: |
  iOS variant of case-01. Verify that a user can sign in with email and
  password on iOS Simulator. Key differences from Android:
  - No hardware BACK key — use swipe-down or navigation back button
  - Keyboard may behave differently (iOS keyboard accessory)
  - No adb — use ios-use CLI (simctl)
tags: [auth, login, critical, ios, regression]
timeout_seconds: 120
max_retries: 1
verdict_before_cleanup: true

device:
  type: ios-simulator
  device_name: iPhone 16
  locale: en-US

environment:
  server: staging
  credentials_ref: qa-account:slock-test

preconditions:
  - type: app_installed
    params: { bundle_id: build.raft.app }
  - type: logged_out

cleanup:
  - action: terminate_app

steps:
  - id: launch-app
    goal: "Launch the Raft app from cold start"
    action_category: launch
    hint: "Use: ios-use launch"
    capture: [screenshot]

  - id: enter-email
    goal: "Enter the QA test account email in the email field"
    action_category: input
    hint: "The email input field on the login screen. Use ios-use interact to tap and type"
    params:
      text: "${QA_EMAIL}"
    capture: [screenshot]

  - id: enter-password
    goal: "Enter the QA test account password"
    action_category: input
    hint: "The password input field"
    params:
      text: "${QA_PASSWORD}"
    capture: [screenshot]

  - id: tap-login
    goal: "Tap the login/sign-in button"
    action_category: interact
    hint: "The login button, usually labeled 'Sign In' or similar"
    on_failure: abort
    capture: [screenshot]

  - id: wait-home
    goal: "Wait for home screen to load after authentication"
    action_category: wait
    params:
      duration_ms: 3000

  - id: verify-home
    goal: "Capture home screen state"
    action_category: verify
    capture: [screenshot]

assertions:
  - id: no-crash-during-login
    goal: "App must not crash during login flow"
    type: no_crash
    after_step: tap-login
    severity: critical

  - id: home-channel-list-visible
    goal: "Channel list must be visible after successful login"
    type: visual_check
    after_step: verify-home
    severity: critical

  - id: no-error-toast
    goal: "No error messages visible after successful login"
    type: text_absent
    params:
      text_match_regex: "(?i)(error|failed|invalid|incorrect)"
    after_step: verify-home
    severity: major

expected:
  result: pass
  notes: |
    iOS variant of login case. Key platform differences:
    - Use ios-use CLI instead of android-use/adb
    - No BACK key — iOS uses swipe gestures or navigation buttons
    - Keyboard dismissal: tap outside or swipe down
    - Screenshots via ios-use screenshot (simctl)
