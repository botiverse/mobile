id: login-email-password
title: "登录-邮箱密码登录"
goal: "验证用户能用邮箱和密码登录，登录后看到频道列表"
tier: L1
max_retries: 1
auth_fixture: alpha-qa
launch_route: compose_slock_app_shell
assertions:
  - id: no-crash-login
    goal: "登录过程中无 crash"
    type: no_crash
    severity: critical
  - id: home-channel-list-visible
    goal: "登录后频道列表可见"
    type: visual_check
    severity: critical
  - id: no-error-toast
    goal: "登录后无错误提示"
    type: text_absent
    params:
      text_match_regex: "(?i)(error|failed|invalid|incorrect)"
    severity: major
android:
  device:
    type: emulator
    api_level: 34
  steps:
    - goal: "启动 app（冷启动）"
      capture: [screenshot]
    - goal: "输入 QA 测试账号邮箱"
      hint: "email 输入框"
      capture: [screenshot]
    - goal: "输入 QA 测试账号密码"
      hint: "password 输入框"
      capture: [screenshot]
    - goal: "点击登录按钮"
      hint: "登录按钮，文本可能是 Sign In"
      capture: [screenshot, dump_layout]
    - goal: "等待 home 加载"
      hint: "wait 3s"
    - goal: "截图验证 home 状态"
      capture: [screenshot, dump_layout]
ios:
  device:
    type: ios-simulator
    device_name: "iPhone 14"
  steps:
    - goal: "启动 app（冷启动）"
      capture: [screenshot]
    - goal: "输入 QA 测试账号邮箱"
      hint: "email 输入框。键盘弹出后可能需要重新 dump 算坐标"
      capture: [screenshot]
    - goal: "输入 QA 测试账号密码"
      hint: "password 输入框"
      capture: [screenshot]
    - goal: "点击登录按钮"
      hint: "登录按钮。用 tap_text 如有文字标签"
      capture: [screenshot]
    - goal: "选择 OranixSlockTest server（如果出现服务器选择页）"
      hint: "如果有多服务器选择，选 OranixSlockTest"
      capture: [screenshot]
    - goal: "等待 home 加载"
      hint: "wait 3s"
    - goal: "截图验证 home 状态"
      capture: [screenshot]
