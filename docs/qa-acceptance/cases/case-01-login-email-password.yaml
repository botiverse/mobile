id: login-email-password
title: "登录-邮箱密码登录"
app: raft-android
tier: L1
version: "0.1"
description: |
  Verify that a user can sign in with email and password.
  This is the most fundamental acceptance path — if login is broken,
  nothing else can be tested. Covers: login form rendering, credential
  input, authentication, and navigation to home screen.
tags: [auth, login, critical, regression]
timeout_seconds: 90
max_retries: 2
auth_fixture: alpha-qa
launch_route: compose_slock_app_shell

device:
  type: emulator
  api_level: 34
  locale: en-US

environment:
  server: staging
  credentials_ref: qa-account:slock-test

preconditions:
  - type: app_installed
    params: { package: build.raft.app }
  - type: logged_out

cleanup:
  - action: stop_app

steps:
  - id: launch-app
    action: launch
    description: "Launch the Raft app from cold start"
    capture: [screenshot]

  - id: enter-email
    action: input
    params:
      field_selector: "email-input"
      text: "${QA_EMAIL}"
    description: "Enter the QA test account email"
    capture: [screenshot]

  - id: enter-password
    action: input
    params:
      field_selector: "password-input"
      text: "${QA_PASSWORD}"
    description: "Enter the QA test account password"
    capture: [screenshot]

  - id: tap-login
    action: tap
    params:
      element: "login-button"
    description: "Tap the login/sign-in button"
    on_failure: abort
    capture: [screenshot, dump_layout]

  - id: wait-home
    action: wait
    params:
      duration_ms: 3000
    description: "Wait for home screen to load after authentication"

  - id: verify-home
    action: screenshot
    description: "Capture home screen state for assertion"
    capture: [screenshot, dump_layout]

assertions:
  - id: no-crash-during-login
    type: no_crash
    after_step: tap-login
    severity: critical
    description: "App must not crash during login flow"

  - id: home-channel-list-visible
    type: element_visible
    params:
      resource_id: "channel-list"
    after_step: verify-home
    severity: critical
    description: "Channel list must be visible after successful login"

  - id: no-error-toast
    type: text_not_visible
    params:
      text_match_regex: "(?i)(error|failed|invalid|incorrect)"
    after_step: verify-home
    severity: major
    description: "No error messages should be visible after successful login"

  - id: home-screenshot-baseline
    type: screenshot_similarity
    params:
      baseline: "home-after-login"
      threshold: 0.90
    after_step: verify-home
    severity: minor
    description: "Home screen should match visual baseline (allowing for dynamic content)"

expected:
  result: pass
  notes: "Standard happy-path login. If this fails, all other cases are blocked."
