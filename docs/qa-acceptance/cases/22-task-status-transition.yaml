id: task-status-transition
title: "Task-任务状态流转"
goal: "验证task状态流转：Todo→InProgress→Done"
tier: L1
max_retries: 1
auth_fixture: alpha-qa
launch_route: compose_slock_app_shell
assertions:
  - id: status-change-worked
    goal: "状态变更可见且生效"
    type: visual_check
    severity: critical
  - id: no-status-error
    goal: "无Could not update status错误"
    type: text_absent
    params:
      text_match_regex: "(?i)(could not update status|error|failed)"
    severity: major
android:
  device: { type: emulator, api_level: 34 }
  steps:
    - goal: "找到或创建一个task消息"
      capture: [screenshot]
    - goal: "长按task消息"
      capture: [screenshot]
    - goal: "改状态为In Progress"
      capture: [screenshot]
    - goal: "验证状态变更"
      capture: [screenshot]
    - goal: "长按再改状态为Done"
      capture: [screenshot]
    - goal: "验证状态变更"
      capture: [screenshot]
ios:
  device: { type: ios-simulator, device_name: "iPhone 14" }
  steps:
    - goal: "找到或创建一个task"
      capture: [screenshot]
    - goal: "长按task消息"
      capture: [screenshot]
    - goal: "改状态为In Progress"
      capture: [screenshot]
    - goal: "验证状态"
      capture: [screenshot]
    - goal: "改状态为Done"
      capture: [screenshot]
    - goal: "验证"
      capture: [screenshot]
