id: image-preview-in-thread
title: "图片预览-对话流中查看图片"
goal: "验证点击对话中的图片能打开全屏预览"
tier: L1
max_retries: 1
auth_fixture: alpha-qa
launch_route: compose_slock_app_shell
assertions:
  - id: preview-opened
    goal: "图片预览/viewer打开"
    type: visual_check
    severity: critical
  - id: image-rendered
    goal: "图片实际渲染（非空白/占位）"
    type: visual_check
    severity: critical
android:
  device: { type: emulator, api_level: 34 }
  steps:
    - goal: "打开有图片消息的频道"
      capture: [screenshot]
    - goal: "滚动找到图片消息"
      capture: [screenshot]
    - goal: "点击图片打开预览"
      capture: [screenshot, dump_layout]
    - goal: "等待预览加载"
      hint: "wait 2s"
    - goal: "截图验证预览"
      capture: [screenshot]
ios:
  device: { type: ios-simulator, device_name: "iPhone 14" }
  steps:
    - goal: "打开有图片消息的频道"
      capture: [screenshot]
    - goal: "滚动找到图片消息"
      capture: [screenshot]
    - goal: "点击图片打开预览"
      capture: [screenshot]
    - goal: "等待预览加载"
      hint: "wait 2s"
    - goal: "截图验证预览"
      capture: [screenshot]
