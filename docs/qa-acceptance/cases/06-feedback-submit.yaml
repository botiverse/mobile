id: settings-feedback-submit
title: "反馈上传-设置页提交反馈"
goal: "验证用户能在设置页提交反馈，反馈成功上传并创建工单"
tier: L1
max_retries: 1
auth_fixture: alpha-qa
launch_route: compose_slock_app_shell
assertions:
  - id: submission-success
    goal: "提交后有成功指示（ticket号/Feedback sent）"
    type: visual_check
    severity: critical
  - id: no-error
    goal: "无错误消息"
    type: text_absent
    params:
      text_match_regex: "(?i)(failed|error|try again|unable)"
    severity: critical
  - id: ticket-created-server-side
    goal: "Hands 服务端确认工单已创建"
    type: api_check
    severity: critical
android:
  device: { type: emulator, api_level: 34 }
  steps:
    - goal: "打开设置页"
      capture: [screenshot]
    - goal: "找到并点击 Send feedback"
      hint: "可能需要滚动"
      capture: [screenshot]
    - goal: "输入测试反馈消息"
      capture: [screenshot]
    - goal: "点击提交按钮"
      capture: [screenshot]
    - goal: "等待提交完成"
      hint: "wait 5s"
    - goal: "截图验证提交结果"
      capture: [screenshot]
ios:
  device: { type: ios-simulator, device_name: "iPhone 14" }
  steps:
    - goal: "打开设置页"
      capture: [screenshot]
    - goal: "找到并点击 Send feedback"
      capture: [screenshot]
    - goal: "输入测试反馈消息"
      hint: "用屏幕键盘输入"
      capture: [screenshot]
    - goal: "点击提交按钮"
      capture: [screenshot]
    - goal: "等待提交完成"
      hint: "wait 5s"
    - goal: "截图验证提交结果"
      capture: [screenshot]
