id: dm-open-and-send
title: "私信-打开DM并发送消息"
goal: "验证打开DM对话并发送消息功能正常"
tier: L1
max_retries: 1
auth_fixture: alpha-qa
launch_route: compose_slock_app_shell
assertions:
  - id: dm-message-appears
    goal: "发送的DM消息出现在对话中"
    type: text_present
    severity: critical
  - id: no-dm-error
    goal: "无错误"
    type: text_absent
    params:
      text_match_regex: "(?i)(failed|error|unsupport|unable)"
    severity: major
android:
  device: { type: emulator, api_level: 34 }
  steps:
    - goal: "打开 app home"
      capture: [screenshot]
    - goal: "找到并点击一个DM对话"
      capture: [screenshot]
    - goal: "等待DM加载"
      hint: "wait 2s"
    - goal: "输入测试消息"
      capture: [screenshot]
    - goal: "发送消息"
      capture: [screenshot]
    - goal: "等待送达"
      hint: "wait 2s"
    - goal: "截图验证消息"
      capture: [screenshot]
ios:
  device: { type: ios-simulator, device_name: "iPhone 14" }
  steps:
    - goal: "打开 app home"
      capture: [screenshot]
    - goal: "找到并点击一个DM对话"
      capture: [screenshot]
    - goal: "等待DM加载"
      hint: "wait 2s"
    - goal: "输入测试消息"
      hint: "用屏幕键盘"
      capture: [screenshot]
    - goal: "发送消息"
      capture: [screenshot]
    - goal: "等待送达"
      hint: "wait 2s"
    - goal: "截图验证消息"
      capture: [screenshot]
