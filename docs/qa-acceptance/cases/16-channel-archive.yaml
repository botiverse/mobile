id: channel-archive
title: "频道管理-归档频道"
app: raft-android
tier: L1
version: "0.1"
description: |
  Verify that archiving a channel works. User can open channel settings,
  archive the channel, and it disappears from the active channel list
  (or moves to archived section). Must run in test server only.
tags: [channels, archive, regression]
timeout_seconds: 120
verdict_before_cleanup: true
max_retries: 1

device:
  type: emulator
  api_level: 34
  locale: en-US

environment:
  server: staging
  credentials_ref: qa-account:slock-test

preconditions:
  - type: app_installed
    params: { package: build.raft.app }
  - type: logged_in
  - type: in_test_server
  - type: channel_exists
    params:
      channel_prefix: "qa-test-archive"

cleanup:
  - action: stop_app

steps:
  - id: open-channel
    goal: "Create a fresh channel named qa-test-archive-<random 4 digits> and open it"
    action_category: navigate
    hint: "Self-contained: create the channel this case will archive (archive consumes it, so a fixture would fail on the second run), then open it"
    capture: [screenshot]

  - id: open-channel-settings
    goal: "Open channel settings/info"
    action_category: interact
    hint: "Open the qa-test-archive channel, then tap the gear/settings icon at the top-right of the channel header to open channel settings"
    capture: [screenshot, dump_layout]

  - id: find-archive-option
    goal: "Find and tap the Archive option"
    action_category: interact
    hint: "Look for 'Archive Channel' in settings, may need to scroll down"
    capture: [screenshot]

  - id: confirm-archive
    goal: "Confirm the archive action"
    action_category: interact
    hint: "Tap 'Archive' or 'Confirm' in the confirmation dialog"
    on_failure: abort
    capture: [screenshot, dump_layout]

  - id: wait-archive
    goal: "Wait for archive to complete"
    action_category: wait
    params:
      duration_ms: 2000

  - id: verify-channel-list
    goal: "Capture channel list state after archiving"
    action_category: verify
    capture: [screenshot, dump_layout]

assertions:
  - id: channel-archived
    goal: "The archived channel is no longer in the active channel list"
    type: text_absent
    params:
      text_match_regex: "qa-test-archive"
    after_step: verify-channel-list
    severity: critical

  - id: no-archive-error
    goal: "No error during archive"
    type: text_absent
    params:
      text_match_regex: "(?i)(error|failed|permission denied|cannot archive)"
    after_step: verify-channel-list
    severity: major

  - id: no-crash-archive
    goal: "App must not crash during archive"
    type: no_crash
    after_step: verify-channel-list
    severity: critical

expected:
  result: pass
  notes: "Channel lifecycle - archive. Must be in test server only."
