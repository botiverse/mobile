			shellScript = "set -e\n# The Gradle project root is compose/ (gradlew + settings.gradle.kts live there),\n# one level up from this target's $SRCROOT (compose/iosApp).\nGRADLE_ROOT=\"$SRCROOT/..\"\n\"$GRADLE_ROOT/gradlew\" -p \"$GRADLE_ROOT\" :shared:copyFrameworkResourcesToApp \\\n  -Ptmm.resources.BUILT_PRODUCTS_DIR=\"$BUILT_PRODUCTS_DIR\" \\\n  -Ptmm.resources.CONTENTS_FOLDER_PATH=\"$CONTENTS_FOLDER_PATH\" \\\n  -Ptmm.resources.CONFIGURATION=\"$CONFIGURATION\" \\\n  -Ptmm.resources.PLATFORM_NAME=\"$PLATFORM_NAME\" \\\n  -Ptmm.resources.ARCHS=\"$ARCHS\"\n\n# The kmmresource generator packs MR strings but NOT MR/assets into the bundle.\n# The runtime reads assets via the moko convention: relativePath with '/'\n# flattened to '+' and no 'assets/' prefix (see slock_mrBundleURLForRelativePath,\n# #409). Inject every MR/assets file flattened to the bundle root, e.g.\n#   assets/reactions/reaction_atlas_v1.png -> MR.bundle/reactions+reaction_atlas_v1.png\nMR_ASSETS_SRC=\"$GRADLE_ROOT/shared/src/commonMain/resources/MR/assets\"\nMR_BUNDLE_DST=\"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/build.raft.app.resources.MR.bundle\"\nif [ -d \"$MR_ASSETS_SRC\" ] && [ -d \"$MR_BUNDLE_DST\" ]; then\n  # Land under Contents/Resources/ to exactly match the verified-working Debug\n  # simulator bundle shape (KMP task #22 evidence: assets live at\n  # MR.bundle/Contents/Resources/<flattened>); the moko handler checks there\n  # first. Create the dir if the Release bundle didn't have it.\n  MR_DEST=\"$MR_BUNDLE_DST/Contents/Resources\"\n  mkdir -p \"$MR_DEST\"\n  find \"$MR_ASSETS_SRC\" -type f | while IFS= read -r f; do\n    rel=${f#\"$MR_ASSETS_SRC/\"}\n    flat=$(printf '%s' \"$rel\" | tr '/' '+')\n    cp -f \"$f\" \"$MR_DEST/$flat\"\n    echo \"MR asset injected: Contents/Resources/$flat\"\n  done\nelse\n  echo \"warning: MR assets src or bundle dst missing (src=$MR_ASSETS_SRC dst=$MR_BUNDLE_DST)\" >&2\nfi\n";
		};
