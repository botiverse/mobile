[versions]
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.12"
composePlugin = "1.12.2"
# Compose Multiplatform 1.12.x ships Material3 on its own line (1.9.0 = Jetpack Material3 1.4.0).
cmpMaterial3 = "1.9.0"
cmpLifecycle = "2.11.0"
androidxComposeRuntime = "1.12.1"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.12.0"
# Time zones (kotlin.time.Instant API, Kotlin 2.2+).
kotlinxDatetime = "0.7.1"
atomicfu = "0.33.0"
coreKtx = "1.19.1"
media3 = "1.11.1"
coreSplashscreen = "1.2.0"
webkit = "1.18.0"
junit = "4.13.2"
robolectric = "4.17"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
window = "1.5.1"
metricsPerformance = "1.0.0"
activityCompose = "1.13.0"
fragment = "1.9.1"
composeBom = "2026.09.00"
recyclerview = "1.4.0"
# The app's only OkHttp version: under the Ktor HTTP transport (ktor-client-okhttp 3.6.0 is built against
# 5.5.0), and it wins resolution over the transitive OkHttp 3.12 (socket.io-client) and 4.12 (Hands SDK).
okhttpTransport = "5.5.1"
# Ktor client for app HTTP (OkHttp on Android, Darwin on iOS). 3.6.0 is built against kotlinx-coroutines
# 1.11.0, the app's version: Ktor 2.3.7 called coroutines internals 1.11 removed (Hands ae47bba1).
ktor = "3.6.0"
gson = "2.15.0"
socketIoClient = "2.1.2"
sqldelight = "2.4.1"
# Desktop-only embedded WebView: the OS engine through Wry (macOS WKWebView, Windows WebView2,
# Linux WebKitGTK). The last Wry release of ComposeNativeWebView (Apache-2.0); see :shared desktopMain.
# Upstream no longer maintains it (moved to Tao): owned by Lagoon, who forks it if it needs a fix.
# Jar SHA-256 pinned in desktopApp/build.gradle.kts (verifyWryWebviewChecksum): bump both together.
wrywebview = "1.0.0-beta-02"
coil = "3.6.3"
# huarangmeng/latex: message math (task #775). Pure Kotlin, MIT.
hrmLatex = "1.6.1"
# dev.snipme:highlights: message code block syntax colours (artin task #20 lane K). Pure Kotlin
# Multiplatform (jvm + iosArm64/iosSimulatorArm64 klibs), Apache-2.0.
snipmeHighlights = "1.1.0"
# MobileNativeFoundation Store5: offline-first resources (fetcher + SqlDelight-backed source of truth,
# RaftOfflineResources.kt). Apache-2.0; android/jvm/iosArm64/iosSimulatorArm64 klibs; built against
# kotlinx-coroutines / serialization 1.11.0 and atomicfu 0.33.0 (the app's versions). 5.1 is the
# maintained line (5.0.0 is from 2023); beta01 is its latest release.
store5 = "5.1.0-beta01"
androidsvg = "1.4"
mmkv = "2.4.3"
firebaseBom = "35.1.0"
googleServices = "4.5.0"
benchmarkMacro = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"
# Roborazzi: record / verify / compare tasks and diff reports for the design system's desktop
# screenshot tests (compose/designsystem). 1.77.0 is the latest release; its Compose Desktop
# module is built against CMP 1.10.3, aligned to composePlugin by cmp-ui-test-junit4 below.
roborazzi = "1.77.0"

