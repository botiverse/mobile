#Gradle
# -Xss4m: the Compose compiler plugin's DeepCopyIrTreeWithRemappedComposableTypes
# recurses per nested @Composable call and overflows the default JVM thread stack
# when compiling :shared for Kotlin/Native on CI images whose default -Xss is
# smaller than the macOS runner's. A larger stack is
# harmless on every other target — it only reserves more per-thread address space.
# 4 GiB is enough for ONE Kotlin/Native framework link per Gradle invocation.
# An xcodebuild that requests two Simulator slices (generic destination without
# ARCHS, or ARCHS="arm64 x86_64") makes the CocoaPods "Build shared" phase link
# two frameworks in one invocation and the daemon runs out of heap: main run
# 33805615758 died at :shared:linkPodDebugFrameworkIosX64 after 56 min, run
# 33805224692 GC-stalled to the 60-min timeout. ios-simulator-app.yml pins
# ARCHS=arm64 for that reason (task #247). Widening the slice set means either
# raising -Xmx here or linking the slices in separate invocations.
# The Kotlin compile daemon (JVM/Android compiles) needs 6g: at 4g :shared:compileDebugKotlinAndroid
# GC-thrashed for 31 min and died with OutOfMemoryError (test.yml run 42571118161), and a local
# build OOMed at 3g. CI's Android job compiles in-process instead (test.yml "Configure Gradle memory budget").
org.gradle.jvmargs=-Xmx4g -Xss4m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx6g,-Xss4m"
org.gradle.caching=true
#Kotlin
kotlin.code.style=official
kotlin.incremental.native=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
ksp.incremental=false
compose.ios.resources.sync=false
#AGP 9 (9.1.1) default flips, pinned to their AGP 8 values so this upgrade changes no behaviour.
# :androidApp tests the custom `connectedTest` build type; keep host unit tests for every
# build type (testDebugUnitTest is the CI gate).
android.onlyEnableUnitTestForTheTestedBuildType=false
# Library modules (and their tests) keep their own/AGP-8 default targetSdk.
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
# :shared still applies com.android.library next to Kotlin Multiplatform: the KMM resource (MR)
# generator wires its Android resources through the legacy AndroidSourceSet API, and :shared
# relies on build types (Robolectric androidUnitTest, androidInstrumentedTest). AGP 9 only allows
# that with the legacy DSL and with built-in Kotlin off globally (both removed in AGP 10).
# :core/:designsystem/:ui-cmp are on com.android.kotlin.multiplatform.library and :androidApp
# opts into built-in Kotlin per module (com.android.built-in-kotlin).
# TODO(cmp-latest): drop both once :shared is on com.android.kotlin.multiplatform.library.
android.newDsl=false
android.builtInKotlin=false
#Compose UI patch (CMP-10674): ui-iosarm64 / ui-iossimulatorarm64 resolve the patched
# 1.12.2-raft.1 klibs instead of the official ones; see third_party/compose-ui-1.12.2/README.md.
# Read by settings.gradle.kts (repository), build.gradle.kts (version pin) and
# scripts/ci/check_compose_ui_patch_pin.py, which fails once composePlugin in
# gradle/libs.versions.toml is no longer `base`. Delete all four raft.composeUiPatch.* lines to drop the pin.
raft.composeUiPatch.base=1.12.2
raft.composeUiPatch.version=1.12.2-raft.1
# SHA-256 of each patched .klib as published (publish run log; the .module's sha256). The
# verifyComposeUiPatch task fails if the repository serves different bytes.
raft.composeUiPatch.sha256.ui-iosarm64=f847244cdd0b0bf7e7c8df2e88b479d76c0e98cb11735ccbc295a87bc2edd429
raft.composeUiPatch.sha256.ui-iossimulatorarm64=1042ce975bf286f1202f076466bbbc53d81b5145ff7f50929cedfdbe1d61e6dc
