#Compose foundation patch (Android only, "Cannot read CompositionLocal because the Modifier node is
# not currently attached"): androidx.compose.foundation:foundation-android resolves the patched
# 1.12.1-raft.1 AAR instead of the official one; see third_party/compose-foundation-1.12.1/README.md.
# iOS and desktop keep the official JetBrains foundation. Read by settings.gradle.kts (repository)
# and build.gradle.kts (version pin, verifyComposeFoundationPatch, which fails once a Compose
# Multiplatform upgrade moves foundation-android off `base`). Delete all four
# raft.composeFoundationPatch.* lines to drop the pin.
# The Compose Multiplatform version whose Android foundation is `base`:
# org.jetbrains.compose.foundation:foundation-android:1.12.2 depends on androidx.compose.foundation:foundation:1.12.1.
raft.composeFoundationPatch.composeMultiplatform=1.12.2
raft.composeFoundationPatch.base=1.12.1
