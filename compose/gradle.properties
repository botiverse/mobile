#Gradle
# -Xss4m: the Compose compiler plugin's DeepCopyIrTreeWithRemappedComposableTypes
# recurses per nested @Composable call and overflows the default JVM thread stack
# when compiling :shared for Kotlin/Native inside the harmonyos-ci-image container
# (whose default -Xss is smaller than the macOS runner's). A larger stack is
# harmless on every other target — it only reserves more per-thread address space.
org.gradle.jvmargs=-Xmx8g -Xss4m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8g,-Xss4m"
org.gradle.caching=true
#Kotlin
kotlin.code.style=official
kotlin.incremental.native=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.applyDefaultHierarchyTemplate=false
ksp.incremental=false
compose.ios.resources.sync=false
