#Gradle
# -Xss4m: the Compose compiler plugin's DeepCopyIrTreeWithRemappedComposableTypes
# recurses per nested @Composable call and overflows the default JVM thread stack
# when compiling :shared for Kotlin/Native inside the harmonyos-ci-image container
# (whose default -Xss is smaller than the macOS runner's). A larger stack is
# harmless on every other target — it only reserves more per-thread address space.
# 4 GiB is enough for ONE Kotlin/Native framework link per Gradle invocation.
# An xcodebuild that requests two Simulator slices (generic destination without
# ARCHS, or ARCHS="arm64 x86_64") makes the CocoaPods "Build shared" phase link
# two frameworks in one invocation and the daemon runs out of heap: main run
# 33805615758 died at :shared:linkPodDebugFrameworkIosX64 after 56 min, run
# 33805224692 GC-stalled to the 60-min timeout. ios-simulator-app.yml pins
# ARCHS=arm64 for that reason (task #247). Widening the slice set means either
# raising -Xmx here or linking the slices in separate invocations.
org.gradle.jvmargs=-Xmx4g -Xss4m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4g,-Xss4m"
org.gradle.caching=true
#Kotlin
kotlin.code.style=official
kotlin.incremental.native=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.applyDefaultHierarchyTemplate=false
ksp.incremental=false
compose.ios.resources.sync=false
