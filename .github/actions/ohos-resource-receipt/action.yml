name: OHOS resource receipt
description: >
  Fail-close memory/cgroup resource receipt for the OHOS shared compile
  (task #91, DX collab). Phase 1 only COLLECTS evidence so a future
  no-diagnostic `kspKotlinOhosArm64` kill can be classified
  (resource_exhaustion_suspected vs indeterminate) instead of guessed as infra.
  It never changes the gate result, never auto-greens, never quarantines product
  coverage, and reports unreadable cgroup metrics as typed `unavailable(reason)`
  (itself an honest Phase 1 result) rather than expanding permissions.
inputs:
  phase:
    description: "pre (before compile) or post (always() after compile)"
    required: false
    default: pre
runs:
  using: composite
  steps:
    - name: OHOS resource receipt — pre snapshot
      if: inputs.phase == 'pre'
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/snapshot.sh" pre

    - name: OHOS resource receipt — post snapshot + crash inventory + classify
      if: inputs.phase == 'post'
      shell: bash
      run: |
        bash "${GITHUB_ACTION_PATH}/snapshot.sh" post
        bash "${GITHUB_ACTION_PATH}/crash-artifacts.sh"
        receipt_dir="${OHOS_RECEIPT_DIR:-${RUNNER_TEMP:-/tmp}/ohos-resource-receipt}"
        mkdir -p "$receipt_dir"
        {
          printf 'always_executed=true\n'
          printf 'timestamp=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null)"
        } > "$receipt_dir/always_executed.env"
        echo "----- ohos-resource-receipt [always_executed marker] -----"
        cat "$receipt_dir/always_executed.env"
        bash "${GITHUB_ACTION_PATH}/classify.sh"

    - name: OHOS resource receipt — upload bundle
      if: inputs.phase == 'post'
      uses: actions/upload-artifact@v4
      with:
        name: ohos-resource-receipt-${{ github.run_id }}
        path: ${{ env.OHOS_RECEIPT_DIR }}
        if-no-files-found: warn
        retention-days: 14
