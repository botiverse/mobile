name: raft-ui version watch

# Once a day, compare the raft-ui version mobile follows (tools/design-tokens/
# manifest.json) with the one the Web pins (slock packages/web/package.json).
# When the Web is ahead, open one issue per Web version; the issue title carries
# the version, so the same version is never reported twice.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: raft-ui-version-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Compare with the Web pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout Web package manifest
        uses: actions/checkout@v5
        with:
          repository: botiverse/slock
          ref: staging
          path: slock
          fetch-depth: 1
          sparse-checkout: packages/web/package.json
          sparse-checkout-cone-mode: false
          token: ${{ secrets.SLOCK_SOURCE_REPO_TOKEN || secrets.SLOCK_GITHUB_PACKAGES_TOKEN }}

      - name: Self-test comparison
        run: python3 scripts/ci/test_raft_ui_version_watch.py

      - name: Compare versions
        id: compare
        run: |
          python3 scripts/ci/raft_ui_version_watch.py \
            --manifest tools/design-tokens/manifest.json \
            --web-package slock/packages/web/package.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Open one issue for this Web version
        if: steps.compare.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE: ${{ steps.compare.outputs.mobile }}
          WEB: ${{ steps.compare.outputs.web }}
        run: |
          title="raft-ui ${WEB} 可跟进"
          # Any state: closing the issue without bumping must not bring it back
          # the next day.
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 \
            --search "\"${title}\" in:title" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ -n "$existing" ]; then
            echo "Already reported in #${existing}; nothing to do."
            exit 0
          fi
          body="$(cat <<BODY
          网页（slock \`packages/web\`）现在锁定的是 raft-ui **${WEB}**，mobile 跟的是 **${MOBILE}**（\`tools/design-tokens/manifest.json\`）。

          跟进时：
          - 读 raft-design 的 CHANGELOG（${MOBILE} 之后的各版），逐条判断 App 要不要改；
          - 颜色按 \`tools/design-tokens/README.md\` 的 "Bumping to a newer Web" 重新生成；间距、圆角、字号等非颜色 token 手动对；
          - 用户能看到的变化加 changeset；对应版本的 \`change-logs/<版本>/\` 还没建时，在 PR 里写明"需要 changeset"。

          这个 issue 由 \`.github/workflows/raft-ui-version-watch.yml\` 自动开，每个网页版本只开一次。
          BODY
          )"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
