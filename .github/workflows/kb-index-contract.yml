name: Knowledge-base index

# The KB index (docs/kb/README.md) is prose, not a generated artifact, so nothing
# notices when it drifts from the files on disk.  Two failure modes matter and
# they fail in opposite directions:
#
#   * an article that exists but has no row  -> ships reachable only by link;
#   * a row pointing at a deleted article    -> keeps asserting something exists
#     long after it stopped being true.  This side survives reviews because
#     nobody re-reads the table after a deletion.
#
# The checker reads the whole docs/kb tree, so any change under docs/kb (an
# added, deleted or re-indexed article) reruns it against the full index.

on:
  pull_request:
    paths:
      - "docs/kb/**"
      - "scripts/ci/check_kb_index.py"
      - ".github/workflows/kb-index-contract.yml"
  push:
    branches:
      - main
    paths:
      - "docs/kb/**"
      - "scripts/ci/check_kb_index.py"
      - ".github/workflows/kb-index-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kb-index:
    name: KB index invariant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact change
        uses: actions/checkout@v7
        with:
          # Bind the check to the submitted PR head, not GitHub's synthetic
          # merge ref. Push/manual runs use the event SHA directly.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_SHA" "$actual"
          test "$actual" = "$EXPECTED_SHA"

      - name: Run checker self-test and live index check
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check_kb_index.py --self-test
          python3 scripts/ci/check_kb_index.py
