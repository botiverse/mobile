name: Android Release Auto Login

# Signs a RELEASE (non-Alpha) Android build in on a GitHub-hosted emulator through the product's
# real browser login (no QA hook in the app): scripts/qa/release_auto_login.mjs with the QA capture
# browser (scripts/qa/capture-browser). docs/qa-acceptance/release-auto-login.md explains the flow.
# Other emulator workflows can copy the two steps "Build the QA capture browser" and "Sign in".

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Server the app signs in to"
        required: true
        type: choice
        options: [staging, production]
        default: staging
      apk_run_id:
        description: "Optional: reuse a release APK artifact from this run instead of building one"
        required: false
        type: string
        default: ""
      apk_artifact:
        description: "Artifact name holding the APK in apk_run_id"
        required: false
        type: string
        default: android-release-apk
      strict_cleanup:
        description: "Fail the run when any cleanup step does not succeed (required for Testbed)"
        required: false
        type: boolean
        default: true
      revoke_app_session:
        description: "Sign the app out through its own Sign out at the end (fallback: pm clear)"
        required: false
        type: boolean
        default: true
      scenario:
        description: "Optional: a scenario module run while signed in, e.g. scripts/qa/scenarios/task_v2.mjs"
        required: false
        type: string
        default: ""
      scenario_args:
        description: "Its options, e.g. --server-name OranixSlockTest"
        required: false
        type: string
        default: ""
      mode:
        description: "sign_in (default): the emulator run. old_cli_task: no emulator; make the s5 test task with the old Raft CLI 0.0.26 (scripts/qa/old_cli_task.mjs)"
        required: false
        type: choice
        options: [sign_in, old_cli_task]
        default: sign_in
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: staging
      apk_run_id:
        required: false
        type: string
        default: ""
      apk_artifact:
        required: false
        type: string
        default: android-release-apk
      strict_cleanup:
        required: false
        type: boolean
        default: true
      revoke_app_session:
        required: false
        type: boolean
        default: true
      scenario:
        required: false
        type: string
        default: ""
      scenario_args:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  # mode=old_cli_task: test data for task v2 scenario s5 only (one external agent, one title
  # message, one task); the QA password and the agent key stay in this job.
  old-cli-task:
    if: ${{ inputs.mode == 'old_cli_task' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Old CLI task
        env:
          QA_LOGIN_EMAIL: ${{ (inputs.environment == 'staging' && secrets.QA_STAGING_TEST_EMAIL) || secrets.QA_TEST_EMAIL }}
          QA_LOGIN_PASSWORD: ${{ (inputs.environment == 'staging' && secrets.QA_STAGING_TEST_PASSWORD) || secrets.QA_TEST_PASSWORD }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: node scripts/qa/old_cli_task.mjs --env "${ENVIRONMENT}" --out old-cli-task.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: old-cli-task-result
          path: old-cli-task.json
          if-no-files-found: warn
          retention-days: 14

  plan:
    if: ${{ inputs.mode != 'old_cli_task' }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.p.outputs.build }}
      source_sha: ${{ steps.p.outputs.source_sha }}
      apk_run_id: ${{ steps.p.outputs.apk_run_id }}
      apk_artifact: ${{ steps.p.outputs.apk_artifact }}
      environment: ${{ steps.p.outputs.environment }}
      cleanup_flags: ${{ steps.p.outputs.cleanup_flags }}
      scenario_flags: ${{ steps.p.outputs.scenario_flags }}
    steps:
      - id: p
        env:
          ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          APK_RUN_ID: ${{ inputs.apk_run_id }}
          APK_ARTIFACT: ${{ inputs.apk_artifact || 'android-release-apk' }}
          # Both default on; only an explicit false turns them off.
          STRICT_CLEANUP: ${{ inputs.strict_cleanup != false }}
          REVOKE_APP_SESSION: ${{ inputs.revoke_app_session != false }}
          SCENARIO: ${{ inputs.scenario }}
          SCENARIO_ARGS: ${{ inputs.scenario_args }}
        run: |
          set -euo pipefail
          case "${ENVIRONMENT}" in staging|production) ;; *) echo "::error::environment must be staging or production"; exit 1;; esac
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          FLAGS=""
          [ "${STRICT_CLEANUP}" = true ] && FLAGS="${FLAGS} --strict-cleanup"
          [ "${REVOKE_APP_SESSION}" = true ] && FLAGS="${FLAGS} --revoke-app-session"
          echo "cleanup_flags=${FLAGS# }" >> "$GITHUB_OUTPUT"
          if [ -n "${SCENARIO}" ]; then
            [[ "${SCENARIO}" =~ ^scripts/qa/scenarios/[a-z0-9_]+\.mjs$ ]] || { echo "::error::scenario must be scripts/qa/scenarios/<name>.mjs"; exit 1; }
            [[ "${SCENARIO_ARGS}" =~ ^[A-Za-z0-9\ ._=/-]*$ ]] || { echo "::error::scenario_args may hold letters, digits, spaces and . _ = / - only"; exit 1; }
            echo "scenario_flags=--scenario ${SCENARIO} ${SCENARIO_ARGS}" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${APK_RUN_ID}" ]; then
            [[ "${APK_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "::error::apk_run_id must be a run id"; exit 1; }
            { echo "build=false"; echo "apk_run_id=${APK_RUN_ID}"; echo "apk_artifact=${APK_ARTIFACT}"; } >> "$GITHUB_OUTPUT"
          else
            { echo "build=true"; echo "source_sha=${GITHUB_SHA}"; echo "apk_run_id=${GITHUB_RUN_ID}"; echo "apk_artifact=release-auto-login-apk"; } >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/android-release.yml
    secrets: inherit
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      artifact_name: release-auto-login-apk
      version_major: "2000"
      version_minor: "0"
      version_patch: "0"
      version_build: ${{ github.run_number }}
      version_suffix: auto-login
      hands_channel: debug
      android_variant: release
      release_mode: draft
      create_hands_draft: false
      create_share_page: false

  sign-in:
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVIDENCE: release-auto-login-evidence
    steps:
      - uses: actions/checkout@v7

      - name: Download the release APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.plan.outputs.apk_run_id }}
          ARTIFACT: ${{ needs.plan.outputs.apk_artifact }}
        run: |
          set -euo pipefail
          mkdir -p apk
          gh run download "${RUN_ID}" -R "${GITHUB_REPOSITORY}" -n "${ARTIFACT}" -D apk
          APK="$(find apk -name '*.apk' | head -1)"
          [ -s "${APK}" ] || { echo "::error::no APK in ${ARTIFACT} of run ${RUN_ID}"; exit 1; }
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          BADGING="$("${BT}/aapt" dump badging "${APK}")"
          PKG="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"${BADGING}")"
          [ "${PKG}" = build.raft.app ] || { echo "::error::expected the release package build.raft.app, got ${PKG}"; exit 1; }
          if grep -q "application-debuggable" <<<"${BADGING}"; then echo "::error::APK is debuggable; this lane is for release builds"; exit 1; fi
          { echo "apk=${APK}"; echo "version=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"${BADGING}" | head -1)"; } | tee -a "$GITHUB_OUTPUT"

      - name: Build the QA capture browser
        run: bash scripts/qa/capture-browser/build.sh "${RUNNER_TEMP}/capture-browser.apk"

      - name: Expose QA credentials
        env:
          # A staging-only account may be set as QA_STAGING_TEST_EMAIL / QA_STAGING_TEST_PASSWORD;
          # otherwise the QA account (it exists with the same password on staging and production).
          EMAIL: ${{ (needs.plan.outputs.environment == 'staging' && secrets.QA_STAGING_TEST_EMAIL) || secrets.QA_TEST_EMAIL }}
          PASSWORD: ${{ (needs.plan.outputs.environment == 'staging' && secrets.QA_STAGING_TEST_PASSWORD) || secrets.QA_TEST_PASSWORD }}
        run: |
          [ -n "${EMAIL}" ] && [ -n "${PASSWORD}" ] || { echo "::error::QA credentials secret is missing (QA_TEST_EMAIL / QA_TEST_PASSWORD)"; exit 1; }
          echo "::add-mask::${EMAIL}"
          python3 - <<'PY'
          import os, uuid
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              for name, key in (("QA_LOGIN_EMAIL", "EMAIL"), ("QA_LOGIN_PASSWORD", "PASSWORD")):
                  delimiter = f"QA_{uuid.uuid4().hex}"
                  out.write(f"{name}<<{delimiter}\n{os.environ[key]}\n{delimiter}\n")
          PY

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Sign in on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 2
          disk-size: 6000M
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: node scripts/qa/release_auto_login.mjs --apk "${{ steps.apk.outputs.apk }}" --capture-browser-apk "${{ runner.temp }}/capture-browser.apk" --env "${{ needs.plan.outputs.environment }}" --out "${{ env.EVIDENCE }}" ${{ needs.plan.outputs.cleanup_flags }} ${{ needs.plan.outputs.scenario_flags }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release auto login"
            echo "| | |"; echo "|---|---|"
            echo "| APK | \`${{ steps.apk.outputs.version }}\` from run \`${{ needs.plan.outputs.apk_run_id }}\` |"
            echo "| Server | ${{ needs.plan.outputs.environment }} |"
            echo "| Cleanup flags | \`${{ needs.plan.outputs.cleanup_flags || 'none' }}\` |"
            echo "| Scenario | \`${{ needs.plan.outputs.scenario_flags || 'none' }}\` |"
            if [ -f "${EVIDENCE}/summary.json" ] && [ -n "${{ needs.plan.outputs.scenario_flags }}" ]; then
              echo; echo "| Scenario | Result | Note |"; echo "|---|---|---|"
              jq -r '.scenario.results // {} | to_entries[] | "| \(.key) | \(.value.result) | \((.value.note // "") | gsub("\\|"; "/") | .[0:300]) |"' "${EVIDENCE}/summary.json" || true
            fi
            if [ -f "${EVIDENCE}/summary.json" ]; then echo; echo '```json'; cat "${EVIDENCE}/summary.json"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-auto-login-evidence
          path: ${{ env.EVIDENCE }}
          if-no-files-found: warn
          retention-days: 14
