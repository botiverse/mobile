name: Visual Testing

# End-to-end visual parity pipeline (task #299/#300 in #visual-testing):
#   react-capture  ─┐
#                   ├─► report (diff → report → site → optional publish)
#   android-capture ─┘
# React and Android captures run in parallel; the report job joins their
# artifacts, generates the site with the canonical visual-testing CLI from
# botiverse/slock, and publishes to this repo's gh-pages behind the CLI's
# preflight guard (case-count drop / missing Raft UI entry are rejected).

on:
  # Nightly full run publishes the report (21:30 UTC = 05:30 Beijing, fresh
  # before the team's morning). Scheduled runs have empty inputs: slock ref
  # falls back to the repo default branch (staging), case_filter is empty
  # (full manifest), and the publish step below treats schedule as publish.
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish generated site to gh-pages (preflight-guarded)"
        type: boolean
        default: false
      case_filter:
        description: "Optional case ids, comma-separated — drives BOTH React --case and the Android instrumentation method filter (fast targeted round); empty = full manifest"
        type: string
        default: ""
      slock_source_ref:
        description: "botiverse/slock ref for React source + visual CLI"
        type: string
        default: "staging"
      site_only:
        description: "UI-only fast republish: skip ALL capture jobs, rebuild the site HTML from the images/data already on gh-pages with the latest CLI, and publish (minutes instead of a full run)"
        type: boolean
        default: false

concurrency:
  group: visual-testing-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  react-capture:
    if: ${{ !inputs.site_only }}
    name: React capture (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: slock-source
    steps:
      - name: Checkout slock source (React + visual CLI)
        uses: actions/checkout@v5
        with:
          repository: botiverse/slock
          ref: ${{ inputs.slock_source_ref }}
          token: ${{ secrets.SLOCK_SOURCE_REPO_TOKEN || secrets.SLOCK_GITHUB_PACKAGES_TOKEN }}
          path: slock-source

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: slock-source/package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: slock-source/pnpm-lock.yaml

      - name: Install web + visual-testing workspace deps
        run: pnpm install --frozen-lockfile --filter "@slock-ai/web..." --filter "@botiverse/raft-visual-testing..."

      - name: Install playwright chromium
        run: pnpm --filter "@slock-ai/web" exec playwright install --with-deps chromium

      # continue-on-error: single broken cases must surface as "missing" in the
      # diff report instead of killing the whole pipeline.
      - name: Capture React visuals
        continue-on-error: true
        env:
          CASE_FILTER: ${{ inputs.case_filter }}
        run: |
          if [ -z "$CASE_FILTER" ]; then
            node packages/visual-testing/src/cli.mjs capture --providers react
            exit $?
          fi

          status=0
          IFS=',' read -ra CASES <<< "$CASE_FILTER"
          for CASE_ID in "${CASES[@]}"; do
            CASE_ID="$(echo "$CASE_ID" | xargs)"
            if [ -z "$CASE_ID" ]; then
              continue
            fi
            if ! node packages/visual-testing/src/cli.mjs capture --providers react --case "$CASE_ID"; then
              status=1
            fi
          done
          exit "$status"

      - name: Upload react results
        uses: actions/upload-artifact@v4
        with:
          name: visual-results-react
          path: slock-source/visual-testing-results/react
          if-no-files-found: error

  android-build:
    if: ${{ !inputs.site_only }}
    name: Android build (connected test APKs)
    # ubuntu-latest-m (org larger runner, 4 cores / 15GB): the standard 7GB
    # runner forces emulator and gradle to fight for memory. (task #418)
    runs-on: ubuntu-latest-m
    timeout-minutes: 60
    outputs:
      method_filter: ${{ steps.methods.outputs.filter }}
    steps:
      - name: Checkout mobile
        uses: actions/checkout@v5

      # Map requested case ids to KmpVisualScreenshotCaptureTest methods so a
      # case_filter round only captures those cases on Android too.
      - name: Derive android method filter
        id: methods
        env:
          CASES: ${{ inputs.case_filter }}
        run: |
          python3 - <<'EOF'
          import os, re
          cases = [c.strip() for c in os.environ.get("CASES", "").split(",") if c.strip()]
          methods = []
          if cases:
              src = open("compose/androidApp/src/androidTest/java/build/raft/app/visual/KmpVisualScreenshotCaptureTest.kt").read()
              chunks = re.split(r"\bfun\s+(\w+)\s*\(", src)
              for case in cases:
                  needle = f'"{case}"'
                  found = None
                  for i in range(1, len(chunks) - 1, 2):
                      if needle in chunks[i + 1]:
                          found = chunks[i]
                          break
                  if found:
                      methods.append(f"build.raft.app.visual.KmpVisualScreenshotCaptureTest#{found}")
                  else:
                      print(f"::warning::no capture method found for case {case}")
          value = ",".join(methods)
          print(f"derived method filter: {value or '(none — full sharded run)'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"filter={value}\n")
          EOF

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write github-packages.properties
        run: |
          {
            echo "githubPackagesUsername=${{ secrets.SLOCK_GITHUB_PACKAGES_USERNAME }}"
            echo "githubPackagesToken=${{ secrets.SLOCK_GITHUB_PACKAGES_TOKEN }}"
          } > compose/github-packages.properties

      # The registry's kuikly-open artifacts lag the fork (e.g. missing
      # nativeDispatchCapture); local builds shadow them via mavenLocal, so CI
      # must do the same from the pinned third_party/kuikly-ui submodule.
      # Cache key is shared with test.yml — keep in sync.
      - name: Resolve kuikly fork submodule sha
        id: kuikly-fork
        run: echo "sha=$(git ls-tree HEAD third_party/kuikly-ui --object-only)" >> "$GITHUB_OUTPUT"

      - name: Cache kuikly fork mavenLocal artifacts
        id: kuikly-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-android-${{ runner.os }}-${{ steps.kuikly-fork.outputs.sha }}

      - name: Build kuikly fork into mavenLocal
        if: steps.kuikly-cache.outputs.cache-hit != 'true'
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui
          bash scripts/build_kuikly_fork.sh --android-only

      - name: Build connected test APKs
        working-directory: ./compose
        run: |
          ./gradlew --no-daemon --console=plain -PslockVisualFixtures=true \
            :androidApp:assembleConnectedTest :androidApp:assembleConnectedTestAndroidTest

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-apks
          path: |
            compose/androidApp/build/outputs/apk/connectedTest/*.apk
            compose/androidApp/build/outputs/apk/androidTest/connectedTest/*.apk
          if-no-files-found: error

  android-capture:
    name: Android capture (shard ${{ matrix.shard }}/6)
    # See android-build: emulator boot + render are the slow path on 7GB. (task #418)
    runs-on: ubuntu-latest-m
    timeout-minutes: 45
    needs: android-build
    # Build once, capture many: shards skip Gradle entirely — install the
    # prebuilt APKs and drive AndroidJUnitRunner sharding via adb directly.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      # Targeted case_filter runs only use shard 0; the other shards no-op
      # so the round finishes in one emulator's time.
      - name: Free runner disk space for emulator
        if: ${{ needs.android-build.outputs.method_filter == '' || matrix.shard == 0 }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Android SDK
        if: ${{ needs.android-build.outputs.method_filter == '' || matrix.shard == 0 }}
        uses: android-actions/setup-android@v3

      - name: Download APKs
        if: ${{ needs.android-build.outputs.method_filter == '' || matrix.shard == 0 }}
        uses: actions/download-artifact@v4
        with:
          name: visual-test-apks
          path: apks

      - name: Enable KVM
        if: ${{ needs.android-build.outputs.method_filter == '' || matrix.shard == 0 }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run visual capture shard
        if: ${{ needs.android-build.outputs.method_filter == '' || matrix.shard == 0 }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6_pro
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          # The runner executes each script line as a separate command;
          # backslash line continuations break ("Task '\' not found").
          script: |
            adb wait-for-device
            # Per-case timing (task #362): grow the device logcat ring so the
            # sparse VisualCapture CASE_START/CASE_END lines survive a full
            # shard, then clear so the dump only holds this run. Each script
            # line is a separate command (no background jobs / shared vars), so
            # we size+clear here and dump after instrumentation below.
            adb logcat -G 16M
            adb logcat -c
            # True 3x captures at the manifest viewport (390x844dp), task #370.
            # `wm density 480` alone is NOT enough: pixel_6_pro is 1440px wide,
            # so at 480dpi the layout window is 480dp (confirmed via #90
            # diagnostics: rootView 1440x2975), NOT 390dp. cropDp then takes the
            # top-left 1170x2532 (390x844dp * 3), so content centered in the
            # wider window is offset by half the difference and clipped —
            # centered dialogs (server-danger-modal, create-channel) even fell
            # off and failed to capture. Pinning the physical size to 1170x2532
            # makes the layout window == the crop == React's 390dp viewport, so
            # both top-left- and centre-anchored content align. `wm size` is
            # flaky on the CI AVD (sometimes the override doesn't stick and the
            # window comes back ~2414/2342px, so FULL_VIEWPORT 2532px crops clip
            # — task #370), so set it in a device-shell loop that reads back the
            # override and retries with a reset until it sticks, and echo the
            # final `wm size` for the log.
            adb shell 'for i in 1 2 3 4 5; do wm size 1170x2532; sleep 1; if wm size | grep -q "Override size: 1170x2532"; then echo "wm size applied on try $i"; break; fi; echo "wm size not applied on try $i, resetting"; wm size reset; sleep 1; done; if wm size | grep -q "Override size: 1170x2532"; then echo "wm-size: APPLIED"; else echo "wm-size: GAVE-UP-after-5 (test-side clamp will handle)"; fi; echo "final: $(wm size | tr "\n" " ")"'
            adb shell wm density 480
            adb install -r "$(find apks -name '*connectedTest.apk' -not -name '*androidTest*' | head -1)"
            adb install -r "$(find apks -name '*androidTest.apk' | head -1)"
            mkdir -p visual-testing-results/android
            # Record the instrumentation exit code instead of swallowing it with
            # `|| echo`: a hung case aborts AndroidJUnitRunner and `am instrument`
            # exits non-zero, which the old `|| echo` hid so the job stayed green
            # while the shard tail was silently dropped (see tail-drop guard
            # below). `cmd; echo $? > file` keeps the line's own exit at 0 so a
            # non-zero instrumentation run still falls through to the pull (never
            # aborts the script) — we just persist rc to a file (script lines
            # don't share shell vars) for the guard to report.
            adb shell am instrument -w -e class ${{ needs.android-build.outputs.method_filter != '' && needs.android-build.outputs.method_filter || format('build.raft.app.visual.KmpVisualScreenshotCaptureTest -e numShards 6 -e shardIndex {0}', matrix.shard) }} build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner; echo "$?" > visual-testing-results/instr-rc-${{ matrix.shard }}.txt; echo "instrumentation exit code $(cat visual-testing-results/instr-rc-${{ matrix.shard }}.txt); pulling whatever was captured"
            adb pull /sdcard/Download/slock-visual-testing/android/. visual-testing-results/android/ || echo "nothing captured on this shard"
            # Per-case timing + idle-wait warnings for this shard. Grep
            # CASE_START/CASE_END to see how long every android item ran and
            # which case (if any) stalled.
            adb logcat -d -v time -s VisualCapture:V TestRunner:V > visual-testing-results/logcat-shard-${{ matrix.shard }}.txt || echo "logcat dump failed"
            # Tail-drop guard: a case that hangs past the per-case Timeout kills
            # this shard's AndroidJUnitRunner, so every case MethodSorter orders
            # after it never emits CASE_START and its results are silently lost
            # (root-caused deterministically: each never-started case sat in a
            # shard that had a hung case, ordered after it). The signature is a
            # methodName with CASE_START but no CASE_END — a normally-FAILing case
            # still logs CASE_END status=FAIL, so only a true hang trips this.
            # Surface it LOUDLY as a red ::error:: annotation naming the hung
            # case, but do NOT fail the step: a hard failure would trip the report
            # job's `if: !failure()` and drop the whole published site. Portable
            # (grep -oE isolates the two-token marker so awk $NF is the
            # methodName regardless of the logcat -v time prefix; no gawk/procsub).
            grep -oE 'CASE_START [A-Za-z0-9_]+' visual-testing-results/logcat-shard-${{ matrix.shard }}.txt 2>/dev/null | awk '{print $NF}' | sort -u > /tmp/td-started-${{ matrix.shard }}; grep -oE 'CASE_END [A-Za-z0-9_]+' visual-testing-results/logcat-shard-${{ matrix.shard }}.txt 2>/dev/null | awk '{print $NF}' | sort -u > /tmp/td-ended-${{ matrix.shard }}; HUNG=$(comm -23 /tmp/td-started-${{ matrix.shard }} /tmp/td-ended-${{ matrix.shard }} | tr '\n' ' '); RC=$(cat visual-testing-results/instr-rc-${{ matrix.shard }}.txt 2>/dev/null || echo '?'); if [ -n "$HUNG" ]; then MSG="tail-drop shard ${{ matrix.shard }}: hung case(s) with CASE_START but no CASE_END: ${HUNG}(instrumentation rc=$RC). Every case MethodSorter ordered after a hung case never ran and this shard's tail was dropped — not a timeout."; echo "::error title=Visual capture tail-drop (shard ${{ matrix.shard }})::$MSG"; echo "TAIL_DROP_GUARD: $MSG" >> visual-testing-results/logcat-shard-${{ matrix.shard }}.txt; else echo "tail-drop guard: shard ${{ matrix.shard }} clean (instrumentation rc=$RC, every CASE_START matched a CASE_END)"; fi

      - name: Upload android results
        if: ${{ needs.android-build.outputs.method_filter == '' || matrix.shard == 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-results-android-shard-${{ matrix.shard }}
          path: visual-testing-results/android
          if-no-files-found: warn

      - name: Upload capture logcat (per-case timing)
        if: ${{ always() && (needs.android-build.outputs.method_filter == '' || matrix.shard == 0) }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-logcat-shard-${{ matrix.shard }}
          path: visual-testing-results/logcat-shard-${{ matrix.shard }}.txt
          if-no-files-found: warn

  # iOS simulator capture (task #418). Additive: the report job does not (yet)
  # depend on this leg — results upload as their own artifact and the diff
  # engine's providers.ios ingestion consumes them (CC-Wow2, slock side).
  # Case source of truth = the android harness file; the generator emits only
  # cases whose fixture setup is fully expressible as launch env (#359) and
  # lists everything else as pending — no silent coverage gaps.
  ios-capture:
    name: iOS capture (simulator)
    if: ${{ !inputs.site_only }}
    runs-on: macos-14-xlarge
    timeout-minutes: 75
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      # iPhone 14: 390x844pt @3x = 1170x2532 px, the exact android/react
      # baseline geometry — no crop step needed before diffing.
      SIM_DEVICE: iPhone 14
      # compile visual fixture @Page routes into commonMain; the cocoapods
      # phase runs gradle with this env inherited
      SLOCK_VISUAL_FIXTURES: "true"
      CASE_FILTER: ${{ inputs.case_filter }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      - name: Resolve kuikly fork submodule sha
        id: kuikly-fork
        shell: bash
        run: |
          sha="$(git rev-parse HEAD:third_party/kuikly-ui)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Same key prefix as the test.yml ios job so the two share the cache.
      - name: Cache kuikly fork mavenLocal artifacts
        id: kuikly-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-android-${{ runner.os }}-${{ steps.kuikly-fork.outputs.sha }}

      - name: Publish Kuikly fork artifacts
        if: steps.kuikly-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui
          scripts/build_kuikly_fork.sh --android-only

      - name: Ensure kuikly fork submodule for local pod
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui

      - name: Generate shared framework placeholder
        working-directory: compose
        run: ./gradlew :shared:generateDummyFramework --no-daemon --console=plain -PslockVisualFixtures=true

      - name: Pod install
        working-directory: compose/iosApp
        run: pod install

      - name: Boot simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys,os; d=json.load(sys.stdin)['devices']; print(next((dev['udid'] for devs in d.values() for dev in devs if dev['name']==os.environ['SIM_DEVICE']), ''))")
          if [ -z "$udid" ]; then
            # device type not pre-created on this runner image; create it on the newest runtime
            runtime=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r['isAvailable'] and r['platform']=='iOS']; print(sorted(rs, key=lambda r: r['version'])[-1]['identifier'])")
            devtype=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys,os; print(next(d['identifier'] for d in json.load(sys.stdin)['devicetypes'] if d['name']==os.environ['SIM_DEVICE']))")
            udid=$(xcrun simctl create "visualcap-${SIM_DEVICE// /-}" "$devtype" "$runtime")
          fi
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      # Built AFTER simulator boot, pinned to its udid: an unmatched named
      # destination makes xcodebuild silently fall back to a device build.
      - name: Build iOS app for simulator
        working-directory: compose/iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -200

      - name: Generate case manifest
        run: |
          python3 scripts/generate_ios_case_manifest.py \
            --filter "$CASE_FILTER" --out /tmp/ios-manifest.json

      - name: Install app and capture cases
        run: |
          app=$(find compose/iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          echo "app=$app bundle_id=$bundle_id"
          xcrun simctl install "$UDID" "$app"
          mkdir -p visual-testing-results/ios
          python3 -c "
          import json
          m = json.load(open('/tmp/ios-manifest.json'))
          with open('/tmp/ios-cases.tsv', 'w') as out:
              for c in m['cases']:
                  print(c['caseId'], c['pageName'], json.dumps(c['pageData'], ensure_ascii=False), sep='\t', file=out)
          "
          failed=0
          total=$(wc -l < /tmp/ios-cases.tsv | tr -d ' ')
          echo "capturing $total cases"
          i=0
          while IFS=$'\t' read -r case_id page_name page_data; do
            i=$((i+1))
            xcrun simctl terminate "$UDID" "$bundle_id" 2>/dev/null || true
            : > /tmp/launch.log
            SIMCTL_CHILD_SLOCK_VISUAL_FIXTURE_PAGE="$page_name" \
            SIMCTL_CHILD_SLOCK_VISUAL_FIXTURE_PAGE_DATA="$page_data" \
              xcrun simctl launch --console-pty "$UDID" "$bundle_id" > /tmp/launch.log 2>&1 &
            ready=0
            for _ in $(seq 1 60); do
              if grep -q "SLOCK_VISUAL_FIXTURE_READY page=$page_name" /tmp/launch.log; then
                ready=1; break
              fi
              sleep 1
            done
            if [ "$ready" != "1" ]; then
              echo "::warning::[$i/$total] $case_id: READY marker not seen in 60s (page=$page_name)"
              failed=$((failed+1))
              continue
            fi
            sleep 1
            # READY alone is not enough: a renderer exception (e.g. resource
            # init crash, task #421) can pop a "kuikly error" dialog AFTER the
            # first frame, turning the screenshot into a crash dialog while the
            # case still counts OK. Check the console log before accepting.
            if grep -qiE "\[Kuikly Exception\]|kuikly error" /tmp/launch.log; then
              echo "::warning::[$i/$total] $case_id: renderer exception after READY (kuikly error dialog); not capturing"
              mkdir -p visual-testing-results/ios-diagnostics
              xcrun simctl io "$UDID" screenshot "visual-testing-results/ios-diagnostics/$case_id.error.png" || true
              cp /tmp/launch.log "visual-testing-results/ios-diagnostics/$case_id.launch.log" || true
              failed=$((failed+1))
              continue
            fi
            xcrun simctl io "$UDID" screenshot "visual-testing-results/ios/$case_id.png"
            echo "[$i/$total] $case_id OK"
          done < /tmp/ios-cases.tsv
          captured=$(ls visual-testing-results/ios/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "captured=$captured failed=$failed total=$total"
          cp /tmp/ios-manifest.json visual-testing-results/ios-manifest.json
          # Per-case metadata alongside each PNG, mirroring the android
          # provider's <caseId>.metadata.json so the CLI panels don't show n/a.
          python3 -c "
          import json, struct
          m = json.load(open('/tmp/ios-manifest.json'))
          by_id = {c['caseId']: c for c in m['cases']}
          import glob, os
          for png in glob.glob('visual-testing-results/ios/*.png'):
              case_id = os.path.basename(png)[:-4]
              with open(png, 'rb') as f:
                  head = f.read(24)
              w, h = struct.unpack('>II', head[16:24])
              case = by_id.get(case_id, {})
              meta = {
                  'provider': 'ios',
                  'providerType': 'ios-kuikly-shared-page',
                  'source': 'kmp-shared',
                  'caseId': case_id,
                  'image': os.path.basename(png),
                  'pageName': case.get('pageName'),
                  'pageData': case.get('pageData'),
                  'viewport': {'width': w, 'height': h, 'density': 1},
                  'device': os.environ.get('SIM_DEVICE'),
                  'systemBars': 'status-hidden-home-indicator-visible',
              }
              with open(png[:-4] + '.metadata.json', 'w') as out:
                  json.dump(meta, out, indent=2)
          print('metadata written for', len(glob.glob('visual-testing-results/ios/*.metadata.json')), 'cases')
          "
          if [ "$captured" -eq 0 ]; then
            echo "::error::no cases captured"; exit 1
          fi
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed of $total cases failed to reach READY"; exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-testing-results-ios
          path: visual-testing-results/
          if-no-files-found: warn

  report:
    name: Diff, report, site, publish
    # ios-capture is in needs only for ORDERING (its artifact must exist before
    # the download step runs — it finishes minutes after the android shards);
    # the if-condition deliberately tolerates a red ios leg (e.g. task #421
    # renderer crashes) so the site degrades to react__android instead of
    # blocking. react/android failures still block, and site_only (all capture
    # jobs skipped) still passes.
    needs: [react-capture, android-capture, ios-capture]
    # Outside site_only, react AND android captures must have actually
    # SUCCEEDED — "not failed" was not enough: when android-build fails, the
    # shards are SKIPPED (not failed) and run 28970107352 published a site
    # with an empty android side (react__android missing 89). iOS stays
    # tolerated (red/skipped degrades to fewer pairs, never blocks).
    if: ${{ !cancelled() && (inputs.site_only || (needs.react-capture.result == 'success' && needs.android-capture.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout mobile
        uses: actions/checkout@v5
        with:
          path: mobile

      - name: Checkout slock source (visual CLI)
        uses: actions/checkout@v5
        with:
          repository: botiverse/slock
          ref: ${{ inputs.slock_source_ref }}
          token: ${{ secrets.SLOCK_SOURCE_REPO_TOKEN || secrets.SLOCK_GITHUB_PACKAGES_TOKEN }}
          path: slock-source

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: slock-source/package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: slock-source/pnpm-lock.yaml

      # Installs the visual-testing package deps from slock's lockfile,
      # including @earendil-works/pi-ai for the direct pi-SDK AI diff analysis.
      - name: Install visual-testing CLI deps (sharp, pi-ai)
        working-directory: slock-source
        run: pnpm install --frozen-lockfile --filter "@botiverse/raft-visual-testing..."

      # Fixture data drift gate (task #304): mobile's generated
      # VisualFixtureData.kt must match slock's canonical fixtureData.json.
      - name: Check fixture data drift
        working-directory: mobile
        env:
          SLOCK_SOURCE_REPO: ${{ github.workspace }}/slock-source
        run: node scripts/slock-visual-testing.mjs generate-fixture-data --check

      # Pixel avatar drift gate (task #352): mobile's generated
      # SlockPixelAvatarData.kt must match slock's canonical pixelAvatars.json.
      - name: Check pixel avatar drift
        working-directory: mobile
        env:
          SLOCK_SOURCE_REPO: ${{ github.workspace }}/slock-source
        run: node scripts/generate_pixel_avatars.mjs --check

      - name: Download react results
        if: ${{ !inputs.site_only }}
        uses: actions/download-artifact@v4
        with:
          name: visual-results-react
          path: mobile/visual-testing-results/react

      - name: Download android results (merge shards)
        if: ${{ !inputs.site_only }}
        uses: actions/download-artifact@v4
        with:
          pattern: visual-results-android-shard-*
          merge-multiple: true
          path: mobile/visual-testing-results/android

      # iOS results are additive (task #418): tolerate an absent/red ios leg so
      # the react/android site never blocks on it.
      - name: Download ios results
        if: ${{ !inputs.site_only }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: visual-testing-results-ios
          path: mobile/visual-testing-results

      # UI-only republish: rebuild visual-testing-results from what is already
      # published on gh-pages (raw react/android captures + metadata), then run
      # the normal diff/report/site chain with the LATEST CLI. No emulators, no
      # browsers — minutes instead of a full capture round.
      - name: Reconstruct results from gh-pages (site_only)
        if: ${{ inputs.site_only }}
        working-directory: mobile
        run: |
          git fetch origin gh-pages --depth 1
          git worktree add /tmp/ghpages origin/gh-pages
          SRC=/tmp/ghpages/visual-testing/latest
          test -d "$SRC/react" && test -d "$SRC/android" || { echo "gh-pages latest/ lacks raw captures"; exit 1; }
          mkdir -p visual-testing-results
          cp -R "$SRC/react" visual-testing-results/react
          cp -R "$SRC/android" visual-testing-results/android
          test -d "$SRC/ios" && cp -R "$SRC/ios" visual-testing-results/ios || echo "no ios captures on gh-pages yet"
          # prior analysis JSONs seed the imageHash cache so unchanged cases skip re-analysis
          test -d "$SRC/analysis" && cp -R "$SRC/analysis" visual-testing-results/analysis || true

      - name: Diff / report / site
        working-directory: mobile
        env:
          SLOCK_SOURCE_REPO: ${{ github.workspace }}/slock-source
          # AI analysis credential: the visual-testing CLI calls the pi SDK
          # (@earendil-works/pi-ai, provider minimax) directly when
          # MINIMAX_API_KEY is set. PI_MODEL picks the vision model
          # (default MiniMax-M3). Absent credential -> the analyze step skips.
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          PI_MODEL: ${{ vars.PI_MODEL }}
        run: |
          # ios joins the pair list only when its captures are present, so a
          # red/absent ios leg degrades to the classic react__android site.
          CURRENT="android"
          if [ -d visual-testing-results/ios ] && [ -n "$(ls visual-testing-results/ios/*.png 2>/dev/null)" ]; then
            CURRENT="android,ios"
          fi
          echo "diff pairs: baseline=react current=$CURRENT"
          node scripts/slock-visual-testing.mjs diff --baseline react --current "$CURRENT"
          # AI diff analysis (task: site "AI diff notes"/summary badges). Runs
          # only when the pi credential is configured; the CLI then calls the
          # pi SDK (minimax/$PI_MODEL) in-process — no codex CLI install.
          # imageHash caching in the CLI keeps re-runs incremental (only
          # changed cases re-analyze). Failure degrades to a site without
          # fresh notes — never blocks.
          if [ -n "$PI_API_KEY" ]; then
            export MINIMAX_API_KEY="$PI_API_KEY"
            node scripts/slock-visual-testing.mjs analyze --baseline react --current "$CURRENT" \
              || echo "::warning::AI diff analysis failed; publishing without fresh notes"
          else
            echo "No AI credential (PI_API_KEY); skipping AI diff analysis"
          fi
          node scripts/slock-visual-testing.mjs report --baseline react --current "$CURRENT"
          node scripts/slock-visual-testing.mjs site --baseline react --current "$CURRENT"
          echo "CURRENT=$CURRENT" >> "$GITHUB_ENV"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-testing-site
          path: mobile/artifacts/visual-testing-site
          if-no-files-found: error

      - name: Publish to gh-pages (preflight-guarded)
        if: ${{ inputs.publish || inputs.site_only || github.event_name == 'schedule' }}
        working-directory: mobile
        env:
          SLOCK_SOURCE_REPO: ${{ github.workspace }}/slock-source
        run: |
          git config user.name "raft-visual-bot"
          git config user.email "visual-testing@raft.build"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || echo "no existing gh-pages branch"
          node scripts/slock-visual-testing.mjs publish-gh-pages --baseline react --current "${CURRENT:-android}" --repo-dir . --dry-run
          node scripts/slock-visual-testing.mjs publish-gh-pages --baseline react --current "${CURRENT:-android}" --repo-dir .
