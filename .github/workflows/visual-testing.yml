name: Visual Testing

# End-to-end visual parity pipeline (task #299/#300 in #visual-testing):
#   react-capture  ─┐
#                   ├─► report (diff → report → site → optional publish)
#   android-capture ─┘
# React and Android captures run in parallel; the report job joins their
# artifacts, generates the site with the canonical visual-testing CLI from
# botiverse/slock, and publishes to this repo's gh-pages behind the CLI's
# preflight guard (case-count drop / missing Raft UI entry are rejected).

on:
  # Nightly full run publishes the report (21:30 UTC = 05:30 Beijing, fresh
  # before the team's morning). Scheduled runs have empty inputs: slock ref
  # falls back to the repo default branch (staging), case_filter is empty
  # (full manifest), and the publish step below treats schedule as publish.
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish generated site to gh-pages (preflight-guarded)"
        type: boolean
        default: false
      case_filter:
        description: "Optional case ids, comma-separated — drives BOTH React --case and the Android instrumentation method filter (fast targeted round); empty = full manifest"
        type: string
        default: ""
      slock_source_ref:
        description: "botiverse/slock ref for React source + visual CLI"
        type: string
        default: "staging"
      site_only:
        description: "UI-only fast republish: skip ALL capture jobs, rebuild the site HTML from the images/data already on gh-pages with the latest CLI, and publish (minutes instead of a full run)"
        type: boolean
        default: false

concurrency:
  group: visual-testing-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  react-capture:
    if: ${{ !inputs.site_only }}
    name: React capture (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: slock-source
    steps:
      - name: Checkout slock source (React + visual CLI)
        uses: actions/checkout@v5
        with:
          repository: botiverse/slock
          ref: ${{ inputs.slock_source_ref }}
          token: ${{ secrets.SLOCK_SOURCE_REPO_TOKEN || secrets.SLOCK_GITHUB_PACKAGES_TOKEN }}
          path: slock-source

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: slock-source/package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: slock-source/pnpm-lock.yaml

      - name: Install web + visual-testing workspace deps
        run: pnpm install --frozen-lockfile --filter "@slock-ai/web..." --filter "@botiverse/raft-visual-testing..."

      - name: Install playwright chromium
        run: pnpm --filter "@slock-ai/web" exec playwright install --with-deps chromium

      # continue-on-error: single broken cases must surface as "missing" in the
      # diff report instead of killing the whole pipeline.
      - name: Capture React visuals
        continue-on-error: true
        env:
          CASE_FILTER: ${{ inputs.case_filter }}
        run: |
          if [ -z "$CASE_FILTER" ]; then
            node packages/visual-testing/src/cli.mjs capture --providers react
            exit $?
          fi

          status=0
          IFS=',' read -ra CASES <<< "$CASE_FILTER"
          for CASE_ID in "${CASES[@]}"; do
            CASE_ID="$(echo "$CASE_ID" | xargs)"
            if [ -z "$CASE_ID" ]; then
              continue
            fi
            if ! node packages/visual-testing/src/cli.mjs capture --providers react --case "$CASE_ID"; then
              status=1
            fi
          done
          exit "$status"

      - name: Upload react results
        uses: actions/upload-artifact@v4
        with:
          name: visual-results-react
          path: slock-source/visual-testing-results/react
          if-no-files-found: error

  android-build:
    if: ${{ !inputs.site_only }}
    name: Android build (connected test APKs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      method_filter: ${{ steps.methods.outputs.filter }}
    steps:
      - name: Checkout mobile
        uses: actions/checkout@v5

      # Map requested case ids to KmpVisualScreenshotCaptureTest methods so a
      # case_filter round only captures those cases on Android too.
      - name: Derive android method filter
        id: methods
        env:
          CASES: ${{ inputs.case_filter }}
        run: |
          python3 - <<'EOF'
          import os, re
          cases = [c.strip() for c in os.environ.get("CASES", "").split(",") if c.strip()]
          methods = []
          if cases:
              src = open("compose/androidApp/src/androidTest/java/build/raft/app/visual/KmpVisualScreenshotCaptureTest.kt").read()
              chunks = re.split(r"\bfun\s+(\w+)\s*\(", src)
              for case in cases:
                  needle = f'"{case}"'
                  found = None
                  for i in range(1, len(chunks) - 1, 2):
                      if needle in chunks[i + 1]:
                          found = chunks[i]
                          break
                  if found:
                      methods.append(f"build.raft.app.visual.KmpVisualScreenshotCaptureTest#{found}")
                  else:
                      print(f"::warning::no capture method found for case {case}")
          value = ",".join(methods)
          print(f"derived method filter: {value or '(none — full sharded run)'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"filter={value}\n")
          EOF

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write github-packages.properties
        run: |
          {
            echo "githubPackagesUsername=${{ secrets.SLOCK_GITHUB_PACKAGES_USERNAME }}"
            echo "githubPackagesToken=${{ secrets.SLOCK_GITHUB_PACKAGES_TOKEN }}"
          } > compose/github-packages.properties

      # The registry's kuikly-open artifacts lag the fork (e.g. missing
      # nativeDispatchCapture); local builds shadow them via mavenLocal, so CI
      # must do the same from the pinned third_party/kuikly-ui submodule.
      # Cache key is shared with test.yml — keep in sync.
      - name: Resolve kuikly fork submodule sha
        id: kuikly-fork
        run: echo "sha=$(git ls-tree HEAD third_party/kuikly-ui --object-only)" >> "$GITHUB_OUTPUT"

      - name: Cache kuikly fork mavenLocal artifacts
        id: kuikly-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-android-${{ runner.os }}-${{ steps.kuikly-fork.outputs.sha }}

      - name: Build kuikly fork into mavenLocal
        if: steps.kuikly-cache.outputs.cache-hit != 'true'
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui
          bash scripts/build_kuikly_fork.sh --android-only

      - name: Build connected test APKs
        working-directory: ./compose
        run: |
          ./gradlew --no-daemon --console=plain -PslockVisualFixtures=true \
            :androidApp:assembleConnectedTest :androidApp:assembleConnectedTestAndroidTest

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-apks
          path: |
            compose/androidApp/build/outputs/apk/connectedTest/*.apk
            compose/androidApp/build/outputs/apk/androidTest/connectedTest/*.apk
          if-no-files-found: error

  android-capture:
    name: Android capture (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: android-build
    # Build once, capture many: shards skip Gradle entirely — install the
    # prebuilt APKs and drive AndroidJUnitRunner sharding via adb directly.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      # Targeted case_filter runs only use shard 0; the other shards no-op
      # so the round finishes in one emulator's time.
      - name: Free runner disk space for emulator
        if: ${{ needs.android-build.outputs.method_filter == '' || matrix.shard == 0 }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Android SDK
        if: ${{ needs.android-build.outputs.method_filter == '' || matrix.shard == 0 }}
        uses: android-actions/setup-android@v3

      - name: Download APKs
        if: ${{ needs.android-build.outputs.method_filter == '' || matrix.shard == 0 }}
        uses: actions/download-artifact@v4
        with:
          name: visual-test-apks
          path: apks

      - name: Enable KVM
        if: ${{ needs.android-build.outputs.method_filter == '' || matrix.shard == 0 }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run visual capture shard
        if: ${{ needs.android-build.outputs.method_filter == '' || matrix.shard == 0 }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6_pro
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          # The runner executes each script line as a separate command;
          # backslash line continuations break ("Task '\' not found").
          script: |
            adb wait-for-device
            # Per-case timing (task #362): grow the device logcat ring so the
            # sparse VisualCapture CASE_START/CASE_END lines survive a full
            # shard, then clear so the dump only holds this run. Each script
            # line is a separate command (no background jobs / shared vars), so
            # we size+clear here and dump after instrumentation below.
            adb logcat -G 16M
            adb logcat -c
            # True 3x captures at the manifest viewport (390x844dp), task #370.
            # `wm density 480` alone is NOT enough: pixel_6_pro is 1440px wide,
            # so at 480dpi the layout window is 480dp (confirmed via #90
            # diagnostics: rootView 1440x2975), NOT 390dp. cropDp then takes the
            # top-left 1170x2532 (390x844dp * 3), so content centered in the
            # wider window is offset by half the difference and clipped —
            # centered dialogs (server-danger-modal, create-channel) even fell
            # off and failed to capture. Pinning the physical size to 1170x2532
            # makes the layout window == the crop == React's 390dp viewport, so
            # both top-left- and centre-anchored content align.
            adb shell wm size 1170x2532
            adb shell wm density 480
            adb install -r "$(find apks -name '*connectedTest.apk' -not -name '*androidTest*' | head -1)"
            adb install -r "$(find apks -name '*androidTest.apk' | head -1)"
            mkdir -p visual-testing-results/android
            adb shell am instrument -w -e class ${{ needs.android-build.outputs.method_filter != '' && needs.android-build.outputs.method_filter || format('build.raft.app.visual.KmpVisualScreenshotCaptureTest -e numShards 6 -e shardIndex {0}', matrix.shard) }} build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner || echo "instrumentation exited non-zero; pulling whatever was captured"
            adb pull /sdcard/Download/slock-visual-testing/android/. visual-testing-results/android/ || echo "nothing captured on this shard"
            # Per-case timing + idle-wait warnings for this shard. Grep
            # CASE_START/CASE_END to see how long every android item ran and
            # which case (if any) stalled.
            adb logcat -d -v time -s VisualCapture:V TestRunner:V > visual-testing-results/logcat-shard-${{ matrix.shard }}.txt || echo "logcat dump failed"

      - name: Upload android results
        if: ${{ needs.android-build.outputs.method_filter == '' || matrix.shard == 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-results-android-shard-${{ matrix.shard }}
          path: visual-testing-results/android
          if-no-files-found: warn

      - name: Upload capture logcat (per-case timing)
        if: ${{ always() && (needs.android-build.outputs.method_filter == '' || matrix.shard == 0) }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-logcat-shard-${{ matrix.shard }}
          path: visual-testing-results/logcat-shard-${{ matrix.shard }}.txt
          if-no-files-found: warn

  report:
    name: Diff, report, site, publish
    needs: [react-capture, android-capture]
    # site_only skips both capture jobs; run the report job anyway and let its
    # steps branch. Real failures/cancellations of live capture jobs still
    # block it.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout mobile
        uses: actions/checkout@v5
        with:
          path: mobile

      - name: Checkout slock source (visual CLI)
        uses: actions/checkout@v5
        with:
          repository: botiverse/slock
          ref: ${{ inputs.slock_source_ref }}
          token: ${{ secrets.SLOCK_SOURCE_REPO_TOKEN || secrets.SLOCK_GITHUB_PACKAGES_TOKEN }}
          path: slock-source

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: slock-source/package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: slock-source/pnpm-lock.yaml

      - name: Install visual-testing CLI deps (sharp)
        working-directory: slock-source
        run: pnpm install --frozen-lockfile --filter "@botiverse/raft-visual-testing..."

      # Fixture data drift gate (task #304): mobile's generated
      # VisualFixtureData.kt must match slock's canonical fixtureData.json.
      - name: Check fixture data drift
        working-directory: mobile
        env:
          SLOCK_SOURCE_REPO: ${{ github.workspace }}/slock-source
        run: node scripts/slock-visual-testing.mjs generate-fixture-data --check

      # Pixel avatar drift gate (task #352): mobile's generated
      # SlockPixelAvatarData.kt must match slock's canonical pixelAvatars.json.
      - name: Check pixel avatar drift
        working-directory: mobile
        env:
          SLOCK_SOURCE_REPO: ${{ github.workspace }}/slock-source
        run: node scripts/generate_pixel_avatars.mjs --check

      - name: Download react results
        if: ${{ !inputs.site_only }}
        uses: actions/download-artifact@v4
        with:
          name: visual-results-react
          path: mobile/visual-testing-results/react

      - name: Download android results (merge shards)
        if: ${{ !inputs.site_only }}
        uses: actions/download-artifact@v4
        with:
          pattern: visual-results-android-shard-*
          merge-multiple: true
          path: mobile/visual-testing-results/android

      # UI-only republish: rebuild visual-testing-results from what is already
      # published on gh-pages (raw react/android captures + metadata), then run
      # the normal diff/report/site chain with the LATEST CLI. No emulators, no
      # browsers — minutes instead of a full capture round.
      - name: Reconstruct results from gh-pages (site_only)
        if: ${{ inputs.site_only }}
        working-directory: mobile
        run: |
          git fetch origin gh-pages --depth 1
          git worktree add /tmp/ghpages origin/gh-pages
          SRC=/tmp/ghpages/visual-testing/latest
          test -d "$SRC/react" && test -d "$SRC/android" || { echo "gh-pages latest/ lacks raw captures"; exit 1; }
          mkdir -p visual-testing-results
          cp -R "$SRC/react" visual-testing-results/react
          cp -R "$SRC/android" visual-testing-results/android

      - name: Diff / report / site
        working-directory: mobile
        env:
          SLOCK_SOURCE_REPO: ${{ github.workspace }}/slock-source
        run: |
          node scripts/slock-visual-testing.mjs diff --baseline react --current android
          node scripts/slock-visual-testing.mjs report --baseline react --current android
          node scripts/slock-visual-testing.mjs site --baseline react --current android

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-testing-site
          path: mobile/artifacts/visual-testing-site
          if-no-files-found: error

      - name: Publish to gh-pages (preflight-guarded)
        if: ${{ inputs.publish || inputs.site_only || github.event_name == 'schedule' }}
        working-directory: mobile
        env:
          SLOCK_SOURCE_REPO: ${{ github.workspace }}/slock-source
        run: |
          git config user.name "raft-visual-bot"
          git config user.email "visual-testing@raft.build"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || echo "no existing gh-pages branch"
          node scripts/slock-visual-testing.mjs publish-gh-pages --baseline react --current android --repo-dir . --dry-run
          node scripts/slock-visual-testing.mjs publish-gh-pages --baseline react --current android --repo-dir .
