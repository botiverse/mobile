name: Stamp Review Panel (3x independent agent)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Stamp run id in running/judging/in_review state"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Repo vars are mutable while the serial 3-slot matrix runs (up to ~30min);
  # resolve provider/model/timeout ONCE here so every reviewer and the verify
  # gate consume the same frozen values — a mid-run vars flip must not drift
  # generated records away from verification expectations.
  freeze:
    name: Freeze panel parameters
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      provider: ${{ steps.freeze.outputs.provider }}
      model: ${{ steps.freeze.outputs.model }}
      timeout_ms: ${{ steps.freeze.outputs.timeout_ms }}
    steps:
      - name: Resolve and validate panel parameters
        id: freeze
        env:
          PANEL_PROVIDER: ${{ vars.PI_REVIEW_PROVIDER || 'minimax' }}
          PANEL_MODEL: ${{ vars.PI_REVIEW_MODEL || 'MiniMax-M3.1-Flash-Preview' }}
          PANEL_TIMEOUT_MS: ${{ vars.PI_REVIEW_TIMEOUT_MS || '600000' }}
        run: |
          # Frozen values become GITHUB_OUTPUT lines consumed as the single
          # authority by every later job: restrict them to single-line safe
          # tokens so a mutated repo var can never inject or overwrite
          # additional outputs.
          case "$PANEL_PROVIDER" in
            ''|*[!A-Za-z0-9._-]*) echo "PI_REVIEW_PROVIDER must match [A-Za-z0-9._-]+"; exit 1;;
          esac
          case "$PANEL_MODEL" in
            ''|*[!A-Za-z0-9._-]*) echo "PI_REVIEW_MODEL must match [A-Za-z0-9._-]+"; exit 1;;
          esac
          case "$PANEL_TIMEOUT_MS" in
            ''|*[!0-9]*) echo "PI_REVIEW_TIMEOUT_MS must be a positive integer, got: $PANEL_TIMEOUT_MS"; exit 1;;
          esac
          if [ "$PANEL_TIMEOUT_MS" -lt 60000 ] || [ "$PANEL_TIMEOUT_MS" -gt 1800000 ]; then
            echo "PI_REVIEW_TIMEOUT_MS must be within [60000, 1800000], got: $PANEL_TIMEOUT_MS"
            exit 1
          fi
          {
            echo "provider=$PANEL_PROVIDER"
            echo "model=$PANEL_MODEL"
            echo "timeout_ms=$PANEL_TIMEOUT_MS"
          } >> "$GITHUB_OUTPUT"
          echo "frozen provider=$PANEL_PROVIDER model=$PANEL_MODEL timeout_ms=$PANEL_TIMEOUT_MS"

  review:
    name: Independent reviewer ${{ matrix.slot }}
    needs: freeze
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Provider capacity is shared with the acceptance lanes.  Keep the three
      # contexts independent but serialize their requests so they do not starve
      # each other until timeout.
      max-parallel: 1
      matrix:
        slot: [1, 2, 3]
    steps:
      - name: Checkout mobile
        uses: actions/checkout@v5

      - name: Install agent review SDK
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p stamp-review-agent
          cd stamp-review-agent
          npm init -y >/dev/null
          npm i @earendil-works/pi-ai@0.81.1 yaml@2.8.1 --no-audit --no-fund

      - name: Review raw evidence and submit panel vote
        env:
          STAMP_URL: ${{ secrets.STAMP_URL }}
          STAMP_TOKEN: ${{ secrets.STAMP_TOKEN }}
          STAMP_RUN_ID: ${{ inputs.run_id }}
          STAMP_REVIEWER: agent-review-${{ matrix.slot }}
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.PI_API_KEY }}
          QWEN_TOKEN_PLAN_CN_API_KEY: ${{ secrets.QWEN_TOKEN_PLAN_CN_API_KEY }}
          PI_PROVIDER: ${{ needs.freeze.outputs.provider }}
          PI_MODEL: ${{ needs.freeze.outputs.model }}
          PI_REVIEW_TIMEOUT_MS: ${{ needs.freeze.outputs.timeout_ms }}
          SLOCK_PI_AI_MODULE: ${{ runner.temp }}/stamp-review-agent/node_modules/@earendil-works/pi-ai/dist/providers/all.js
          SLOCK_YAML_MODULE: ${{ runner.temp }}/stamp-review-agent/node_modules/yaml/dist/index.js
          STAMP_REVIEW_OUT: panel-review-${{ matrix.slot }}.json
        run: node scripts/qa/review_agent.mjs

      - name: Upload raw and parsed review record
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: stamp-panel-review-${{ matrix.slot }}
          path: panel-review-${{ matrix.slot }}.json
          if-no-files-found: error

  verify-panel:
    name: Verify three independent votes
    needs: [freeze, review]
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Download reviewer records
        uses: actions/download-artifact@v7
        with:
          pattern: stamp-panel-review-*
          path: panel-records
          merge-multiple: true

      - name: Verify panel state in Stamp
        env:
          STAMP_URL: ${{ secrets.STAMP_URL }}
          STAMP_TOKEN: ${{ secrets.STAMP_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          PANEL_PROVIDER: ${{ needs.freeze.outputs.provider }}
          PANEL_MODEL: ${{ needs.freeze.outputs.model }}
        run: |
          test "${{ needs.review.result }}" = success || {
            echo "review matrix result: ${{ needs.review.result }}"
            exit 1
          }
          records=$(find panel-records -name 'panel-review-*.json' -type f | sort)
          test "$(wc -w <<<"$records")" -eq 3
          jq -es --arg provider "$PANEL_PROVIDER" --arg model "$PANEL_MODEL" '
            length == 3 and
            ([.[].reviewer] | sort) == ["agent-review-1","agent-review-2","agent-review-3"] and
            ([.[].run_id] | unique) == [env.RUN_ID] and
            all(.[]; .stage == "submitted" or .stage == "already_submitted") and
            ([.[] | select(.stage == "submitted")] | length) >= 1 and
            ([.[].evidence_manifest_sha256] | unique | length) == 1 and
            ([.[].review_input_sha256] | unique | length) == 1 and
            all(.[]; .provider == $provider and .model == $model) and
            all(.[];
              (.parsed_vote.verdict == "passed" or .parsed_vote.verdict == "failed") and
              (if .stage == "submitted" then .post_receipt.ok == true
               else .source == "remote_existing_vote" and ((.existing_review.id | type) == "string") and ((.existing_review.id | length) > 0)
               end)
            )
          ' $records
          input_sha=$(jq -rs '.[0].review_input_sha256' $records)
          local_passed=$(jq -rs '[.[].parsed_vote.verdict | select(. == "passed")] | length' $records)
          local_failed=$(jq -rs '[.[].parsed_vote.verdict | select(. == "failed")] | length' $records)
          json=$(curl -fsS -H "Authorization: Bearer $STAMP_TOKEN" "$STAMP_URL/api/runs/$RUN_ID")
          jq -e --arg sha "$input_sha" --arg provider "$PANEL_PROVIDER" --arg model "$PANEL_MODEL" --argjson passed "$local_passed" --argjson failed "$local_failed" '
            ([.reviews[] | select(.role == "panel") | .reviewer] | sort) == ["agent-review-1","agent-review-2","agent-review-3"] and
            ([.reviews[] | select(.role == "panel") | .detail_json | (if type == "string" then fromjson else . end) | .review_input_sha256] | unique) == [$sha] and
            all(.reviews[] | select(.role == "panel"); (.detail_json | (if type == "string" then fromjson else . end) | .provider == $provider and .model == $model)) and
            ([.reviews[] | select(.role == "panel" and .verdict == "passed")] | length) == $passed and
            ([.reviews[] | select(.role == "panel" and .verdict == "failed")] | length) == $failed and
            (if $passed >= 2 and .run.human_final_required == 1 then
              .run.panel_policy == "auto" and .run.status == "in_review" and
              (any(.reviews[]; .role == "final" and .reviewer == "panel-consensus") | not)
            elif $passed >= 2 then
              .run.panel_policy == "auto" and .run.status == "passed" and
              any(.reviews[]; .role == "final" and .reviewer == "panel-consensus" and .verdict == "passed")
            else
              .run.status == "in_review" and
              (any(.reviews[]; .role == "final" and .reviewer == "panel-consensus") | not)
            end)
          ' <<<"$json"
          echo "panel tally=${local_passed}/${local_failed} run_status=$(jq -r .run.status <<<"$json") input_sha=$input_sha"

      - name: Upload aggregate panel record
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: stamp-panel-aggregate
          path: panel-records/
          if-no-files-found: error
