name: OHOS SQLDelight Raft Maven consumer

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Mobile source ref/commit to verify
        required: true
        default: main

permissions:
  contents: read

jobs:
  clean-cache-consumer:
    name: Clean-cache OHOS KBA-001 resolution
    runs-on: blacksmith-8vcpu-ubuntu-2404
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280-android.1
    timeout-minutes: 90
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.ci-gradle-home
      SLOCK_SKIP_OHOS_LOCAL_DEP_PREP: "true"
    steps:
      - name: Checkout locked source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify isolated cache and Raft-only coordinates
        working-directory: compose
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GRADLE_USER_HOME" "$RUNNER_TEMP/ohos-sqldelight-receipt"
          # The container checkout is owned by a different uid; make the
          # source identity read auditable before invoking any Gradle logic.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test ! -d "$HOME/.m2/repository/app/cash/sqldelight" || {
            echo 'unexpected host Maven cache present' >&2; exit 1;
          }
          {
            echo "source=$(git -C .. rev-parse HEAD)"
            echo "gradle_user_home=$GRADLE_USER_HOME"
            echo "slock_skip_ohos_local_dep_prep=$SLOCK_SKIP_OHOS_LOCAL_DEP_PREP"
            echo 'repository_policy=Raft Maven only for KBA-001; no restored/published local artifacts'
          } | tee "$RUNNER_TEMP/ohos-sqldelight-receipt/environment.txt"
          cat > "$RUNNER_TEMP/ohos-sqldelight-init.gradle" <<'GRADLE'
          gradle.settingsEvaluated { settings ->
            def locals = settings.dependencyResolutionManagement.repositories.findAll { it.name == 'MavenLocal' }
            locals.each { settings.dependencyResolutionManagement.repositories.remove(it) }
            settings.dependencyResolutionManagement.repositories.maven { url = uri('https://maven.artifacts.botiverse.dev') }
          }
          GRADLE
          # settings.ohos.gradle.kts owns plugin repositories and is evaluated
          # before init scripts; inject the public marker repository into this
          # ephemeral checkout only (source tree remains unchanged).
          sed -i '/repositories {/a\        maven { url = uri("https://maven.artifacts.botiverse.dev") }' settings.ohos.gradle.kts
          ./gradlew -c settings.ohos.gradle.kts --init-script "$RUNNER_TEMP/ohos-sqldelight-init.gradle" tasks --all --no-daemon --console=plain \
            | tee "$RUNNER_TEMP/ohos-sqldelight-receipt/tasks.txt"

      - name: Resolve and compile real OHOS target
        working-directory: compose
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ohos-sqldelight-receipt"
          ./gradlew -c settings.ohos.gradle.kts \
            --init-script "$RUNNER_TEMP/ohos-sqldelight-init.gradle" \
            :shared:compileKotlinOhosArm64 \
            --no-daemon --console=plain --stacktrace 2>&1 | tee "$out/compile.log"
          # Kotlin MPP does not expose a stable resolvable *CompileClasspath
          # configuration for native targets. Record the artifacts actually
          # consumed by the successful compiler invocation instead.
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/app.cash.sqldelight" \
            -type f -path '*/2.1.0-KBA-001/*' -print | sort \
            | tee "$out/resolution.log"
          grep -q '/app.cash.sqldelight/runtime/2.1.0-KBA-001/' "$out/resolution.log"
          grep -q '/app.cash.sqldelight/runtime-ohosarm64/2.1.0-KBA-001/' "$out/resolution.log"
          grep -q '/app.cash.sqldelight/native-driver-ohosarm64/2.1.0-KBA-001/' "$out/resolution.log"
          grep -q '/app.cash.sqldelight/native-driver-ohosarm64/2.1.0-KBA-001/' "$out/compile.log"
          ! grep -Eqi 'third_party/sqldelight|included-source|mavenLocal' "$out/compile.log"

      - name: Upload resolved-coordinate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohos-sqldelight-kba001-receipt
          path: ${{ runner.temp }}/ohos-sqldelight-receipt/
          if-no-files-found: error
          retention-days: 14
