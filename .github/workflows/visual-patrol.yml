name: Visual Patrol (daily drift report)

# Daily visual-drift and source-lens inspection. Reads the nightly visual-testing analysis and the
# source tree, and reports what it finds in the job summary and the uploaded JSON reports.
# See docs/visual-patrol.md.
#
# It no longer files GitHub issues: the repository is public (2026-10-15, artin), and automated
# audit findings are internal triage material, not public issues (Sentinel, task #172). The scripts
# always run in their default dry-run mode here; `--live` is never passed, and the job can only read
# issues (the scripts list existing ones to dedupe the report).

on:
  workflow_dispatch:
    inputs:
      comparison:
        description: "Analysis comparison to inspect"
        type: choice
        options: [react__android, android__ios, react__ios]
        default: react__android
      threshold:
        description: "Minimum severity to report"
        type: choice
        options: [medium, high, critical]
        default: medium
      cap:
        description: "Max findings per lens"
        default: "10"
  schedule:
    # A bit after the nightly capture+analysis lands on gh-pages.
    # Twice daily (artin, #wg-nightly-visual-fix 2026-07-16): the code lenses
    # (token/glyph/renderer/font) scan source that moves all day; the visual
    # lens reuses the once-nightly analysis, so its second pass just dedupes.
    - cron: "0 8 * * *"
    - cron: "0 20 * * *"

permissions:
  contents: read
  issues: read

concurrency:
  group: visual-patrol-${{ github.event.inputs.comparison || 'react__android' }}
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0            # need origin/gh-pages for the analysis + dedup context
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run visual patrol
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail   # `| tee` must not swallow a non-zero exit from the node script
          node scripts/visual_patrol.mjs \
            --analysis gh-pages \
            --comparison "${{ github.event.inputs.comparison || 'react__android' }}" \
            --threshold "${{ github.event.inputs.threshold || 'medium' }}" \
            --cap "${{ github.event.inputs.cap || '10' }}" \
            --repo "${{ github.repository }}" | tee patrol-report.json
      - name: Run token audit (design-token lens)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/patrol/token_audit.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --cap 5 | tee token-audit-report.json

      - name: Run glyph audit (text-glyph-as-icon lens)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/patrol/glyph_audit.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --cap 5 | tee glyph-audit-report.json

      - name: Run renderer coverage audit (markdown silent-drop lens)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/patrol/renderer_coverage.mjs \
            --repo "$GITHUB_REPOSITORY" | tee renderer-coverage-report.json

      - name: Run font audit (typography contract lens)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/patrol/font_audit.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --cap 5 | tee font-audit-report.json

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Visual patrol (report only, no issues filed)"
            for f in patrol-report.json token-audit-report.json glyph-audit-report.json \
                     renderer-coverage-report.json font-audit-report.json; do
              [ -f "$f" ] || continue
              echo ""
              echo "<details><summary>$f</summary>"
              echo ""
              echo '```json'
              head -c 60000 "$f"
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: visual-patrol-report
          path: |
            patrol-report.json
            token-audit-report.json
            glyph-audit-report.json
            renderer-coverage-report.json
            font-audit-report.json
