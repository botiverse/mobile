name: OHOS macOS M4 HVF Probe

on:
  pull_request:
    paths:
      - .github/workflows/ohos-macos-hvf-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Command-line SDK + emulator boot probe
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      COMMAND_LINE_TOOLS_URL: https://cdn.cat.ms/commandline-tools-mac-arm64-6.1.1.280.zip
      COMMAND_LINE_TOOLS_SHA256: 47d0e558b8285e1452f4d3611863027ec0d1135642761bef23402434e22382d4
      OHOS_IMAGE_VERSION: HarmonyOS 6.1.0(23)
      OHOS_INSTANCE_NAME: Raft CI API23
    steps:
      - name: Record macOS runner facts
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="$RUNNER_TEMP/ohos-macos-hvf-probe"
          mkdir -p "$LOG_DIR"
          {
            uname -a
            uname -m
            sw_vers
            system_profiler SPHardwareDataType
            sysctl -a 2>/dev/null | grep -E 'kern\.hv|machdep\.cpu|hw\.(model|machine|memsize|ncpu)' || true
            df -h /
          } | tee "$LOG_DIR/runner-facts.txt"

      - name: Install pinned HarmonyOS command-line tools
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="$RUNNER_TEMP/ohos-macos-hvf-probe"
          ARCHIVE="$RUNNER_TEMP/command-line-tools-mac-arm64-6.1.1.280.zip"
          TOOLS_PARENT="$RUNNER_TEMP/harmonyos-tools"
          mkdir -p "$TOOLS_PARENT"

          curl --fail --location --retry 3 \
            --output "$ARCHIVE" \
            "$COMMAND_LINE_TOOLS_URL"
          printf '%s  %s\n' "$COMMAND_LINE_TOOLS_SHA256" "$ARCHIVE" \
            | shasum -a 256 --check -
          ditto -x -k "$ARCHIVE" "$TOOLS_PARENT"
          xattr -dr com.apple.quarantine "$TOOLS_PARENT/command-line-tools" || true

          TOOLS="$TOOLS_PARENT/command-line-tools"
          {
            file "$TOOLS/emulator/Emulator"
            "$TOOLS/bin/hvigorw" --version
            "$TOOLS/bin/ohpm" --version
            "$TOOLS/sdk/default/openharmony/toolchains/hdc" -v
            "$TOOLS/bin/Emulator" -version
            otool -L "$TOOLS/emulator/Emulator" \
              | grep '/Hypervisor.framework/'
          } | tee "$LOG_DIR/tool-versions.txt"

      - name: Probe API 23 emulator boot
        shell: bash
        run: |
          set -u
          LOG_DIR="$RUNNER_TEMP/ohos-macos-hvf-probe"
          TOOLS="$RUNNER_TEMP/harmonyos-tools/command-line-tools"
          EMULATOR="$TOOLS/bin/Emulator"
          HDC="$TOOLS/sdk/default/openharmony/toolchains/hdc"
          IMAGE_ROOT="$RUNNER_TEMP/harmonyos-images"
          INSTANCE_ROOT="$RUNNER_TEMP/harmonyos-instances"
          RESULT=not_run
          DETAIL=
          EMULATOR_PID=

          cleanup() {
            if [[ -n "$EMULATOR_PID" ]] && kill -0 "$EMULATOR_PID" 2>/dev/null; then
              "$EMULATOR" -stop "$OHOS_INSTANCE_NAME" >/dev/null 2>&1 || true
              kill "$EMULATOR_PID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          HV_SUPPORT="$(sysctl -n kern.hv_support 2>/dev/null || true)"
          printf 'kern.hv_support=%s\n' "${HV_SUPPORT:-unavailable}" \
            | tee "$LOG_DIR/hvf-capability.txt"

          if [[ "$HV_SUPPORT" != "1" ]]; then
            RESULT=hvf_unavailable
            DETAIL='Runner does not expose Hypervisor.framework acceleration; nested emulator boot was skipped.'
          else
            defaults write NSGlobalDomain AppleLocale 'zh_CN'
            defaults write NSGlobalDomain AppleLanguages -array 'zh-Hans-CN'
            export LANG=zh_CN.UTF-8
            export LC_ALL=zh_CN.UTF-8

            "$EMULATOR" -license accept >"$LOG_DIR/licenses.txt" 2>&1
            LICENSE_EXIT=$?
            if [[ "$LICENSE_EXIT" -ne 0 ]]; then
              RESULT=license_failed
              DETAIL="Emulator license acceptance exited $LICENSE_EXIT."
            else
              "$EMULATOR" \
                -install \
                -deviceType Phone \
                -osVersion "$OHOS_IMAGE_VERSION" \
                -imageRoot "$IMAGE_ROOT" \
                -force >"$LOG_DIR/image-install.txt" 2>&1
              IMAGE_EXIT=$?

              IMAGE_METADATA="$IMAGE_ROOT/system-image/HarmonyOS-6.0.31/phone_all_arm/sdk-pkg.json"
              if [[ "$IMAGE_EXIT" -ne 0 || ! -f "$IMAGE_METADATA" ]]; then
                RESULT=image_install_failed
                DETAIL="API 23 image install exited $IMAGE_EXIT or did not produce $IMAGE_METADATA."
              else
                "$EMULATOR" \
                  -create "$OHOS_INSTANCE_NAME" \
                  -deviceType Phone \
                  -osVersion "$OHOS_IMAGE_VERSION" \
                  -storage 6 \
                  -memory 4 \
                  -instancePath "$INSTANCE_ROOT" \
                  -imageRoot "$IMAGE_ROOT" >"$LOG_DIR/instance-create.txt" 2>&1
                CREATE_EXIT=$?

                if [[ "$CREATE_EXIT" -ne 0 ]]; then
                  RESULT=instance_create_failed
                  DETAIL="Emulator instance creation exited $CREATE_EXIT."
                else
                  "$EMULATOR" \
                    -start "$OHOS_INSTANCE_NAME" \
                    -instancePath "$INSTANCE_ROOT" \
                    -imageRoot "$IMAGE_ROOT" \
                    -bootmode coldboot >"$LOG_DIR/emulator-start.txt" 2>&1 &
                  EMULATOR_PID=$!

                  TARGET=
                  for _ in $(seq 1 120); do
                    "$HDC" list targets >"$LOG_DIR/hdc-targets.txt" 2>&1 || true
                    TARGET="$(grep -E '^[[:alnum:].:_-]+$' "$LOG_DIR/hdc-targets.txt" \
                      | grep -v '^\[Empty\]$' \
                      | head -1 || true)"
                    if [[ -n "$TARGET" ]]; then
                      break
                    fi
                    if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
                      break
                    fi
                    sleep 2
                  done

                  if [[ -z "$TARGET" ]]; then
                    RESULT=boot_failed
                    DETAIL='Emulator did not expose an HDC target within four minutes, or the process exited early.'
                  else
                    RESULT=boot_pass
                    DETAIL="Emulator booted and exposed HDC target $TARGET."
                    {
                      "$HDC" -t "$TARGET" shell param get const.product.model
                      "$HDC" -t "$TARGET" shell param get const.ohos.apiversion
                      "$HDC" -t "$TARGET" shell param get const.product.software.version
                    } | tee "$LOG_DIR/live-device-identity.txt"
                    "$HDC" -t "$TARGET" shell snapshot_display \
                      -f /data/local/tmp/ohos-ci-probe.jpeg \
                      >"$LOG_DIR/snapshot.txt" 2>&1 || true
                    "$HDC" -t "$TARGET" file recv \
                      /data/local/tmp/ohos-ci-probe.jpeg \
                      "$LOG_DIR/ohos-ci-probe.jpeg" \
                      >>"$LOG_DIR/snapshot.txt" 2>&1 || true
                  fi
                fi
              fi
            fi
          fi

          {
            printf 'result=%s\n' "$RESULT"
            printf 'detail=%s\n' "$DETAIL"
            printf 'command_line_tools_sha256=%s\n' "$COMMAND_LINE_TOOLS_SHA256"
            printf 'image_version=%s\n' "$OHOS_IMAGE_VERSION"
          } | tee "$LOG_DIR/result.txt"

          {
            echo '## OHOS macOS M4 HVF probe'
            echo
            echo "- Result: \`$RESULT\`"
            echo "- Detail: $DETAIL"
            echo "- Image: \`$OHOS_IMAGE_VERSION\`"
            echo "- Tools SHA-256: \`$COMMAND_LINE_TOOLS_SHA256\`"
            echo
            echo 'The probe records unsupported nested virtualization as evidence, not as a product-test failure.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ohos-macos-m4-hvf-probe
          path: ${{ runner.temp }}/ohos-macos-hvf-probe/
          if-no-files-found: error
          retention-days: 14
