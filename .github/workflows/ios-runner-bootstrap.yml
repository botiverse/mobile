name: iOS runner bootstrap

on:
  workflow_dispatch:
    inputs:
      xcode_app_path:
        description: "Optional absolute installed Xcode .app path; empty selects the installed default"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-bootstrap-mac-mini-1
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap mac-mini-1 for iOS capture
    runs-on:
      group: jacky-macmini
      labels: [self-hosted, macOS, ARM64, mac-mini-1]
    timeout-minutes: 60
    env:
      XCODE_APP_PATH: ${{ inputs.xcode_app_path }}
      SIM_DEVICE: iPhone 14
    steps:
      - uses: actions/checkout@v5
      - name: Select full Xcode for this job
        run: bash scripts/ci/select_ios_xcode.sh
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install missing tools and iOS runtime
        run: bash scripts/ci/bootstrap_ios_runner.sh
      - name: Check capture prerequisites
        run: bash scripts/ci/ios_visual_runner.sh prepare
      - name: Verify a fresh iPhone 14 can boot
        run: bash scripts/ci/ios_visual_runner.sh boot
      - name: Clean up the probe simulator
        if: always()
        run: bash scripts/ci/ios_visual_runner.sh cleanup
      - name: Upload cleanup diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-bootstrap-diagnostics
          path: visual-testing-results/ios-diagnostics/
          if-no-files-found: ignore
