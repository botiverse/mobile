name: OHOS Release

on:
  pull_request:
    paths:
      - ".github/workflows/ohos-release.yml"
      - "compose/ohosApp/AppScope/app.json5"
      - "scripts/set_ohos_app_version.mjs"
      - "scripts/stage_ohos_mr_resources.sh"
      - "scripts/validate_ohos_hap_resources.sh"
      - "scripts/validate_ohos_app_pack.sh"
      - "docs/ohos-release-ci.md"
      - "change-logs/**/ohos/*.md"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact application SHA for artifact-only validation (empty uses workflow ref)"
        required: false
        type: string
        default: ""
      publish_to_hands:
        description: "Publish a Hands draft; disable for validation artifacts only"
        required: true
        type: boolean
        default: true
      version_major:
        description: "versionName major (X)"
        required: true
        type: string
        default: "1"
      version_minor:
        description: "versionName minor (Y)"
        required: true
        type: string
        default: "0"
      version_patch:
        description: "versionName patch (Z)"
        required: true
        type: string
        default: "0"
      version_build:
        description: "versionCode build (0-999)"
        required: true
        type: string
        default: "0"
      version_suffix:
        description: "versionName suffix (e.g. rc1); leave empty for release"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: ohos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-definition:
    name: Validate OHOS release workflow
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate workflow and scripts
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/ohos-release.yml")'
          bash -n scripts/sign_ohos_app_pack.sh
          bash -n scripts/stage_ohos_mr_resources.sh
          bash -n scripts/validate_ohos_hap_resources.sh
          bash -n scripts/validate_ohos_app_pack.sh
          python3 scripts/ci/test_remote_touchlab_ci_contract.py
          python3 scripts/ci/test_no_local_ktor_ci_contract.py
          node --check scripts/set_ohos_app_version.mjs

          app_json="$(mktemp)"
          cp compose/ohosApp/AppScope/app.json5 "$app_json"
          node scripts/set_ohos_app_version.mjs "$app_json" 2.3.4-rc1 2030405
          node - "$app_json" <<'NODE'
          const fs = require("node:fs");
          const app = JSON.parse(fs.readFileSync(process.argv[2], "utf8")).app;
          if (app.versionName !== "2.3.4-rc1" || app.versionCode !== 2030405) {
            throw new Error("OHOS version writer produced unexpected metadata");
          }
          NODE

  resolve:
    name: Resolve release parameters
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version_name: ${{ steps.parameters.outputs.version_name }}
      version_code: ${{ steps.parameters.outputs.version_code }}
    steps:
      - name: Checkout version formula
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false
      - name: Resolve exact application source
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          PUBLISH_TO_HANDS: ${{ inputs.publish_to_hands }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_SHA" ]]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be a full SHA"; exit 1; }
            [[ "$PUBLISH_TO_HANDS" == false ]] || { echo "::error::Custom source is artifact-only"; exit 1; }
          fi
          echo "sha=${REQUESTED_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate and resolve version
        id: parameters
        shell: bash
        run: |
          set -euo pipefail
          MAJOR="${{ inputs.version_major }}"
          MINOR="${{ inputs.version_minor }}"
          PATCH="${{ inputs.version_patch }}"
          BUILD="${{ inputs.version_build }}"
          SUFFIX="${{ inputs.version_suffix }}"

          for value in "$MAJOR" "$MINOR" "$PATCH" "$BUILD"; do
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "::error::Version components must be non-negative integers"; exit 1; }
          done
          [[ -z "$SUFFIX" || "$SUFFIX" =~ ^[0-9A-Za-z.-]+$ ]] || {
            echo "::error::version_suffix may contain only letters, digits, dots, and hyphens"
            exit 1
          }

          VERSION_CODE="$(scripts/ci/version_code.sh "$MAJOR" "$MINOR" "$PATCH" "$BUILD")"
          (( VERSION_CODE > 0 && VERSION_CODE <= 2147483647 )) || {
            echo "::error::Computed versionCode is outside the supported 32-bit positive range"
            exit 1
          }
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          if [[ -n "$SUFFIX" ]]; then
            VERSION_NAME="${VERSION_NAME}-${SUFFIX}"
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "OHOS release: $VERSION_NAME ($VERSION_CODE)"

  signing-preflight:
    name: Check OHOS signing secrets
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: resolve
    env:
      SIGNING_CERT: ${{ secrets.SLOCK_OHOS_SIGNING_CERT_BASE64 }}
      SIGNING_PROFILE: ${{ secrets.SLOCK_OHOS_SIGNING_PROFILE_BASE64 }}
      SIGNING_KEY: ${{ secrets.SLOCK_OHOS_SIGNING_KEY_BASE64 }}
      KEY_ALIAS: ${{ secrets.SLOCK_OHOS_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.SLOCK_OHOS_KEY_PASSWORD }}
      KEYSTORE_PASSWORD: ${{ secrets.SLOCK_OHOS_KEYSTORE_PASSWORD }}
      HANDS_OHOS_BEARER_TOKEN: ${{ inputs.publish_to_hands && secrets.HANDS_OHOS_BEARER_TOKEN || '' }}
      PUBLISH_TO_HANDS: ${{ inputs.publish_to_hands }}
    steps:
      - name: Require complete release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SIGNING_CERT SIGNING_PROFILE SIGNING_KEY KEY_ALIAS KEY_PASSWORD KEYSTORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret for $name"
              missing=1
            fi
          done
          if [[ "$PUBLISH_TO_HANDS" == true && -z "$HANDS_OHOS_BEARER_TOKEN" ]]; then
            echo "::error::Missing Hands token for draft publication"
            missing=1
          fi
          exit "$missing"

  kuikly-artifacts:
    name: Kuikly release manifest (Raft)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [resolve, signing-preflight]
    timeout-minutes: 20
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/graalvm \
            /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Verify complete immutable Kuikly release
        run: scripts/ci/verify_kuikly_release_manifest.sh

  fork-deps:
    name: Shared OHOS fork dependencies
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [resolve, signing-preflight]
    timeout-minutes: 60
    outputs:
      forkdeps-key: ${{ steps.keys.outputs.forkdeps }}
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/graalvm \
            /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up OpenHarmony SDK
        id: setup-ohos-sdk
        uses: openharmony-rs/setup-ohos-sdk@v1.0.1
        with:
          version: "6.0"
          components: native
          cache: true

      - name: Export OpenHarmony SDK path
        shell: bash
        run: echo "OHOS_SDK_HOME=${{ steps.setup-ohos-sdk.outputs.ohos-base-sdk-home }}" >> "$GITHUB_ENV"
      - name: Add canonical plugin repository fallbacks
        shell: bash
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle.kts <<'INIT'
          settingsEvaluated {
              pluginManagement {
                  repositories {
                      gradlePluginPortal()
                      mavenCentral()
                      google()
                  }
              }
          }
          gradle.beforeProject {
              if (rootProject.name == "sqldelight") {
                  repositories {
                      exclusiveContent {
                          forRepository {
                              maven {
                                  name = "RaftArtifactsTouchlab"
                                  url = uri("https://maven.artifacts.botiverse.dev")
                              }
                          }
                          filter {
                              includeGroup("co.touchlab")
                          }
                      }
                  }
              }
          }
          INIT

      - name: Compose dependency cache key
        id: keys
        shell: bash
        run: |
          sqldelight="$(git rev-parse HEAD:third_party/sqldelight)"
          test -n "$sqldelight"
          echo "forkdeps=sqldelight-mavenlocal-$sqldelight" >> "$GITHUB_OUTPUT"

      - name: Cache shared fork dependencies
        id: forkdeps-cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/app/cash/sqldelight
          key: ${{ steps.keys.outputs.forkdeps }}

      - name: Start Touchlab resolution from empty local caches
        shell: bash
        run: |
          userhome="$(java -XshowSettings:properties -version 2>&1 | awk '/user.home/{print $3; exit}')"
          test -n "$userhome"
          gradlehome="${GRADLE_USER_HOME:-$userhome/.gradle}"
          rm -rf \
            "$userhome/.m2/repository/co/touchlab" \
            "$userhome/.m2/repository/io/ktor" \
            "$gradlehome/caches/modules-2/files-2.1/co.touchlab" \
            "$gradlehome/caches/modules-2/files-2.1/io.ktor"
          test ! -e "$userhome/.m2/repository/co/touchlab"
          test ! -e "$userhome/.m2/repository/io/ktor"
          test ! -e "$gradlehome/caches/modules-2/files-2.1/co.touchlab"
          test ! -e "$gradlehome/caches/modules-2/files-2.1/io.ktor"

      - name: Publish shared fork dependencies
        if: steps.forkdeps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cat > /tmp/publish-forkdeps.sh <<'SCRIPT'
          set -euo pipefail
          git submodule sync third_party/sqldelight
          git submodule update --init third_party/sqldelight

          pushd third_party/sqldelight
          ./gradlew --no-daemon --console=plain \
            --stacktrace \
            :sqldelight-compiler:environment:publishMavenPublicationToMavenLocal \
            :sqldelight-compiler:dialect:publishMavenPublicationToMavenLocal \
            :sqldelight-compiler:publishMavenPublicationToMavenLocal \
            :sqlite-migrations:environment:publishMavenPublicationToMavenLocal \
            :sqlite-migrations:publishMavenPublicationToMavenLocal \
            :dialects:sqlite-3-18:publishMavenPublicationToMavenLocal \
            :sqldelight-gradle-plugin:publishToMavenLocal \
            :runtime:publishKotlinMultiplatformPublicationToMavenLocal \
            :runtime:publishOhosArm64PublicationToMavenLocal \
            :drivers:native-driver:publishOhosArm64PublicationToMavenLocal
          popd
          SCRIPT
          for i in 1 2 3; do
            if bash /tmp/publish-forkdeps.sh; then exit 0; fi
            echo "fork-deps publish attempt $i failed; retrying in $((i*30))s" >&2
            sleep $((i*30))
          done
          echo "fork-deps publish failed after 3 attempts" >&2
          exit 1

      - name: Verify published fork dependencies
        shell: bash
        run: |
          repo="$HOME/.m2/repository"
          missing=0
          for probe in \
            "app/cash/sqldelight/app.cash.sqldelight.gradle.plugin" \
            "app/cash/sqldelight/runtime-ohosarm64" \
            "app/cash/sqldelight/native-driver-ohosarm64"; do
            if ! find "$repo/$probe" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | grep -q .; then
              echo "MISSING: $probe" >&2
              missing=1
            fi
          done
          test ! -e "$repo/co/touchlab"
          test ! -e "$repo/io/ktor"
          exit "$missing"

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics

  build-ohos-release:
    name: Build, sign, and validate OHOS .app
    runs-on: blacksmith-16vcpu-ubuntu-2404
    needs: [resolve, kuikly-artifacts, fork-deps]
    timeout-minutes: 180
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280-android.1
    env:
      OHOS_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk/default/openharmony
      DEVECO_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk
      SLOCK_SKIP_OHOS_LOCAL_DEP_PREP: "true"
      SLOCK_OHOS_VERSION_NAME: ${{ needs.resolve.outputs.version_name }}
      SLOCK_OHOS_VERSION_CODE: ${{ needs.resolve.outputs.version_code }}
      KEY_ALIAS: ${{ secrets.SLOCK_OHOS_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.SLOCK_OHOS_KEY_PASSWORD }}
      KEYSTORE_PASSWORD: ${{ secrets.SLOCK_OHOS_KEYSTORE_PASSWORD }}
      HANDS_BEARER_TOKEN: ${{ inputs.publish_to_hands && secrets.HANDS_OHOS_BEARER_TOKEN || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0

      - name: Mark workspace safe for git
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      # Match compose/gradle/gradle-daemon-jvm.properties before Gradle starts.
      # Its generated Foojay redirect can expire; provision the vendor locally.
      - name: Set up JetBrains JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21.0.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Raise Gradle and Kotlin/Native heap for release link
        shell: bash
        run: |
          set -euo pipefail
          GUH="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$GUH"
          cat >> "$GUH/gradle.properties" <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx24g -Xss8m -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx16g,-Xss8m"
          kotlin.native.jvmArgs=-Xmx24g -Xss8m
          org.gradle.workers.max=1
          PROPERTIES
          echo "Configured the release runner with a 24 GB Gradle/Kotlin Native heap"

      - name: Write project build configuration
        shell: bash
        run: |
          cat > compose/ohosApp/local.properties <<'PROPERTIES'
          kuikly.projectPath=../
          kuikly.moduleName=ohosBridge
          kuikly.libraryName=shared
          kuikly.ohosGradleSettings=settings.ohos.gradle.kts
          PROPERTIES

      - name: Restore shared fork dependency artifacts
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository/app/cash/sqldelight
          key: ${{ needs.fork-deps.outputs.forkdeps-key }}
          fail-on-cache-miss: true

      - name: Relocate restored mavenLocal caches
        shell: bash
        run: |
          src="$(cd "$GITHUB_WORKSPACE/../../.." && pwd)/.m2/repository"
          userhome="$(java -XshowSettings:properties -version 2>&1 | awk '/user.home/{print $3; exit}')"
          test -n "$userhome"
          dst="$userhome/.m2/repository"
          test ! -e "$src/co/touchlab"
          test ! -e "$src/io/ktor"
          rm -rf "$dst/co/touchlab" "$dst/io/ktor"
          gradlehome="${GRADLE_USER_HOME:-$userhome/.gradle}"
          rm -rf \
            "$gradlehome/caches/modules-2/files-2.1/co.touchlab" \
            "$gradlehome/caches/modules-2/files-2.1/io.ktor"
          if [[ -d "$src" && "$src" != "$dst" ]]; then
            mkdir -p "$userhome/.m2"
            cp -a "$src" "$userhome/.m2/"
          fi
          test -d "$dst/app/cash/sqldelight/app.cash.sqldelight.gradle.plugin"
          test ! -e "$dst/io/ktor"

      - name: Build and stage OHOS shared release library
        working-directory: compose
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            --stacktrace \
            -c settings.ohos.gradle.kts \
            --refresh-dependencies \
            copyNetworkOhosRuntimeLibs \
            :ohosBridge:linkReleaseSharedOhosArm64

          shared_output="ohosBridge/build/bin/ohosArm64/releaseShared"
          install -Dm755 \
            "$shared_output/libshared.so" \
            ohosApp/entry/libs/arm64-v8a/libshared.so
          install -Dm644 \
            "$shared_output/libshared_api.h" \
            ohosApp/entry/src/main/cpp/libshared_api.h

          test -s ohosApp/entry/libs/arm64-v8a/libshared.so
          test -s ohosApp/entry/src/main/cpp/libshared_api.h
          ../scripts/verify_kuikly_ohos_provenance.sh \
            ohosApp/entry/libs/arm64-v8a/libshared.so

          ../scripts/stage_ohos_mr_resources.sh

          api_header_lines="$(wc -l < "$shared_output/libshared_api.h")"
          grep -q 'raftInitKuikly' "$shared_output/libshared_api.h"
          if (( api_header_lines > 500 )); then
            echo "::error::OHOS bridge C API unexpectedly expanded to $api_header_lines lines"
            exit 1
          fi
          echo "OHOS bridge C API: $api_header_lines lines"

      - name: Decode OHOS signing assets
        id: signing
        shell: bash
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SLOCK_OHOS_SIGNING_CERT_BASE64 }}
          SIGNING_PROFILE_BASE64: ${{ secrets.SLOCK_OHOS_SIGNING_PROFILE_BASE64 }}
          SIGNING_KEY_BASE64: ${{ secrets.SLOCK_OHOS_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/ohos-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"

          decode_secret() {
            local value="$1" output="$2" name="$3"
            if ! printf '%s' "$value" | tr -d '[:space:]' | base64 --decode > "$output" 2>/dev/null || [[ ! -s "$output" ]]; then
              echo "::error::$name is empty or not valid base64"
              exit 1
            fi
            chmod 600 "$output"
          }
          decode_secret "$SIGNING_CERT_BASE64" "$SIGNING_DIR/release.cer" SLOCK_OHOS_SIGNING_CERT_BASE64
          decode_secret "$SIGNING_PROFILE_BASE64" "$SIGNING_DIR/release.p7b" SLOCK_OHOS_SIGNING_PROFILE_BASE64
          decode_secret "$SIGNING_KEY_BASE64" "$SIGNING_DIR/release.p12" SLOCK_OHOS_SIGNING_KEY_BASE64

          echo "cert=$SIGNING_DIR/release.cer" >> "$GITHUB_OUTPUT"
          echo "profile=$SIGNING_DIR/release.p7b" >> "$GITHUB_OUTPUT"
          echo "key=$SIGNING_DIR/release.p12" >> "$GITHUB_OUTPUT"
          echo "directory=$SIGNING_DIR" >> "$GITHUB_OUTPUT"

      - name: Set OHOS app version
        shell: bash
        run: |
          node scripts/set_ohos_app_version.mjs \
            compose/ohosApp/AppScope/app.json5 \
            "$SLOCK_OHOS_VERSION_NAME" \
            "$SLOCK_OHOS_VERSION_CODE"

      - name: Verify manifest-bound OHOS Kuikly renderer
        shell: bash
        run: scripts/ci/verify_kuikly_ohos_renderer.sh

      - name: Install OHOS dependencies
        working-directory: compose/ohosApp
        shell: bash
        run: ohpm install --all

      - name: Sync OHOS project
        working-directory: compose/ohosApp
        shell: bash
        run: hvigorw --sync -p product=default --analyze=normal --no-daemon

      - name: Assemble unsigned release .app
        working-directory: compose/ohosApp
        shell: bash
        run: |
          hvigorw --mode project \
            -p product=default \
            -p buildMode=release \
            -p requiredDeviceType=phone \
            assembleApp --analyze=normal --no-daemon

      - name: Sign release App Pack
        shell: bash
        env:
          SIGNING_CERT: ${{ steps.signing.outputs.cert }}
          SIGNING_PROFILE: ${{ steps.signing.outputs.profile }}
          SIGNING_KEY: ${{ steps.signing.outputs.key }}
        run: |
          set -euo pipefail
          mapfile -t apps < <(find compose/ohosApp -type f -name '*.app' -path '*/build/*' -print)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one generated .app before signing, found ${#apps[@]}"
            printf '%s\n' "${apps[@]}"
            exit 1
          fi
          SIGN_TOOL="$(find "$DEVECO_SDK_HOME" -path '*/openharmony/toolchains/lib/hap-sign-tool.jar' -print -quit)"
          test -n "$SIGN_TOOL"
          scripts/sign_ohos_app_pack.sh \
            --app "${apps[0]}" \
            --sign-tool "$SIGN_TOOL" \
            --cert "$SIGNING_CERT" \
            --profile "$SIGNING_PROFILE" \
            --keystore "$SIGNING_KEY" \
            --key-alias "$KEY_ALIAS" \
            --key-password "$KEY_PASSWORD" \
            --keystore-password "$KEYSTORE_PASSWORD" \
            --compatible-version 23

      - name: Validate signed package and create metadata
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apps < <(find compose/ohosApp -type f -name '*.app' -path '*/build/*' -print)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one generated .app, found ${#apps[@]}"
            printf '%s\n' "${apps[@]}"
            exit 1
          fi
          SIGN_TOOL="$(find "$DEVECO_SDK_HOME" -path '*/openharmony/toolchains/lib/hap-sign-tool.jar' -print -quit)"
          test -n "$SIGN_TOOL"
          mkdir -p "$RUNNER_TEMP/ohos-release"
          GITHUB_SHA="$(git rev-parse HEAD)" scripts/validate_ohos_app_pack.sh \
            --app "${apps[0]}" \
            --bundle build.raft.mobile \
            --version-name "$SLOCK_OHOS_VERSION_NAME" \
            --version-code "$SLOCK_OHOS_VERSION_CODE" \
            --sign-tool "$SIGN_TOOL" \
            --output-dir "$RUNNER_TEMP/ohos-release" | tee -a "$GITHUB_OUTPUT"

      - name: Validate packaged shared resources
        shell: bash
        run: |
          scripts/validate_ohos_hap_resources.sh "${{ steps.validate.outputs.hap_path }}"
          node --test compose/ohosApp/scripts/verify_mobile_oauth_hap.test.mjs
          node compose/ohosApp/scripts/verify_mobile_oauth_hap.mjs \
            "${{ steps.validate.outputs.hap_path }}" \
            raft

      - name: Collect release symbols and source maps
        shell: bash
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/ohos-symbol-files.txt"
          native_symbol="compose/ohosBridge/build/bin/ohosArm64/releaseShared/libshared.so"
          packaged_library="compose/ohosApp/entry/libs/arm64-v8a/libshared.so"
          test -s "$native_symbol"
          test -s "$packaged_library"
          READELF="$(find "$DEVECO_SDK_HOME" -path '*/openharmony/native/llvm/bin/llvm-readelf' -print -quit)"
          test -n "$READELF"
          symbol_build_id="$($READELF -n "$native_symbol" | awk '/Build ID:/{print $3; exit}')"
          packaged_build_id="$($READELF -n "$packaged_library" | awk '/Build ID:/{print $3; exit}')"
          test -n "$symbol_build_id"
          if [[ "$symbol_build_id" != "$packaged_build_id" ]]; then
            echo "::error::Native symbol build-id does not match packaged libshared.so"
            exit 1
          fi
          printf '%s\n' "$native_symbol" > "$list"
          find compose/ohosApp compose/shared/build -type f \
            \( -name '*.sym' -o -name '*.map' -o -name '*.so.dbg' -o -name '*.d.ts.map' \) \
            -print >> "$list" || true
          tar -czf "$RUNNER_TEMP/ohos-release/ohos-symbols-${SLOCK_OHOS_VERSION_NAME}-${SLOCK_OHOS_VERSION_CODE}.tar.gz" -T "$list"
          echo "Packaged OHOS native symbols for build-id $symbol_build_id"

      - name: Record validation source identity
        shell: bash
        env:
          APPLICATION_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPLICATION_SHA"
          printf 'workflow_sha=%s\napplication_sha=%s\n' "$GITHUB_SHA" "$APPLICATION_SHA" > "$RUNNER_TEMP/ohos-release/source-identity.txt"

      - name: Upload signed OHOS release artifact
        uses: actions/upload-artifact@v6
        with:
          name: raft-ohos-${{ needs.resolve.outputs.version_name }}-${{ needs.resolve.outputs.version_code }}
          path: ${{ runner.temp }}/ohos-release
          if-no-files-found: error
          retention-days: 30

      - name: Publish OHOS draft to Hands
        if: inputs.publish_to_hands
        id: hands
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @botiverse/hands-cli@0.5.6

          app="$(find "$RUNNER_TEMP/ohos-release" -maxdepth 1 -type f -name '*.app' -print -quit)"
          hap="$(find "$RUNNER_TEMP/ohos-release" -maxdepth 1 -type f -name '*.hap' -print -quit)"
          metadata="$RUNNER_TEMP/ohos-release/ohos-release-metadata.json"
          test -n "$app" && test -n "$hap" && test -s "$metadata"

          platform_changelog_dir="$GITHUB_WORKSPACE/change-logs/$SLOCK_OHOS_VERSION_NAME/ohos"
          legacy_changelog_dir="$GITHUB_WORKSPACE/change-logs/$SLOCK_OHOS_VERSION_NAME"

          args=(
            --json
            builds publish-ohos raft-ohos
            --app "$app"
            --hap "$hap"
            --metadata "$metadata"
            --channel main
            --version-name "$SLOCK_OHOS_VERSION_NAME"
            --version-code "$SLOCK_OHOS_VERSION_CODE"
            --source-commit "$GITHUB_SHA"
            --source-branch "$GITHUB_REF_NAME"
            --ci-provider github-actions
            --ci-run-id "$GITHUB_RUN_ID"
            --ci-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            --draft
          )
          if [[ -s "$platform_changelog_dir/zh-CN.md" && -s "$platform_changelog_dir/en.md" ]]; then
            args+=(
              --changelog-file "zh-CN=$platform_changelog_dir/zh-CN.md"
              --changelog-file "en=$platform_changelog_dir/en.md"
            )
            echo "Using reviewed OHOS changelog from change-logs/$SLOCK_OHOS_VERSION_NAME/ohos/"
          elif [[ -s "$legacy_changelog_dir/zh-CN.md" && -s "$legacy_changelog_dir/en.md" ]]; then
            args+=(
              --changelog-file "zh-CN=$legacy_changelog_dir/zh-CN.md"
              --changelog-file "en=$legacy_changelog_dir/en.md"
            )
            echo "Using legacy reviewed changelog from change-logs/$SLOCK_OHOS_VERSION_NAME/"
          else
            args+=(--changelog "Automated OHOS release draft from ${GITHUB_SHA}")
            echo "Reviewed OHOS changelog not found; falling back to the automated draft note."
          fi
          symbols="$(find "$RUNNER_TEMP/ohos-release" -maxdepth 1 -type f -name 'ohos-symbols-*.tar.gz' -print -quit)"
          if [[ -n "$symbols" ]]; then
            args+=(--symbols "$symbols")
          fi
          hands "${args[@]}" | tee "$RUNNER_TEMP/hands-ohos-publish.json"
          node - "$RUNNER_TEMP/hands-ohos-publish.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require("node:fs");
          const [input, output] = process.argv.slice(2);
          const result = JSON.parse(fs.readFileSync(input, "utf8"));
          fs.appendFileSync(output, `build_id=${result.build_id}\nrelease_id=${result.release_id}\n`);
          NODE

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## OHOS release artifact"
            echo "- Workflow SHA: $GITHUB_SHA"
            echo "- Application SHA: $(git rev-parse HEAD)"
            echo "- Bundle: \`build.raft.mobile\`"
            echo "- Version: \`${SLOCK_OHOS_VERSION_NAME}\` (\`${SLOCK_OHOS_VERSION_CODE}\`)"
            echo "- SHA-256: \`${{ steps.validate.outputs.app_sha256 }}\`"
            echo "- Size: \`${{ steps.validate.outputs.app_size }}\` bytes"
            echo "- Verified signed HAPs: \`${{ steps.validate.outputs.signed_hap_count }}\`"
            echo "- Standalone HAP: \`${{ steps.validate.outputs.hap_path }}\`"
            echo "- Hands draft build: \`${{ steps.hands.outputs.build_id }}\`"
            echo "- Hands draft release: \`${{ steps.hands.outputs.release_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove decoded signing assets
        if: always()
        shell: bash
        run: rm -rf "${{ steps.signing.outputs.directory }}"

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics
