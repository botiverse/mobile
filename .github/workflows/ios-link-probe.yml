name: iOS link probe

# Measurement only, dispatch only. Links the release iOS framework once
# (:shared:linkPodReleaseFrameworkIosArm64) on the chosen GitHub macOS runner with the chosen JVM
# and compiler settings, and records what that costs: the runner's real RAM and CPUs, wall time,
# peak memory (/usr/bin/time -l, and a ps sampler of the forked Gradle daemon), swap, the GC log,
# the compiler's per-phase timings and the framework size. It never archives, signs or exports an
# app, never uploads to Hands or TestFlight, never creates a release or a draft, and reads no
# repository secrets. Results: the job summary and the ios-link-probe-<run>-<attempt> artifact
# (summary.txt, phase-profile.txt / phase-profile-top.tsv, gc.log, mem-samples.tsv, link.log),
# written by scripts/ci/ios_link_probe_report.py.
#
# The job is ios-release.yml's "Build + sign IPA" job up to and including "Build shared framework":
# Xcode 27.1 through select_ios_xcode.sh, JDK 17, the Gradle cache policy, the heap written to
# $GRADLE_USER_HOME/gradle.properties, the release ~/.konan cache key, :verifyComposeUiPatch, no
# Gradle daemon, one worker. Differences, all for clean numbers:
# - the link task runs directly: syncFramework only copies its output, and there is no pod
#   install (:shared declares no pods or cinterops; nothing here builds the app);
# - :shared and its dependencies compile first, in their own Gradle invocation (as test.yml
#   does), so the measured invocation is the link alone, in a fresh daemon JVM (ios-release.yml
#   compiles and links in one JVM);
# - the link runs with --no-build-cache, so a cached framework can never stand in for it.
#
# How the inputs reach the compiler:
# - heap, parallel_gc: org.gradle.jvmargs in $GRADLE_USER_HOME/gradle.properties (it overrides
#   compose/gradle.properties), i.e. the Gradle daemon JVM, inside which Kotlin/Native compiles and
#   links. The same line adds -Xlog:gc* (the GC log).
# - disable_phases, small_binary, profile_phases: -Praft.iosLinkProbe.* Gradle properties, read
#   by compose/shared/build.gradle.kts for the framework binaries only (no other build sets them).
# - -Pkotlin.internal.compiler.arguments.log.level=warning makes the Kotlin Gradle plugin print
#   konanc's "Arguments = [...]"; the report checks the probe's flags in it, and the -Xmx / GC flags
#   in the forked daemon's real command line.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "GitHub macOS runner, both the Xcode 27 image: xcode-27-xlarge (default, billed) | xcode-27 (standard, about 7 GB). The job records the real RAM and CPUs."
        required: false
        type: choice
        default: xcode-27-xlarge
        options:
          - xcode-27-xlarge
          - xcode-27
      heap:
        description: "Gradle daemon -Xmx, e.g. 10g or 12288m (Kotlin/Native compiles and links inside that JVM). Empty = ios-release.yml's value for the runner: 20g on xcode-27-xlarge, 5g on xcode-27."
        required: false
        type: string
        default: ""
      parallel_gc:
        description: "Add -XX:+UseParallelGC to the Gradle daemon JVM (otherwise the JDK default, G1)"
        required: false
        type: boolean
        default: false
      disable_phases:
        description: "Link with one -Xdisable-phases=DevirtualizationAnalysis,DCEPhase,RemoveRedundantCallsToStaticInitializersPhase (otherwise the usual RemoveRedundantCallsToStaticInitializersPhase only)"
        required: false
        type: boolean
        default: false
      small_binary:
        description: 'binaryOption("smallBinary", "true") for the framework (-Xbinary=smallBinary=true)'
        required: false
        type: boolean
        default: false
      profile_phases:
        description: "-Xprofile-phases: per-phase compiler timings (a line per phase per file: kept out of the live log, summed per phase in the report). Keep it the same across runs you compare."
        required: false
        type: boolean
        default: true

env:
  # As ios-release.yml: no -Xmx here ($GRADLE_USER_HOME/gradle.properties, written below, takes
  # precedence over GRADLE_OPTS), no Gradle daemon (each ./gradlew forks a single-use daemon JVM
  # with those settings), Kotlin JVM compiles in-process, one worker.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
  GRADLE_MAX_WORKERS: "1"

permissions:
  contents: read

jobs:
  probe:
    name: Link release framework (measure only)
    runs-on: ${{ inputs.runner }}
    # Setup ~5 min, compile up to 45, link up to 120 (the 5g release link of run 44856960454 ran
    # ~80 min before its OOM), report and upload a few. Each Gradle step has its own timeout, so
    # the report and the upload still run after one.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Seconds: proves the report's parsers on fixtures before an hour of runner time.
      - name: Self-test the probe report
        shell: bash
        run: python3 -I scripts/ci/ios_link_probe_report.py --self-test

      - name: Resolve probe parameters
        shell: bash
        env:
          PROBE_RUNNER: ${{ inputs.runner }}
          HEAP_INPUT: ${{ inputs.heap }}
          PARALLEL_GC: ${{ inputs.parallel_gc }}
          DISABLE_PHASES: ${{ inputs.disable_phases }}
          SMALL_BINARY: ${{ inputs.small_binary }}
          PROFILE_PHASES: ${{ inputs.profile_phases }}
        run: |
          set -euo pipefail
          heap="$(printf '%s' "${HEAP_INPUT}" | tr -d '[:space:]')"
          if [ -z "${heap}" ]; then
            # ios-release.yml, "Raise Gradle/Kotlin heap for the iOS archive (this runner only)".
            case "${PROBE_RUNNER}" in
              xcode-27) heap=5g ;;
              *) heap=20g ;;
            esac
          fi
          if ! [[ "${heap}" =~ ^[1-9][0-9]*[gGmM]$ ]]; then
            echo "::error::heap must be a whole number with g or m, e.g. 10g or 12288m; got '${HEAP_INPUT}'"
            exit 1
          fi
          # The framework always disables RemoveRedundantCallsToStaticInitializersPhase;
          # compose/shared/build.gradle.kts merges this list into that one -Xdisable-phases value.
          expected_phases=RemoveRedundantCallsToStaticInitializersPhase
          props=(
            -Pkotlin.internal.compiler.arguments.log.level=warning
            "-Praft.iosLinkProbe.smallBinary=${SMALL_BINARY}"
            "-Praft.iosLinkProbe.profilePhases=${PROFILE_PHASES}"
          )
          if [ "${DISABLE_PHASES}" = true ]; then
            expected_phases=DevirtualizationAnalysis,DCEPhase,RemoveRedundantCallsToStaticInitializersPhase
            props+=("-Praft.iosLinkProbe.disablePhases=${expected_phases}")
          fi
          probe_dir="${RUNNER_TEMP}/ios-link-probe"
          mkdir -p "${probe_dir}"
          {
            echo "runner=${PROBE_RUNNER}"
            echo "heap=${heap}"
            echo "parallel_gc=${PARALLEL_GC}"
            echo "disable_phases=${DISABLE_PHASES}"
            echo "small_binary=${SMALL_BINARY}"
            echo "profile_phases=${PROFILE_PHASES}"
            echo "expected_disable_phases=${expected_phases}"
            echo "gradle_properties=${props[*]}"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "${probe_dir}/params.env"
          cat "${probe_dir}/params.env"
          {
            echo "PROBE_DIR=${probe_dir}"
            echo "PROBE_HEAP=${heap}"
            echo "PROBE_GRADLE_PROPS=${props[*]}"
          } >> "$GITHUB_ENV"

      - name: Record runner hardware
        shell: bash
        run: |
          set -euo pipefail
          echo "== sysctl -n hw.memsize hw.ncpu"
          sysctl -n hw.memsize hw.ncpu
          mem="$(sysctl -n hw.memsize)"
          ncpu="$(sysctl -n hw.ncpu)"
          model="$(sysctl -n hw.model 2>/dev/null || echo '?')"
          cpu="$(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo '?')"
          echo "RAM $(( mem / 1073741824 )) GiB (${mem} bytes), ${ncpu} CPUs, ${model}, ${cpu}"
          echo "== sysctl vm.swapusage"; sysctl vm.swapusage || true
          echo "== vm_stat"; vm_stat
          echo "== sw_vers"; sw_vers || true
          echo "== df -h"; df -h "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}" || true
          {
            echo "hw_memsize=${mem}"
            echo "hw_ncpu=${ncpu}"
            echo "hw_model=${model}"
            echo "cpu_brand=${cpu}"
          } > "${PROBE_DIR}/machine.env"

      - name: Pin Xcode
        # As ios-release.yml with its default xcode_app_path: both runners are GitHub's Xcode 27
        # image, where Xcode_27.1.app is a real directory. Symlinked Xcode paths stay rejected.
        env:
          XCODE_APP_PATH: /Applications/Xcode_27.1.app
        shell: bash
        run: |
          bash scripts/ci/select_ios_xcode.sh || {
            echo "Xcode installs on this runner (pick a non-symlink path):"
            ls -ld /Applications/Xcode*.app || true
            exit 1
          }

      - name: Record Xcode and iOS SDK
        id: toolchain
        # Log-only, as in ios-release.yml.
        continue-on-error: true
        env:
          XCODE_APP_PATH: /Applications/Xcode_27.1.app
          RAFT_DEFAULT_XCODE_APP: /Applications/Xcode_27.1.app
        run: bash scripts/ci/record_ios_toolchain.sh

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Not .github/actions/ios-kn-gradle: its jvmargs line takes no extra JVM flags and its
      # ~/.konan key is the simulator one; this keeps ios-release.yml's own heap step and key.
      - name: Configure the Gradle daemon JVM (heap, GC, GC log)
        shell: bash
        env:
          PARALLEL_GC: ${{ inputs.parallel_gc }}
        run: |
          set -euo pipefail
          # Like ios-release.yml's heap step: the user-home gradle.properties overrides the 4g of
          # compose/gradle.properties, for this job only. Its -Dkotlin.daemon.jvm.options is left
          # out: no Kotlin daemon is involved (Kotlin/Native compiles and links inside this JVM).
          # One gc.log per JVM: the link step moves the compile invocation's file aside first.
          jvmargs="-Xmx${PROBE_HEAP} -Xss4m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          if [ "${PARALLEL_GC}" = true ]; then
            jvmargs="${jvmargs} -XX:+UseParallelGC"
          fi
          jvmargs="${jvmargs} -Xlog:gc*:file=${PROBE_DIR}/gc.log:time,uptime,level,tags:filecount=0"
          props="${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
          mkdir -p "$(dirname "${props}")"
          printf 'org.gradle.jvmargs=%s\n' "${jvmargs}" >> "${props}"
          echo "== ${props}"; cat "${props}"
          echo "jvmargs=${jvmargs}" >> "${PROBE_DIR}/params.env"

      # ~/.konan (Kotlin/Native distribution and LLVM deps) under ios-release.yml's key, so the
      # link runs with the same warm toolchain as a release; setup-gradle does not cover it.
      - name: Resolve Kotlin version
        id: kotlin
        shell: bash
        run: |
          set -euo pipefail
          KOTLIN_VERSION="$(sed -n 's/^kotlin[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' compose/gradle/libs.versions.toml | head -n 1)"
          [ -n "${KOTLIN_VERSION}" ] || { echo "::error::kotlin version not found in compose/gradle/libs.versions.toml"; exit 1; }
          echo "version=${KOTLIN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "kotlin=${KOTLIN_VERSION}" >> "${PROBE_DIR}/params.env"
          echo "Kotlin ${KOTLIN_VERSION}"

      - name: Cache Kotlin/Native (~/.konan)
        id: konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-v1-${{ runner.os }}-${{ runner.arch }}-kotlin-${{ steps.kotlin.outputs.version }}

      - name: Compile shared for iOS (before the measured link)
        working-directory: compose
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          read -r -a probe_props <<< "${PROBE_GRADLE_PROPS}"
          # :verifyComposeUiPatch as in ios-release.yml (the CMP-10674 patched Compose UI klibs). It
          # resolves the libraries of every iOS link task, so this compiles :shared and its
          # dependencies for both iOS targets, as a release build does. The same -P set as the
          # link step, so nothing built here is out of date there.
          date +%s > "${PROBE_DIR}/compile.start"
          set +e
          /usr/bin/time -l ./gradlew :verifyComposeUiPatch :shared:compileKotlinIosArm64 \
            "${probe_props[@]}" \
            --no-daemon \
            --console=plain \
            --max-workers="${GRADLE_MAX_WORKERS}" \
            --stacktrace \
            2>&1 | tee "${PROBE_DIR}/compile.log"
          status=${PIPESTATUS[0]}
          set -e
          date +%s > "${PROBE_DIR}/compile.end"
          echo "${status}" > "${PROBE_DIR}/compile.status"
          exit "${status}"

      - name: Link release framework (measured)
        id: link
        working-directory: compose
        shell: bash
        timeout-minutes: 120
        run: |
          set -euo pipefail
          read -r -a probe_props <<< "${PROBE_GRADLE_PROPS}"
          # filecount=0 appends to an existing file: this invocation's daemon gets a fresh gc.log.
          if [ -f "${PROBE_DIR}/gc.log" ]; then mv "${PROBE_DIR}/gc.log" "${PROBE_DIR}/gc-compile.log"; fi
          echo "== vm_stat before"; vm_stat | tee "${PROBE_DIR}/vm_stat-before.txt"
          sysctl vm.swapusage || true
          # Every 5 s: RSS of the forked Gradle daemon (where the compiler runs) and of all JVMs,
          # swap in use, and vm_stat free / compressor / swapout pages. /usr/bin/time -l below
          # counts only processes the Gradle client reaped, which may not include that daemon.
          sample_memory() {
            set +e +o pipefail
            printf 'epoch\tdaemon_rss_kb\tjava_rss_kb\tswap_used\tfree_pages\tcompressor_pages\tswapouts\n'
            while :; do
              procs="$(ps -axww -o rss= -o command= 2>/dev/null)"
              daemon_kb="$(printf '%s\n' "${procs}" | awk '/GradleDaemon/ { s += $1 } END { print s + 0 }')"
              java_kb="$(printf '%s\n' "${procs}" | awk '$2 ~ /\/java$/ { s += $1 } END { print s + 0 }')"
              if [ ! -s "${PROBE_DIR}/daemon-cmdline.txt" ]; then
                printf '%s\n' "${procs}" \
                  | awk '/GradleDaemon/ { sub(/^[ \t]*[0-9]+[ \t]+/, ""); print; exit }' > "${PROBE_DIR}/daemon-cmdline.txt"
              fi
              swap="$(sysctl -n vm.swapusage 2>/dev/null | awk '{ for (i = 1; i < NF; i++) if ($i == "used") { print $(i + 2); exit } }')"
              pages="$(vm_stat 2>/dev/null | awk -F: '
                /^Pages free/ { gsub(/[ .]/, "", $2); f = $2 }
                /^Pages occupied by compressor/ { gsub(/[ .]/, "", $2); c = $2 }
                /^Swapouts/ { gsub(/[ .]/, "", $2); s = $2 }
                END { printf "%s\t%s\t%s", f, c, s }')"
              printf '%s\t%s\t%s\t%s\t%s\n' "$(date +%s)" "${daemon_kb}" "${java_kb}" "${swap:--}" "${pages}"
              sleep 5
            done
          }
          sample_memory > "${PROBE_DIR}/mem-samples.tsv" 2>/dev/null &
          sampler=$!
          trap 'kill "${sampler}" 2>/dev/null || true' EXIT
          date +%s > "${PROBE_DIR}/link.start"
          # --no-build-cache: the link always runs; a framework from the cache would measure nothing.
          # -Xprofile-phases prints a line per phase per file: those lines go to phase-profile.txt
          # only, everything else (konanc's arguments, the time -l report) to this log and link.log.
          set +e
          /usr/bin/time -l ./gradlew :verifyComposeUiPatch :shared:linkPodReleaseFrameworkIosArm64 \
            "${probe_props[@]}" \
            --no-build-cache \
            --no-daemon \
            --console=plain \
            --max-workers="${GRADLE_MAX_WORKERS}" \
            --stacktrace \
            2>&1 \
            | awk -v phases="${PROBE_DIR}/phase-profile.txt" '/: [0-9]+ msec$/ { print > phases; next } { print; fflush() }' \
            | tee "${PROBE_DIR}/link.log"
          status=${PIPESTATUS[0]}
          set -e
          date +%s > "${PROBE_DIR}/link.end"
          echo "${status}" > "${PROBE_DIR}/link.status"
          kill "${sampler}" 2>/dev/null || true
          echo "== vm_stat after"; vm_stat | tee "${PROBE_DIR}/vm_stat-after.txt"
          sysctl vm.swapusage || true
          echo "== link: exit ${status} after $(( $(cat "${PROBE_DIR}/link.end") - $(cat "${PROBE_DIR}/link.start") )) s"
          if [ -f "${PROBE_DIR}/phase-profile.txt" ]; then
            echo "== $(wc -l < "${PROBE_DIR}/phase-profile.txt" | tr -d ' ') -Xprofile-phases lines in phase-profile.txt"
          fi
          ls -l shared/build/bin/iosArm64/podReleaseFramework/shared.framework 2>/dev/null || true
          exit "${status}"

      - name: Probe report
        if: always()
        shell: bash
        env:
          PROBE_XCODE: ${{ steps.toolchain.outputs.xcode_version }}
          PROBE_KONAN_CACHE_HIT: ${{ steps.konan.outputs.cache-hit }}
        run: |
          [ -f scripts/ci/ios_link_probe_report.py ] || { echo "no checkout, nothing to report"; exit 0; }
          python3 -I scripts/ci/ios_link_probe_report.py \
            --dir "${PROBE_DIR:-${RUNNER_TEMP}/ios-link-probe}" \
            --framework compose/shared/build/bin/iosArm64/podReleaseFramework/shared.framework \
            --xcode "${PROBE_XCODE}" \
            --konan-cache-hit "${PROBE_KONAN_CACHE_HIT}" \
            --step-summary "${GITHUB_STEP_SUMMARY}"

      - name: Upload probe data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-link-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-link-probe/
          if-no-files-found: warn
          retention-days: 14

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics
