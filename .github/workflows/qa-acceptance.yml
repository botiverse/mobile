name: QA Acceptance (agent-in-CI)
run-name: Stamp ${{ inputs.stamp_run_case_id || github.run_id }}

# PoC of the acceptance executor (#proj-quality task #2): one acceptance run =
# one CI job. A goal goes in; an M3 agent drives the REAL debug APK on the
# emulator (observe -> act -> verify via adb), records evidence, writes
# verdict.json and exits. The job's conclusion mirrors the agent's verdict;
# evidence uploads either way. A human reviews the evidence on the Raft task —
# the agent's pass is an initial judgment, never the final acceptance.

on:
  workflow_dispatch:
    inputs:
      goal:
        description: "Acceptance goal for the agent (natural language, concrete verifiable requirements)"
        required: false
        default: ""
      max_turns:
        description: "Agent turn budget"
        required: false
        default: "30"
      max_minutes:
        description: "Case-specific wall-clock budget"
        required: false
        default: "20"
      no_progress_turns:
        description: "Abort after this many repeated identical actions"
        required: false
        default: "8"
      stamp_run_case_id:
        description: "Stamp run_case id — when set, evidence + verdict report back to Stamp"
        required: false
        default: ""
      # Pinned-bits verification (artin: bug-verify runs must test the EXACT
      # package): apk_run_id reuses another run's qa-acceptance-apk artifact;
      # apk_url tests a downloadable APK (e.g. the Hands link). Either one
      # skips the build job entirely. Branch builds use plain --ref dispatch.
      apk_run_id:
        description: "Reuse the qa-acceptance-apk artifact from this workflow run id (skips build)"
        required: false
        default: ""
      apk_artifact_id:
        description: "Exact GitHub Actions artifact id frozen by Stamp (preferred for strict coordinates)"
        required: false
        default: ""
      apk_url:
        description: "Direct APK download URL to test (skips build)"
        required: false
        default: ""
      artifact_sha256:
        description: "Frozen artifact SHA-256 for strict Stamp claim identity"
        required: false
        default: ""
      artifact_source_commit:
        description: "Frozen source commit for strict Stamp claim identity"
        required: false
        default: ""
      artifact_version:
        description: "Frozen version name for strict Stamp claim identity"
        required: false
        default: ""
      artifact_version_code:
        description: "Frozen version code for strict Stamp claim identity"
        required: false
        default: ""
      artifact_package_id:
        description: "Frozen package id for strict Stamp claim identity"
        required: false
        default: ""
      # Required-marker coverage gate (task #6): comma-separated
      # `marker|min|max` entries checked against qa-evidence/logcat.txt after
      # the run. Any missing/out-of-bounds marker overrides the agent's visual
      # verdict to coverage-invalid/no-verdict (exit 3, NOT a product FAIL) —
      # a visual PASS on an unexercised seam must not count (case-18 lesson).
      require_markers:
        description: "Post-run logcat marker gate, e.g. 'thread_header_scroll_to_top|1|,slock_perf_launch|1|1'"
        required: false
        default: ""
      # Identity of the server environment under test, recorded in perf.json
      # (task #14 self-describing header). Free-form label, e.g. OranixSlockTest.
      environment:
        description: "Server environment label for the perf.json identity header"
        required: false
        default: "unspecified-ci"
# Minimal token scopes: contents to check out, actions to read ANOTHER run's
# artifacts for the pinned-bits path (403 'Resource not accessible by
# integration' on the first --apk-run use, run 29546757069). No write scopes.
permissions:
  contents: read
  actions: read

env:
  # Login smoke: the default goal for pushes / empty dispatch inputs.
  DEFAULT_GOAL: >-
    Log into the app with the provided test account: if a login/welcome screen shows,
    enter the email and password and submit. If a server picker appears choose
    'OranixSlockTest'. If 'OranixSlockTest' is not present,
    fail and report it; never substitute the closest-looking name.
    Then verify BOTH: (1) the home screen loads
    showing a channel list (rows with # channel names), and (2) tapping one channel opens
    it and a message list renders. Declare pass only after both are visually confirmed.

jobs:
  build:
    name: Build debug APK
    if: ${{ inputs.apk_run_id == '' && inputs.apk_url == '' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Checkout mobile
        uses: actions/checkout@v5

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Verify complete immutable Kuikly release
        run: scripts/ci/verify_kuikly_release_manifest.sh

      - name: Build debug APK
        working-directory: ./compose
        run: ./gradlew --no-daemon --console=plain --stacktrace :androidApp:assembleDebug

      # Every run binds to the exact bits it tested (artin: 每次 run 必须记录
      # 版本) — commit, branch, APK hash, versionName/Code, auto-extracted here
      # and shipped through evidence + Stamp (kind=build_info).
      - name: Write build info
        run: |
          apk=$(find compose/androidApp/build/outputs/apk/debug -name '*.apk' | head -1)
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          badging=$("$bt/aapt" dump badging "$apk" 2>/dev/null || true)
          vn=$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          vc=$(printf '%s' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
          APK="$apk" VN="$vn" VC="$vc" python3 - <<'EOF'
          import hashlib, json, os
          apk = os.environ["APK"]
          info = {
              "platform": "android",
              "source_commit": os.environ.get("GITHUB_SHA", ""),
              "branch": os.environ.get("GITHUB_REF_NAME", ""),
              "build_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "apk_sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              "app_version": os.environ.get("VN", ""),
              "version_code": os.environ.get("VC", ""),
          }
          out = os.path.join(os.path.dirname(apk), "build-info.json")
          json.dump(info, open(out, "w"), indent=1)
          print(json.dumps(info))
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: qa-acceptance-apk
          path: |
            compose/androidApp/build/outputs/apk/debug/*.apk
            compose/androidApp/build/outputs/apk/debug/build-info.json
          if-no-files-found: error

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics

  acceptance:
    name: Acceptance run (M3 agent on emulator)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    needs: build
    # Run when build succeeded OR was skipped (pinned-bits inputs replace it).
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    steps:
      - name: Checkout mobile
        uses: actions/checkout@v5

      - name: Bind pre-claim workflow to Stamp
        if: ${{ inputs.stamp_run_case_id != '' }}
        env:
          STAMP_RUN_CASE_ID: ${{ inputs.stamp_run_case_id }}
          STAMP_URL: ${{ secrets.STAMP_URL }}
          STAMP_TOKEN: ${{ secrets.STAMP_TOKEN }}
        run: |
          printf '%s' checkout_complete > "$RUNNER_TEMP/stamp-preclaim-phase"
          bash scripts/qa/stamp_report.sh dispatch-start

      - name: Validate frozen artifact inputs
        env:
          PIN_PRIMARY: ${{ inputs.apk_run_id }}
          PIN_SECONDARY: ${{ inputs.apk_url }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          ARTIFACT_SOURCE_COMMIT: ${{ inputs.artifact_source_commit }}
          ARTIFACT_VERSION: ${{ inputs.artifact_version }}
          ARTIFACT_VERSION_CODE: ${{ inputs.artifact_version_code }}
          ARTIFACT_PACKAGE_ID: ${{ inputs.artifact_package_id }}
        run: node scripts/qa/validate_frozen_inputs.mjs

      - name: Free runner disk space for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Download APK
        if: ${{ inputs.apk_run_id == '' && inputs.apk_url == '' }}
        uses: actions/download-artifact@v7
        with:
          name: qa-acceptance-apk
          path: apks

      # Pinned bits: reuse another run's artifact (same sha256 the reporter
      # verified) or fetch a direct URL; synthesize build-info for the URL
      # case so the version binding never goes missing.
      - name: Fetch pinned APK
        if: ${{ inputs.apk_run_id != '' || inputs.apk_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN_ID: ${{ inputs.apk_run_id }}
          APK_ARTIFACT_ID: ${{ inputs.apk_artifact_id }}
          APK_URL: ${{ inputs.apk_url }}
          FROZEN_ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          FROZEN_ARTIFACT_SOURCE_COMMIT: ${{ inputs.artifact_source_commit }}
        run: |
          printf '%s' fetch_pinned_apk > "$RUNNER_TEMP/stamp-preclaim-phase"
          mkdir -p apks
          if [ -n "$APK_RUN_ID" ]; then
            # Named artifact first (our own build jobs); fall back to ALL
            # artifacts for foreign runs (the alpha workflow names its APK
            # android-alpha-<n>-<sha>), then bind build-info to the source
            # run's head commit if the artifact didn't carry one.
            if [ -n "$FROZEN_ARTIFACT_SHA256" ]; then
              metadata="$RUNNER_TEMP/pinned-android-artifacts.json"
              resolved="$RUNNER_TEMP/pinned-android-artifact.json"
              if [ -n "$APK_ARTIFACT_ID" ]; then
                gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$APK_ARTIFACT_ID" > "$metadata"
                node scripts/qa/resolve_pinned_android_artifact.mjs "$metadata" "$resolved" "$APK_RUN_ID" "$APK_ARTIFACT_ID"
              else
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APK_RUN_ID/artifacts?per_page=100" > "$metadata"
                node scripts/qa/resolve_pinned_android_artifact.mjs "$metadata" "$resolved" "$APK_RUN_ID"
              fi
              artifact_name=$(jq -r .artifactName "$resolved")
              source_commit="$FROZEN_ARTIFACT_SOURCE_COMMIT"
              artifact_id=$(jq -r .artifactId "$resolved")
              if [ -n "$APK_ARTIFACT_ID" ]; then
                gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$APK_ARTIFACT_ID/zip" > "$RUNNER_TEMP/pinned-android-artifact.zip"
                unzip -q "$RUNNER_TEMP/pinned-android-artifact.zip" -d apks
              else
                gh run download "$APK_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$artifact_name" -D apks
              fi
              apk=$(find apks -type f -name '*.apk' -print -quit)
              test -s "$apk"
              bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
              badging=$("$bt/aapt" dump badging "$apk")
              pkg=$(printf '%s' "$badging" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -1)
              vn=$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
              vc=$(printf '%s' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
              APK="$apk" SOURCE="$source_commit" PIN="$APK_RUN_ID" ARTIFACT_NAME="$artifact_name" ARTIFACT_ID="$artifact_id" PKG="$pkg" VN="$vn" VC="$vc" python3 - <<'EOF2'
          import hashlib, json, os
          apk = os.environ["APK"]
          info = {
              "platform": "android",
              "pinned_from_run": os.environ["PIN"],
              "artifact_id": os.environ["ARTIFACT_ID"],
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "source_commit": os.environ["SOURCE"],
              "source_commit_verified": True,
              "apk_sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              "package": os.environ["PKG"],
              "app_version": os.environ["VN"],
              "version_code": os.environ["VC"],
          }
          json.dump(info, open("apks/build-info.json", "w"), indent=1)
          print(json.dumps(info))
          EOF2
            else
              gh run download "$APK_RUN_ID" --repo "$GITHUB_REPOSITORY" -n qa-acceptance-apk -D apks 2>/dev/null \
                || gh run download "$APK_RUN_ID" --repo "$GITHUB_REPOSITORY" -D apks
            fi
            if ! find apks -name build-info.json | grep -q .; then
              # A foreign run's headSha is its WORKFLOW-DEFINITION ref, not the
              # build source (the Android Alpha Validation run 29546326028
              # reports headSha=main while building release-1.5.0) — so record
              # it as dispatch_ref, NOT source_commit (林舟). The authoritative
              # binding is apk_sha256 + package/version from the binary itself.
              ref=$(gh run view "$APK_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
              apk=$(find apks -name '*.apk' | head -1)
              bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
              badging=$("$bt/aapt" dump badging "$apk" 2>/dev/null || true)
              pkg=$(printf '%s' "$badging" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -1)
              vn=$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
              vc=$(printf '%s' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
              APK="$apk" REF="$ref" PIN="$APK_RUN_ID" PKG="$pkg" VN="$vn" VC="$vc" python3 - <<'EOF2'
          import hashlib, json, os
          apk = os.environ["APK"]
          info = {
              "platform": "android",
              "pinned_from_run": os.environ.get("PIN", ""),
              # dispatch_ref: the pinned run's workflow-definition ref, NOT a
              # verified build source. Do not treat as source_commit.
              "dispatch_ref": os.environ.get("REF", ""),
              "source_commit_verified": False,
              "apk_sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              "package": os.environ.get("PKG", ""),
              "app_version": os.environ.get("VN", ""),
              "version_code": os.environ.get("VC", ""),
          }
          json.dump(info, open("apks/build-info.json", "w"), indent=1)
          print(json.dumps(info))
          EOF2
            fi
          else
            # A downloaded APK (e.g. a Hands signed package): the binary is the
            # only ground truth — package/version/sha256 from aapt, no commit.
            curl -sfL -o apks/pinned.apk "$APK_URL"
            bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            badging=$("$bt/aapt" dump badging apks/pinned.apk 2>/dev/null || true)
            pkg=$(printf '%s' "$badging" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -1)
            vn=$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
            vc=$(printf '%s' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
            APK=apks/pinned.apk PKG="$pkg" VN="$vn" VC="$vc" python3 - <<'EOF'
          import hashlib, json, os
          apk = os.environ["APK"]
          info = {
              "platform": "android",
              "apk_url": os.environ.get("APK_URL", ""),
              "source_commit_verified": False,
              "apk_sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              "package": os.environ.get("PKG", ""),
              "app_version": os.environ.get("VN", ""),
              "version_code": os.environ.get("VC", ""),
          }
          json.dump(info, open("apks/build-info.json", "w"), indent=1)
          print(json.dumps(info))
          EOF
          fi
          ls -la apks

      - name: Verify frozen Android artifact identity
        if: ${{ inputs.artifact_sha256 != '' }}
        env:
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          ARTIFACT_SOURCE_COMMIT: ${{ inputs.artifact_source_commit }}
          ARTIFACT_VERSION: ${{ inputs.artifact_version }}
          ARTIFACT_VERSION_CODE: ${{ inputs.artifact_version_code }}
          ARTIFACT_PACKAGE_ID: ${{ inputs.artifact_package_id }}
        run: |
          printf '%s' verify_frozen_artifact > "$RUNNER_TEMP/stamp-preclaim-phase"
          mapfile -t apk_candidates < <(find apks -type f -name '*.apk' -print)
          mapfile -t manifest_candidates < <(find apks -type f -name build-info.json -print)
          if [ "${#apk_candidates[@]}" -ne 1 ] || [ "${#manifest_candidates[@]}" -ne 1 ]; then
            echo "strict frozen Android identity requires exactly one APK and one build-info.json" >&2
            printf 'APKs: %s\n' "${apk_candidates[*]:-none}" >&2
            printf 'manifests: %s\n' "${manifest_candidates[*]:-none}" >&2
            exit 2
          fi
          apk="${apk_candidates[0]}"
          manifest="${manifest_candidates[0]}"
          test -s "$apk" && test -s "$manifest"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          badging=$("$bt/aapt" dump badging "$apk")
          pkg=$(printf '%s' "$badging" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -1)
          vn=$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          vc=$(printf '%s' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
          sha=$(sha256sum "$apk" | awk '{print $1}')
          APK_SHA="$sha" APK_PKG="$pkg" APK_VERSION="$vn" APK_CODE="$vc" node -e \
            'const fs=require("fs"),e=process.env;fs.writeFileSync("apks/observed-identity.json",JSON.stringify({sha256:e.APK_SHA,packageId:e.APK_PKG,version:e.APK_VERSION,versionCode:e.APK_CODE}))'
          node scripts/qa/verify_pinned_android_identity.mjs "$manifest" apks/observed-identity.json

      - name: Claim Stamp run case and resolve auth mode
        id: stamp-claim
        if: ${{ inputs.stamp_run_case_id != '' }}
        env:
          STAMP_RUN_CASE_ID: ${{ inputs.stamp_run_case_id }}
          STAMP_URL: ${{ secrets.STAMP_URL }}
          STAMP_TOKEN: ${{ secrets.STAMP_TOKEN }}
        run: |
          bash scripts/qa/stamp_report.sh claim
          spec="$RUNNER_TEMP/stamp-bootstrap-spec-${STAMP_RUN_CASE_ID}.json"
          required=$(node -e 'const fs=require("fs"),v=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(v.required===true?"true":"false")' "$spec")
          echo "bootstrap_required=$required" >> "$GITHUB_OUTPUT"
          echo "STAMP_BOOTSTRAP_REQUIRED=$required" >> "$GITHUB_ENV"

      # Password-login cases still exercise the UI normally. Auth-bootstrap
      # cases never execute this step, so QA credentials are absent from the
      # emulator-runner process, its argv/env, logs and evidence.
      - name: Expose legacy UI-login credentials
        if: ${{ inputs.stamp_run_case_id == '' || steps.stamp-claim.outputs.bootstrap_required != 'true' }}
        env:
          QA_TEST_EMAIL_SECRET: ${{ secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD_SECRET: ${{ secrets.QA_TEST_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, uuid
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              for name in ("QA_TEST_EMAIL", "QA_TEST_PASSWORD"):
                  value = os.environ[f"{name}_SECRET"]
                  delimiter = f"SLOCK_{uuid.uuid4().hex}"
                  out.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")
          PY

      - name: Preflight — QA account must not see the production server
        # Layer 2 of three, wired here because this is the first point where the QA
        # credentials exist (the step above puts them in the environment) and the last point
        # before anything drives the app. Same `if:` as that step on purpose: without it this
        # would run credential-less on the bootstrap path, exit 2 every time, and quietly
        # become a step that never actually checks anything.
        #
        # rc semantics are deliberate and are the reviewable decision in this PR:
        #   1  judged, and the judgement FAILED  -> block. Production reachable by the QA
        #      account is out of bounds (artin, 2026-08-31); no run should proceed on it.
        #   2  could not be judged at all (429, network, shape change) -> ALSO block.
        #      Ruled by @Argus, overriding the warn-only form I first proposed. rc=2 means the
        #      visibility reading is unavailable, which returns the run to "we believe it but
        #      are not testing it" — the exact state this probe exists to end. Under warn-only,
        #      the probe's infrastructure breaking would silently downgrade the pipeline back
        #      to the pre-probe world while staying green: no reading read as a good reading.
        #      A broken guard has to behave like a broken guard, not like a pass.
        #      Accepted cost, stated: this probe depends on an external surface, so blocking on
        #      rc=2 adds a new flaky-red source. The remedy is fix-or-rerun, never downgrade.
        #      An explicit per-run waiver channel is deliberately NOT pre-built.
        #
        # rc=2 therefore carries a REASON (@HuaTuo, adopted by @Argus). Without one, "fix or
        # rerun" decays into "always rerun" — and the class where a rerun most easily goes green
        # by accident (the endpoint moved, or the probe broke) is exactly the one where a green
        # rerun means nothing. credential -> rerun cannot help. infra -> rerun is reasonable.
        # contract -> a passing rerun does NOT mean fixed. A missing reason is treated as
        # contract, because the unknown case must not default to the cheap one.
        if: ${{ inputs.stamp_run_case_id == '' || steps.stamp-claim.outputs.bootstrap_required != 'true' }}
        env:
          QA_TEST_EMAIL: ${{ env.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ env.QA_TEST_PASSWORD }}
        run: |
          mkdir -p qa-evidence
          set +e
          # 2>&1 so the reason code reaches the receipt: the probe writes `reason=` on
          # STDERR, and `| tee` alone captures only stdout (@LiBai). Without this the grep
          # below found nothing every time, `reason` fell back to unknown, and the
          # credential/ratelimit/infra arms were UNREACHABLE — the reason codes existed in
          # form while every failure reported as contract. PIPESTATUS[0] is still node's.
          node scripts/qa/visible_servers_probe.mjs 2>&1 | tee qa-evidence/visible-servers-probe.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> qa-evidence/visible-servers-probe.txt
          if [ "$rc" = "1" ]; then
            echo "::error::QA account can see the production server - refusing to run"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            reason="$(grep -oE '^reason=[a-z]+' qa-evidence/visible-servers-probe.txt | tail -1 | cut -d= -f2)"
            reason="${reason:-unknown}"
            echo "reason=$reason" >> qa-evidence/visible-servers-probe.txt
            echo "PROBE NOT RUN - this run carries no evidence about production visibility" >> qa-evidence/visible-servers-probe.txt
            case "$reason" in
              credential) echo "::error::visible-servers probe: credentials rejected - rerunning will NOT help, fix the QA credential" ;;
              ratelimit)  echo "::error::visible-servers probe: rate-limited (429) - rerun is right but NOT immediately; an instant retry is what caused this" ;;
              infra)      echo "::error::visible-servers probe: transport failure - a rerun is reasonable" ;;
              contract)   echo "::error::visible-servers probe: endpoint or response contract changed - A PASSING RERUN DOES NOT MEAN FIXED; check the probe against the live endpoint"
                          echo "rerun-does-not-mean-fixed" >> qa-evidence/visible-servers-probe.txt ;;
              *)          echo "::error::visible-servers probe unjudgeable with no reason code (rc=$rc) - treat as contract until diagnosed" ;;
            esac
            exit 1
          fi

      - name: Freeze legacy credential identity receipt
        if: ${{ inputs.stamp_run_case_id != '' && steps.stamp-claim.outputs.bootstrap_required != 'true' }}
        env:
          STAMP_RUN_CASE_ID: ${{ inputs.stamp_run_case_id }}
          STAMP_URL: ${{ secrets.STAMP_URL }}
          STAMP_TOKEN: ${{ secrets.STAMP_TOKEN }}
          QA_TEST_EMAIL: ${{ env.QA_TEST_EMAIL }}
        run: bash scripts/qa/stamp_report.sh credential-receipt

      - name: Mark pre-claim preparation complete
        if: ${{ inputs.stamp_run_case_id != '' }}
        run: printf '%s' ready_to_claim > "$RUNNER_TEMP/stamp-preclaim-phase"

      # task #354 fixture seed (artin-approved option a): the image cases can
      # never pass against an empty emulator gallery / imageless workspace.
      # Emits the deterministic PNG for the in-emulator adb push below and
      # idempotently ensures one image-bearing fixture message exists in the
      # QA channel. Best-effort: seeding never fails the acceptance job.
      - name: Seed media fixtures (image + workspace)
        if: ${{ inputs.stamp_run_case_id == '' || steps.stamp-claim.outputs.bootstrap_required != 'true' }}
        env:
          QA_TEST_EMAIL: ${{ env.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ env.QA_TEST_PASSWORD }}
        run: |
          node scripts/qa/seed_media_fixtures.mjs emit-image --out qa-fixture-image.png
          node scripts/qa/seed_media_fixtures.mjs workspace || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install M3 SDK (pi-ai)
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p m3 && cd m3
          # @earendil-works/pi-ai is on the PUBLIC npm registry — no scope override or auth.
          npm i @earendil-works/pi-ai@0.80.10 --no-audit --no-fund

      # Evidence annotation (docs/qa-acceptance/annotation-spec.md): sharp draws
      # assertion boxes / tap crosshairs onto copies of the step screenshots.
      # Installed at the workspace root so the runner's `import("sharp")`
      # resolves; the runner degrades gracefully if this step is ever skipped.
      - name: Install sharp (evidence annotation)
        run: npm i --no-save sharp@0.33.5 --no-audit --no-fund

      - name: Run acceptance agent
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          PI_PROVIDER: ${{ vars.PI_PROVIDER || 'minimax' }}
          PI_MODEL: ${{ vars.PI_MODEL || 'MiniMax-M3' }}
          QA_MODEL_MAX_ATTEMPTS: ${{ vars.QA_MODEL_MAX_ATTEMPTS || '3' }}
          QA_MODEL_RETRY_BUDGET_MS: ${{ vars.QA_MODEL_RETRY_BUDGET_MS || '300000' }}
          QA_MODEL_RELEASE_ATTEMPTS: ${{ vars.QA_MODEL_RELEASE_ATTEMPTS || '3' }}
          QA_MODEL_QUEUE_TIMEOUT_MS: ${{ vars.QA_MODEL_QUEUE_TIMEOUT_MS || '900000' }}
          SLOCK_PI_AI_MODULE: ${{ runner.temp }}/m3/node_modules/@earendil-works/pi-ai/dist/providers/all.js
          QA_TEST_EMAIL: ${{ env.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ env.QA_TEST_PASSWORD }}
          QA_GOAL: ${{ inputs.goal || '' }}
          QA_MAX_TURNS: ${{ inputs.max_turns || '30' }}
          QA_MAX_MINUTES: ${{ inputs.max_minutes || '20' }}
          QA_NO_PROGRESS_TURNS: ${{ inputs.no_progress_turns || '8' }}
          STAMP_RUN_CASE_ID: ${{ inputs.stamp_run_case_id || '' }}
          STAMP_URL: ${{ inputs.stamp_run_case_id != '' && secrets.STAMP_URL || '' }}
          STAMP_TOKEN: ${{ inputs.stamp_run_case_id != '' && secrets.STAMP_TOKEN || '' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          # Each script line is a separate command (no shared shell vars); the
          # agent's exit code is persisted to a file instead of failing the
          # line, so evidence still uploads and the verdict step decides.
          script: |
            # The emulator-runner action already waits for sys.boot_completed
            # before running this script (its own `[command] getprop` poll), so
            # no custom boot-wait is needed — the "device offline" failures on
            # 29547438316/29547563763/29547835920 were the ACTION'S boot-wait
            # under blacksmith pool contention (infra), not this script. Just
            # dismiss the keyguard.
            adb shell input keyevent 82 || true
            # task #354 fixture seed: give the photo picker a real image.
            if [ -s qa-fixture-image.png ]; then adb push qa-fixture-image.png /sdcard/Pictures/qa-fixture-image.png && { adb shell cmd media_scanner scan /sdcard/Pictures/qa-fixture-image.png || adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Pictures/qa-fixture-image.png || true; }; fi
            # emulator-runner executes each script LINE as its own `sh -c`, so
            # shell vars do NOT survive to the next line (林舟: my earlier
            # `APK=$(...)` on one line + `adb install "$APK"` on the next gave an
            # empty path). Do the whole install→derive-package→launch in ONE
            # physical line so APK/PKG/ACT share a single shell; test the path is
            # non-empty; persist the package to a FILE for the node line below.
            # (Pinned alpha is build.raft.app.alpha, not build.raft.app — a fixed
            # am start launched nothing and the agent saw the launcher home.)
            APK="$(find apks -name '*.apk' | head -1)"; test -s "$APK" || { echo "no APK found under apks/"; exit 2; }; echo "installing $APK"; adb install -r "$APK"; BT="$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)"; PKG="$("$BT/aapt" dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -1)"; ACT="$("$BT/aapt" dump badging "$APK" | sed -n "s/launchable-activity: name='\([^']*\)'.*/\1/p" | head -1)"; echo "$PKG" > qa-app-package.txt; if [ "${STAMP_BOOTSTRAP_REQUIRED:-false}" != "true" ]; then echo "launching $PKG / ${ACT:-.MainActivity}"; adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 || adb shell am start -n "$PKG/${ACT:-.MainActivity}"; fi
            mkdir -p qa-evidence
            if [ "${STAMP_BOOTSTRAP_REQUIRED:-false}" = "true" ]; then APK="$(find apks -name '*.apk' | head -1)"; node scripts/qa/mobile_login_bootstrap.mjs binding --apk "$APK" --output "$RUNNER_TEMP/stamp-bootstrap-device-binding.json"; bash scripts/qa/stamp_report.sh bootstrap-login "$RUNNER_TEMP/stamp-bootstrap-device-binding.json"; prep_rc=0; timeout --kill-after=10s 180s node scripts/qa/mobile_login_bootstrap.mjs prepare --response "$RUNNER_TEMP/stamp-bootstrap-login-${STAMP_RUN_CASE_ID}.json" --binding "$RUNNER_TEMP/stamp-bootstrap-device-binding.json" --run-case-id "$STAMP_RUN_CASE_ID" --ci-job-ref "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --ready-output "$RUNNER_TEMP/stamp-bootstrap-ready.json" || prep_rc=$?; if [ "$prep_rc" = "0" ]; then bash scripts/qa/stamp_report.sh bootstrap-ready "$RUNNER_TEMP/stamp-bootstrap-ready.json" || prep_rc=$?; fi; if [ "$prep_rc" != "0" ]; then if ! timeout --kill-after=10s 120s bash scripts/qa/stamp_report.sh bootstrap-failure-terminal "$RUNNER_TEMP/stamp-bootstrap-device-binding.json" "$RUNNER_TEMP/stamp-bootstrap-ready.json"; then PKG="$(cat qa-app-package.txt)"; timeout --kill-after=5s 20s adb shell am force-stop "$PKG" || true; timeout --kill-after=5s 20s adb shell pm clear "$PKG" || true; printf '%s\n' '{"contract":"qa-bootstrap-operator-recovery/v1","reason":"bounded failure-terminal did not confirm cleanup","product_verdict":"NOT_RUN"}' > qa-evidence/bootstrap-operator-recovery-required.json; fi; exit "$prep_rc"; fi; else sleep 8; fi
            cp "$(find apks -name build-info.json | head -1)" qa-evidence/build-info.json 2>/dev/null || true
            if [ "${STAMP_BOOTSTRAP_REQUIRED:-false}" = "true" ]; then cp "$RUNNER_TEMP/stamp-bootstrap-ready.json" qa-evidence/bootstrap-ready.json; fi
            adb logcat -c
            # task #14 perf v1: reset gfxinfo counters and stamp the capture
            # window start before the agent drives the app (record-only,
            # advisory — no thresholds).
            adb shell dumpsys gfxinfo "$(cat qa-app-package.txt 2>/dev/null || echo build.raft.app)" reset || true
            date +%s%3N > qa-evidence/perf-started.txt
            adb shell "nohup sh -c 'i=1; while [ \$i -le 8 ]; do screenrecord --size 540x1200 --bit-rate 1000000 --time-limit 180 /sdcard/qa-rec-\$(printf %02d \$i).mp4; i=\$((i+1)); done' >/dev/null 2>&1 &"
            if [ "${STAMP_BOOTSTRAP_REQUIRED:-false}" = "true" ]; then . "$RUNNER_TEMP/stamp-bootstrap-capture-env-${STAMP_RUN_CASE_ID}.sh"; fi; export MINIMAX_API_KEY="$PI_API_KEY"; node scripts/qa/acceptance_agent.mjs --goal "${QA_GOAL:-$DEFAULT_GOAL}" --max-turns "$QA_MAX_TURNS" --max-minutes "$QA_MAX_MINUTES" --no-progress-turns "$QA_NO_PROGRESS_TURNS" --package "$(cat qa-app-package.txt 2>/dev/null || echo build.raft.app)" --out qa-evidence; echo "$?" > qa-evidence/agent-rc.txt; echo "agent exit code $(cat qa-evidence/agent-rc.txt)"
            adb logcat -d -v threadtime > qa-evidence/logcat-full.txt 2>&1 || true
            if [ "${STAMP_BOOTSTRAP_REQUIRED:-false}" = "true" ]; then . "$RUNNER_TEMP/stamp-bootstrap-capture-env-${STAMP_RUN_CASE_ID}.sh"; fi; PKG="$(cat qa-app-package.txt 2>/dev/null || echo build.raft.app)"; adb shell pidof "$PKG" >> qa-evidence/app-pids.txt 2>/dev/null || true; node scripts/qa/scope_logcat.mjs --input qa-evidence/logcat-full.txt --output qa-evidence/logcat.txt --verdict qa-evidence/verdict.json --pids qa-evidence/app-pids.txt --package "$PKG" --generation "${QA_CAPTURE_SCOPE_GENERATION:-${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}}" || true
            adb shell dumpsys activity top > qa-evidence/activity-top.txt 2>&1 || true
            adb shell dumpsys gfxinfo "$(cat qa-app-package.txt 2>/dev/null || echo build.raft.app)" > qa-evidence/gfxinfo.txt 2>&1 || true
            node scripts/qa/collect_perf.mjs --gfx qa-evidence/gfxinfo.txt --log qa-evidence/logcat.txt --steps qa-evidence/steps.jsonl --pkg "$(cat qa-app-package.txt 2>/dev/null || echo build.raft.app)" --environment "${{ inputs.environment }}" --device-json "{\"model\":\"$(adb shell getprop ro.product.model | tr -d '\r')\",\"sdk\":\"$(adb shell getprop ro.build.version.sdk | tr -d '\r')\",\"abi\":\"$(adb shell getprop ro.product.cpu.abi | tr -d '\r')\"}" --started "$(cat qa-evidence/perf-started.txt 2>/dev/null || echo 0)" --out qa-evidence/perf.json || true
            adb shell pkill -INT screenrecord 2>/dev/null || true
            sleep 3
            adb shell ls /sdcard/qa-rec-*.mp4 2>/dev/null | tr -d '\r' | while read f; do adb pull "$f" qa-evidence/ || true; done
            evidence_rc=0; bash scripts/qa/stamp_report.sh report-evidence qa-evidence || evidence_rc=$?; echo "$evidence_rc" > qa-evidence/stamp-evidence.rc
            if [ "${STAMP_BOOTSTRAP_REQUIRED:-false}" = "true" ]; then cleanup_rc=0; node scripts/qa/mobile_login_bootstrap.mjs cleanup --response "$RUNNER_TEMP/stamp-bootstrap-login-${STAMP_RUN_CASE_ID}.json" --binding "$RUNNER_TEMP/stamp-bootstrap-device-binding.json" --ready "$RUNNER_TEMP/stamp-bootstrap-ready.json" --outcome completed --output "$RUNNER_TEMP/stamp-bootstrap-cleanup.json" --run-case-id "$STAMP_RUN_CASE_ID" --ci-job-ref "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || cleanup_rc=$?; rc="$cleanup_rc"; if [ "$cleanup_rc" = "0" ]; then cp "$RUNNER_TEMP/stamp-bootstrap-cleanup.json" qa-evidence/bootstrap-cleanup.json; bash scripts/qa/stamp_report.sh bootstrap-terminal completed "$RUNNER_TEMP/stamp-bootstrap-cleanup.json" || rc=$?; else PKG="$(cat qa-app-package.txt)"; adb shell am force-stop "$PKG" || true; adb shell pm clear "$PKG" || true; rm -f "$RUNNER_TEMP/stamp-bootstrap-login-${STAMP_RUN_CASE_ID}.json" "$RUNNER_TEMP/stamp-bootstrap-ready-${STAMP_RUN_CASE_ID}.json"; fi; echo "$rc" > qa-evidence/bootstrap-terminal.rc; fi

      # Required-marker gate: when the case declares production markers that
      # must appear in logcat, a violation overrides the agent verdict to
      # coverage-invalid (3) — never a product FAIL. Runs after logcat.txt is
      # captured and before upload so the report lands in the artifact.
      - name: Required-marker gate
        if: ${{ always() && inputs.require_markers != '' }}
        env:
          REQUIRE_MARKERS: ${{ inputs.require_markers }}
        run: |
          echo "## Required-marker gate" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s qa-evidence/logcat.txt ]; then
            echo '{"gate":"require_markers","verdict":"invalid","note":"no logcat.txt captured"}' > qa-evidence/coverage-require-markers.json
            echo 3 > qa-evidence/coverage-require-markers.rc
          else
            # `|| rc=$?` — without it `bash -e` kills the step on exit 3
            # before the rc file is written; a marker violation is a VERDICT
            # (applied in Report verdict), not an infra error of this step.
            rc=0
            node scripts/qa/check_require_markers.mjs --log qa-evidence/logcat.txt --markers "$REQUIRE_MARKERS" > qa-evidence/coverage-require-markers.json || rc=$?
            echo "$rc" > qa-evidence/coverage-require-markers.rc
          fi
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat qa-evidence/coverage-require-markers.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-acceptance-evidence
          path: qa-evidence
          if-no-files-found: warn

      - name: Report verdict
        # Infrastructure/setup failures are owned exclusively by the final
        # failure handler below so it can cleanup + terminal before closing the
        # claimed attempt as harness/error. Product/harness executor outcomes
        # keep this normal path because the runner step itself completed.
        if: ${{ always() && !failure() }}
        env:
          STAMP_RUN_CASE_ID: ${{ inputs.stamp_run_case_id }}
          STAMP_URL: ${{ secrets.STAMP_URL }}
          STAMP_TOKEN: ${{ secrets.STAMP_TOKEN }}
        run: |
          set -o pipefail
          rc="$(cat qa-evidence/agent-rc.txt 2>/dev/null || echo 2)"
          lifecycle_rc=0
          echo "## QA Acceptance verdict" >> "$GITHUB_STEP_SUMMARY"
          if [ -f qa-evidence/verdict.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat qa-evidence/verdict.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no verdict.json produced (agent rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Evidence: qa-acceptance-evidence artifact (per-step screenshots + steps.jsonl)." >> "$GITHUB_STEP_SUMMARY"
          # A required-marker gate, when run, OVERRIDES the agent verdict: a
          # visual pass on an unexercised seam must not count as product PASS.
          mrc="$(cat qa-evidence/coverage-require-markers.rc 2>/dev/null || echo '')"
          if [ -n "$mrc" ] && [ "$mrc" != "0" ]; then
            echo "Required-marker gate overrides agent verdict: rc=$mrc (3=coverage-invalid/no-verdict, NOT a product FAIL)." >> "$GITHUB_STEP_SUMMARY"
            rc="$mrc"
            lifecycle_rc=1
          fi
          erc="$(cat qa-evidence/stamp-evidence.rc 2>/dev/null || echo '0')"
          if [ "$erc" != "0" ]; then
            echo "Stamp scope/evidence upload failed before teardown: rc=$erc (harness/incomplete, not product FAIL)." >> "$GITHUB_STEP_SUMMARY"
            rc=3
            lifecycle_rc=1
          fi
          trc="$(cat qa-evidence/bootstrap-terminal.rc 2>/dev/null || echo '')"
          if [ -n "$trc" ] && [ "$trc" != "0" ]; then
            echo "QA login bootstrap terminal/logout failed: rc=$trc (harness/incomplete, not product FAIL)." >> "$GITHUB_STEP_SUMMARY"
            rc=3
            lifecycle_rc=1
          fi
          if ! bash scripts/qa/stamp_report.sh report-verdict qa-evidence "$lifecycle_rc"; then
            echo "Stamp verdict report failed after teardown (harness/incomplete)." >> "$GITHUB_STEP_SUMMARY"
            rc=3
          fi
          exit "$rc"

      - name: Report pre-claim infrastructure failure
        if: ${{ failure() && inputs.stamp_run_case_id != '' }}
        env:
          STAMP_RUN_CASE_ID: ${{ inputs.stamp_run_case_id }}
          STAMP_URL: ${{ secrets.STAMP_URL }}
          STAMP_TOKEN: ${{ secrets.STAMP_TOKEN }}
          STAMP_PRECLAIM_ERROR_REASON: workflow failed before Stamp claim; inspect linked GitHub Actions run
          STAMP_POSTCLAIM_ERROR_REASON: workflow failed after Stamp claim; product requirements were not evaluated
          STAMP_POSTCLAIM_ERROR_PHASE: workflow_failure
        run: |
          claim="$RUNNER_TEMP/stamp-claim-${STAMP_RUN_CASE_ID}"
          binding="$RUNNER_TEMP/stamp-bootstrap-device-binding.json"
          if [ -s "$claim" ]; then
            bash scripts/qa/stamp_report.sh bootstrap-failure-terminal "$binding" "$RUNNER_TEMP/stamp-bootstrap-ready.json" || true
          fi
          bash scripts/qa/stamp_report.sh workflow-error
