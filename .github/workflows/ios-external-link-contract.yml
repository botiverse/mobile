name: iOS external-link contract

on:
  pull_request:
    paths:
      - 'compose/iosApp/iosApp/RaftIosExternalLink*.swift'
      - 'compose/iosApp/iosApp/RaftIosSceneDelegate.swift'
      - 'compose/iosApp/iosApp/RaftIosShellWindowContract.swift'
      - 'compose/iosApp/iosApp/ContentView.swift'
      - 'compose/iosApp/iosApp/SlockIosMobileOAuthHost.swift'
      - 'compose/iosApp/iosApp/KuiklyExpand/Modules/HRBridgeModule.m'
      - 'compose/iosApp/scripts/test_external_link*'
      - '.github/workflows/ios-external-link-contract.yml'
  push:
    paths:
      - 'compose/iosApp/iosApp/RaftIosExternalLink*.swift'
      - 'compose/iosApp/scripts/test_external_link*'
      - '.github/workflows/ios-external-link-contract.yml'

permissions:
  contents: read

concurrency:
  group: ios-external-link-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingress:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Exercise production native ingress
        run: bash compose/iosApp/scripts/test_external_link_ingress.sh
