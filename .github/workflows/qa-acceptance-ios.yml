name: QA Acceptance iOS (agent-in-CI)

# iOS leg of the acceptance executor (#proj-quality): same goal-in/verdict-out
# contract as qa-acceptance.yml, driven through the QaAcceptanceLoopTests
# XCUITest harness (ONE test invocation keeps the app alive for the whole run;
# actions flow over a cmd/res file protocol) plus `simctl io screenshot`.
# Build/boot recipe is the proven visual-testing ios-capture one.

on:
  workflow_dispatch:
    inputs:
      goal:
        description: "Acceptance goal for the agent (natural language, concrete verifiable requirements)"
        required: false
        default: ""
      max_turns:
        description: "Agent turn budget"
        required: false
        default: "40"
      stamp_run_case_id:
        description: "Stamp run_case id — when set, evidence + verdict report back to Stamp"
        required: false
        default: ""
      # Identity of the server environment under test, recorded in perf.json
      # (task #14 self-describing header). Free-form label, e.g. OranixSlockTest.
      environment:
        description: "Server environment label for the perf.json identity header"
        required: false
        default: "unspecified-ci"
      # agent = M3 acceptance agent (default); deterministic = no-model scripted
      # drive (ios_deterministic_repro.mjs) for precise crash-repro where agent
      # navigation keeps getting lost.
      mode:
        description: "Execution mode: agent (M3) or deterministic (scripted, no model)"
        required: false
        default: "agent"
  push:
    branches: [xishi/qa-ios-executor]

env:
  # login smoke (iOS first-run PoC): mirrors the Android case-01 path.
  DEFAULT_GOAL: >-
    Log into the app with the provided test account: if a login/welcome screen shows,
    enter the email and password and submit. If a server picker appears choose 'Raft Android'.
    Declare pass once the home channel list is visible with at least one channel row,
    fail otherwise. Do not open any channel.

jobs:
  acceptance:
    name: iOS acceptance run (M3 agent on simulator)
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 75
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      # iPhone 14: 390x844pt @3x — same geometry as the android/react baselines.
      SIM_DEVICE: iPhone 14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      - name: Resolve kuikly fork submodule sha
        id: kuikly-fork
        shell: bash
        run: |
          sha="$(git rev-parse HEAD:third_party/kuikly-ui)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Same key as visual-testing/test.yml so this job rides their warm cache.
      - name: Cache kuikly fork mavenLocal artifacts
        id: kuikly-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-android-${{ runner.os }}-${{ steps.kuikly-fork.outputs.sha }}

      - name: Publish Kuikly fork artifacts
        if: steps.kuikly-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui
          scripts/build_kuikly_fork.sh --android-only

      - name: Ensure kuikly fork submodule for local pod
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui

      # Reused blacksmith macOS runners can carry a stale KSP incremental cache in
      # compose/shared/build from a prior job on a DIFFERENT commit. That stale state
      # intermittently corrupts :shared:kspKotlinIosSimulatorArm64 FIR resolution
      # (KotlinIllegalArgumentExceptionWithAttachments: FirRegularClassImpl RAW_FIR ->
      # STATUS, "BUILD FAILED in ~7s", xcodebuild exit 65) — same source builds green on
      # a clean runner. Preflight diagnoses the residue (existence + mtime only, no
      # content) to prove the cross-job mechanism, then clears only the KSP/Kotlin
      # incremental dirs so this build regenerates them fresh.
      - name: Preflight — KSP incremental cache hygiene (iOS FIR RAW_FIR->STATUS guard)
        shell: bash
        run: |
          ksp_dir="$GITHUB_WORKSPACE/compose/shared/build/generated/ksp"
          inc_dir="$GITHUB_WORKSPACE/compose/shared/build/kotlin"
          echo "===== KSP preflight residue check (this build sha=$GITHUB_SHA, run=$GITHUB_RUN_ID) ====="
          for d in "$ksp_dir" "$inc_dir"; do
            if [ -e "$d" ]; then
              mt=$(stat -f '%Sm' -t '%Y-%m-%dT%H:%M:%SZ' "$d" 2>/dev/null || date -u -r "$d" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo unknown)
              echo "PRESENT  $d  mtime=$mt  (stale-from-prior-job if older than this job's checkout)"
            else
              echo "ABSENT   $d"
            fi
          done
          echo "===== clearing KSP/Kotlin incremental state (targeted, per A/B design) ====="
          rm -rf "$ksp_dir" "$inc_dir"
          echo "cleaned; :shared:kspKotlinIosSimulatorArm64 will regenerate fresh."

      - name: Generate shared framework placeholder
        working-directory: compose
        run: ./gradlew :shared:generateDummyFramework --no-daemon --console=plain

      - name: Pod install
        working-directory: compose/iosApp
        run: pod install

      - name: Boot simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys,os; d=json.load(sys.stdin)['devices']; print(next((dev['udid'] for devs in d.values() for dev in devs if dev['name']==os.environ['SIM_DEVICE']), ''))")
          if [ -z "$udid" ]; then
            runtime=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r['isAvailable'] and r['platform']=='iOS']; print(sorted(rs, key=lambda r: r['version'])[-1]['identifier'])")
            devtype=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys,os; print(next(d['identifier'] for d in json.load(sys.stdin)['devicetypes'] if d['name']==os.environ['SIM_DEVICE']))")
            udid=$(xcrun simctl create "qa-${SIM_DEVICE// /-}" "$devtype" "$runtime")
          fi
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # Marker for attributed .ips capture: any crash report newer than this
          # (touched before the app runs) belongs to this run, avoiding time-window
          # parsing ambiguity when harvesting the simulator's CrashReporter later.
          touch "$GITHUB_WORKSPACE/qa-ips-marker"

      # One build produces BOTH the app and the UITest runner (the test target
      # depends on the app), pinned to the booted udid.
      - name: Build for testing (app + loop harness)
        working-directory: compose/iosApp
        run: |
          log="$GITHUB_WORKSPACE/xcodebuild-ios.log"
          set +e
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosAppUITests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing > "$log" 2>&1
          status=$?
          tail -100 "$log"
          if [ "$status" -ne 0 ]; then
            echo "===== iOS build FAILED (status=$status) — extracted errors ====="
            grep -nE "e: |: error:|error: |Unresolved|unresolved reference|BUILD FAILED|following build commands failed|PhaseScriptExecution" "$log" | tail -100 || true
          fi
          exit "$status"

      - name: Install app
        run: |
          app=$(find compose/iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' ! -name '*Runner*' | head -1)
          test -n "$app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          echo "app=$app bundle_id=$bundle_id"
          echo "BUNDLE_ID=$bundle_id" >> "$GITHUB_ENV"
          xcrun simctl install "$UDID" "$app"
          # iOS twin of the android build-info.json (#1120): bind the run to
          # its exact bits — commit, app version, and the main binary's hash.
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist" 2>/dev/null || echo "")
          buildnum=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist" 2>/dev/null || echo "")
          binary=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist" 2>/dev/null || echo "iosApp")
          binhash=$(shasum -a 256 "$app/$binary" 2>/dev/null | cut -d' ' -f1 || echo "")
          printf '{\n "platform": "ios",\n "source_commit": "%s",\n "branch": "%s",\n "build_run_id": "%s",\n "app_version": "%s",\n "version_code": "%s",\n "binary_sha256": "%s",\n "bundle_id": "%s"\n}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$version" "$buildnum" "$binhash" "$bundle_id" > "$GITHUB_WORKSPACE/build-info-ios.json"
          cat "$GITHUB_WORKSPACE/build-info-ios.json"

      - name: Install M3 SDK (pi-ai)
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p m3 && cd m3
          npm i @earendil-works/pi-ai@0.80.10 --no-audit --no-fund

      - name: Start loop harness (background)
        working-directory: compose/iosApp
        run: |
          mkdir -p "$RUNNER_TEMP/qa-loop"
          echo "QA_LOOP_IO_DIR=$RUNNER_TEMP/qa-loop" >> "$GITHUB_ENV"
          # TEST_RUNNER_* env vars are forwarded into the XCUITest runner.
          TEST_RUNNER_QA_LOOP_IO_DIR="$RUNNER_TEMP/qa-loop" \
          TEST_RUNNER_QA_LOOP_BUNDLE="$BUNDLE_ID" \
          TEST_RUNNER_QA_LOOP_IDLE_TIMEOUT="300" \
            xcodebuild \
              -workspace iosApp.xcworkspace \
              -scheme iosAppUITests \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=${UDID}" \
              -derivedDataPath build/DerivedData \
              -only-testing:iosAppUITests/QaAcceptanceLoopTests \
              CODE_SIGNING_ALLOWED=NO \
              test-without-building > "$GITHUB_WORKSPACE/xcodebuild-loop.log" 2>&1 &
          echo "loop harness started (pid $!)"

      - name: Run acceptance agent
        if: ${{ inputs.mode != 'deterministic' }}
        env:
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          SLOCK_PI_AI_MODULE: ${{ runner.temp }}/m3/node_modules/@earendil-works/pi-ai/dist/providers/all.js
          QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
          QA_GOAL: ${{ inputs.goal || '' }}
          QA_MAX_TURNS: ${{ inputs.max_turns || '40' }}
          STAMP_RUN_CASE_ID: ${{ inputs.stamp_run_case_id || '' }}
          STAMP_URL: ${{ secrets.STAMP_URL }}
          STAMP_TOKEN: ${{ secrets.STAMP_TOKEN }}
        run: |
          bash scripts/qa/stamp_report.sh claim
          mkdir -p qa-evidence
          cp "$GITHUB_WORKSPACE/build-info-ios.json" qa-evidence/build-info.json 2>/dev/null || true
          # BSD date (macOS) has no %3N — compose ms from seconds instead.
          echo $(( $(date +%s) * 1000 )) > qa-evidence/perf-started.txt
          export MINIMAX_API_KEY="$PI_API_KEY"
          set +e
          node scripts/qa/acceptance_agent.mjs \
            --platform ios --ios-udid "$UDID" --package "$BUNDLE_ID" \
            --goal "${QA_GOAL:-$DEFAULT_GOAL}" --max-turns "$QA_MAX_TURNS" --out qa-evidence
          echo "$?" > qa-evidence/agent-rc.txt
          echo "agent exit code $(cat qa-evidence/agent-rc.txt)"

      # Deterministic mode: no-model scripted drive for precise crash-repro —
      # the M3 agent keeps getting lost on navigation (permission dialogs,
      # back-gesture exits). Fixed step sequence, auditable; same loop harness
      # and evidence collectors downstream.
      - name: Test deterministic navigation matcher
        if: ${{ inputs.mode == 'deterministic' }}
        run: node --test scripts/qa/ios_navigation_matcher.test.mjs

      - name: Run deterministic repro
        if: ${{ inputs.mode == 'deterministic' }}
        env:
          QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
        run: |
          mkdir -p qa-evidence
          cp "$GITHUB_WORKSPACE/build-info-ios.json" qa-evidence/build-info.json 2>/dev/null || true
          echo $(( $(date +%s) * 1000 )) > qa-evidence/perf-started.txt
          # Pre-grant Photos access (task #26): the SpringBoard permission alert
          # is outside the app accessibility tree, so tapping it would mean
          # driving system UI — instead we grant deterministically up front and
          # the single image tap goes straight to the real PhotosUI picker.
          xcrun simctl privacy "$UDID" grant photos "$BUNDLE_ID"
          set +e
          node scripts/qa/ios_deterministic_repro.mjs \
            --ios-io-dir "$QA_LOOP_IO_DIR" --ios-udid "$UDID" --package "$BUNDLE_ID" --out qa-evidence
          echo "$?" > qa-evidence/agent-rc.txt
          echo "deterministic repro exit code $(cat qa-evidence/agent-rc.txt)"

      - name: Collect harness log + system log + crashes + xcresult
        if: always()
        run: |
          cp xcodebuild-loop.log qa-evidence/xcodebuild-loop.log 2>/dev/null || true
          tail -50 xcodebuild-loop.log 2>/dev/null || true
          # iOS evidence parity with Android (logcat + activity-top) — collected
          # EVERY run, not just failures. Lets termination cases (e.g. case-06
          # feedback submit) be judged product-crash vs sim-lifecycle from the
          # .ips instead of guessing from a SpringBoard screenshot.
          UDID="${UDID:-booted}"
          # 1) System log (the logcat twin): last 12m of the sim's unified log,
          #    kept to app + termination-relevant lines so the artifact stays
          #    bounded. grep-filtered rather than a `process ==` predicate because
          #    the Kuikly app's process name is its executable ("iosApp"), not
          #    "Raft"; the daemon lines (SpringBoard/launchd/assertiond/jetsam)
          #    carry the reason when the app is terminated.
          xcrun simctl spawn "$UDID" log show --last 12m --style syslog 2>/dev/null \
            | grep -iE 'raft|iosApp|SpringBoard|launchd|assertiond|runningboardd|jetsam|crash|terminat|signal|exception|watchdog' \
            | tail -4000 > qa-evidence/system-log-raft.txt || true
          # 2) Crash reports (.ips): simulator app crashes land in the SIMULATOR's
          #    own data dir, NOT the host ~/Library/Logs/DiagnosticReports (which is
          #    empty for sim app crashes — the old `cp host/*.ips || true` silently
          #    captured nothing, losing attribution on `crashed in <external symbol>`
          #    terminations). Harvest per-UDID CrashReporter/DiagnosticReports for
          #    reports NEWER than the boot marker, keep only those naming our process
          #    /bundle, and record identity (path + sha256). Never silent: log the
          #    searched roots and count even when zero.
          mkdir -p qa-evidence/crashes
          marker="$GITHUB_WORKSPACE/qa-ips-marker"
          simlogs="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Logs"
          {
            echo "udid=$UDID"
            echo "marker=$([ -e "$marker" ] && stat -f '%Sm' -t '%Y-%m-%dT%H:%M:%SZ' "$marker" 2>/dev/null || echo MISSING)"
          } > qa-evidence/crashes/ips-manifest.txt
          ips_found=0
          for root in "$simlogs/CrashReporter" "$simlogs/DiagnosticReports"; do
            exists=absent; [ -d "$root" ] && exists=exists
            echo "searched_root=$root ($exists)" >> qa-evidence/crashes/ips-manifest.txt
            [ -d "$root" ] || continue
            while IFS= read -r ips; do
              [ -n "$ips" ] || continue
              if grep -qE 'iosApp|build\.raft\.app' "$ips" 2>/dev/null; then
                sha=$(shasum -a 256 "$ips" 2>/dev/null | awk '{print $1}')
                cp "$ips" "qa-evidence/crashes/$(basename "$ips")" 2>/dev/null
                echo "captured=$(basename "$ips") path=$ips sha256=$sha" >> qa-evidence/crashes/ips-manifest.txt
                ips_found=$((ips_found+1))
              fi
            done < <(find "$root" -name '*.ips' -newer "$marker" 2>/dev/null)
          done
          echo "attributed_ips_count=$ips_found" >> qa-evidence/crashes/ips-manifest.txt
          echo "attributed .ips captured: $ips_found (see qa-evidence/crashes/ips-manifest.txt)"
          # 3) The XCUITest .xcresult bundle (definitive per-run test result).
          find compose/iosApp/build/DerivedData/Logs/Test -maxdepth 1 -name '*.xcresult' \
            -exec cp -R {} qa-evidence/ \; 2>/dev/null || true
          echo "iOS evidence: system-log-raft.txt=$(wc -l < qa-evidence/system-log-raft.txt 2>/dev/null || echo 0) lines, crashes=$(ls qa-evidence/crashes 2>/dev/null | wc -l | tr -d ' ') .ips, xcresult=$(ls -d qa-evidence/*.xcresult 2>/dev/null | wc -l | tr -d ' ')"

      # task #14 iOS v1: self-describing perf.json every run (record-only,
      # advisory). Step timing windows + system-log lifecycle signals; the
      # app-level frame-metric gap (SlockPerformanceDiagnostics is Android-only)
      # is recorded explicitly in the file's known_gap field.
      - name: Collect perf summary
        if: always()
        run: |
          UDID="${UDID:-booted}"
          # sw_vers does not exist INSIDE an iOS simulator — read the runtime
          # version from the host-side device record instead (e.g. iOS-17-5 → 17.5).
          IOS_VER="$(xcrun simctl list devices -j 2>/dev/null | python3 -c "import json,sys,os; d=json.load(sys.stdin)['devices']; rt=next((k for k,devs in d.items() for dev in devs if dev['udid']==os.environ.get('UDID','')), ''); import re; m=re.search(r'iOS-([0-9-]+)', rt); print(m.group(1).replace('-','.') if m else 'unknown')" || echo unknown)"
          node scripts/qa/collect_perf_ios.mjs \
            --slog qa-evidence/system-log-raft.txt \
            --steps qa-evidence/steps.jsonl \
            --bundle "${BUNDLE_ID:-build.raft.app}" \
            --device-json "{\"model\":\"${SIM_DEVICE:-iPhone 14}\",\"os\":\"${IOS_VER}\"}" \
            --environment "${{ inputs.environment }}" \
            --started "$(cat qa-evidence/perf-started.txt 2>/dev/null || echo 0)" \
            --out qa-evidence/perf.json || true

      - name: Report to Stamp
        if: always()
        env:
          STAMP_RUN_CASE_ID: ${{ inputs.stamp_run_case_id || '' }}
          STAMP_URL: ${{ secrets.STAMP_URL }}
          STAMP_TOKEN: ${{ secrets.STAMP_TOKEN }}
        run: bash scripts/qa/stamp_report.sh report qa-evidence

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-acceptance-ios-evidence
          path: qa-evidence
          if-no-files-found: warn

      - name: Report verdict
        if: always()
        run: |
          rc="$(cat qa-evidence/agent-rc.txt 2>/dev/null || echo 2)"
          echo "## QA Acceptance verdict (iOS)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f qa-evidence/verdict.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat qa-evidence/verdict.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no verdict.json produced (agent rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Evidence: qa-acceptance-ios-evidence artifact (per-step screenshots + steps.jsonl + xcodebuild-loop.log + system-log-raft.txt + crashes/*.ips + *.xcresult)." >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
