name: QA Acceptance iOS (agent-in-CI)

# iOS leg of the acceptance executor (#proj-quality): same goal-in/verdict-out
# contract as qa-acceptance.yml. Inspect/act defaults to agent-device; screenshots
# stay on `simctl io screenshot`. IOS_QA_DRIVER=qa-loop keeps the
# QaAcceptanceLoopTests file protocol. Product-log verdicts stay outside the driver.
# Build/boot recipe is the proven visual-testing ios-capture one.

on:
  workflow_dispatch:
    inputs:
      goal:
        description: "Acceptance goal for the agent (natural language, concrete verifiable requirements)"
        required: false
        default: ""
      max_turns:
        description: "Agent turn budget"
        required: false
        default: "40"
      max_minutes:
        description: "Case-specific wall-clock budget"
        required: false
        default: "20"
      no_progress_turns:
        description: "Abort after this many repeated identical actions"
        required: false
        default: "8"
      stamp_run_case_id:
        description: "Stamp run_case id — when set, evidence + verdict report back to Stamp"
        required: false
        default: ""
      # Identity of the server environment under test, recorded in perf.json
      # (task #14 self-describing header). Free-form label, e.g. OranixSlockTest.
      environment:
        description: "Server environment label for the perf.json identity header"
        required: false
        default: "unspecified-ci"
      # agent = M3 acceptance agent (default); deterministic = no-model scripted
      # drive (ios_deterministic_repro.mjs) for precise crash-repro where agent
      # navigation keeps getting lost.
      mode:
        description: "Execution mode: agent (M3) | deterministic (#1096) | tabpager-probe (#232/#233)"
        required: false
        default: "agent"
      fixture_page:
        description: "Launch this @Page route directly instead of logging in (e.g. compose_tab_pager_probe)"
        required: false
        default: ""
      probe_groups:
        description: "Which gesture groups to run for tabpager-probe (e.g. 1,2)"
        required: false
        default: "1,2"
      app_run_id:
        description: "Download ios-simulator-app-<run> and replace the app product after building the UITest runner"
        required: false
        default: ""
      artifact_sha256:
        description: "Frozen SHA-256 of the exact .app.zip"
        required: false
        default: ""
      artifact_source_commit:
        description: "Frozen source commit of the exact app artifact"
        required: false
        default: ""
      artifact_version:
        description: "Frozen CFBundleShortVersionString"
        required: false
        default: ""
      artifact_version_code:
        description: "Frozen CFBundleVersion"
        required: false
        default: ""
      artifact_package_id:
        description: "Frozen CFBundleIdentifier"
        required: false
        default: ""
      allow_non_default_xcode_lane:
        description: "Accept an app_run_id carrier built on an opt-in Xcode lane (metadata xcode_lane != default, e.g. the Xcode 26.6 / iOS 26.5 SDK fallback, or one stamped default on a pre-27.1 Xcode). Off: such a carrier is refused, it is not the release build."
        required: false
        type: boolean
        default: false
  push:
    branches: [xishi/qa-ios-executor]

permissions:
  contents: read
  actions: read

env:
  # login smoke (iOS first-run PoC): mirrors the Android case-01 path.
  DEFAULT_GOAL: >-
    Log into the app with the provided test account: if a login/welcome screen shows,
    enter the email and password and submit. If a server picker appears choose 'OranixSlockTest'.
    If 'OranixSlockTest' is not present, fail and report it; never
    substitute the closest-looking name.
    Declare pass once the home channel list is visible with at least one channel row,
    fail otherwise. Do not open any channel.

jobs:
  acceptance:
    name: iOS acceptance run (M3 agent on simulator)
    # GitHub's Xcode 27 image (billed): the only one with Xcode 27.1, the default since 2026-10-28.
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      # iPhone 14: 390x844pt @3x — same geometry as the android/react baselines.
      SIM_DEVICE: iPhone 14
      # Default inspect/act path. qa-loop keeps QaAcceptanceLoopTests.
      IOS_QA_DRIVER: agent-device
      # The one pinned Xcode for this job: Pin Xcode selects it, and the exported carrier's
      # metadata.json is stamped as built on it (xcode_lane=default). prepare_pinned_ios_app.sh
      # also reads it to refuse an app_run_id carrier built on any other Xcode.
      RAFT_DEFAULT_XCODE_APP: /Applications/Xcode_27.1.app
    steps:
      # Blacksmith macOS starts its local Actions-results proxy with the job.
      # Give it a bounded readiness window before any action can use artifact
      # or cache APIs. Remove this once the fleet has a server-side health gate.
      - name: Warm macOS artifact proxy
        shell: bash
        run: sleep 5

      - name: Checkout
        uses: actions/checkout@v7

      - name: Pin Xcode
        # Build with a chosen Xcode, not the runner image's default: the SDK decides how iOS
        # lays the app out (the iOS 27.1 SDK makes it edge-to-edge on iPhone Duo, status bar on
        # the right edge). Moving SDKs is a deliberate change (iPhone Duo audit, 2026-10-27).
        env:
          XCODE_APP_PATH: ${{ env.RAFT_DEFAULT_XCODE_APP }}
        run: bash scripts/ci/select_ios_xcode.sh

      - name: Validate frozen artifact inputs
        id: frozen-inputs
        env:
          PIN_PRIMARY: ${{ inputs.app_run_id }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          ARTIFACT_SOURCE_COMMIT: ${{ inputs.artifact_source_commit }}
          ARTIFACT_VERSION: ${{ inputs.artifact_version }}
          ARTIFACT_VERSION_CODE: ${{ inputs.artifact_version_code }}
          ARTIFACT_PACKAGE_ID: ${{ inputs.artifact_package_id }}
        run: node scripts/qa/validate_frozen_inputs.mjs

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Shared Kotlin/Native Gradle settings
        uses: ./.github/actions/ios-kn-gradle
      # Reused blacksmith macOS runners can carry a stale KSP incremental cache in
      # compose/shared/build from a prior job on a DIFFERENT commit. That stale state
      # intermittently corrupts :shared:kspKotlinIosSimulatorArm64 FIR resolution
      # (KotlinIllegalArgumentExceptionWithAttachments: FirRegularClassImpl RAW_FIR ->
      # STATUS, "BUILD FAILED in ~7s", xcodebuild exit 65) — same source builds green on
      # a clean runner. Preflight diagnoses the residue (existence + mtime only, no
      # content) to prove the cross-job mechanism, then clears only the KSP/Kotlin
      # incremental dirs so this build regenerates them fresh.
      - name: Preflight — KSP incremental cache hygiene (iOS FIR RAW_FIR->STATUS guard)
        shell: bash
        run: |
          ksp_dir="$GITHUB_WORKSPACE/compose/shared/build/generated/ksp"
          inc_dir="$GITHUB_WORKSPACE/compose/shared/build/kotlin"
          echo "===== KSP preflight residue check (this build sha=$GITHUB_SHA, run=$GITHUB_RUN_ID) ====="
          for d in "$ksp_dir" "$inc_dir"; do
            if [ -e "$d" ]; then
              mt=$(stat -f '%Sm' -t '%Y-%m-%dT%H:%M:%SZ' "$d" 2>/dev/null || date -u -r "$d" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo unknown)
              echo "PRESENT  $d  mtime=$mt  (stale-from-prior-job if older than this job's checkout)"
            else
              echo "ABSENT   $d"
            fi
          done
          echo "===== clearing KSP/Kotlin incremental state (targeted, per A/B design) ====="
          rm -rf "$ksp_dir" "$inc_dir"
          echo "cleaned; :shared:kspKotlinIosSimulatorArm64 will regenerate fresh."

      - name: Generate shared framework placeholder
        working-directory: compose
        run: ./gradlew :shared:generateDummyFramework --no-daemon --console=plain --stacktrace

      - name: Pod install
        working-directory: compose/iosApp
        run: pod install

      # Runtime: the newest available iOS runtime not newer than the pinned Xcode's
      # iPhoneSimulator SDK (the Xcode 27 image also ships e.g. a 27.2 RC runtime that Xcode 27.1
      # may not drive), else the newest available. SIM_DEVICE is reused on that runtime, or created.
      - name: Boot simulator
        run: |
          SIM_SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)"; export SIM_SDK
          runtime=$(xcrun simctl list runtimes -j | python3 -c "
          import json, os, sys
          v = lambda s: tuple(int(p) for p in s.split('.') if p.isdigit())
          rs = sorted((r for r in json.load(sys.stdin)['runtimes'] if r['isAvailable'] and r['platform'] == 'iOS'), key=lambda r: v(r['version']))
          if not rs: sys.exit('no available iOS simulator runtime')
          fit = [r for r in rs if v(r['version']) <= v(os.environ['SIM_SDK'])]
          print((fit or rs)[-1]['identifier'])")
          export RUNTIME="$runtime"
          echo "iPhoneSimulator SDK ${SIM_SDK}; runtime ${RUNTIME}; device ${SIM_DEVICE}"
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys,os; d=json.load(sys.stdin)['devices'].get(os.environ['RUNTIME'], []); print(next((dev['udid'] for dev in d if dev['name']==os.environ['SIM_DEVICE']), ''))")
          if [ -z "$udid" ]; then
            devtype=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys,os; print(next(d['identifier'] for d in json.load(sys.stdin)['devicetypes'] if d['name']==os.environ['SIM_DEVICE']))")
            udid=$(xcrun simctl create "qa-${SIM_DEVICE// /-}" "$devtype" "$runtime") || {
              echo "::error::Could not create ${SIM_DEVICE} on ${runtime}. iPhone device types it supports:"
              xcrun simctl list runtimes -j | python3 -c "import json,sys,os; r=next(r for r in json.load(sys.stdin)['runtimes'] if r['identifier']==os.environ['RUNTIME']); print('\n'.join(t['name'] for t in r.get('supportedDeviceTypes', []) if 'iPhone' in t['name']))" || true
              exit 1
            }
          fi
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # Marker for attributed .ips capture: any crash report newer than this
          # (touched before the app runs) belongs to this run, avoiding time-window
          # parsing ambiguity when harvesting the simulator's CrashReporter later.
          touch "$GITHUB_WORKSPACE/qa-ips-marker"

      # Link the Debug simulator framework once, as its own visible step; the
      # build below skips the CocoaPods "Build shared" phase and lets the
      # "Copy kmmresource MR bundle to app" phase reuse this link instead of
      # relinking (see ios-simulator-app.yml / compose/shared/build.gradle.kts).
      - name: Sync shared framework (simulator arm64, Debug)
        working-directory: compose
        run: |
          ./gradlew :shared:syncFramework \
            -Pkotlin.native.cocoapods.platform=iphonesimulator \
            -Pkotlin.native.cocoapods.archs=arm64 \
            -Pkotlin.native.cocoapods.configuration=Debug \
            --no-daemon \
            --console=plain \
            --stacktrace

      # One build produces BOTH the app and the UITest runner (the test target
      # depends on the app), pinned to the booted udid.
      - name: Build for testing (app + loop harness)
        working-directory: compose/iosApp
        run: |
          log="$GITHUB_WORKSPACE/xcodebuild-ios.log"
          set +e
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosAppUITests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            RAFT_IOS_REUSE_LINKED_FRAMEWORK=YES \
            build-for-testing > "$log" 2>&1
          status=$?
          tail -100 "$log"
          if [ "$status" -ne 0 ]; then
            echo "===== iOS build FAILED (status=$status) — extracted errors ====="
            grep -nE "e: |: error:|error: |Unresolved|unresolved reference|BUILD FAILED|following build commands failed|PhaseScriptExecution" "$log" | tail -100 || true
          fi
          exit "$status"

      # task #239: publish the simulator .app this run just built.
      #
      # Until now nothing in the repo uploaded an installable iOS app — this job built one and
      # installed it straight into the simulator, never exporting it — which left the
      # `app_run_id` input below a dangling consumer: it downloads `ios-simulator-app-<run>`,
      # a name no workflow produced. Publishing it here closes that loop, so a later run can
      # pin an exact carrier, and a reviewer with a Simulator seat can install these bits.
      #
      # The emitted metadata.json is NOT a free-form record: it is the exact shape
      # scripts/qa/prepare_pinned_ios_app.sh validates on the consuming side (platform
      # "ios-simulator", artifact_sha256/artifact_size of the zip, 40-hex source_commit,
      # github_run_id, bundle_id, version, version_code). Producer and consumer must move
      # together or the pin fails closed.
      - name: Export simulator .app as an installable artifact
        if: ${{ inputs.app_run_id == '' }}
        run: |
          set -euo pipefail
          products=compose/iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator
          app=$(find "$products" -maxdepth 1 -name '*.app' ! -name '*Runner*' | head -1)
          test -n "$app"
          # A device build cannot be installed on a Simulator seat, and the two are
          # indistinguishable by filename — only DTPlatformName separates them. Refuse rather
          # than publish an artifact whose consumer can only discover the mismatch at install.
          platform=$(/usr/libexec/PlistBuddy -c 'Print DTPlatformName' "$app/Info.plist" 2>/dev/null || echo "")
          if [ "$platform" != "iphonesimulator" ]; then
            echo "refusing to publish a non-simulator slice: DTPlatformName=${platform:-<absent>}" >&2
            exit 2
          fi
          mkdir -p ios-app-export
          zip=ios-app-export/raft-ios-simulator.app.zip
          # ditto, not `zip -r`: a .app is a bundle with symlinks and resource forks that
          # plain zip flattens, producing an archive that unpacks into an uninstallable app.
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          sha=$(shasum -a 256 "$zip" | awk '{print $1}')
          size=$(stat -f '%z' "$zip")
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")
          code=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")
          binary=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")
          binsha=$(shasum -a 256 "$app/$binary" | awk '{print $1}')
          # ⚠️ This reads the BUILD PRODUCT ("$app" is the DerivedData Products dir),
          # not an installed bundle — this export step runs before any install exists.
          # It is a build-time self-claim, NOT a read-back and NOT "bound to the
          # artifact". The previous comment here asserted the opposite; it was cited
          # downstream as proof of installed identity, which it cannot support.
          # A genuine read-back must read a path that only resolves after install
          # (xcrun simctl get_app_container), with a same-path positive control.
          hands=$(/usr/libexec/PlistBuddy -c 'Print :HandsBuildCommit' "$app/Info.plist" 2>/dev/null || echo "")
          # Fail closed, same tier as DTPlatformName (@LiBai review, task #240). HandsBuildCommit
          # is stamped by an UNCONDITIONAL Xcode build phase, so an empty value does not mean
          # "this build has no commit" — it means the stamping phase did not run. Publishing it
          # empty is worse than refusing: this field is the carrier's stamped self-claim, it is NOT
          # in the set prepare_pinned_ios_app.sh validates, so nothing downstream would catch it,
          # and an empty string reads to a consumer as a normal value rather than a gap.
          # Two ways the stamp can be absent, and only one of them looks absent.
          # compose/iosApp/scripts/stamp_hands_build_metadata.sh:
          #   - if the processed Info.plist isn't found it warns and `exit 0` — the build stays
          #     green and no key is written  => PlistBuddy Print fails => hands is empty;
          #   - if no commit can be resolved it writes the literal string "unknown"
          #     => NON-EMPTY, so a bare -z test passes it and we would publish a carrier that
          #        claims an identity it does not have.
          # The sentinel is the more dangerous of the two precisely because it survives an
          # emptiness check, so reject both. Anything downstream comparing this against an exact
          # would otherwise be comparing against a placeholder.
          # Allowlist, not blacklist (@LiBai review). Enumerating known-bad values fails OPEN: the
          # sentinel today is "unknown", but if the stamping script ever emits "none", "N/A", or a
          # literal variable name, a blacklist waves it through while it still reads as a bound
          # identity. Asserting the required SHAPE fails CLOSED — an unanticipated bad value is
          # refused, and the worst case is one visible false rejection instead of a silent bad one.
          # Deliberate: a short SHA is REJECTED. Pinning a carrier is a full-SHA operation, so this
          # is a stated policy, not a regex written too narrowly — do not "fix" it by loosening.
          case "$hands" in
            *[!0-9a-f]* | "") hands_ok=no ;;
            ????????????????????????????????????????) hands_ok=yes ;;
            *) hands_ok=no ;;
          esac
          if [ "$hands_ok" != "yes" ]; then
            echo "refusing to publish a carrier without a real HandsBuildCommit (got: '${hands:-<empty>}')" >&2
            echo "expected a full 40-character lowercase hex commit" >&2
            echo "empty => the stamping build phase did not run; 'unknown' => it ran but could not resolve a commit; short SHA => rejected by policy" >&2
            exit 2
          fi
          printf '{\n  "platform": "ios-simulator",\n  "artifact_sha256": "%s",\n  "artifact_size": %s,\n  "source_commit": "%s",\n  "github_run_id": "%s",\n  "bundle_id": "%s",\n  "version": "%s",\n  "version_code": "%s",\n  "hands_build_commit": "%s",\n  "binary_sha256": "%s",\n  "dt_platform_name": "%s"\n}\n' \
            "$sha" "$size" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$bundle_id" "$version" "$code" \
            "$hands" "$binsha" "$platform" > ios-app-export/metadata.json
          # The metadata is hand-rendered with printf, so a format-string slip yields a file that
          # looks fine here and only explodes inside the consumer's JSON.parse one run later.
          # Parse it now, next to its cause.
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' ios-app-export/metadata.json
          # Xcode, iOS SDK and lane (always the pinned default here), so a later app_run_id pin
          # can tell this carrier from an opt-in-lane one (prepare_pinned_ios_app.sh).
          XCODE_APP_PATH="$RAFT_DEFAULT_XCODE_APP" \
            python3 scripts/ci/stamp_ios_xcode_lane.py ios-app-export/metadata.json
          cat ios-app-export/metadata.json
          {
            echo "## Installable iOS Simulator carrier"
            echo '```json'
            cat ios-app-export/metadata.json
            echo '```'
            echo "Pin it in a later run with: app_run_id=${GITHUB_RUN_ID} artifact_sha256=${sha}"
            echo ""
            echo "Verifying this carrier: compare artifact_sha256/artifact_size against the EXTRACTED"
            echo "raft-ios-simulator.app.zip file itself. Do NOT compare them against the size GitHub"
            echo "shows for the artifact - that is GitHub's own outer archive (this zip plus"
            echo "metadata.json, re-packed), so it legitimately differs and comparing it would reject"
            echo "a sound carrier. Measured example: outer 42,541,517 vs inner 43,545,457."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable simulator app
        if: ${{ inputs.app_run_id == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app-${{ github.run_id }}
          path: ios-app-export
          # error, not warn: an empty carrier artifact is worse than a failed step, because
          # the consumer's download succeeds and the mismatch surfaces far from its cause.
          if-no-files-found: error

      - name: Download frozen iOS Simulator app
        if: ${{ inputs.app_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ios-simulator-app-${{ inputs.app_run_id }}
          path: pinned-ios-app
          run-id: ${{ inputs.app_run_id }}
          github-token: ${{ github.token }}

      - name: Replace app product with frozen artifact
        if: ${{ inputs.app_run_id != '' }}
        env:
          PINNED_ZIP: pinned-ios-app/raft-ios-simulator.app.zip
          PINNED_METADATA: pinned-ios-app/metadata.json
          PRODUCTS_DIR: compose/iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator
          APP_RUN_ID: ${{ inputs.app_run_id }}
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.artifact_source_commit }}
          EXPECTED_VERSION: ${{ inputs.artifact_version }}
          EXPECTED_VERSION_CODE: ${{ inputs.artifact_version_code }}
          EXPECTED_PACKAGE_ID: ${{ inputs.artifact_package_id }}
          # Refuses a carrier from a non-default Xcode lane unless this input is true.
          ALLOW_NON_DEFAULT_XCODE_LANE: ${{ inputs.allow_non_default_xcode_lane && 'true' || 'false' }}
        run: |
          bash scripts/qa/prepare_pinned_ios_app.sh \
            "$PINNED_ZIP" "$PINNED_METADATA" "$PRODUCTS_DIR" "$APP_RUN_ID" \
            "$EXPECTED_SHA256" "$EXPECTED_SOURCE_COMMIT" "$EXPECTED_PACKAGE_ID" \
            "$EXPECTED_VERSION" "$EXPECTED_VERSION_CODE"

      - name: Set agent-device state dir
        if: ${{ env.IOS_QA_DRIVER == 'agent-device' }}
        run: echo "AGENT_DEVICE_STATE_DIR=$RUNNER_TEMP/agent-device" >> "$GITHUB_ENV"

      - name: Install agent-device
        if: ${{ env.IOS_QA_DRIVER == 'agent-device' }}
        run: npm install -g agent-device@0.20.10

      - name: Install app
        run: |
          app=$(find compose/iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' ! -name '*Runner*' | head -1)
          test -n "$app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          echo "app=$app bundle_id=$bundle_id"
          echo "BUNDLE_ID=$bundle_id" >> "$GITHUB_ENV"
          xcrun simctl install "$UDID" "$app"
          # iOS twin of the android build-info.json (#1120): bind the run to
          # its exact bits — commit, app version, and the main binary's hash.
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist" 2>/dev/null || echo "")
          buildnum=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist" 2>/dev/null || echo "")
          binary=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist" 2>/dev/null || echo "iosApp")
          binhash=$(shasum -a 256 "$app/$binary" 2>/dev/null | cut -d' ' -f1 || echo "")
          source_commit="${VERIFIED_ARTIFACT_SOURCE_COMMIT:-$GITHUB_SHA}"
          build_run_id="${VERIFIED_ARTIFACT_BUILD_RUN_ID:-$GITHUB_RUN_ID}"
          artifact_hash="${VERIFIED_ARTIFACT_SHA256:-}"
          printf '{\n "platform": "ios",\n "source_commit": "%s",\n "branch": "%s",\n "build_run_id": "%s",\n "app_version": "%s",\n "version_code": "%s",\n "artifact_sha256": "%s",\n "binary_sha256": "%s",\n "bundle_id": "%s"\n}\n' \
            "$source_commit" "$GITHUB_REF_NAME" "$build_run_id" "$version" "$buildnum" "$artifact_hash" "$binhash" "$bundle_id" > "$GITHUB_WORKSPACE/build-info-ios.json"
          cat "$GITHUB_WORKSPACE/build-info-ios.json"

      - name: Prepare agent-device iOS runner
        if: ${{ env.IOS_QA_DRIVER == 'agent-device' }}
        run: |
          mkdir -p "$AGENT_DEVICE_STATE_DIR"
          agent-device --version
          agent-device prepare ios-runner --platform ios --udid "$UDID" --timeout 180000

      - name: Install M3 SDK (pi-ai)
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p m3 && cd m3
          npm i @earendil-works/pi-ai@0.80.10 --no-audit --no-fund

      # Keep evidence behavior identical to Android: acceptance_agent imports
      # sharp from the workspace root when it renders tap/assertion overlays.
      # Without this explicit install, iOS uploads only raw screenshots and
      # Stamp has no annotated frame to display.
      - name: Install sharp (evidence annotation)
        run: npm i --no-save sharp@0.33.5 --no-audit --no-fund

      - name: Claim Stamp run case and resolve auth mode
        id: stamp-claim
        if: ${{ inputs.stamp_run_case_id != '' }}
        env:
          STAMP_RUN_CASE_ID: ${{ inputs.stamp_run_case_id }}
          STAMP_URL: ${{ secrets.STAMP_URL }}
          STAMP_TOKEN: ${{ secrets.STAMP_TOKEN }}
        run: |
          bash scripts/qa/stamp_report.sh claim
          spec="$RUNNER_TEMP/stamp-bootstrap-spec-${STAMP_RUN_CASE_ID}.json"
          required=$(node -e 'const fs=require("fs"),v=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(v.required===true?"true":"false")' "$spec")
          echo "bootstrap_required=$required" >> "$GITHUB_OUTPUT"
          echo "STAMP_BOOTSTRAP_REQUIRED=$required" >> "$GITHUB_ENV"

      - name: Expose legacy UI-login credentials
        if: ${{ inputs.stamp_run_case_id == '' || steps.stamp-claim.outputs.bootstrap_required != 'true' }}
        env:
          QA_TEST_EMAIL_SECRET: ${{ secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD_SECRET: ${{ secrets.QA_TEST_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, uuid
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              for name in ("QA_TEST_EMAIL", "QA_TEST_PASSWORD"):
                  value = os.environ[f"{name}_SECRET"]
                  delimiter = f"SLOCK_{uuid.uuid4().hex}"
                  out.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")
          PY

      - name: Preflight — QA account must not see the production server
        # Layer 2 of three, wired here because this is the first point where the QA
        # credentials exist (the step above puts them in the environment) and the last point
        # before anything drives the app. Same `if:` as that step on purpose: without it this
        # would run credential-less on the bootstrap path, exit 2 every time, and quietly
        # become a step that never actually checks anything.
        #
        # rc semantics are deliberate and are the reviewable decision in this PR:
        #   1  judged, and the judgement FAILED  -> block. Production reachable by the QA
        #      account is out of bounds (artin, 2026-08-31); no run should proceed on it.
        #   2  could not be judged at all (429, network, shape change) -> ALSO block.
        #      Ruled by @Argus, overriding the warn-only form I first proposed. rc=2 means the
        #      visibility reading is unavailable, which returns the run to "we believe it but
        #      are not testing it" — the exact state this probe exists to end. Under warn-only,
        #      the probe's infrastructure breaking would silently downgrade the pipeline back
        #      to the pre-probe world while staying green: no reading read as a good reading.
        #      A broken guard has to behave like a broken guard, not like a pass.
        #      Accepted cost, stated: this probe depends on an external surface, so blocking on
        #      rc=2 adds a new flaky-red source. The remedy is fix-or-rerun, never downgrade.
        #      An explicit per-run waiver channel is deliberately NOT pre-built.
        #
        # rc=2 therefore carries a REASON (@HuaTuo, adopted by @Argus). Without one, "fix or
        # rerun" decays into "always rerun" — and the class where a rerun most easily goes green
        # by accident (the endpoint moved, or the probe broke) is exactly the one where a green
        # rerun means nothing. credential -> rerun cannot help. infra -> rerun is reasonable.
        # contract -> a passing rerun does NOT mean fixed. A missing reason is treated as
        # contract, because the unknown case must not default to the cheap one.
        if: ${{ inputs.stamp_run_case_id == '' || steps.stamp-claim.outputs.bootstrap_required != 'true' }}
        env:
          QA_TEST_EMAIL: ${{ env.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ env.QA_TEST_PASSWORD }}
        run: |
          mkdir -p qa-evidence
          set +e
          # 2>&1 so the reason code reaches the receipt: the probe writes `reason=` on
          # STDERR, and `| tee` alone captures only stdout (@LiBai). Without this the grep
          # below found nothing every time, `reason` fell back to unknown, and the
          # credential/ratelimit/infra arms were UNREACHABLE — the reason codes existed in
          # form while every failure reported as contract. PIPESTATUS[0] is still node's.
          node scripts/qa/visible_servers_probe.mjs 2>&1 | tee qa-evidence/visible-servers-probe.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> qa-evidence/visible-servers-probe.txt
          if [ "$rc" = "1" ]; then
            echo "::error::QA account can see the production server - refusing to run"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            reason="$(grep -oE '^reason=[a-z]+' qa-evidence/visible-servers-probe.txt | tail -1 | cut -d= -f2)"
            reason="${reason:-unknown}"
            echo "reason=$reason" >> qa-evidence/visible-servers-probe.txt
            echo "PROBE NOT RUN - this run carries no evidence about production visibility" >> qa-evidence/visible-servers-probe.txt
            case "$reason" in
              credential) echo "::error::visible-servers probe: credentials rejected - rerunning will NOT help, fix the QA credential" ;;
              ratelimit)  echo "::error::visible-servers probe: rate-limited (429) - rerun is right but NOT immediately; an instant retry is what caused this" ;;
              infra)      echo "::error::visible-servers probe: transport failure - a rerun is reasonable" ;;
              contract)   echo "::error::visible-servers probe: endpoint or response contract changed - A PASSING RERUN DOES NOT MEAN FIXED; check the probe against the live endpoint"
                          echo "rerun-does-not-mean-fixed" >> qa-evidence/visible-servers-probe.txt ;;
              *)          echo "::error::visible-servers probe unjudgeable with no reason code (rc=$rc) - treat as contract until diagnosed" ;;
            esac
            exit 1
          fi

      - name: Freeze legacy credential identity receipt
        if: ${{ inputs.stamp_run_case_id != '' && steps.stamp-claim.outputs.bootstrap_required != 'true' }}
        env:
          STAMP_RUN_CASE_ID: ${{ inputs.stamp_run_case_id }}
          STAMP_URL: ${{ secrets.STAMP_URL }}
          STAMP_TOKEN: ${{ secrets.STAMP_TOKEN }}
          QA_TEST_EMAIL: ${{ env.QA_TEST_EMAIL }}
        run: bash scripts/qa/stamp_report.sh credential-receipt

      - name: Prepare iOS driver I/O dir
        run: |
          mkdir -p "$RUNNER_TEMP/qa-loop"
          echo "QA_LOOP_IO_DIR=$RUNNER_TEMP/qa-loop" >> "$GITHUB_ENV"
          echo "QA_LOOP_FIXTURE_PAGE=${{ inputs.fixture_page }}" >> "$GITHUB_ENV"

      - name: Start loop harness (background)
        if: ${{ env.IOS_QA_DRIVER == 'qa-loop' }}
        working-directory: compose/iosApp
        run: |
          # TEST_RUNNER_* env vars are forwarded into the XCUITest runner.
          # ⚠️ The env has to be set HERE, on the xcodebuild that starts the runner.
          # Run 33155331720 failed because I set QA_LOOP_FIXTURE_PAGE on the probe
          # step instead — that step runs AFTER this background harness has already
          # launched the app, so the variable arrived too late and the app came up on
          # the normal login screen. Same process-boundary mistake I had just fixed
          # one layer down (SIMCTL_CHILD_* not reaching the app), made again on the
          # step boundary. TEST_RUNNER_* is the only channel into the XCUITest runner.
          TEST_RUNNER_QA_LOOP_IO_DIR="$RUNNER_TEMP/qa-loop" \
          TEST_RUNNER_QA_LOOP_BUNDLE="$BUNDLE_ID" \
          TEST_RUNNER_QA_LOOP_IDLE_TIMEOUT="300" \
          TEST_RUNNER_QA_LOOP_FIXTURE_PAGE="${{ inputs.fixture_page }}" \
            xcodebuild \
              -workspace iosApp.xcworkspace \
              -scheme iosAppUITests \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=${UDID}" \
              -derivedDataPath build/DerivedData \
              -only-testing:iosAppUITests/QaAcceptanceLoopTests \
              CODE_SIGNING_ALLOWED=NO \
              test-without-building > "$GITHUB_WORKSPACE/xcodebuild-loop.log" 2>&1 &
          echo "loop harness started (pid $!)"

      - name: Run acceptance agent
        if: ${{ inputs.mode == 'agent' || inputs.mode == '' }}
        env:
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          SLOCK_PI_AI_MODULE: ${{ runner.temp }}/m3/node_modules/@earendil-works/pi-ai/dist/providers/all.js
          QA_TEST_EMAIL: ${{ env.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ env.QA_TEST_PASSWORD }}
          QA_GOAL: ${{ inputs.goal || '' }}
          QA_MAX_TURNS: ${{ inputs.max_turns || '40' }}
          QA_MAX_MINUTES: ${{ inputs.max_minutes || '20' }}
          QA_NO_PROGRESS_TURNS: ${{ inputs.no_progress_turns || '8' }}
          STAMP_RUN_CASE_ID: ${{ inputs.stamp_run_case_id || '' }}
          STAMP_URL: ${{ inputs.stamp_run_case_id != '' && secrets.STAMP_URL || '' }}
          STAMP_TOKEN: ${{ inputs.stamp_run_case_id != '' && secrets.STAMP_TOKEN || '' }}
        run: |
          mkdir -p qa-evidence
          cp "$GITHUB_WORKSPACE/build-info-ios.json" qa-evidence/build-info.json 2>/dev/null || true
          # BSD date (macOS) has no %3N — compose ms from seconds instead.
          echo $(( $(date +%s) * 1000 )) > qa-evidence/perf-started.txt
          date -u +"%Y-%m-%d %H:%M:%S" > qa-evidence/run-start.txt
          export MINIMAX_API_KEY="$PI_API_KEY"
          set +e
          node scripts/qa/acceptance_agent.mjs \
            --platform ios --ios-udid "$UDID" --package "$BUNDLE_ID" \
            --goal "${QA_GOAL:-$DEFAULT_GOAL}" --max-turns "$QA_MAX_TURNS" --max-minutes "$QA_MAX_MINUTES" --no-progress-turns "$QA_NO_PROGRESS_TURNS" --out qa-evidence
          echo "$?" > qa-evidence/agent-rc.txt
          echo "agent exit code $(cat qa-evidence/agent-rc.txt)"

      # Deterministic mode: no-model scripted drive for precise crash-repro —
      # the M3 agent keeps getting lost on navigation (permission dialogs,
      # back-gesture exits). Fixed step sequence, auditable; same loop harness
      # and evidence collectors downstream.
      - name: Test deterministic navigation matcher
        if: ${{ inputs.mode == 'deterministic' }}
        run: node --test scripts/qa/ios_navigation_matcher.test.mjs

      # task #232/#233 — TabPager probe. Launches the @Page route DIRECTLY via
      # QA_LOOP_FIXTURE_PAGE (QaAcceptanceLoopTests forwards it into the app's
      # launchEnvironment), so it never touches login and is unaffected by the
      # auth-restore blocker in task #1101.
      - name: Run TabPager probe (task #232/#233)
        if: ${{ inputs.mode == 'tabpager-probe' }}
        run: |
          mkdir -p qa-evidence
          cp "$GITHUB_WORKSPACE/build-info-ios.json" qa-evidence/build-info.json 2>/dev/null || true
          date -u +"%Y-%m-%d %H:%M:%S" > qa-evidence/run-start.txt
          node --check scripts/qa/ios_tabpager_probe.mjs
          # Record the whole sequence. @Jony asked for simctl recordVideo; it runs in
          # the background and is stopped with SIGINT so the .mp4 is finalised —
          # SIGKILL leaves an unplayable file.
          xcrun simctl io "$UDID" recordVideo --codec h264 --force qa-evidence/tabpager-probe.mp4 &
          REC_PID=$!
          echo "recording pid=$REC_PID"
          set +e
          node scripts/qa/ios_tabpager_probe.mjs \
            --ios-io-dir "$QA_LOOP_IO_DIR" --ios-udid "$UDID" --package "$BUNDLE_ID" \
            --out qa-evidence --groups "${{ inputs.probe_groups }}"
          rc=$?
          set -e
          sleep 2
          kill -INT "$REC_PID" 2>/dev/null || true
          wait "$REC_PID" 2>/dev/null || true
          ls -la qa-evidence/tabpager-probe.mp4 2>/dev/null || echo "::warning::no video file produced"
          echo "$rc" > qa-evidence/agent-rc.txt
          echo "tabpager probe exit code $rc"

      - name: Run deterministic repro
        if: ${{ inputs.mode == 'deterministic' }}
        env:
          QA_TEST_EMAIL: ${{ env.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ env.QA_TEST_PASSWORD }}
        run: |
          mkdir -p qa-evidence
          cp "$GITHUB_WORKSPACE/build-info-ios.json" qa-evidence/build-info.json 2>/dev/null || true
          echo $(( $(date +%s) * 1000 )) > qa-evidence/perf-started.txt
          date -u +"%Y-%m-%d %H:%M:%S" > qa-evidence/run-start.txt
          set +e
          node scripts/qa/ios_deterministic_repro.mjs \
            --ios-io-dir "$QA_LOOP_IO_DIR" --ios-udid "$UDID" --package "$BUNDLE_ID" --out qa-evidence
          echo "$?" > qa-evidence/agent-rc.txt
          echo "deterministic repro exit code $(cat qa-evidence/agent-rc.txt)"

      - name: Collect harness log + system log + crashes + xcresult
        if: always()
        run: |
          cp xcodebuild-loop.log qa-evidence/xcodebuild-loop.log 2>/dev/null || true
          tail -50 xcodebuild-loop.log 2>/dev/null || true
          # iOS evidence parity with Android (logcat + activity-top) — collected
          # EVERY run, not just failures. Lets termination cases (e.g. case-06
          # feedback submit) be judged product-crash vs sim-lifecycle from the
          # .ips instead of guessing from a SpringBoard screenshot.
          UDID="${UDID:-booted}"
          # 1) System log (the logcat twin): last 12m of the sim's unified log,
          #    kept to app + termination-relevant lines so the artifact stays
          #    bounded. grep-filtered rather than a `process ==` predicate because
          #    the Kuikly app's process name is its executable ("iosApp"), not
          #    "Raft"; the daemon lines (SpringBoard/launchd/assertiond/jetsam)
          #    carry the reason when the app is terminated.
          xcrun simctl spawn "$UDID" log show --last 12m --style syslog 2>/dev/null \
            | grep -iE 'raft|iosApp|SpringBoard|launchd|assertiond|runningboardd|jetsam|crash|terminat|signal|exception|watchdog' \
            | tail -4000 > qa-evidence/system-log-raft.txt || true
          # Stamp's product-judgment log is app-scoped. Keep the broader
          # lifecycle log above in the workflow artifact, but upload only the
          # iosApp process lane as `logcat` and bind it to PID(s) observed in
          # THIS run's already-process-filtered NDJSON. Do not use a post-run
          # launchctl snapshot: a product agent may legitimately exit before
          # evidence collection, while its unified-log rows remain authoritative.
          xcrun simctl spawn "$UDID" log show --start "$(cat qa-evidence/run-start.txt)" --style ndjson --predicate 'process == "iosApp"' \
            2>/dev/null | tail -4000 > qa-evidence/logcat-iosApp.txt || true
          set +e
          node scripts/qa/derive_ios_log_pids.mjs \
            --input qa-evidence/logcat-iosApp.txt --output qa-evidence/app-pids.txt \
            --started-at "$(cat qa-evidence/run-start.txt)"
          ios_pid_rc=$?
          node scripts/qa/scope_logcat.mjs \
            --input qa-evidence/logcat-iosApp.txt --output qa-evidence/logcat.txt \
            --verdict qa-evidence/verdict.json --pids qa-evidence/app-pids.txt \
            --package "${BUNDLE_ID:-build.raft.app}" --generation "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --format ios-ndjson --started-at "$(cat qa-evidence/run-start.txt)"
          ios_scope_rc=$?
          set -e
          printf 'pid_derivation_rc=%s\nlog_scope_rc=%s\n' "$ios_pid_rc" "$ios_scope_rc" > qa-evidence/ios-log-scope-status.txt
          # 2) Crash reports (.ips): simulator app crashes land in the SIMULATOR's
          #    own data dir, NOT the host ~/Library/Logs/DiagnosticReports (which is
          #    empty for sim app crashes — the old `cp host/*.ips || true` silently
          #    captured nothing, losing attribution on `crashed in <external symbol>`
          #    terminations). Harvest per-UDID CrashReporter/DiagnosticReports for
          #    reports NEWER than the boot marker, keep only those naming our process
          #    /bundle, and record identity (path + sha256). Never silent: log the
          #    searched roots and count even when zero.
          mkdir -p qa-evidence/crashes
          marker="$GITHUB_WORKSPACE/qa-ips-marker"
          simlogs="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Logs"
          {
            echo "udid=$UDID"
            echo "marker=$([ -e "$marker" ] && stat -f '%Sm' -t '%Y-%m-%dT%H:%M:%SZ' "$marker" 2>/dev/null || echo MISSING)"
          } > qa-evidence/crashes/ips-manifest.txt
          ips_found=0
          for root in "$simlogs/CrashReporter" "$simlogs/DiagnosticReports"; do
            exists=absent; [ -d "$root" ] && exists=exists
            echo "searched_root=$root ($exists)" >> qa-evidence/crashes/ips-manifest.txt
            [ -d "$root" ] || continue
            while IFS= read -r ips; do
              [ -n "$ips" ] || continue
              if grep -qE 'iosApp|build\.raft\.app' "$ips" 2>/dev/null; then
                sha=$(shasum -a 256 "$ips" 2>/dev/null | awk '{print $1}')
                cp "$ips" "qa-evidence/crashes/$(basename "$ips")" 2>/dev/null
                echo "captured=$(basename "$ips") path=$ips sha256=$sha" >> qa-evidence/crashes/ips-manifest.txt
                ips_found=$((ips_found+1))
              fi
            done < <(find "$root" -name '*.ips' -newer "$marker" 2>/dev/null)
          done
          echo "attributed_ips_count=$ips_found" >> qa-evidence/crashes/ips-manifest.txt
          echo "attributed .ips captured: $ips_found (see qa-evidence/crashes/ips-manifest.txt)"
          # 3) The XCUITest .xcresult bundle (definitive per-run test result).
          find compose/iosApp/build/DerivedData/Logs/Test -maxdepth 1 -name '*.xcresult' \
            -exec cp -R {} qa-evidence/ \; 2>/dev/null || true
          echo "iOS evidence: system-log-raft.txt=$(wc -l < qa-evidence/system-log-raft.txt 2>/dev/null || echo 0) lines, crashes=$(ls qa-evidence/crashes 2>/dev/null | wc -l | tr -d ' ') .ips, xcresult=$(ls -d qa-evidence/*.xcresult 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$ios_pid_rc" -ne 0 ] || [ "$ios_scope_rc" -ne 0 ]; then
            echo "iOS execution-scope collection failed closed (pid_rc=$ios_pid_rc scope_rc=$ios_scope_rc)" >&2
            exit 1
          fi

      # task #14 iOS v1: self-describing perf.json every run (record-only,
      # advisory). Step timing windows + system-log lifecycle signals; the
      # app-level frame-metric gap (RaftPerformanceDiagnostics is Android-only)
      # is recorded explicitly in the file's known_gap field.
      - name: Collect perf summary
        if: always()
        run: |
          UDID="${UDID:-booted}"
          # sw_vers does not exist INSIDE an iOS simulator — read the runtime
          # version from the host-side device record instead (e.g. iOS-17-5 → 17.5).
          IOS_VER="$(xcrun simctl list devices -j 2>/dev/null | python3 -c "import json,sys,os; d=json.load(sys.stdin)['devices']; rt=next((k for k,devs in d.items() for dev in devs if dev['udid']==os.environ.get('UDID','')), ''); import re; m=re.search(r'iOS-([0-9-]+)', rt); print(m.group(1).replace('-','.') if m else 'unknown')" || echo unknown)"
          node scripts/qa/collect_perf_ios.mjs \
            --slog qa-evidence/system-log-raft.txt \
            --steps qa-evidence/steps.jsonl \
            --bundle "${BUNDLE_ID:-build.raft.app}" \
            --device-json "{\"model\":\"${SIM_DEVICE:-iPhone 14}\",\"os\":\"${IOS_VER}\"}" \
            --environment "${{ inputs.environment }}" \
            --started "$(cat qa-evidence/perf-started.txt 2>/dev/null || echo 0)" \
            --out qa-evidence/perf.json || true

      - name: Report to Stamp
        if: always()
        env:
          STAMP_RUN_CASE_ID: ${{ inputs.stamp_run_case_id || '' }}
          STAMP_URL: ${{ secrets.STAMP_URL }}
          STAMP_TOKEN: ${{ secrets.STAMP_TOKEN }}
          QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
        run: bash scripts/qa/stamp_report.sh report qa-evidence

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-acceptance-ios-evidence
          path: qa-evidence
          if-no-files-found: warn

      - name: Report verdict
        if: always()
        run: |
          rc="$(cat qa-evidence/agent-rc.txt 2>/dev/null || echo 2)"
          echo "## QA Acceptance verdict (iOS)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f qa-evidence/verdict.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat qa-evidence/verdict.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no verdict.json produced (agent rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Evidence: qa-acceptance-ios-evidence artifact (per-step screenshots + steps.jsonl + xcodebuild-loop.log + system-log-raft.txt + crashes/*.ips + *.xcresult)." >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Close claimed Stamp attempt after workflow failure
        if: ${{ failure() && inputs.stamp_run_case_id != '' }}
        env:
          STAMP_RUN_CASE_ID: ${{ inputs.stamp_run_case_id }}
          STAMP_URL: ${{ secrets.STAMP_URL }}
          STAMP_TOKEN: ${{ secrets.STAMP_TOKEN }}
          STAMP_POSTCLAIM_ERROR_PHASE: ios_workflow
          STAMP_POSTCLAIM_ERROR_REASON: iOS workflow failed after Stamp dispatch or claim
        run: bash scripts/qa/stamp_report.sh workflow-error qa-evidence

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics
