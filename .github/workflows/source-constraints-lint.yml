name: Source constraints lint

# Incident-born static constraints as an explicit gate (test-discipline
# announcement, #all 2026-07-25). check_source_constraints.py now holds the
# 1.15.0 conditional-interaction-state crash guard, the task #82 native
# Sign in with Apple contract and the #3823 no-production-runBlocking gate; the other steps below
# are string edge spaces and no-production-visual-pages.
# Behavior stays proven by behavior tests; this only blocks silent structural
# regressions a refactor could reintroduce.

on:
  pull_request:
    paths:
      # check_no_conditional_interaction_state scans every .kt under these roots.
      - "compose/designsystem/src/commonMain/kotlin/**/*.kt"
      - "compose/shared/src/commonMain/kotlin/**/*.kt"
      # Same glob as check_string_edge_spaces.py: a fourth locale must trigger
      # this job on its own PR, not only after it lands (LiBai, #2327 review).
      - "compose/shared-data/src/commonMain/composeResources/values*/strings.xml"
      - "scripts/ci/check_source_constraints.py"
      - "scripts/ci/check_jvm_method_size.py"
      # check_no_production_run_blocking (#3823) scans every non-test Kotlin source set.
      - "compose/**/src/**/*.kt"
      # check_native_apple_authentication_services (task #82) reads these iOS files.
      - "compose/iosApp/iosApp/RaftIosMobileOAuthHost.swift"
      # check_no_strong_invocation_object_return (1.17.1 crash) scans the Objective-C sources.
      - "compose/iosApp/**/*.m"
      - "compose/iosApp/**/*.mm"
      - "compose/iosApp/iosApp/iosApp.entitlements"
      - "compose/iosApp/iosApp.xcodeproj/project.pbxproj"
      - "scripts/ci/check_string_edge_spaces.py"
      - "scripts/ci/verify_no_production_visual_pages.py"
      # verify_no_production_visual_pages.py also scans the platform production
      # source sets and checks the generated CMP page registries, which are built
      # from the visual fixture source sets.
      - "compose/shared/src/androidMain/kotlin/**/*.kt"
      - "compose/shared/src/iosMain/kotlin/**/*.kt"
      - "compose/shared/src/visualFixtures/**"
      - "compose/shared/src/visualFixtureData/**"
      - "compose/shared/src/visualFixturesOff/**"
      - "compose/androidApp/src/main/java/**/*.kt"
      - "scripts/cmp_generate_page_registry.py"
      # check_visual_pairs.py reads the capture test (compose/**/src/**/*.kt above) and its list.
      - "scripts/ci/check_visual_pairs.py"
      - "scripts/ci/visual_paired_cases.txt"
      - "scripts/visual_android_case_filter.py"
      # check_component_sizes.py reads the component tokens (#proj-mobile:#318).
      - "scripts/ci/check_component_sizes.py"
      - "tools/design-tokens/manifest.json"
      - "tools/design-tokens/source/**"
      # check_raw_clickables.py: clickable UI in compose/shared goes through raftClickable / DS (#wg-mobile-sync:#268).
      - "scripts/ci/check_raw_clickables.py"
      - "scripts/ci/raw_clickables_baseline.txt"
      # objc_entry_points.py --check: the iOS framework's Objective-C export list must name every
      # Kotlin API the Swift/Objective-C app uses (Kotlin sources are covered by compose/**/src above).
      - "compose/iosApp/**/*.swift"
      - "compose/shared/objc-entry-points.txt"
      - "scripts/ios/objc_entry_points.py"
      - ".github/workflows/source-constraints-lint.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  constraints:
    name: Incident constraints invariant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-test checker
        run: python3 scripts/ci/check_source_constraints.py --self-test

      - name: Enforce constraints
        run: python3 scripts/ci/check_source_constraints.py

      # The class-file reader behind test.yml's ":shared JVM method sizes" gate (#4802).
      - name: Self-test JVM method size checker
        run: python3 scripts/ci/check_jvm_method_size.py --self-test

      # task #536 (S8): aapt trims unquoted edge whitespace in <string>, so
      # `prefix + bold(name) + suffix` rendered "deleteVisual Serverand" on
      # Android while iOS kept the spaces. Resources must use &#160; at edges.
      - name: Self-test string edge-space check
        run: python3 scripts/ci/check_string_edge_spaces.py --self-test

      - name: Enforce string edge-space check
        run: python3 scripts/ci/check_string_edge_spaces.py

      # task #194: verifyNoProductionVisualPages as a required CI gate.
      - name: Self-test verify no production visual pages
        run: python3 scripts/ci/verify_no_production_visual_pages.py --self-test

      - name: Enforce no production visual pages
        run: python3 scripts/ci/verify_no_production_visual_pages.py

      # Every case the web captures for comparison has its Android capture (#proj-mobile:#280).
      - name: Self-test visual pairs check
        run: python3 scripts/ci/check_visual_pairs.py --self-test

      - name: Enforce visual pairs
        run: python3 scripts/ci/check_visual_pairs.py

      # Token-owned sizes read the component tokens, not numbers (#proj-mobile:#318; the same
      # rules as raft-ui's size-tokens check, raft-design #1393).
      - name: Self-test component size check
        run: python3 scripts/ci/check_component_sizes.py --self-test

      - name: Enforce component sizes
        run: python3 scripts/ci/check_component_sizes.py

      # Hover and press by default: clickable UI in compose/shared uses Modifier.raftClickable or a DS
      # component, not a raw clickable / combinedClickable / detectTapGestures, unless marked
      # `// raw-click: <reason>`; older sites are counted in raw_clickables_baseline.txt (#wg-mobile-sync:#268).
      - name: Self-test raw clickable check
        run: python3 scripts/ci/check_raw_clickables.py --self-test

      - name: Enforce raw clickable check
        run: python3 scripts/ci/check_raw_clickables.py

      # compose/shared/build.gradle.kts exports to Objective-C only what this list names
      # (objcExportEntryPointsPath, #wg-mobile-sync:#220). A Swift change that starts using new Kotlin
      # API, or a Kotlin change to a listed type, must regenerate it; this fails in seconds instead of
      # at the end of an iOS compile.
      - name: iOS Objective-C entry points are current
        run: python3 scripts/ios/objc_entry_points.py --check
