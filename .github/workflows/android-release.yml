name: Android Release

# Per owner 2026-07-03 16:39: versionX / Y / Z / build are dispatch inputs,
# not hardcoded. Default fallbacks preserve "today" if you want a smoke run.
# This workflow is intentionally draft-first. It may build and upload a Hands
# draft, but it must never activate a release or create the release tag; those
# happen only after the release owner approves reviewed notes and smoke results.

on:
  workflow_dispatch:
    inputs:
      version_major:
        description: "versionName major (X)"
        required: true
        type: string
        default: "1"
      version_minor:
        description: "versionName minor (Y)"
        required: true
        type: string
        default: "0"
      version_patch:
        description: "versionName patch (Z)"
        required: true
        type: string
        default: "0"
      version_build:
        description: "versionCode build (x*1_000_000 + y*10_000 + z*100 + build)"
        required: true
        type: string
        default: "0"
      version_suffix:
        description: "versionName suffix (e.g. rc1); leave empty for release"
        required: false
        type: string
        default: ""
      quiver_channel:
        description: "Hands channel: main | preview | nightly | debug"
        required: true
        type: choice
        default: "main"
        options:
          - main
          - preview
          - nightly
          - debug
      android_variant:
        description: "Gradle variant: release (default) | debug"
        required: true
        type: choice
        default: "release"
        options:
          - release
          - debug
      release_mode:
        description: "Draft only. Review notes and smoke before the separate explicit Hands publish step."
        required: true
        type: choice
        default: "draft"
        options:
          - draft
      publish_quiver:
        description: "If true, upload the signed APK + metadata as a Hands draft and create a share page"
        required: true
        type: boolean
        default: false
      create_share_page:
        description: "If true (and publish_quiver=true), create a /share/<token> page for the release"
        required: true
        type: boolean
        default: true
      share_ttl_seconds:
        description: "Optional share page TTL in seconds. Empty (default) = the share never expires."
        required: false
        type: string
        default: ""

env:
  # The lane's android-release docs require these envs:
  #   docs/android-release-lane-pi-perfprofiler.md
  #   docs/android-quiver-release-practices-2026-07-02.md
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
  GRADLE_MAX_WORKERS: "1"

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    name: Resolve release parameters
    runs-on: blacksmith-4vcpu-ubuntu-2204
    outputs:
      version_major: ${{ steps.p.outputs.version_major }}
      version_minor: ${{ steps.p.outputs.version_minor }}
      version_patch: ${{ steps.p.outputs.version_patch }}
      version_build: ${{ steps.p.outputs.version_build }}
      version_suffix: ${{ steps.p.outputs.version_suffix }}
      version_name: ${{ steps.p.outputs.version_name }}
      quiver_channel: ${{ steps.p.outputs.quiver_channel }}
      android_variant: ${{ steps.p.outputs.android_variant }}
      release_mode: ${{ steps.p.outputs.release_mode }}
      publish_quiver: ${{ steps.p.outputs.publish_quiver }}
      create_share_page: ${{ steps.p.outputs.create_share_page }}
      share_ttl_seconds: ${{ steps.p.outputs.share_ttl_seconds }}
    steps:
      - id: p
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="${{ inputs.version_major }}.${{ inputs.version_minor }}.${{ inputs.version_patch }}"
          [ -n "${{ inputs.version_suffix }}" ] && VERSION_NAME="${VERSION_NAME}-${{ inputs.version_suffix }}"
          {
            echo "version_major=${{ inputs.version_major }}"
            echo "version_minor=${{ inputs.version_minor }}"
            echo "version_patch=${{ inputs.version_patch }}"
            echo "version_build=${{ inputs.version_build }}"
            echo "version_suffix=${{ inputs.version_suffix }}"
            echo "version_name=${VERSION_NAME}"
            echo "quiver_channel=${{ inputs.quiver_channel }}"
            echo "android_variant=${{ inputs.android_variant }}"
            echo "release_mode=draft"
            echo "publish_quiver=${{ inputs.publish_quiver }}"
            echo "create_share_page=${{ inputs.create_share_page }}"
            echo "share_ttl_seconds=${{ inputs.share_ttl_seconds }}"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build_android_release:
    name: Build + sign APK
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs: resolve
    timeout-minutes: 30
    outputs:
      apk_path: ${{ steps.locate.outputs.apk_path }}
      apk_sha256: ${{ steps.verify.outputs.sha256 }}
      apk_size: ${{ steps.verify.outputs.size }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      version_name: ${{ steps.resolve.outputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials (for KuiklyBase)
        # The release helper's githubPackagesCredentials() reads
        # githubPackagesUsername / githubPackagesToken from
        # compose/github-packages.properties (untracked, .gitignore'd).
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${{ secrets.SLOCK_GITHUB_PACKAGES_USERNAME }}"
            echo "githubPackagesToken=${{ secrets.SLOCK_GITHUB_PACKAGES_TOKEN }}"
          } > compose/github-packages.properties

      - name: Publish Kuikly fork artifacts
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui
          scripts/build_kuikly_fork.sh --android-only

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          MAJOR="${{ needs.resolve.outputs.version_major }}"
          MINOR="${{ needs.resolve.outputs.version_minor }}"
          PATCH="${{ needs.resolve.outputs.version_patch }}"
          BUILD="${{ needs.resolve.outputs.version_build }}"
          SUFFIX="${{ needs.resolve.outputs.version_suffix }}"
          # versionCode = X*1_000_000 + Y*10_000 + Z*100 + build (per
          # docs/android-quiver-release-practices-2026-07-02.md)
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + BUILD))
          if [ -n "$SUFFIX" ]; then
            VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}-${SUFFIX}"
          else
            VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Gradle build (assembleRelease / assembleDebug)
        working-directory: compose
        env:
          SLOCK_QUIVER_CHANNEL: ${{ needs.resolve.outputs.quiver_channel }}
        shell: bash
        run: |
          GRADLE_ARGS=(
            :shared:generateSqlDelightInterface
            :androidApp:assemble${{ needs.resolve.outputs.android_variant == 'debug' && 'Debug' || 'Release' }}
            :androidApp:copyHandsNativeSymbols
            "-PversionX=${{ needs.resolve.outputs.version_major }}"
            "-PversionY=${{ needs.resolve.outputs.version_minor }}"
            "-PversionZ=${{ needs.resolve.outputs.version_patch }}"
            "-PversionBuild=${{ needs.resolve.outputs.version_build }}"
          )
          if [ -n "${{ needs.resolve.outputs.version_suffix }}" ]; then
            GRADLE_ARGS+=("-PversionSuffix=${{ needs.resolve.outputs.version_suffix }}")
          fi
          ./gradlew \
            "${GRADLE_ARGS[@]}" \
            --no-daemon --max-workers=${{ env.GRADLE_MAX_WORKERS }} --console=plain

      - name: Determine APK path
        id: locate
        shell: bash
        run: |
          APK_DIR="compose/androidApp/build/outputs/apk/${{ needs.resolve.outputs.android_variant }}"
          APK="$(find "${APK_DIR}" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${APK}" ]; then
            echo "No APK found under ${APK_DIR}" >&2
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify NetworkKMM curl runtime and pinned CA
        shell: bash
        run: |
          compose/androidApp/src/test/scripts/check_networkkmm_curl_runtime_package.sh \
            "${{ steps.locate.outputs.apk_path }}"

      - name: Sign + align APK
        # Lane-canonical approach: zipalign + apksigner (the release helper
        # scripts/publish_android_quiver_release.sh does not sign; that's a
        # known gap for KMP's helper follow-up).
        env:
          LEGACY_KEYSTORE_FILE_B64: ${{ secrets.SLOCK_KEYSTORE_FILE_BASE64 }}
          SLOCK_LEGACY_KEYSTORE_PASS: ${{ secrets.SLOCK_KEYSTORE_PASS }}
          SLOCK_LEGACY_KEY_ALIAS: ${{ secrets.SLOCK_KEY_ALIAS }}
          SLOCK_LEGACY_KEY_PASS: ${{ secrets.SLOCK_KEY_PASS }}
          ROTATED_KEYSTORE_FILE_B64: ${{ secrets.SLOCK_ROTATED_KEYSTORE_FILE_BASE64 }}
          SLOCK_ROTATED_KEYSTORE_PASS: ${{ secrets.SLOCK_ROTATED_KEYSTORE_PASS }}
          SLOCK_ROTATED_KEY_ALIAS: ${{ secrets.SLOCK_ROTATED_KEY_ALIAS }}
          SLOCK_ROTATED_KEY_PASS: ${{ secrets.SLOCK_ROTATED_KEY_PASS }}
          SIGNING_LINEAGE_B64: ${{ secrets.SLOCK_SIGNING_LINEAGE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            LEGACY_KEYSTORE_FILE_B64 \
            SLOCK_LEGACY_KEYSTORE_PASS \
            SLOCK_LEGACY_KEY_ALIAS \
            SLOCK_LEGACY_KEY_PASS \
            ROTATED_KEYSTORE_FILE_B64 \
            SLOCK_ROTATED_KEYSTORE_PASS \
            SLOCK_ROTATED_KEY_ALIAS \
            SLOCK_ROTATED_KEY_PASS \
            SIGNING_LINEAGE_B64; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required rotated release signing secret: ${name}" >&2
              exit 1
            fi
          done
          SLOCK_LEGACY_KEYSTORE_FILE="$(mktemp -t raft-release-legacy-keystore-XXXXXX.jks)"
          SLOCK_ROTATED_KEYSTORE_FILE="$(mktemp -t raft-release-rotated-keystore-XXXXXX.jks)"
          SLOCK_SIGNING_LINEAGE_FILE="$(mktemp -t raft-release-signing-lineage-XXXXXX.bin)"
          export SLOCK_LEGACY_KEYSTORE_FILE SLOCK_ROTATED_KEYSTORE_FILE SLOCK_SIGNING_LINEAGE_FILE
          echo "${LEGACY_KEYSTORE_FILE_B64}" | base64 -d > "${SLOCK_LEGACY_KEYSTORE_FILE}"
          echo "${ROTATED_KEYSTORE_FILE_B64}" | base64 -d > "${SLOCK_ROTATED_KEYSTORE_FILE}"
          echo "${SIGNING_LINEAGE_B64}" | base64 -d > "${SLOCK_SIGNING_LINEAGE_FILE}"
          BT="${ANDROID_HOME}/build-tools/36.0.0"
          UNSIGNED="${{ steps.locate.outputs.apk_path }}"
          SIGNED="/tmp/androidApp-${{ needs.resolve.outputs.android_variant }}-signed.apk"
          cleanup() {
            rm -f \
              "${SLOCK_LEGACY_KEYSTORE_FILE}" \
              "${SLOCK_ROTATED_KEYSTORE_FILE}" \
              "${SLOCK_SIGNING_LINEAGE_FILE}" \
              "${SIGNED}"
          }
          trap cleanup EXIT
          scripts/sign_android_apk_with_rotation.sh \
            --input "${UNSIGNED}" \
            --output "${SIGNED}" \
            --build-tools-dir "${BT}" \
            --verify-log apksigner-rotation-verify.log
          # Replace the unsigned APK in the build outputs directory so the
          # downstream job can pick it up via the apk_path output.
          cp "${SIGNED}" "${UNSIGNED}"

      - name: Verify exact Hands native symbols
        id: native-symbols
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find compose/androidApp/build/outputs/hands-native-symbols -maxdepth 1 -type f -name '*-native-symbols.zip' | sort | head -n 1)"
          if [ -z "${ARCHIVE}" ]; then
            echo "Hands native symbols classifier was not resolved" >&2
            exit 1
          fi
          scripts/verify_android_native_symbols.sh \
            --apk "${{ steps.locate.outputs.apk_path }}" \
            --symbols "${ARCHIVE}"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/36.0.0"
          APK="${{ steps.locate.outputs.apk_path }}"
          "${BT}/zipalign" -c -p 4 "${APK}"
          "${BT}/apksigner" verify --verbose --print-certs "${APK}" 2>&1 | tee apksigner-verify.log
          "${BT}/aapt" dump badging "${APK}" 2>&1 | tee aapt-badging.log
          echo "apk_path=${APK}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${APK}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "${APK}" 2>/dev/null || stat -f %z "${APK}")" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping as workflow artifact
        # Enables server-side crash deobfuscation: the publish job attaches
        # this as a proguard-mapping build asset.
        uses: actions/upload-artifact@v4
        with:
          name: android-release-mapping
          path: compose/androidApp/build/outputs/mapping/${{ needs.resolve.outputs.android_variant }}/mapping.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload exact native symbols as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-native-symbols
          path: ${{ steps.native-symbols.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

      - name: Step summary
        if: always()
        run: |
          {
            echo "### Android release build summary"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **versionCode** | \`${{ steps.resolve.outputs.version_code }}\` |"
            echo "| **versionName** | \`${{ steps.resolve.outputs.version_name }}\` |"
            echo "| **APK** | \`${{ steps.locate.outputs.apk_path }}\` |"
            echo "| **size (bytes)** | \`${{ steps.verify.outputs.size }}\` |"
            echo "| **sha256** | \`${{ steps.verify.outputs.sha256 }}\` |"
            echo "| **Hands channel target** | \`${{ needs.resolve.outputs.quiver_channel }}\` |"
            echo "| **Publish to Hands** | \`${{ needs.resolve.outputs.publish_quiver }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish_quiver:
    name: Publish to Hands + create share page
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 15
    needs: [resolve, build_android_release]
    if: |
      github.event_name == 'workflow_dispatch' && needs.resolve.outputs.publish_quiver == 'true'
    environment:
      name: production
      # Optional: enforce manual approval for `production` env in repo settings.
    env:
      QUIVER_APP_SLUG: raft-android
      QUIVER_BEARER_TOKEN: ${{ secrets.QUIVER_BEARER_TOKEN }}
      QUIVER_AUTH_TOKEN: ${{ secrets.QUIVER_BEARER_TOKEN }}
      HANDS_APP_SLUG: raft-android
      HANDS_BEARER_TOKEN: ${{ secrets.QUIVER_BEARER_TOKEN }}
      HANDS_AUTH_TOKEN: ${{ secrets.QUIVER_BEARER_TOKEN }}
      HANDS_API: https://hands.build
      # Mirror the chosen channel into both env names so the helper picks
      # it up AND any direct Hands API calls (which use the legacy variable) stay
      # consistent.
      SLOCK_QUIVER_CHANNEL: ${{ needs.resolve.outputs.quiver_channel }}
      QUIVER_CHANNEL: ${{ needs.resolve.outputs.quiver_channel }}
      SLOCK_ANDROID_VARIANT: ${{ needs.resolve.outputs.android_variant }}
      SLOCK_ANDROID_VERSION_MAJOR: ${{ needs.resolve.outputs.version_major }}
      SLOCK_ANDROID_VERSION_MINOR: ${{ needs.resolve.outputs.version_minor }}
      SLOCK_ANDROID_VERSION_PATCH: ${{ needs.resolve.outputs.version_patch }}
      SLOCK_ANDROID_VERSION_BUILD: ${{ needs.resolve.outputs.version_build }}
      SLOCK_ANDROID_VERSION_SUFFIX: ${{ needs.resolve.outputs.version_suffix }}
      SLOCK_SKIP_GRADLE_BUILD: "1"
      SLOCK_QUIVER_DRAFT: "1"
      SLOCK_COLLECT_ANDROID_SYMBOLS: "1"
      SLOCK_REQUIRE_ANDROID_SYMBOLS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: dist/

      - name: Download R8 mapping (optional)
        # Restored to the exact path the publish helper probes; absent for
        # variants without minification.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android-release-mapping
          path: compose/androidApp/build/outputs/mapping/${{ needs.resolve.outputs.android_variant }}/

      - name: Download exact native symbols
        uses: actions/download-artifact@v4
        with:
          name: android-release-native-symbols
          path: dist/native-symbols/

      - name: Install Hands CLI (npm)
        shell: bash
        run: |
          npm install -g @botiverse/hands-cli@0.5.4
          hands --version

      - name: Generate changelog from git history
        id: generate-changelog
        shell: bash
        run: |
          set -euo pipefail
          # Range: previous build's provenance source_commit (authenticated
          # builds API) .. HEAD. Falls back to the last 15 subjects when the
          # previous commit is unknown or unreachable.
          QUIVER_API_BASE="${HANDS_API:-https://hands.build}"
          APP_ID="$(curl -fsS -H "Authorization: Bearer ${QUIVER_BEARER_TOKEN}" \
            "${QUIVER_API_BASE}/api/apps" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((a['id'] for a in d.get('apps',[]) if a.get('slug')=='${QUIVER_APP_SLUG}'), ''))" \
            2>/dev/null || true)"
          PREV_COMMIT=""
          if [ -n "${APP_ID}" ]; then
            PREV_COMMIT="$(curl -fsS -H "Authorization: Bearer ${QUIVER_BEARER_TOKEN}" \
              "${QUIVER_API_BASE}/api/apps/${APP_ID}/builds" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); bs=d.get('builds') or []; p=(bs[0].get('provenance_json') if bs else None); p=json.loads(p) if isinstance(p,str) else (p or {}); print(p.get('source_commit') or '')" \
              2>/dev/null || true)"
          fi
          echo "previous release commit: '${PREV_COMMIT:-none}'"
          if [ -n "${PREV_COMMIT}" ] && git cat-file -e "${PREV_COMMIT}^{commit}" 2>/dev/null; then
            git log --no-merges --pretty='- %s' --max-count=40 "${PREV_COMMIT}..HEAD" > changelog.txt
          fi
          if [ ! -s changelog.txt ]; then
            git log --no-merges --pretty='- %s' -15 > changelog.txt
          fi
          echo "---- changelog ----"
          cat changelog.txt

      - name: Build metadata + publish APK + (optional) mapping/symbols
        id: publish-quiver-release
        shell: bash
        env:
          SLOCK_RELEASE_CHANGELOG_FILE: ${{ github.workspace }}/changelog.txt
          SLOCK_RELEASE_CHANGELOG_PLATFORM_DIR: ${{ github.workspace }}/change-logs/${{ needs.resolve.outputs.version_name }}/android
          SLOCK_RELEASE_CHANGELOG_LEGACY_DIR: ${{ github.workspace }}/change-logs/${{ needs.resolve.outputs.version_name }}
        run: |
          set -euo pipefail
          if [ -s "${SLOCK_RELEASE_CHANGELOG_PLATFORM_DIR}/zh-CN.md" ] && [ -s "${SLOCK_RELEASE_CHANGELOG_PLATFORM_DIR}/en.md" ]; then
            export SLOCK_RELEASE_CHANGELOG_ZH_FILE="${SLOCK_RELEASE_CHANGELOG_PLATFORM_DIR}/zh-CN.md"
            export SLOCK_RELEASE_CHANGELOG_EN_FILE="${SLOCK_RELEASE_CHANGELOG_PLATFORM_DIR}/en.md"
            echo "Using reviewed Android changelog from change-logs/${{ needs.resolve.outputs.version_name }}/android/"
          elif [ -s "${SLOCK_RELEASE_CHANGELOG_LEGACY_DIR}/zh-CN.md" ] && [ -s "${SLOCK_RELEASE_CHANGELOG_LEGACY_DIR}/en.md" ]; then
            export SLOCK_RELEASE_CHANGELOG_ZH_FILE="${SLOCK_RELEASE_CHANGELOG_LEGACY_DIR}/zh-CN.md"
            export SLOCK_RELEASE_CHANGELOG_EN_FILE="${SLOCK_RELEASE_CHANGELOG_LEGACY_DIR}/en.md"
            echo "Using legacy reviewed changelog from change-logs/${{ needs.resolve.outputs.version_name }}/"
          else
            unset SLOCK_RELEASE_CHANGELOG_ZH_FILE SLOCK_RELEASE_CHANGELOG_EN_FILE
            echo "Reviewed Android changelog not found; falling back to generated git history."
          fi
          # The release helper handles metadata.json generation, channel
          # routing, and Hands CLI invocation. Build + sign were already
          # done in build_android_release; --skip-gradle-build reuses the
          # signed APK on disk.
          APK="$(find dist -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${APK}" ]; then
            echo "No downloaded APK found under dist/" >&2
            exit 1
          fi
          mkdir -p compose/androidApp/build/outputs/apk/${{ needs.resolve.outputs.android_variant }}
          cp "${APK}" "compose/androidApp/build/outputs/apk/${{ needs.resolve.outputs.android_variant }}/androidApp-${{ needs.resolve.outputs.android_variant }}.apk"
          SYMBOLS="$(find dist/native-symbols -maxdepth 1 -type f -name '*-native-symbols.zip' | sort | head -n 1)"
          if [ -z "${SYMBOLS}" ]; then
            echo "No downloaded native symbol archive found" >&2
            exit 1
          fi
          export SLOCK_ANDROID_SYMBOL_ARCHIVE="${SYMBOLS}"
          ls -la compose/androidApp/build/outputs/apk/${{ needs.resolve.outputs.android_variant }}/
          # Helper does the rest (build-metadata, build, asset, release, sign
          # skipped because APK is already on disk; depends on KMP follow-up
          # to integrate sign step into the helper itself).
          ./scripts/publish_android_quiver_release.sh | tee quiver-publish.log
          RELEASE_ID="$(awk '/^[[:space:]]*release:/ {print $2}' quiver-publish.log | tail -n 1)"
          if [ -z "${RELEASE_ID}" ]; then
            echo "Could not parse release id from Hands publish output" >&2
            exit 1
          fi
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Create share page
        id: create-share-page
        if: needs.resolve.outputs.create_share_page == 'true'
        env:
          SLOCK_QUIVER_CHANNEL: ${{ needs.resolve.outputs.quiver_channel }}
          QUIVER_CHANNEL: ${{ needs.resolve.outputs.quiver_channel }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="${{ steps.publish-quiver-release.outputs.release_id }}"
          echo "release_id=$RELEASE_ID"
          APP_ID="$(curl -fsS \
            -H "Authorization: Bearer ${QUIVER_BEARER_TOKEN}" \
            "${HANDS_API:-https://hands.build}/api/apps" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(next(a['id'] for a in d.get('apps',[]) if a.get('slug')=='${{ env.QUIVER_APP_SLUG }}'))")"
          # No ttl_seconds in the body = the share never expires (server-side
          # default). An explicit share_ttl_seconds input still sets one.
          TTL="${{ needs.resolve.outputs.share_ttl_seconds }}"
          if [ -n "$TTL" ]; then
            SHARE_BODY="{\"ttl_seconds\":${TTL}}"
          else
            SHARE_BODY="{}"
          fi
          SHARE_JSON="$(curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${QUIVER_BEARER_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$SHARE_BODY" \
            "${HANDS_API:-https://hands.build}/api/apps/${APP_ID}/releases/${RELEASE_ID}/shares")"
          echo "$SHARE_JSON"
          SHARE_URL="$(printf '%s' "$SHARE_JSON" | python3 -c "import json,sys;print(json.load(sys.stdin)['share_url'])")"
          echo "share_url=$SHARE_URL" >> "$GITHUB_OUTPUT"

      - name: Step summary
        if: always()
        run: |
          {
            echo "### Hands publish summary"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **APK** | \`${{ needs.build_android_release.outputs.apk_path }}\` |"
            echo "| **APK sha256** | \`${{ needs.build_android_release.outputs.apk_sha256 }}\` |"
            echo "| **Hands channel** | \`${{ needs.resolve.outputs.quiver_channel }}\` |"
            echo "| **Release mode** | \`${{ needs.resolve.outputs.release_mode }}\` |"
            echo "| **Release id** | \`${{ steps.publish-quiver-release.outputs.release_id || '(none)' }}\` |"
            echo "| **Share URL** | ${{ steps.create-share-page.outputs.share_url || '(skipped)' }} |"
            echo
            if [ "${{ needs.resolve.outputs.release_mode }}" = "draft" ]; then
              echo "### Draft release — review required before publish"
              echo
              echo "Raw changelog (proofread + translate before publishing):"
              echo
              echo '\`\`\`'
              cat changelog.txt 2>/dev/null || echo "(no changelog generated)"
              echo '\`\`\`'
              echo
              echo "Publish flow:"
              echo
              echo '\`\`\`sh'
              echo "hands releases show raft-android ${{ steps.publish-quiver-release.outputs.release_id }}"
              echo "hands releases update raft-android ${{ steps.publish-quiver-release.outputs.release_id }} --changelog-file zh-CN=zh-CN.md --changelog-file en=en.md"
              echo "hands releases publish raft-android ${{ steps.publish-quiver-release.outputs.release_id }}"
              echo '\`\`\`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
