name: Android Release

# Per owner 2026-07-03 16:39: versionX / Y / Z / build are dispatch inputs,
# not hardcoded. Default fallbacks preserve "today" if you want a smoke run.
# This workflow is intentionally draft-first. It may build and upload a Hands
# draft, but it must never activate a release or create the release tag; those
# happen only after the release owner approves reviewed notes and smoke results.

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Immutable source commit to check out; empty uses the caller commit"
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Unique signed APK artifact name"
        required: false
        type: string
        default: "android-release-apk"
      version_major:
        required: true
        type: string
      version_minor:
        required: true
        type: string
      version_patch:
        required: true
        type: string
      version_build:
        required: true
        type: string
      version_suffix:
        required: false
        type: string
        default: ""
      hands_channel:
        required: false
        type: string
        default: "main"
      android_variant:
        required: false
        type: string
        default: "release"
      dex_packaging:
        description: "DEX packaging: current | compressed | mmap"
        required: false
        type: string
        default: "compressed"
      jni_packaging:
        description: "JNI packaging: current | legacy | modern"
        required: false
        type: string
        default: "current"
      upload_android_artifacts:
        description: "Upload immutable AAB and APK to Hands without activation"
        required: false
        type: boolean
        default: false
      release_mode:
        required: false
        type: string
        default: "draft"
      create_hands_draft:
        description: "Create a Hands draft with uploaded installable/support assets; reusable build-only callers keep this false"
        required: false
        type: boolean
        default: false
      create_share_page:
        required: false
        type: boolean
        default: false
      share_ttl_seconds:
        required: false
        type: string
        default: ""
    outputs:
      source_sha:
        value: ${{ jobs.build_android_release.outputs.source_sha }}
      artifact_name:
        value: ${{ jobs.build_android_release.outputs.artifact_name }}
      artifact_id:
        value: ${{ jobs.build_android_release.outputs.artifact_id }}
      apk_member:
        value: ${{ jobs.build_android_release.outputs.apk_member }}
      apk_sha256:
        value: ${{ jobs.build_android_release.outputs.apk_sha256 }}
      apk_size:
        value: ${{ jobs.build_android_release.outputs.apk_size }}
      version_code:
        value: ${{ jobs.build_android_release.outputs.version_code }}
      version_name:
        value: ${{ jobs.build_android_release.outputs.version_name }}
      package_id:
        value: ${{ jobs.build_android_release.outputs.package_id }}
      min_sdk:
        value: ${{ jobs.build_android_release.outputs.min_sdk }}
      target_sdk:
        value: ${{ jobs.build_android_release.outputs.target_sdk }}
      signer_cert_sha256_json:
        value: ${{ jobs.build_android_release.outputs.signer_cert_sha256_json }}
      verified_v2:
        value: ${{ jobs.build_android_release.outputs.verified_v2 }}
      verified_v3:
        value: ${{ jobs.build_android_release.outputs.verified_v3 }}
      verified_v31:
        value: ${{ jobs.build_android_release.outputs.verified_v31 }}
  workflow_dispatch:
    inputs:
      aab_signing_repair:
        description: 'Signing only, no build: JSON with hands_build_id, source_run_id, aab_sha256, apk_sha256; also set source_sha'
        required: false
        type: string
        default: ""
      source_sha:
        description: "Immutable source commit to check out; empty uses the selected workflow ref"
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Signed APK artifact name"
        required: false
        type: string
        default: "android-release-apk"
      version_major:
        description: "versionName major (X)"
        required: true
        type: string
        default: "1"
      version_minor:
        description: "versionName minor (Y)"
        required: true
        type: string
        default: "0"
      version_patch:
        description: "versionName patch (Z)"
        required: true
        type: string
        default: "0"
      version_build:
        description: "versionCode build (x*10_000_000 + y*100_000 + z*1_000 + build, 0-999)"
        required: true
        type: string
        default: "0"
      version_suffix:
        description: "versionName suffix (e.g. rc1); leave empty for release"
        required: false
        type: string
        default: ""
      hands_channel:
        description: "Hands channel: main | preview | nightly | debug"
        required: true
        type: choice
        default: "main"
        options:
          - main
          - preview
          - nightly
          - debug
      android_variant:
        description: "Gradle variant: release (Hands, default) | play (Google Play) | debug"
        required: true
        type: choice
        default: "release"
        options:
          - release
          - play
          - debug
      dex_packaging:
        description: "DEX packaging: current control | compressed | mmap"
        required: true
        type: choice
        default: compressed
        options:
          - current
          - compressed
          - mmap
      jni_packaging:
        description: "JNI packaging: current control | legacy compressed/extracted | modern stored/mmap"
        required: true
        type: choice
        default: current
        options:
          - current
          - legacy
          - modern
      upload_android_artifacts:
        description: "Upload immutable AAB and APK to Hands without activation"
        required: false
        type: boolean
        default: false
      release_mode:
        description: "Draft only. Review notes and smoke before the separate explicit Hands publish step."
        required: true
        type: choice
        default: "draft"
        options:
          - draft
      create_share_page:
        description: "Create a /share/<token> page for the automatically uploaded Hands draft"
        required: true
        type: boolean
        default: true
      share_ttl_seconds:
        description: "Optional share page TTL in seconds. Empty (default) = the share never expires."
        required: false
        type: string
        default: ""

env:
  # The lane's android-release docs require these envs:
  #   docs/android-release-lane-pi-perfprofiler.md
  #   docs/android-hands-release-practices-2026-07-02.md
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
  GRADLE_MAX_WORKERS: "1"

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.aab_signing_repair == '' }}
    name: Resolve release parameters
    runs-on: blacksmith-4vcpu-ubuntu-2204
    outputs:
      version_major: ${{ steps.p.outputs.version_major }}
      version_minor: ${{ steps.p.outputs.version_minor }}
      version_patch: ${{ steps.p.outputs.version_patch }}
      version_build: ${{ steps.p.outputs.version_build }}
      version_suffix: ${{ steps.p.outputs.version_suffix }}
      version_name: ${{ steps.p.outputs.version_name }}
      hands_channel: ${{ steps.p.outputs.hands_channel }}
      android_variant: ${{ steps.p.outputs.android_variant }}
      dex_packaging: ${{ steps.p.outputs.dex_packaging }}
      jni_packaging: ${{ steps.p.outputs.jni_packaging }}
      release_mode: ${{ steps.p.outputs.release_mode }}
      create_hands_draft: ${{ steps.p.outputs.create_hands_draft }}
      upload_android_artifacts: ${{ steps.p.outputs.upload_android_artifacts }}
      create_share_page: ${{ steps.p.outputs.create_share_page }}
      share_ttl_seconds: ${{ steps.p.outputs.share_ttl_seconds }}
    steps:
      - name: Checkout release contract helpers
        uses: actions/checkout@v7

      - id: p
        shell: bash
        env:
          INPUT_CREATE_HANDS_DRAFT: ${{ inputs.create_hands_draft }}
          INPUT_DEX_PACKAGING: ${{ inputs.dex_packaging }}
          INPUT_JNI_PACKAGING: ${{ inputs.jni_packaging }}
          INPUT_ANDROID_VARIANT: ${{ inputs.android_variant }}
          INPUT_UPLOAD_ANDROID_ARTIFACTS: ${{ inputs.upload_android_artifacts }}
        run: |
          set -euo pipefail
          VERSION_NAME="${{ inputs.version_major }}.${{ inputs.version_minor }}.${{ inputs.version_patch }}"
          [ -n "${{ inputs.version_suffix }}" ] && VERSION_NAME="${VERSION_NAME}-${{ inputs.version_suffix }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${INPUT_ANDROID_VARIANT}" = "play" ]; then
              CREATE_HANDS_DRAFT=false
            else
              CREATE_HANDS_DRAFT=true
            fi
          else
            CREATE_HANDS_DRAFT="${INPUT_CREATE_HANDS_DRAFT}"
          fi
          DEX_PACKAGING="${INPUT_DEX_PACKAGING}"
          case "${DEX_PACKAGING}" in
            current|compressed|mmap) ;;
            *)
              echo "Unsupported DEX packaging mode: ${DEX_PACKAGING}" >&2
              exit 1
              ;;
          esac
          JNI_PACKAGING="${INPUT_JNI_PACKAGING}"
          case "${JNI_PACKAGING}" in
            current|legacy|modern) ;;
            *)
              echo "Unsupported JNI packaging mode: ${JNI_PACKAGING}" >&2
              exit 1
              ;;
          esac
          UPLOAD_ANDROID_ARTIFACTS="${INPUT_UPLOAD_ANDROID_ARTIFACTS}"
          if [ "${INPUT_ANDROID_VARIANT}" = "play" ] && [ "${UPLOAD_ANDROID_ARTIFACTS}" != "true" ]; then
            echo "Play builds require upload_android_artifacts=true so the signed AAB is retained for Play Console." >&2
            exit 1
          fi
          {
            echo "version_major=${{ inputs.version_major }}"
            echo "version_minor=${{ inputs.version_minor }}"
            echo "version_patch=${{ inputs.version_patch }}"
            echo "version_build=${{ inputs.version_build }}"
            echo "version_suffix=${{ inputs.version_suffix }}"
            echo "version_name=${VERSION_NAME}"
            echo "hands_channel=${{ inputs.hands_channel }}"
            echo "android_variant=${{ inputs.android_variant }}"
            echo "dex_packaging=${DEX_PACKAGING}"
            echo "jni_packaging=${JNI_PACKAGING}"
            echo "release_mode=draft"
            echo "create_hands_draft=${CREATE_HANDS_DRAFT}"
            echo "upload_android_artifacts=${UPLOAD_ANDROID_ARTIFACTS}"
            echo "create_share_page=${{ inputs.create_share_page }}"
            echo "share_ttl_seconds=${{ inputs.share_ttl_seconds }}"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build_android_release:
    name: Build + sign APK
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs: resolve
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      artifact_name: ${{ inputs.artifact_name }}
      artifact_id: ${{ steps.upload-apk.outputs.artifact-id }}
      apk_member: ${{ steps.verify.outputs.member }}
      apk_path: ${{ steps.sign.outputs.apk_path }}
      apk_sha256: ${{ steps.verify.outputs.sha256 }}
      apk_size: ${{ steps.verify.outputs.size }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      version_name: ${{ steps.resolve.outputs.version_name }}
      package_id: ${{ steps.verify.outputs.package_id }}
      min_sdk: ${{ steps.verify.outputs.min_sdk }}
      target_sdk: ${{ steps.verify.outputs.target_sdk }}
      signer_cert_sha256_json: ${{ steps.verify.outputs.signer_cert_sha256_json }}
      verified_v2: ${{ steps.verify.outputs.verified_v2 }}
      verified_v3: ${{ steps.verify.outputs.verified_v3 }}
      verified_v31: ${{ steps.verify.outputs.verified_v31 }}
      hands_artifact_build_id: ${{ steps.hands-artifacts.outputs.build_id }}
    steps:
      - name: Checkout workflow base
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Stage workflow-owned release implementations
        shell: bash
        run: |
          tar -C . -cf "$RUNNER_TEMP/android-release-workflow-files.tar" \
            .github/actions/gradle-cache-policy \
            .github/actions/gradle-failure-diagnostics \
            .github/gradle-cache-epoch \
            .github/gradle-cache-quarantine \
            scripts/upload_android_hands_artifacts.sh \
            scripts/sign_android_aab.sh \
            scripts/verify_android_aab.sh \
            scripts/VerifyAndroidAab.java \
            scripts/sign_android_apk_with_rotation.sh \
            scripts/verify_android_apk_with_rotation.sh \
            scripts/verify_android_dex_packaging.py \
            scripts/verify_android_elf_alignment.py \
            scripts/verify_android_native_symbols.sh

      - name: Checkout immutable product source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Restore workflow-owned release implementations
        shell: bash
        run: tar -C . -xf "$RUNNER_TEMP/android-release-workflow-files.tar"

      - name: Verify immutable source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          REQUESTED="${{ inputs.source_sha }}"
          if [ -n "${REQUESTED}" ] && [ "${ACTUAL}" != "${REQUESTED}" ]; then
            echo "Requested source ${REQUESTED}, checked out ${ACTUAL}" >&2
            exit 1
          fi
          echo "source_sha=${ACTUAL}" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          MAJOR="${{ needs.resolve.outputs.version_major }}"
          MINOR="${{ needs.resolve.outputs.version_minor }}"
          PATCH="${{ needs.resolve.outputs.version_patch }}"
          BUILD="${{ needs.resolve.outputs.version_build }}"
          SUFFIX="${{ needs.resolve.outputs.version_suffix }}"
          # versionCode = X*10_000_000 + Y*100_000 + Z*1_000 + build (0-999),
          # via scripts/ci/version_code.sh (authoritative single formula).
          VERSION_CODE="$(scripts/ci/version_code.sh "$MAJOR" "$MINOR" "$PATCH" "$BUILD")"
          if [ -n "$SUFFIX" ]; then
            VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}-${SUFFIX}"
          else
            VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Gradle build (assembleRelease / assemblePlay / assembleDebug)
        working-directory: compose
        env:
          SLOCK_HANDS_CHANNEL: ${{ needs.resolve.outputs.hands_channel }}
        shell: bash
        run: |
          case "${{ needs.resolve.outputs.android_variant }}" in
            debug) GRADLE_VARIANT=Debug ;;
            release) GRADLE_VARIANT=Release ;;
            play) GRADLE_VARIANT=Play ;;
            *) echo "Unsupported Android variant: ${{ needs.resolve.outputs.android_variant }}" >&2; exit 1 ;;
          esac
          GRADLE_ARGS=(
            :shared:generateSqlDelightInterface
            ":androidApp:assemble${GRADLE_VARIANT}"
            ":androidApp:bundle${GRADLE_VARIANT}"
            :androidApp:copyHandsNativeSymbols
            "-PversionX=${{ needs.resolve.outputs.version_major }}"
            "-PversionY=${{ needs.resolve.outputs.version_minor }}"
            "-PversionZ=${{ needs.resolve.outputs.version_patch }}"
            "-PversionBuild=${{ needs.resolve.outputs.version_build }}"
            "-PversionCode=${{ steps.resolve.outputs.version_code }}"
          )
          case "${{ needs.resolve.outputs.dex_packaging }}" in
            current) ;;
            compressed) GRADLE_ARGS+=("-PraftDexUseLegacyPackaging=true") ;;
            mmap) GRADLE_ARGS+=("-PraftDexUseLegacyPackaging=false") ;;
          esac
          case "${{ needs.resolve.outputs.jni_packaging }}" in
            current) ;;
            legacy) GRADLE_ARGS+=("-PraftJniUseLegacyPackaging=true") ;;
            modern) GRADLE_ARGS+=("-PraftJniUseLegacyPackaging=false") ;;
          esac
          if [ -n "${{ needs.resolve.outputs.version_suffix }}" ]; then
            GRADLE_ARGS+=("-PversionSuffix=${{ needs.resolve.outputs.version_suffix }}")
          fi
          ./gradlew \
            "${GRADLE_ARGS[@]}" \
            --no-daemon --max-workers=${{ env.GRADLE_MAX_WORKERS }} --console=plain --stacktrace

      - name: Determine APK path
        id: locate
        shell: bash
        run: |
          APK_DIR="compose/androidApp/build/outputs/apk/${{ needs.resolve.outputs.android_variant }}"
          APK="$(find "${APK_DIR}" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${APK}" ]; then
            echo "No APK found under ${APK_DIR}" >&2
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Sign + align APK
        id: sign
        # Lane-canonical approach: zipalign + apksigner (the release helper
        # scripts/publish_android_hands_release.sh does not sign; that's a
        # known gap for KMP's helper follow-up).
        env:
          LEGACY_KEYSTORE_FILE_B64: ${{ secrets.SLOCK_KEYSTORE_FILE_BASE64 }}
          SLOCK_LEGACY_KEYSTORE_PASS: ${{ secrets.SLOCK_KEYSTORE_PASS }}
          SLOCK_LEGACY_KEY_ALIAS: ${{ secrets.SLOCK_KEY_ALIAS }}
          SLOCK_LEGACY_KEY_PASS: ${{ secrets.SLOCK_KEY_PASS }}
          ROTATED_KEYSTORE_FILE_B64: ${{ secrets.SLOCK_ROTATED_KEYSTORE_FILE_BASE64 }}
          SLOCK_ROTATED_KEYSTORE_PASS: ${{ secrets.SLOCK_ROTATED_KEYSTORE_PASS }}
          SLOCK_ROTATED_KEY_ALIAS: ${{ secrets.SLOCK_ROTATED_KEY_ALIAS }}
          SLOCK_ROTATED_KEY_PASS: ${{ secrets.SLOCK_ROTATED_KEY_PASS }}
          SIGNING_LINEAGE_B64: ${{ secrets.SLOCK_SIGNING_LINEAGE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            LEGACY_KEYSTORE_FILE_B64 \
            SLOCK_LEGACY_KEYSTORE_PASS \
            SLOCK_LEGACY_KEY_ALIAS \
            SLOCK_LEGACY_KEY_PASS \
            ROTATED_KEYSTORE_FILE_B64 \
            SLOCK_ROTATED_KEYSTORE_PASS \
            SLOCK_ROTATED_KEY_ALIAS \
            SLOCK_ROTATED_KEY_PASS \
            SIGNING_LINEAGE_B64; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required rotated release signing secret: ${name}" >&2
              exit 1
            fi
          done
          SLOCK_LEGACY_KEYSTORE_FILE="$(mktemp -t raft-release-legacy-keystore-XXXXXX.jks)"
          SLOCK_ROTATED_KEYSTORE_FILE="$(mktemp -t raft-release-rotated-keystore-XXXXXX.jks)"
          SLOCK_SIGNING_LINEAGE_FILE="$(mktemp -t raft-release-signing-lineage-XXXXXX.bin)"
          export SLOCK_LEGACY_KEYSTORE_FILE SLOCK_ROTATED_KEYSTORE_FILE SLOCK_SIGNING_LINEAGE_FILE
          echo "${LEGACY_KEYSTORE_FILE_B64}" | base64 -d > "${SLOCK_LEGACY_KEYSTORE_FILE}"
          echo "${ROTATED_KEYSTORE_FILE_B64}" | base64 -d > "${SLOCK_ROTATED_KEYSTORE_FILE}"
          echo "${SIGNING_LINEAGE_B64}" | base64 -d > "${SLOCK_SIGNING_LINEAGE_FILE}"
          BT="${ANDROID_HOME}/build-tools/36.0.0"
          UNSIGNED="${{ steps.locate.outputs.apk_path }}"
          TARGET_APK="compose/androidApp/build/outputs/apk/${{ needs.resolve.outputs.android_variant }}/androidApp-${{ needs.resolve.outputs.android_variant }}.apk"
          SIGNED="/tmp/androidApp-${{ needs.resolve.outputs.android_variant }}-signed.apk"
          cleanup() {
            rm -f \
              "${SLOCK_LEGACY_KEYSTORE_FILE}" \
              "${SLOCK_ROTATED_KEYSTORE_FILE}" \
              "${SLOCK_SIGNING_LINEAGE_FILE}" \
              "${SIGNED}"
          }
          trap cleanup EXIT
          scripts/sign_android_apk_with_rotation.sh \
            --input "${UNSIGNED}" \
            --output "${SIGNED}" \
            --build-tools-dir "${BT}" \
            --verify-log apksigner-rotation-verify.log
          # Place the signed APK at the canonical release path and remove
          # the temporary unsigned artifact.
          cp "${SIGNED}" "${TARGET_APK}"
          if [ "${UNSIGNED}" != "${TARGET_APK}" ]; then
            rm -f "${UNSIGNED}"
          fi
          echo "apk_path=${TARGET_APK}" >> "$GITHUB_OUTPUT"

      - name: Verify exact Hands native symbols
        id: native-symbols
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find compose/androidApp/build/outputs/hands-native-symbols -maxdepth 1 -type f -name '*-native-symbols.zip' | sort | head -n 1)"
          if [ -z "${ARCHIVE}" ]; then
            echo "Hands native symbols classifier was not resolved" >&2
            exit 1
          fi
          scripts/verify_android_native_symbols.sh \
            --apk "${{ steps.sign.outputs.apk_path }}" \
            --symbols "${ARCHIVE}"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/36.0.0"
          APK="${{ steps.sign.outputs.apk_path }}"
          scripts/verify_android_apk_with_rotation.sh \
            --apk "${APK}" \
            --build-tools-dir "${BT}" \
            --verify-log apksigner-verify.log
          DEX_ARGS=(
            --apk "${APK}"
          )
          if [ "${{ needs.resolve.outputs.dex_packaging }}" = "compressed" ]; then
            DEX_ARGS+=(
              --expect-dex-method deflated
              --max-apk-size-bytes 47185920
              --max-dex-compression-ratio 0.60
            )
          else
            DEX_ARGS+=(--expect-dex-method stored)
          fi
          python3 scripts/verify_android_dex_packaging.py "${DEX_ARGS[@]}"
          NATIVE_METHOD=deflated
          if [ "${{ needs.resolve.outputs.jni_packaging }}" = "modern" ]; then
            NATIVE_METHOD=stored
          fi
          python3 scripts/verify_android_elf_alignment.py \
            --archive "${APK}" \
            --expect-native-method "${NATIVE_METHOD}" \
            --require-abi arm64-v8a \
            --require-abi x86_64
          "${BT}/aapt" dump badging "${APK}" 2>&1 | tee aapt-badging.log
          PACKAGE_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" aapt-badging.log | head -n 1)"
          [ -n "${PACKAGE_ID}" ] || { echo "Unable to read package id" >&2; exit 1; }
          MIN_SDK="$(sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" aapt-badging.log | head -n 1)"
          TARGET_SDK="$(sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p" aapt-badging.log | head -n 1)"
          [[ "${MIN_SDK}" =~ ^[0-9]+$ ]] || { echo "Unable to read minSdk" >&2; exit 1; }
          [[ "${TARGET_SDK}" =~ ^[0-9]+$ ]] || { echo "Unable to read targetSdk" >&2; exit 1; }
          [ "${MIN_SDK}" = "29" ] || { echo "Release APK must require Android 10 / API 29, got ${MIN_SDK}" >&2; exit 1; }
          # apksigner prints newest/current first. Reverse it so the machine
          # contract is the canonical oldest-to-current lineage order.
          SIGNERS_JSON="$(awk -F ': ' '/certificate SHA-256 digest:/ {print $2}' apksigner-verify.log | jq -Rsc 'split("\n") | map(select(length > 0)) | reverse')"
          [ "$(printf '%s' "${SIGNERS_JSON}" | jq 'length')" -gt 0 ] || { echo "Unable to read signer digest" >&2; exit 1; }
          V2="$(awk -F ': ' '/Verified using v2 scheme/ {print $2}' apksigner-verify.log | tail -n 1)"
          V3="$(awk -F ': ' '/Verified using v3 scheme/ {print $2}' apksigner-verify.log | tail -n 1)"
          V31="$(awk -F ': ' '/Verified using v3.1 scheme/ {print $2}' apksigner-verify.log | tail -n 1)"
          [ "${V2}" = "true" ] || { echo "APK v2 verification is not true" >&2; exit 1; }
          [ "${V3}" = "true" ] || { echo "APK v3 verification is not true" >&2; exit 1; }
          [ "${V31}" = "true" ] || { echo "APK v3.1 verification is not true" >&2; exit 1; }
          echo "apk_path=${APK}" >> "$GITHUB_OUTPUT"
          echo "member=$(basename "${APK}")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${APK}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "${APK}" 2>/dev/null || stat -f %z "${APK}")" >> "$GITHUB_OUTPUT"
          echo "package_id=${PACKAGE_ID}" >> "$GITHUB_OUTPUT"
          echo "min_sdk=${MIN_SDK}" >> "$GITHUB_OUTPUT"
          echo "target_sdk=${TARGET_SDK}" >> "$GITHUB_OUTPUT"
          echo "signer_cert_sha256_json=${SIGNERS_JSON}" >> "$GITHUB_OUTPUT"
          echo "verified_v2=${V2}" >> "$GITHUB_OUTPUT"
          echo "verified_v3=${V3}" >> "$GITHUB_OUTPUT"
          echo "verified_v31=${V31}" >> "$GITHUB_OUTPUT"

      # Every non-debug build keeps its signed AAB as a workflow artifact (90 days): the
      # Play carrier for Play Console, the Hands `release` build as the backup bundle that
      # github-release.yml attaches next to the published APK. Only the Hands upload below
      # stays behind upload_android_artifacts.
      - name: Locate AAB
        if: ${{ needs.resolve.outputs.android_variant != 'debug' || needs.resolve.outputs.upload_android_artifacts == 'true' }}
        id: locate-aab
        shell: bash
        run: |
          set -euo pipefail
          AAB_DIR="compose/androidApp/build/outputs/bundle/${{ needs.resolve.outputs.android_variant }}"
          AAB="$(find "$AAB_DIR" -maxdepth 1 -type f -name '*.aab' | sort | head -n 1)"
          [ -n "$AAB" ] || { echo "No AAB found under $AAB_DIR" >&2; exit 1; }
          echo "aab_path=$AAB" >> "$GITHUB_OUTPUT"

      - name: Sign and verify AAB
        if: ${{ needs.resolve.outputs.android_variant != 'debug' || needs.resolve.outputs.upload_android_artifacts == 'true' }}
        id: sign-aab
        env:
          UPLOAD_KEYSTORE_FILE_B64: ${{ secrets.SLOCK_ROTATED_KEYSTORE_FILE_BASE64 }}
          SLOCK_UPLOAD_KEYSTORE_PASS: ${{ secrets.SLOCK_ROTATED_KEYSTORE_PASS }}
          SLOCK_UPLOAD_KEY_ALIAS: ${{ secrets.SLOCK_ROTATED_KEY_ALIAS }}
          SLOCK_UPLOAD_KEY_PASS: ${{ secrets.SLOCK_ROTATED_KEY_PASS }}
          EXPECTED_UPLOAD_CERT_SHA256: 5f08bbe82a27ccdad26c13523a60b5670d3aa7633e8ed2fd71fa6b5751f9b0b1
          INPUT_AAB: ${{ steps.locate-aab.outputs.aab_path }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          SLOCK_UPLOAD_KEYSTORE_FILE="$(mktemp "$RUNNER_TEMP/aab-upload-key.XXXXXX")"
          export SLOCK_UPLOAD_KEYSTORE_FILE
          trap 'rm -f "$SLOCK_UPLOAD_KEYSTORE_FILE"' EXIT
          printf '%s' "$UPLOAD_KEYSTORE_FILE_B64" | base64 -d > "$SLOCK_UPLOAD_KEYSTORE_FILE"
          mkdir -p signed-aab
          scripts/sign_android_aab.sh "$INPUT_AAB" signed-aab/androidApp-release.aab \
            "$EXPECTED_UPLOAD_CERT_SHA256" signed-aab/aab-signature.json
          echo "aab_path=signed-aab/androidApp-release.aab" >> "$GITHUB_OUTPUT"
          echo "upload_key_cert_sha256=$(jq -er .upload_key_cert_sha256 signed-aab/aab-signature.json)" >> "$GITHUB_OUTPUT"

      - name: Record AAB build identity
        # Binds the AAB to this run's APK for github-release.yml (scripts/github_release_from_hands.py).
        if: ${{ steps.sign-aab.outcome == 'success' }}
        env:
          REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_COMMIT_SHA: ${{ steps.source.outputs.source_sha }}
          ANDROID_VARIANT: ${{ needs.resolve.outputs.android_variant }}
          HANDS_CHANNEL: ${{ needs.resolve.outputs.hands_channel }}
          PACKAGE_NAME: ${{ steps.verify.outputs.package_id }}
          VERSION_NAME: ${{ steps.resolve.outputs.version_name }}
          VERSION_CODE: ${{ steps.resolve.outputs.version_code }}
          APK_SHA256: ${{ steps.verify.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          AAB_SHA256="$(sha256sum signed-aab/androidApp-release.aab | awk '{print $1}')"
          [ "${AAB_SHA256}" = "$(jq -er .sha256 signed-aab/aab-signature.json)" ] || {
            echo "Signed AAB does not match its verification receipt" >&2
            exit 1
          }
          jq -n \
            --arg repo "${REPOSITORY}" --arg run "${CI_RUN_ID}" --arg attempt "${CI_RUN_ATTEMPT}" \
            --arg commit "${SOURCE_COMMIT_SHA}" --arg variant "${ANDROID_VARIANT}" \
            --arg channel "${HANDS_CHANNEL}" --arg pkg "${PACKAGE_NAME}" \
            --arg vn "${VERSION_NAME}" --argjson vc "${VERSION_CODE}" \
            --arg apk "${APK_SHA256}" --arg aab "${AAB_SHA256}" \
            '{schema:"raft.android-aab-build-identity.v1",repository:$repo,ci_run_id:$run,ci_run_attempt:$attempt,source_commit:$commit,android_variant:$variant,hands_channel:$channel,package_name:$pkg,version_name:$vn,version_code:$vc,apk_sha256:$apk,aab_sha256:$aab}' \
            > signed-aab/build-identity.json
          cat signed-aab/build-identity.json

      # Play builds upload too: Hands holds the sealed AAB that
      # scripts/play_internal_promote.sh puts on the Play internal track.
      - name: Upload immutable AAB + APK to Hands
        if: ${{ needs.resolve.outputs.upload_android_artifacts == 'true' }}
        id: hands-artifacts
        env:
          HANDS_API: ${{ secrets.HANDS_API || 'https://hands.build' }}
          HANDS_ANDROID_APP_ID: ${{ secrets.HANDS_ANDROID_APP_ID }}
          HANDS_BEARER_TOKEN: ${{ secrets.QUIVER_BEARER_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT_SHA: ${{ steps.source.outputs.source_sha }}
          CI_RUN_ID: ${{ github.run_id }}
          PACKAGE_NAME: ${{ steps.verify.outputs.package_id }}
          VERSION_NAME: ${{ steps.resolve.outputs.version_name }}
          VERSION_CODE: ${{ steps.resolve.outputs.version_code }}
          UPLOAD_KEY_CERT_SHA256: ${{ steps.sign-aab.outputs.upload_key_cert_sha256 }}
          AAB_PATH: ${{ steps.sign-aab.outputs.aab_path }}
          APK_PATH: ${{ steps.sign.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/upload_android_hands_artifacts.sh | tee hands-artifacts-upload.log
          awk -F= '/^build_id=/{print "build_id=" $2}' hands-artifacts-upload.log >> "$GITHUB_OUTPUT"
          if [ "${{ needs.resolve.outputs.android_variant }}" = "play" ]; then
            build_id="$(awk -F= '/^build_id=/{print $2}' hands-artifacts-upload.log | tail -n 1)"
            {
              echo "### Next: Google Play internal testing"
              echo "Every Android release goes to the Play internal track by default. As a signed-in Hands publisher (Play writes use an accountable identity, not CI's deploy token), run:"
              echo '```'
              echo "scripts/play_internal_promote.sh ${build_id}"
              echo '```'
              echo "Closed, open and production tracks still need artin's approval. Never publish the Hands draft this creates."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload signed AAB and verification receipt
        if: ${{ needs.resolve.outputs.android_variant != 'debug' || needs.resolve.outputs.upload_android_artifacts == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}-aab
          path: signed-aab/
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK as workflow artifact
        id: upload-apk
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ steps.sign.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping as workflow artifact
        # Enables server-side crash deobfuscation: the publish job attaches
        # this as a proguard-mapping build asset.
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}-mapping
          path: compose/androidApp/build/outputs/mapping/${{ needs.resolve.outputs.android_variant }}/mapping.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload exact native symbols as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}-native-symbols
          path: ${{ steps.native-symbols.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

      - name: Step summary
        if: always()
        run: |
          {
            echo "### Android release build summary"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **versionCode** | \`${{ steps.resolve.outputs.version_code }}\` |"
            echo "| **versionName** | \`${{ steps.resolve.outputs.version_name }}\` |"
            echo "| **APK** | \`${{ steps.sign.outputs.apk_path }}\` |"
            echo "| **size (bytes)** | \`${{ steps.verify.outputs.size }}\` |"
            echo "| **sha256** | \`${{ steps.verify.outputs.sha256 }}\` |"
            echo "| **DEX packaging** | \`${{ needs.resolve.outputs.dex_packaging }}\` |"
            echo "| **JNI packaging** | \`${{ needs.resolve.outputs.jni_packaging }}\` |"
            echo "| **Hands channel target** | \`${{ needs.resolve.outputs.hands_channel }}\` |"
            echo "| **Create Hands draft** | \`${{ needs.resolve.outputs.create_hands_draft }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics

  create_hands_draft:
    name: Create Hands draft + optional share page
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 15
    needs: [resolve, build_android_release]
    if: |
      github.event_name == 'workflow_dispatch' &&
      needs.resolve.outputs.create_hands_draft == 'true' &&
      needs.resolve.outputs.android_variant != 'play'
    environment:
      name: production
      # Optional: enforce manual approval for `production` env in repo settings.
    env:
      HANDS_APP_SLUG: raft-android
      # The external repository secret keeps its existing storage key; runtime
      # consumers receive only Hands-named variables.
      HANDS_BEARER_TOKEN: ${{ secrets.QUIVER_BEARER_TOKEN }}
      HANDS_AUTH_TOKEN: ${{ secrets.QUIVER_BEARER_TOKEN }}
      HANDS_API: https://hands.build
      SLOCK_HANDS_CHANNEL: ${{ needs.resolve.outputs.hands_channel }}
      HANDS_CHANNEL: ${{ needs.resolve.outputs.hands_channel }}
      SLOCK_ANDROID_VARIANT: ${{ needs.resolve.outputs.android_variant }}
      SLOCK_ANDROID_VERSION_MAJOR: ${{ needs.resolve.outputs.version_major }}
      SLOCK_ANDROID_VERSION_MINOR: ${{ needs.resolve.outputs.version_minor }}
      SLOCK_ANDROID_VERSION_PATCH: ${{ needs.resolve.outputs.version_patch }}
      SLOCK_ANDROID_VERSION_BUILD: ${{ needs.resolve.outputs.version_build }}
      SLOCK_ANDROID_VERSION_SUFFIX: ${{ needs.resolve.outputs.version_suffix }}
      SLOCK_SKIP_GRADLE_BUILD: "1"
      SLOCK_HANDS_DRAFT: "1"
      SLOCK_COLLECT_ANDROID_SYMBOLS: "1"
      SLOCK_REQUIRE_ANDROID_SYMBOLS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/

      - name: Download R8 mapping (optional)
        # Restored to the exact path the publish helper probes; absent for
        # variants without minification.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}-mapping
          path: compose/androidApp/build/outputs/mapping/${{ needs.resolve.outputs.android_variant }}/

      - name: Download exact native symbols
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}-native-symbols
          path: dist/native-symbols/

      - name: Install Hands CLI (npm)
        shell: bash
        run: |
          npm install -g @botiverse/hands-cli@0.5.35
          hands --version

      - name: Generate changelog from git history
        id: generate-changelog
        shell: bash
        run: |
          set -euo pipefail
          # Range: previous build's provenance source_commit (authenticated
          # builds API) .. HEAD. Falls back to the last 15 subjects when the
          # previous commit is unknown or unreachable.
          HANDS_API_BASE="${HANDS_API:-https://hands.build}"
          APP_ID="$(curl -fsS --retry 3 --retry-delay 5 -H "Authorization: Bearer ${HANDS_BEARER_TOKEN}" \
            "${HANDS_API_BASE}/api/apps" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((a['id'] for a in d.get('apps',[]) if a.get('slug')=='${HANDS_APP_SLUG}'), ''))" \
            2>/dev/null || true)"
          PREV_COMMIT=""
          if [ -n "${APP_ID}" ]; then
            PREV_COMMIT="$(curl -fsS --retry 3 --retry-delay 5 -H "Authorization: Bearer ${HANDS_BEARER_TOKEN}" \
              "${HANDS_API_BASE}/api/apps/${APP_ID}/builds" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); bs=d.get('builds') or []; p=(bs[0].get('provenance_json') if bs else None); p=json.loads(p) if isinstance(p,str) else (p or {}); print(p.get('source_commit') or '')" \
              2>/dev/null || true)"
          fi
          echo "previous release commit: '${PREV_COMMIT:-none}'"
          if [ -n "${PREV_COMMIT}" ] && git cat-file -e "${PREV_COMMIT}^{commit}" 2>/dev/null; then
            git log --no-merges --pretty='- %s' --max-count=40 "${PREV_COMMIT}..HEAD" > changelog.txt
          fi
          if [ ! -s changelog.txt ]; then
            git log --no-merges --pretty='- %s' -15 > changelog.txt
          fi
          echo "---- changelog ----"
          cat changelog.txt

      - name: Build metadata + publish APK + (optional) mapping/symbols
        id: publish-hands-release
        shell: bash
        env:
          SLOCK_RELEASE_CHANGELOG_FILE: ${{ github.workspace }}/changelog.txt
          SLOCK_RELEASE_CHANGELOG_PLATFORM_DIR: ${{ github.workspace }}/change-logs/${{ needs.resolve.outputs.version_name }}/android
          SLOCK_RELEASE_CHANGELOG_LEGACY_DIR: ${{ github.workspace }}/change-logs/${{ needs.resolve.outputs.version_name }}
        run: |
          set -euo pipefail
          if [ -s "${SLOCK_RELEASE_CHANGELOG_PLATFORM_DIR}/zh-CN.md" ] && [ -s "${SLOCK_RELEASE_CHANGELOG_PLATFORM_DIR}/en.md" ] && [ -s "${SLOCK_RELEASE_CHANGELOG_PLATFORM_DIR}/ja.md" ]; then
            export SLOCK_RELEASE_CHANGELOG_ZH_FILE="${SLOCK_RELEASE_CHANGELOG_PLATFORM_DIR}/zh-CN.md"
            export SLOCK_RELEASE_CHANGELOG_EN_FILE="${SLOCK_RELEASE_CHANGELOG_PLATFORM_DIR}/en.md"
            export SLOCK_RELEASE_CHANGELOG_JA_FILE="${SLOCK_RELEASE_CHANGELOG_PLATFORM_DIR}/ja.md"
            echo "Using reviewed Android changelog from change-logs/${{ needs.resolve.outputs.version_name }}/android/"
          elif find "${SLOCK_RELEASE_CHANGELOG_PLATFORM_DIR}" -maxdepth 1 -type f \( -name 'zh-CN.md' -o -name 'en.md' -o -name 'ja.md' \) -print -quit 2>/dev/null | grep -q .; then
            echo "Reviewed Android changelog is incomplete; zh-CN.md, en.md, and ja.md are all required." >&2
            exit 1
          elif [ -s "${SLOCK_RELEASE_CHANGELOG_LEGACY_DIR}/zh-CN.md" ] && [ -s "${SLOCK_RELEASE_CHANGELOG_LEGACY_DIR}/en.md" ]; then
            export SLOCK_RELEASE_CHANGELOG_ZH_FILE="${SLOCK_RELEASE_CHANGELOG_LEGACY_DIR}/zh-CN.md"
            export SLOCK_RELEASE_CHANGELOG_EN_FILE="${SLOCK_RELEASE_CHANGELOG_LEGACY_DIR}/en.md"
            if [ -s "${SLOCK_RELEASE_CHANGELOG_LEGACY_DIR}/ja.md" ]; then
              export SLOCK_RELEASE_CHANGELOG_JA_FILE="${SLOCK_RELEASE_CHANGELOG_LEGACY_DIR}/ja.md"
            else
              unset SLOCK_RELEASE_CHANGELOG_JA_FILE
            fi
            echo "Using legacy reviewed changelog from change-logs/${{ needs.resolve.outputs.version_name }}/"
          else
            unset SLOCK_RELEASE_CHANGELOG_ZH_FILE SLOCK_RELEASE_CHANGELOG_EN_FILE SLOCK_RELEASE_CHANGELOG_JA_FILE
            echo "Reviewed Android changelog not found; falling back to generated git history."
          fi
          # The release helper handles metadata.json generation, channel
          # routing, and Hands CLI invocation. Build + sign were already
          # done in build_android_release; --skip-gradle-build reuses the
          # signed APK on disk.
          APK="$(find dist -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${APK}" ]; then
            echo "No downloaded APK found under dist/" >&2
            exit 1
          fi
          mkdir -p compose/androidApp/build/outputs/apk/${{ needs.resolve.outputs.android_variant }}
          cp "${APK}" "compose/androidApp/build/outputs/apk/${{ needs.resolve.outputs.android_variant }}/androidApp-${{ needs.resolve.outputs.android_variant }}.apk"
          SYMBOLS="$(find dist/native-symbols -maxdepth 1 -type f -name '*-native-symbols.zip' | sort | head -n 1)"
          if [ -z "${SYMBOLS}" ]; then
            echo "No downloaded native symbol archive found" >&2
            exit 1
          fi
          export SLOCK_ANDROID_SYMBOL_ARCHIVE="${SYMBOLS}"
          ls -la compose/androidApp/build/outputs/apk/${{ needs.resolve.outputs.android_variant }}/
          # Helper does the rest (build-metadata, build, asset, release, sign
          # skipped because APK is already on disk; depends on KMP follow-up
          # to integrate sign step into the helper itself).
          ./scripts/publish_android_hands_release.sh | tee hands-publish.log
          RELEASE_ID="$(awk '/^[[:space:]]*release:/ {print $2}' hands-publish.log | tail -n 1)"
          if [ -z "${RELEASE_ID}" ]; then
            echo "Could not parse release id from Hands publish output" >&2
            exit 1
          fi
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Create share page
        id: create-share-page
        if: needs.resolve.outputs.create_share_page == 'true'
        env:
          SLOCK_HANDS_CHANNEL: ${{ needs.resolve.outputs.hands_channel }}
          HANDS_CHANNEL: ${{ needs.resolve.outputs.hands_channel }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="${{ steps.publish-hands-release.outputs.release_id }}"
          echo "release_id=$RELEASE_ID"
          APP_ID="$(curl -fsS --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${HANDS_BEARER_TOKEN}" \
            "${HANDS_API:-https://hands.build}/api/apps" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(next(a['id'] for a in d.get('apps',[]) if a.get('slug')=='${{ env.HANDS_APP_SLUG }}'))")"
          # No ttl_seconds in the body = the share never expires (server-side
          # default). An explicit share_ttl_seconds input still sets one.
          TTL="${{ needs.resolve.outputs.share_ttl_seconds }}"
          if [ -n "$TTL" ]; then
            SHARE_BODY="{\"ttl_seconds\":${TTL}}"
          else
            SHARE_BODY="{}"
          fi
          SHARE_JSON="$(curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${HANDS_BEARER_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$SHARE_BODY" \
            "${HANDS_API:-https://hands.build}/api/apps/${APP_ID}/releases/${RELEASE_ID}/shares")"
          echo "$SHARE_JSON"
          SHARE_URL="$(printf '%s' "$SHARE_JSON" | python3 -c "import json,sys;print(json.load(sys.stdin)['share_url'])")"
          echo "share_url=$SHARE_URL" >> "$GITHUB_OUTPUT"

      - name: Step summary
        if: always()
        run: |
          {
            echo "### Hands publish summary"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **APK** | \`${{ needs.build_android_release.outputs.apk_path }}\` |"
            echo "| **APK sha256** | \`${{ needs.build_android_release.outputs.apk_sha256 }}\` |"
            echo "| **Hands channel** | \`${{ needs.resolve.outputs.hands_channel }}\` |"
            echo "| **Release mode** | \`${{ needs.resolve.outputs.release_mode }}\` |"
            echo "| **Release id** | \`${{ steps.publish-hands-release.outputs.release_id || '(none)' }}\` |"
            echo "| **Share URL** | ${{ steps.create-share-page.outputs.share_url || '(skipped)' }} |"
            echo
            if [ "${{ needs.resolve.outputs.release_mode }}" = "draft" ]; then
              echo "### Draft release — review required before publish"
              echo
              echo "Raw changelog (proofread + translate before publishing):"
              echo
              echo '```'
              cat changelog.txt 2>/dev/null || echo "(no changelog generated)"
              echo '```'
              echo
              echo "Publish flow (after owner approval). Publish only through finalize: it runs the channel guard before activating."
              echo "Do not run a bare hands releases publish; that skips the guard."
              echo
              echo '```sh'
              echo "hands releases show raft-android ${{ steps.publish-hands-release.outputs.release_id }}"
              echo "scripts/finalize_android_hands_release.sh --release ${{ steps.publish-hands-release.outputs.release_id }} \\"
              echo "  --version ${{ needs.resolve.outputs.version_major }}.${{ needs.resolve.outputs.version_minor }}.${{ needs.resolve.outputs.version_patch }} --build ${{ needs.resolve.outputs.version_build }} --channel ${{ needs.resolve.outputs.hands_channel }} \\"
              echo "  --zh-notes change-logs/${{ needs.resolve.outputs.version_major }}.${{ needs.resolve.outputs.version_minor }}.${{ needs.resolve.outputs.version_patch }}/android/zh-CN.md \\"
              echo "  --en-notes change-logs/${{ needs.resolve.outputs.version_major }}.${{ needs.resolve.outputs.version_minor }}.${{ needs.resolve.outputs.version_patch }}/android/en.md \\"
              echo "  --ja-notes change-logs/${{ needs.resolve.outputs.version_major }}.${{ needs.resolve.outputs.version_minor }}.${{ needs.resolve.outputs.version_patch }}/android/ja.md --confirm-publish"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sign_existing_aab:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.aab_signing_repair != '' }}
    permissions:
      contents: read
      actions: read
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 15
    environment: production
    env:
      EXPECTED_UPLOAD_CERT_SHA256: 5f08bbe82a27ccdad26c13523a60b5670d3aa7633e8ed2fd71fa6b5751f9b0b1
    steps:
      - name: Checkout signing implementation
        uses: actions/checkout@v7
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate repair identity inputs
        env:
          REPAIR_INPUT: ${{ inputs.aab_signing_repair }}
          PRODUCT_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          python3 - <<'PYINPUT'
          import json, os, re
          value = json.loads(os.environ['REPAIR_INPUT'])
          fields = {'hands_build_id': ('SOURCE_HANDS_BUILD_ID', r'[A-Za-z0-9-]+'),
                    'source_run_id': ('SOURCE_RUN_ID', r'[1-9][0-9]*'),
                    'aab_sha256': ('INPUT_AAB_SHA256', r'[0-9a-f]{64}'),
                    'apk_sha256': ('INPUT_APK_SHA256', r'[0-9a-f]{64}')}
          if set(value) != set(fields):
              raise SystemExit('Repair JSON must have exactly the four documented fields')
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['PRODUCT_SOURCE_SHA']):
              raise SystemExit('Repair requires the original full source_sha')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, (name, pattern) in fields.items():
                  if not isinstance(value[key], str) or not re.fullmatch(pattern, value[key]):
                      raise SystemExit('Invalid repair field: ' + key)
                  output.write(name + '=' + value[key] + '\n')
          PYINPUT
      - name: Verify original source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p repair
          gh api "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          jq -e --arg repo "$SOURCE_REPOSITORY" '
            .repository.full_name == $repo and .status == "completed" and .conclusion == "success" and
            .path == ".github/workflows/android-release.yml"
          ' "$RUNNER_TEMP/source-run.json" >/dev/null
          jq '{id,html_url,head_sha,path,status,conclusion}' "$RUNNER_TEMP/source-run.json" > repair/source-run.json
      - name: Download exact sealed AAB and APK
        env:
          HANDS_API: ${{ secrets.HANDS_API || 'https://hands.build' }}
          HANDS_ANDROID_APP_ID: ${{ secrets.HANDS_ANDROID_APP_ID }}
          HANDS_BEARER_TOKEN: ${{ secrets.QUIVER_BEARER_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/download_android_aab_repair.py repair
      - name: Sign AAB and verify unchanged application payload
        env:
          UPLOAD_KEYSTORE_FILE_B64: ${{ secrets.SLOCK_ROTATED_KEYSTORE_FILE_BASE64 }}
          SLOCK_UPLOAD_KEYSTORE_PASS: ${{ secrets.SLOCK_ROTATED_KEYSTORE_PASS }}
          SLOCK_UPLOAD_KEY_ALIAS: ${{ secrets.SLOCK_ROTATED_KEY_ALIAS }}
          SLOCK_UPLOAD_KEY_PASS: ${{ secrets.SLOCK_ROTATED_KEY_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          SLOCK_UPLOAD_KEYSTORE_FILE="$(mktemp "$RUNNER_TEMP/aab-upload-key.XXXXXX")"
          export SLOCK_UPLOAD_KEYSTORE_FILE
          trap 'rm -f "$SLOCK_UPLOAD_KEYSTORE_FILE"' EXIT
          printf '%s' "$UPLOAD_KEYSTORE_FILE_B64" | base64 -d > "$SLOCK_UPLOAD_KEYSTORE_FILE"
          scripts/sign_android_aab.sh repair/original.aab repair/androidApp-release.aab \
            "$EXPECTED_UPLOAD_CERT_SHA256" repair/aab-signature.json
      - name: Record signing-only provenance
        env:
          SIGNING_RUN_ID: ${{ github.run_id }}
          SIGNING_WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$INPUT_APK_SHA256" repair/original.apk | sha256sum --check
          jq -n --slurpfile source repair/source-receipt.json --slurpfile aab repair/aab-signature.json \
            --arg run "$SIGNING_RUN_ID" --arg sha "$SIGNING_WORKFLOW_SHA" \
            '{schema:"raft.android-aab-repair.v1",source:$source[0],aab:$aab[0],signing:{ci_run_id:$run,workflow_sha:$sha},rebuilt:false,apk_unchanged:true,play_acceptance:"NOT_CHECKED"}' \
            > repair/repair-provenance.json
          # Evidence only: Hands cannot replace a sealed bundle at the same
          # versionCode. Publication needs a higher versionCode and normal build.
      - name: Upload signed repair and evidence
        uses: actions/upload-artifact@v7
        with:
          name: android-aab-sign-repair-${{ github.run_id }}
          path: |
            repair/androidApp-release.aab
            repair/original.apk
            repair/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        run: |
          echo 'Signed existing AAB; application payload and original APK unchanged. Store acceptance has not been checked.' >> "$GITHUB_STEP_SUMMARY"
