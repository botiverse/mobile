name: Android Release

# Per owner 2026-07-03 16:39: versionX / Y / Z / build are dispatch inputs,
# not hardcoded. Default fallbacks preserve "today" if you want a smoke run.
# Two jobs:
#   1. build_android_release — always runs; produces a signed APK + metadata.
#   2. publish_quiver        — gated; only runs when dispatch input
#                               publish_quiver=true OR after manual approval on
#                               the `production` GitHub Environment.

on:
  workflow_dispatch:
    inputs:
      version_major:
        description: "versionName major (X)"
        required: true
        type: string
        default: "1"
      version_minor:
        description: "versionName minor (Y)"
        required: true
        type: string
        default: "0"
      version_patch:
        description: "versionName patch (Z)"
        required: true
        type: string
        default: "0"
      version_build:
        description: "versionCode build (x*1_000_000 + y*10_000 + z*100 + build)"
        required: true
        type: string
        default: "0"
      version_suffix:
        description: "versionName suffix (e.g. rc1); leave empty for release"
        required: false
        type: string
        default: ""
      quiver_channel:
        description: "Quiver channel: main | preview | nightly | debug"
        required: true
        type: choice
        default: "main"
        options:
          - main
          - preview
          - nightly
          - debug
      android_variant:
        description: "Gradle variant: release (default) | debug"
        required: true
        type: choice
        default: "release"
        options:
          - release
          - debug
      publish_quiver:
        description: "If true, push the signed APK + metadata to Quiver + create share page"
        required: true
        type: boolean
        default: false
      create_share_page:
        description: "If true (and publish_quiver=true), create a /share/<token> page for the release"
        required: true
        type: boolean
        default: true
      share_ttl_seconds:
        description: "Share page TTL in seconds (only used when create_share_page=true)"
        required: false
        type: string
        default: "604800"

  # Future: tag-triggered release
  # push:
  #   tags:
  #     - "v*.*.*"

env:
  # The lane's android-release docs require these envs:
  #   docs/android-release-lane-pi-perfprofiler.md
  #   docs/android-quiver-release-practices-2026-07-02.md
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
  GRADLE_MAX_WORKERS: "1"

permissions:
  contents: read
  packages: read

jobs:
  build_android_release:
    name: Build + sign APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      apk_path: ${{ steps.locate.outputs.apk_path }}
      apk_sha256: ${{ steps.verify.outputs.sha256 }}
      apk_size: ${{ steps.verify.outputs.size }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      version_name: ${{ steps.resolve.outputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials (for KuiklyBase)
        # The release helper's githubPackagesCredentials() reads
        # githubPackagesUsername / githubPackagesToken from
        # compose/github-packages.properties (untracked, .gitignore'd).
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${{ secrets.SLOCK_GITHUB_PACKAGES_USERNAME }}"
            echo "githubPackagesToken=${{ secrets.SLOCK_GITHUB_PACKAGES_TOKEN }}"
          } > compose/github-packages.properties

      - name: Publish Kuikly fork artifacts
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui
          scripts/build_kuikly_fork.sh --android-only

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          MAJOR="${{ inputs.version_major }}"
          MINOR="${{ inputs.version_minor }}"
          PATCH="${{ inputs.version_patch }}"
          BUILD="${{ inputs.version_build }}"
          SUFFIX="${{ inputs.version_suffix }}"
          # versionCode = X*1_000_000 + Y*10_000 + Z*100 + build (per
          # docs/android-quiver-release-practices-2026-07-02.md)
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + BUILD))
          if [ -n "$SUFFIX" ]; then
            VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}-${SUFFIX}"
          else
            VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Gradle build (assembleRelease / assembleDebug)
        working-directory: compose
        env:
          SLOCK_QUIVER_CHANNEL: ${{ inputs.quiver_channel }}
        shell: bash
        run: |
          GRADLE_ARGS=(
            :shared:generateSqlDelightInterface
            :androidApp:assemble${{ inputs.android_variant == 'debug' && 'Debug' || 'Release' }}
            "-PversionX=${{ inputs.version_major }}"
            "-PversionY=${{ inputs.version_minor }}"
            "-PversionZ=${{ inputs.version_patch }}"
            "-PversionBuild=${{ inputs.version_build }}"
          )
          if [ -n "${{ inputs.version_suffix }}" ]; then
            GRADLE_ARGS+=("-PversionSuffix=${{ inputs.version_suffix }}")
          fi
          ./gradlew \
            "${GRADLE_ARGS[@]}" \
            --no-daemon --max-workers=${{ env.GRADLE_MAX_WORKERS }} --console=plain

      - name: Determine APK path
        id: locate
        shell: bash
        run: |
          APK_DIR="compose/androidApp/build/outputs/apk/${{ inputs.android_variant }}"
          APK="$(find "${APK_DIR}" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${APK}" ]; then
            echo "No APK found under ${APK_DIR}" >&2
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Sign + align APK
        # Lane-canonical approach: zipalign + apksigner (the release helper
        # scripts/publish_android_quiver_release.sh does not sign; that's a
        # known gap for KMP's helper follow-up).
        env:
          KEYSTORE_FILE_B64: ${{ secrets.SLOCK_KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.SLOCK_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.SLOCK_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SLOCK_KEY_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$(mktemp -t slock-keystore-XXXXXX.jks)"
          echo "${KEYSTORE_FILE_B64}" | base64 -d > "${KEYSTORE_FILE}"
          export KEYSTORE_FILE
          BT="${ANDROID_HOME}/build-tools/36.0.0"
          UNSIGNED="${{ steps.locate.outputs.apk_path }}"
          ALIGNED="/tmp/androidApp-${{ inputs.android_variant }}-aligned.apk"
          SIGNED="/tmp/androidApp-${{ inputs.android_variant }}-signed.apk"
          "${BT}/zipalign" -p -f 4 "${UNSIGNED}" "${ALIGNED}"
          "${BT}/apksigner" sign \
            --ks "${KEYSTORE_FILE}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass "pass:${KEYSTORE_PASS}" \
            --key-pass "pass:${KEY_PASS}" \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "${SIGNED}" \
            "${ALIGNED}"
          # Replace the unsigned APK in the build outputs directory so the
          # downstream job can pick it up via the apk_path output.
          cp "${SIGNED}" "${UNSIGNED}"
          rm -f "${KEYSTORE_FILE}" "${ALIGNED}" "${SIGNED}"

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/36.0.0"
          APK="${{ steps.locate.outputs.apk_path }}"
          "${BT}/zipalign" -c -p 4 "${APK}"
          "${BT}/apksigner" verify --verbose --print-certs "${APK}" 2>&1 | tee apksigner-verify.log
          "${BT}/aapt" dump badging "${APK}" 2>&1 | tee aapt-badging.log
          echo "apk_path=${APK}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${APK}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "${APK}" 2>/dev/null || stat -f %z "${APK}")" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Step summary
        if: always()
        run: |
          {
            echo "### Android release build summary"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **versionCode** | \`${{ steps.resolve.outputs.version_code }}\` |"
            echo "| **versionName** | \`${{ steps.resolve.outputs.version_name }}\` |"
            echo "| **APK** | \`${{ steps.locate.outputs.apk_path }}\` |"
            echo "| **size (bytes)** | \`${{ steps.verify.outputs.size }}\` |"
            echo "| **sha256** | \`${{ steps.verify.outputs.sha256 }}\` |"
            echo "| **Quiver channel target** | \`${{ inputs.quiver_channel }}\` |"
            echo "| **Publish to Quiver** | \`${{ inputs.publish_quiver }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish_quiver:
    name: Publish to Quiver + create share page
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: build_android_release
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_quiver == true
    environment:
      name: production
      # Optional: enforce manual approval for `production` env in repo settings.
    env:
      QUIVER_APP_SLUG: raft-android
      QUIVER_BEARER_TOKEN: ${{ secrets.QUIVER_BEARER_TOKEN }}
      QUIVER_AUTH_TOKEN: ${{ secrets.QUIVER_BEARER_TOKEN }}
      # Mirror the chosen channel into both env names so the helper picks
      # it up AND any direct Quiver API calls (which use QUIVER_CHANNEL) stay
      # consistent.
      SLOCK_QUIVER_CHANNEL: ${{ inputs.quiver_channel }}
      QUIVER_CHANNEL: ${{ inputs.quiver_channel }}
      SLOCK_ANDROID_VARIANT: ${{ inputs.android_variant }}
      SLOCK_ANDROID_VERSION_MAJOR: ${{ inputs.version_major }}
      SLOCK_ANDROID_VERSION_MINOR: ${{ inputs.version_minor }}
      SLOCK_ANDROID_VERSION_PATCH: ${{ inputs.version_patch }}
      SLOCK_ANDROID_VERSION_BUILD: ${{ inputs.version_build }}
      SLOCK_ANDROID_VERSION_SUFFIX: ${{ inputs.version_suffix }}
      SLOCK_SKIP_GRADLE_BUILD: "1"
      # KMP follow-up: when helper gains sign/zipalign, flip this on.
      SLOCK_COLLECT_ANDROID_SYMBOLS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: dist/

      - name: Install Quiver CLI (npm)
        shell: bash
        run: |
          npm install -g @oranix/quiver-cli@0.1.0
          quiver --version

      - name: Generate changelog from git history
        id: generate-changelog
        shell: bash
        run: |
          set -euo pipefail
          # Range: previous build's provenance source_commit (authenticated
          # builds API) .. HEAD. Falls back to the last 15 subjects when the
          # previous commit is unknown or unreachable.
          QUIVER_API_BASE="${QUIVER_API:-https://quiver.oranix.io}"
          APP_ID="$(curl -fsS -H "Authorization: Bearer ${QUIVER_BEARER_TOKEN}" \
            "${QUIVER_API_BASE}/api/apps" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((a['id'] for a in d.get('apps',[]) if a.get('slug')=='${QUIVER_APP_SLUG}'), ''))" \
            2>/dev/null || true)"
          PREV_COMMIT=""
          if [ -n "${APP_ID}" ]; then
            PREV_COMMIT="$(curl -fsS -H "Authorization: Bearer ${QUIVER_BEARER_TOKEN}" \
              "${QUIVER_API_BASE}/api/apps/${APP_ID}/builds" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); bs=d.get('builds') or []; p=(bs[0].get('provenance_json') if bs else None); p=json.loads(p) if isinstance(p,str) else (p or {}); print(p.get('source_commit') or '')" \
              2>/dev/null || true)"
          fi
          echo "previous release commit: '${PREV_COMMIT:-none}'"
          if [ -n "${PREV_COMMIT}" ] && git cat-file -e "${PREV_COMMIT}^{commit}" 2>/dev/null; then
            git log --no-merges --pretty='- %s' "${PREV_COMMIT}..HEAD" | head -n 40 > changelog.txt
          fi
          if [ ! -s changelog.txt ]; then
            git log --no-merges --pretty='- %s' -15 > changelog.txt
          fi
          echo "---- changelog ----"
          cat changelog.txt

      - name: Build metadata + publish APK + (optional) mapping/symbols
        id: publish-quiver-release
        shell: bash
        env:
          SLOCK_RELEASE_CHANGELOG_FILE: ${{ github.workspace }}/changelog.txt
        run: |
          set -euo pipefail
          # The release helper handles metadata.json generation, channel
          # routing, and Quiver CLI invocation. Build + sign were already
          # done in build_android_release; --skip-gradle-build reuses the
          # signed APK on disk.
          APK="$(find dist -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${APK}" ]; then
            echo "No downloaded APK found under dist/" >&2
            exit 1
          fi
          mkdir -p compose/androidApp/build/outputs/apk/${{ inputs.android_variant }}
          cp "${APK}" "compose/androidApp/build/outputs/apk/${{ inputs.android_variant }}/androidApp-${{ inputs.android_variant }}.apk"
          ls -la compose/androidApp/build/outputs/apk/${{ inputs.android_variant }}/
          # Helper does the rest (build-metadata, build, asset, release, sign
          # skipped because APK is already on disk; depends on KMP follow-up
          # to integrate sign step into the helper itself).
          ./scripts/publish_android_quiver_release.sh | tee quiver-publish.log
          RELEASE_ID="$(awk '/^[[:space:]]*release:/ {print $2}' quiver-publish.log | tail -n 1)"
          if [ -z "${RELEASE_ID}" ]; then
            echo "Could not parse release id from Quiver publish output" >&2
            exit 1
          fi
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Create share page
        id: create-share-page
        if: inputs.create_share_page
        env:
          SLOCK_QUIVER_CHANNEL: ${{ inputs.quiver_channel }}
          QUIVER_CHANNEL: ${{ inputs.quiver_channel }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="${{ steps.publish-quiver-release.outputs.release_id }}"
          echo "release_id=$RELEASE_ID"
          APP_ID="$(curl -fsS \
            -H "Authorization: Bearer ${QUIVER_BEARER_TOKEN}" \
            "${QUIVER_API:-https://quiver.oranix.io}/api/apps" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(next(a['id'] for a in d.get('apps',[]) if a.get('slug')=='${{ env.QUIVER_APP_SLUG }}'))")"
          SHARE_JSON="$(curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${QUIVER_BEARER_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"ttl_seconds\":${{ inputs.share_ttl_seconds }}}" \
            "${QUIVER_API:-https://quiver.oranix.io}/api/apps/${APP_ID}/releases/${RELEASE_ID}/shares")"
          echo "$SHARE_JSON"
          SHARE_URL="$(printf '%s' "$SHARE_JSON" | python3 -c "import json,sys;print(json.load(sys.stdin)['share_url'])")"
          echo "share_url=$SHARE_URL" >> "$GITHUB_OUTPUT"

      - name: Step summary
        if: always()
        run: |
          {
            echo "### Quiver publish summary"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **APK** | \`${{ needs.build_android_release.outputs.apk_path }}\` |"
            echo "| **APK sha256** | \`${{ needs.build_android_release.outputs.apk_sha256 }}\` |"
            echo "| **Quiver channel** | \`${{ inputs.quiver_channel }}\` |"
            echo "| **Share URL** | ${{ steps.create-share-page.outputs.share_url || '(skipped)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
