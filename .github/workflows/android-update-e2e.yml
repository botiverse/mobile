name: Android Update E2E

# Automated in-app UPDATE test on a GitHub-hosted emulator (no Testbed):
# install A -> sign in with the QA account -> seed a draft -> the in-app update
# prompt offers B -> Download -> Android package installer -> app reopens on B,
# still signed in on the same server with the draft. docs/mobile-release-sop.md
# §7.2.1 has the manual version this automates.
#
# Two modes:
# 1. Real preview candidate (`preview_release_id` set, #proj-mobile-release:#29):
#    A = the active full-scope `preview` release downloaded from Hands;
#    B = the candidate `preview` draft, scoped to ONE device group holding only
#    this run's emulator, activated, verified, and NEVER cancelled by cleanup
#    (on pass, widen B with `hands releases update ... --full`; on fail, cancel
#    explicitly). Requires B to carry a universal (no-arch) or x86_64 APK.
# 2. Fixture fallback (`preview_release_id` empty):
#    A and B come from "Android App Update QA Fixture" (android-update-qa.yml)
#    on channel `debug`; cleanup removes the emulator and cancels B.

on:
  workflow_dispatch:
    inputs:
      preview_release_id:
        description: "Optional: Hands draft release id on preview to test real A (active preview) -> B (candidate) without building fixture APKs"
        required: false
        type: string
        default: ""
      source_sha:
        description: "Fixture mode only: full 40-char commit to build A and B from (default: the dispatched ref)"
        required: false
        type: string
        default: ""
      fixture_run_id:
        description: "Fixture mode only: reuse A/B APKs from an earlier run of this workflow or android-update-qa.yml instead of building"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      preview_release_id:
        required: false
        type: string
        default: ""
      source_sha:
        required: false
        type: string
        default: ""
      fixture_run_id:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  packages: read

# Single writer for the Hands device group / fixture release.
concurrency:
  group: android-update-e2e
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.p.outputs.mode }}
      preview_release_id: ${{ steps.p.outputs.preview_release_id }}
      source_sha: ${{ steps.p.outputs.source_sha }}
      build: ${{ steps.p.outputs.build }}
      version_major: ${{ steps.p.outputs.version_major }}
      baseline_build: ${{ steps.p.outputs.baseline_build }}
      target_build: ${{ steps.p.outputs.target_build }}
      fixture_generation: ${{ steps.p.outputs.fixture_generation }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Hands CLI
        run: npm install -g --ignore-scripts @botiverse/hands-cli@0.5.83
      - id: p
        env:
          HANDS_AUTH_TOKEN: ${{ secrets.QUIVER_BEARER_TOKEN }}
          HANDS_API: https://hands.build
          PREVIEW_RELEASE_ID: ${{ inputs.preview_release_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          FIXTURE_RUN_ID: ${{ inputs.fixture_run_id }}
        run: |
          set -euo pipefail
          if [ -n "${PREVIEW_RELEASE_ID}" ]; then
            if [ -n "${FIXTURE_RUN_ID}" ] || [ -n "${SOURCE_SHA}" ]; then
              echo "::error::preview_release_id cannot be combined with fixture_run_id or source_sha"
              exit 1
            fi
            [[ "${PREVIEW_RELEASE_ID}" =~ ^[0-9a-fA-F-]{8,64}$ ]] || { echo "::error::preview_release_id must be a release id"; exit 1; }
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            echo "preview_release_id=${PREVIEW_RELEASE_ID}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "source_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=fixture" >> "$GITHUB_OUTPUT"
          echo "preview_release_id=" >> "$GITHUB_OUTPUT"
          if [ -n "${FIXTURE_RUN_ID}" ]; then
            [[ "${FIXTURE_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "::error::fixture_run_id must be a run id"; exit 1; }
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "source_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SOURCE="${SOURCE_SHA:-$(git rev-parse HEAD)}"
          [[ "${SOURCE}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be a full lowercase commit SHA"; exit 1; }
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE}" >> "$GITHUB_OUTPUT"
          bash scripts/qa/android_update_hands_fixture.sh plan | tee -a "$GITHUB_OUTPUT"

  fixture:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/android-update-qa.yml
    secrets: inherit
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      fixture_generation: ${{ needs.plan.outputs.fixture_generation }}
      version_major: ${{ needs.plan.outputs.version_major }}
      baseline_build: ${{ needs.plan.outputs.baseline_build }}
      target_build: ${{ needs.plan.outputs.target_build }}

  e2e:
    needs: [plan, fixture]
    if: ${{ always() && needs.plan.result == 'success' && (needs.fixture.result == 'success' || needs.fixture.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HANDS_AUTH_TOKEN: ${{ secrets.QUIVER_BEARER_TOKEN }}
      HANDS_API: https://hands.build
      EVIDENCE: update-e2e-evidence
    steps:
      - uses: actions/checkout@v7

      - name: Install Hands CLI
        run: npm install -g --ignore-scripts @botiverse/hands-cli@0.5.83

      - name: Download A and B
        if: needs.plan.outputs.mode == 'fixture'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.fixture_run_id || github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p apks/a apks/b
          gh run download "${RUN_ID}" -R "${GITHUB_REPOSITORY}" -n android-update-qa-a-apk -D apks/a
          gh run download "${RUN_ID}" -R "${GITHUB_REPOSITORY}" -n android-update-qa-b-apk -D apks/b

      - name: Prepare real preview A and B (preview channel, e2e device group only)
        if: needs.plan.outputs.mode == 'preview'
        id: preview_hands
        env:
          PREVIEW_RELEASE_ID: ${{ needs.plan.outputs.preview_release_id }}
        run: |
          set -euo pipefail
          GROUP="$(bash scripts/qa/android_update_hands_fixture.sh group)"
          echo "group=${GROUP}" >> "$GITHUB_OUTPUT"
          bash scripts/qa/android_update_hands_fixture.sh preview-prepare "${PREVIEW_RELEASE_ID}" "${GROUP}" apks | tee -a "$GITHUB_OUTPUT"

      - name: Read A/B identity
        id: ids
        run: |
          set -euo pipefail
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          A="$(find apks/a -name '*.apk' | head -1)"; B="$(find apks/b -name '*.apk' | head -1)"
          [ -s "$A" ] && [ -s "$B" ] || { echo "::error::A or B APK missing"; exit 1; }
          badging() { "$BT/aapt" dump badging "$1" | head -1; }
          field() { sed -n "s/.* $2='\([^']*\)'.*/\1/p" <<<"$1"; }
          AB="$(badging "$A")"; BB="$(badging "$B")"
          A_PKG="$(field "$AB" name)"; B_PKG="$(field "$BB" name)"
          A_CODE="$(field "$AB" versionCode)"; B_CODE="$(field "$BB" versionCode)"
          [ "$A_PKG" = build.raft.app ] && [ "$B_PKG" = build.raft.app ] || { echo "::error::A/B must both be build.raft.app"; exit 1; }
          [ "$B_CODE" -gt "$A_CODE" ] || { echo "::error::B versionCode $B_CODE must exceed A $A_CODE"; exit 1; }
          A_SIGNER="$("$BT/apksigner" verify --print-certs "$A" | grep 'SHA-256' | sort)"
          B_SIGNER="$("$BT/apksigner" verify --print-certs "$B" | grep 'SHA-256' | sort)"
          [ "$A_SIGNER" = "$B_SIGNER" ] || { echo "::error::A and B are not signed by the same certificate"; exit 1; }
          {
            echo "a_apk=$A"; echo "b_apk=$B"
            echo "a_code=$A_CODE"; echo "b_code=$B_CODE"
            echo "a_name=$(field "$AB" versionName)"; echo "b_name=$(field "$BB" versionName)"
            echo "b_sha256=$(sha256sum "$B" | cut -d' ' -f1)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Serve B on Hands (debug channel, e2e device group only)
        if: needs.plan.outputs.mode == 'fixture'
        id: hands
        run: |
          set -euo pipefail
          GROUP="$(bash scripts/qa/android_update_hands_fixture.sh group)"
          echo "group=${GROUP}" >> "$GITHUB_OUTPUT"
          RID="$(bash scripts/qa/android_update_hands_fixture.sh publish "${{ steps.ids.outputs.b_apk }}" \
            "${{ steps.ids.outputs.b_name }}" "${{ steps.ids.outputs.b_code }}" "${GROUP}" "${{ needs.plan.outputs.source_sha || github.sha }}")"
          echo "release_id=${RID}" >> "$GITHUB_OUTPUT"
          echo "B ${{ steps.ids.outputs.b_code }} is Hands release ${RID} (raft-android/debug, device group only)"

      # The QA account goes only to the steps that use it (the preflight probe and the emulator
      # script), through their own env: from secrets.*, never through $GITHUB_ENV (that would hand
      # it to every later step and process of the job). scripts/ci/check_workflow_secret_env.py.
      - name: Preflight — QA account must not see the production server
        env:
          QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
        run: node scripts/qa/visible_servers_probe.mjs

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run update e2e on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 2
          disk-size: 6000M
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: node scripts/qa/android_update_e2e.mjs --apk-a "${{ steps.ids.outputs.a_apk }}" --a-code "${{ steps.ids.outputs.a_code }}" --b-code "${{ steps.ids.outputs.b_code }}" --b-name "${{ steps.ids.outputs.b_name }}" --hands-channel "${{ needs.plan.outputs.mode == 'preview' && 'preview' || 'debug' }}" --hands-group "${{ steps.preview_hands.outputs.group || steps.hands.outputs.group }}" --hands-release "${{ steps.preview_hands.outputs.b_release_id || steps.hands.outputs.release_id }}" --device-id-file "${{ runner.temp }}/hands-device-id" --out "${{ env.EVIDENCE }}"

      - name: Hands cleanup (remove emulator from group, cancel debug fixture B)
        if: always() && needs.plan.outputs.mode == 'fixture' && steps.hands.outputs.group != ''
        run: |
          DEVICE="$(cat "${RUNNER_TEMP}/hands-device-id" 2>/dev/null || true)"
          bash scripts/qa/android_update_hands_fixture.sh cleanup "${{ steps.hands.outputs.group }}" "${{ steps.hands.outputs.release_id }}" "${DEVICE}"
          rm -f "${RUNNER_TEMP}/hands-device-id"

      - name: Hands cleanup (remove emulator from group; keep preview candidate B)
        if: always() && needs.plan.outputs.mode == 'preview' && steps.preview_hands.outputs.group != ''
        run: |
          DEVICE="$(cat "${RUNNER_TEMP}/hands-device-id" 2>/dev/null || true)"
          bash scripts/qa/android_update_hands_fixture.sh preview-cleanup "${{ steps.preview_hands.outputs.group }}" "${DEVICE}"
          rm -f "${RUNNER_TEMP}/hands-device-id"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Android update e2e (${{ needs.plan.outputs.mode }})"
            echo "| | |"; echo "|---|---|"
            echo "| A | \`${{ steps.ids.outputs.a_name }}\` (${{ steps.ids.outputs.a_code }})${{ steps.preview_hands.outputs.a_release_id != '' && format(' · Hands `{0}`', steps.preview_hands.outputs.a_release_id) || '' }} |"
            echo "| B | \`${{ steps.ids.outputs.b_name }}\` (${{ steps.ids.outputs.b_code }}) |"
            if [ "${{ needs.plan.outputs.mode }}" = "preview" ]; then
              echo "| B served by | Hands raft-android/preview release \`${{ steps.preview_hands.outputs.b_release_id }}\`, device-group scope (kept after run) |"
            else
              echo "| B served by | Hands raft-android/debug release \`${{ steps.hands.outputs.release_id }}\`, device-group scope |"
            fi
            echo "| Emulator | API 34 google_apis x86_64, pixel_6 |"
            if [ -f "${EVIDENCE}/summary.json" ]; then
              echo; echo '```json'; cat "${EVIDENCE}/summary.json"; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-update-e2e-evidence
          path: ${{ env.EVIDENCE }}
          if-no-files-found: warn
          retention-days: 30
