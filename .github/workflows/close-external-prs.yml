# botiverse/mobile is public but does not accept external pull requests at this
# time (see CONTRIBUTING.md). This workflow closes pull requests opened from
# forks with an explanation. It never checks out or executes pull request code:
# pull_request_target is used only so the token may comment and close, and the
# job is limited to pull-requests:write.
name: Close external pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body: [
                "Thanks for your interest in Raft Mobile.",
                "",
                "This repository does not accept external pull requests at this time, so this PR is being",
                "closed automatically. See CONTRIBUTING.md for details and SECURITY.md for how to report",
                "security issues privately.",
              ].join("\n"),
            });
            await github.rest.pulls.update({ owner, repo, pull_number: number, state: "closed" });
