name: Play ownership registration APK (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-registration-apk:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    env:
      REGISTRATION_CODE: DJUWNF6OOB7PUAAAAAAAAAAAAA
      EXPECTED_CERT_SHA256: 5F08BBE82A27CCDAD26C13523A60B5670D3AA7633E8ED2FD71FA6B5751F9B0B1
      SLOCK_ROTATED_KEY_ALIAS: raft-android-release
      SLOCK_ROTATED_KEYSTORE_PASS: ${{ secrets.SLOCK_ROTATED_KEYSTORE_PASS }}
      SLOCK_ROTATED_KEY_PASS: ${{ secrets.SLOCK_ROTATED_KEY_PASS }}
      ROTATED_KEYSTORE_FILE_B64: ${{ secrets.SLOCK_ROTATED_KEYSTORE_FILE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - name: Write ownership registration marker
        working-directory: compose/androidApp
        run: |
          set -euo pipefail
          cleanup() { rm -f "${ks:-}" "${aligned:-}" "${signed:-}"; }
          trap cleanup EXIT
          mkdir -p src/main/assets
          printf '%s\n' "$REGISTRATION_CODE" > src/main/assets/adi-registration.properties

      - name: Build unsigned release APK
        working-directory: compose
        run: |
          set -euo pipefail
          ./gradlew :androidApp:assembleRelease --no-daemon --max-workers=1 --console=plain

      - name: Sign and verify registration APK
        id: sign
        working-directory: compose
        run: |
          set -euo pipefail
          test -n "$ROTATED_KEYSTORE_FILE_B64"
          test -n "$SLOCK_ROTATED_KEYSTORE_PASS"
          test -n "$SLOCK_ROTATED_KEY_PASS"
          unsigned="$(find androidApp/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          test -n "$unsigned"
          ks="$RUNNER_TEMP/raft-android-release.jks"
          aligned="$RUNNER_TEMP/registration-aligned.apk"
          signed="$RUNNER_TEMP/raft-play-ownership-registration.apk"
          printf '%s' "$ROTATED_KEYSTORE_FILE_B64" | base64 --decode > "$ks"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/zipalign" -f -P 16 4 "$unsigned" "$aligned"
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$SLOCK_ROTATED_KEY_ALIAS" \
            --ks-pass env:SLOCK_ROTATED_KEYSTORE_PASS --key-pass env:SLOCK_ROTATED_KEY_PASS \
            --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false \
            --out "$signed" "$aligned"
          "$bt/apksigner" verify --verbose --print-certs "$signed" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -Eqi "Signer #[0-9]+ certificate SHA-256 digest: ${EXPECTED_CERT_SHA256}" "$RUNNER_TEMP/apksigner.txt"
          test "$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump packagename "$signed")" = 'build.raft.app'
          unzip -p "$signed" assets/adi-registration.properties | tr -d '\r\n' | grep -Fxq "$REGISTRATION_CODE"
          sha256sum "$signed" | tee "$RUNNER_TEMP/apk.sha256"
          cp "$signed" "$GITHUB_WORKSPACE/raft-play-ownership-registration.apk"
          cp "$RUNNER_TEMP/apk.sha256" "$GITHUB_WORKSPACE/raft-play-ownership-registration.apk.sha256"
          cp "$RUNNER_TEMP/apksigner.txt" "$GITHUB_WORKSPACE/raft-play-ownership-registration.apksigner.txt"

      - name: Upload private registration artifact
        uses: actions/upload-artifact@v4
        with:
          name: raft-play-ownership-registration
          retention-days: 1
          if-no-files-found: error
          path: |
            raft-play-ownership-registration.apk
            raft-play-ownership-registration.apk.sha256
            raft-play-ownership-registration.apksigner.txt
