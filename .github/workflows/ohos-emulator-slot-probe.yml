name: OHOS bare-metal emulator slot probe

on:
  pull_request:
    paths:
      - .github/workflows/ohos-emulator-slot-probe.yml
      - scripts/ci/ohos-slot-guard.sh
      - scripts/ci/test_ohos_slot_guard.sh
      - scripts/ci/testdata/fake-ohos-hdc.sh
      - docs/ohos-self-hosted-runner.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contract:
    name: Validate slot guard contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate workflow and guard
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/ohos-emulator-slot-probe.yml")'
          bash -n scripts/ci/ohos-slot-guard.sh
          bash -n scripts/ci/test_ohos_slot_guard.sh
          bash -n scripts/ci/testdata/fake-ohos-hdc.sh
          scripts/ci/test_ohos_slot_guard.sh

  slot-1:
    name: Probe API 23 slot 1
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, ohos-emulator-api23, ohos-emulator-api23-slot-1]
    timeout-minutes: 10
    concurrency:
      group: raft-ohos-emulator-api23-slot-1
      cancel-in-progress: false
    env:
      OHOS_SLOT_LOCK_OWNER: ${{ github.run_id }}:${{ github.run_attempt }}:${{ github.job }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Acquire fixed emulator slot
        id: acquire
        shell: bash
        run: scripts/ci/ohos-slot-guard.sh acquire

      - name: Record live identity and screenshot
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/ohos-emulator-slot-1"
          mkdir -p "$EVIDENCE"
          scripts/ci/ohos-slot-guard.sh verify | tee "$EVIDENCE/identity.txt"
          scripts/ci/ohos-slot-guard.sh hdc shell snapshot_display \
            -f /data/local/tmp/raft-runner-slot-probe.jpeg \
            >"$EVIDENCE/snapshot-command.txt" 2>&1
          scripts/ci/ohos-slot-guard.sh hdc file recv \
            /data/local/tmp/raft-runner-slot-probe.jpeg \
            "$EVIDENCE/slot-1.jpeg" \
            >>"$EVIDENCE/snapshot-command.txt" 2>&1

      - name: Clean probe-owned device file
        if: always() && steps.acquire.outcome == 'success'
        shell: bash
        run: |
          scripts/ci/ohos-slot-guard.sh hdc shell \
            rm -f /data/local/tmp/raft-runner-slot-probe.jpeg || true

      - name: Release fixed emulator slot
        if: always() && steps.acquire.outcome == 'success'
        shell: bash
        run: scripts/ci/ohos-slot-guard.sh release

      - name: Upload slot evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ohos-emulator-api23-slot-1
          path: ${{ runner.temp }}/ohos-emulator-slot-1/
          if-no-files-found: warn
          retention-days: 14
