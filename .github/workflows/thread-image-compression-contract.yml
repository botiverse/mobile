name: Thread image compression contract

# The checker scans the complete Mobile source surface, so this invariant must
# run for every pull request and main push rather than only when one of the
# implementation files changes.  A manual run is useful when a hosted compiler
# or platform lane is unavailable: this is a source contract, not runtime/device
# evidence.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thread-image-compression-contract:
    name: Image compression contract invariant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact change
        uses: actions/checkout@v5
        with:
          # Bind the check to the submitted PR head, not GitHub's synthetic
          # merge ref. Push/manual runs use the event SHA directly.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_SHA" "$actual"
          test "$actual" = "$EXPECTED_SHA"

      - name: Run checker self-test and live contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check_thread_image_compression_contract.py --self-test
          python3 scripts/ci/check_thread_image_compression_contract.py
