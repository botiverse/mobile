name: Perf Benchmark (task #187)

# CI-emulator (SwiftShader softGPU) launch + render-jank benchmark for a single
# immutable APK. Built for 1.9.0 release validation (task #187). Reuses the
# scripts/perf toolchain. Jank on a softGPU emulator is RELATIVE / TREND only --
# never a physical-GPU absolute. Physical cloud-device path is a separate seat.

on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: "Same-repo run id holding the alpha APK artifact"
        required: true
        default: "30646272012"
      apk_artifact:
        description: "APK artifact name on that run"
        required: true
        default: "android-alpha-1763-c891f9d45f48528b98a7308a85d00f1dda57e2fd"
      expected_sha256:
        description: "Expected APK SHA-256 (fail-closed if mismatch)"
        required: true
        default: "58bc25a986fb28e8b62a71b295ab94b2f6c3d4d47128f85c697ec5f7a62e03de"
      package:
        description: "Application id to benchmark"
        required: true
        default: "build.raft.app.alpha"
      iterations:
        description: "Samples per launch mode (N>=5)"
        required: true
        default: "6"

# actions:read is required for actions/download-artifact@v7 to fetch the alpha
# APK from another (same-repo) run; the default token otherwise 403s with
# "Resource not accessible by integration".
permissions:
  contents: read
  actions: read

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Free runner disk space for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Download alpha APK (same-repo cross-run)
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.inputs.apk_artifact }}
          run-id: ${{ github.event.inputs.apk_run_id }}
          github-token: ${{ github.token }}
          path: alpha-apk

      - name: Locate + verify APK bytes (fail-closed on SHA mismatch)
        id: apk
        run: |
          set -euo pipefail
          APK="$(find alpha-apk -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then echo "no apk in artifact"; ls -R alpha-apk; exit 1; fi
          ACTUAL="$(sha256sum "$APK" | cut -d' ' -f1)"
          EXPECTED="${{ github.event.inputs.expected_sha256 }}"
          echo "apk=$APK bytes=$(stat -c%s "$APK") sha256=$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK SHA mismatch: got $ACTUAL expected $EXPECTED"; exit 1
          fi
          echo "verified immutable APK, sha256 == expected"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run perf benchmark on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          PKG: ${{ github.event.inputs.package }}
          ITERS: ${{ github.event.inputs.iterations }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6_pro
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          # Each script line is a separate command (no line continuations).
          script: |
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r -g "$APK_PATH"
            echo "resolving launcher component for $PKG"
            adb shell cmd package resolve-activity --brief "$PKG" | tail -1 > component.txt
            echo "component=$(cat component.txt)"
            mkdir -p artifacts
            # NB: android-emulator-runner runs each script line as its OWN shell,
            # so a shell var set on one line is empty on the next. Read the
            # resolved component from the file inline, in this same line.
            python3 scripts/perf/launch_bench.py --device emulator-5554 --package "$PKG" --component "$(cat component.txt)" --iterations "$ITERS" --out artifacts/perf-launch
            echo "=== device fingerprint ==="
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.product.model
            adb shell dumpsys package "$PKG" | grep -E "versionName|versionCode" | head -2

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-benchmark-task187
          path: |
            artifacts/perf-launch/**
            component.txt

      - name: Summary
        if: always()
        run: |
          echo "## Perf benchmark (task #187)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/perf-launch/launch_bench.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/perf-launch/launch_bench.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no launch_bench.json produced" >> "$GITHUB_STEP_SUMMARY"
          fi
