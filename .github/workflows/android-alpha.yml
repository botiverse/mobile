name: Android Alpha Validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or commit to build; blank uses the selected workflow ref"
        required: false
        type: string
        default: ""
  pull_request:
    types: [labeled, synchronize]

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
  GRADLE_MAX_WORKERS: "1"

permissions:
  contents: read
  packages: read

jobs:
  build_alpha:
    name: Build .alpha APK
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-alpha')
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 30
    steps:
      - name: Checkout workflow base
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve source commit
        id: source
        env:
          REQUESTED_REF: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          sha="$(scripts/resolve_git_revision.sh "$REQUESTED_REF")"
          git checkout --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${{ secrets.SLOCK_GITHUB_PACKAGES_USERNAME }}"
            echo "githubPackagesToken=${{ secrets.SLOCK_GITHUB_PACKAGES_TOKEN }}"
          } > compose/github-packages.properties

      - name: Publish Kuikly fork artifacts
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui
          scripts/build_kuikly_fork.sh --android-only

      - name: Build alpha debug APK
        working-directory: compose
        env:
          SLOCK_QUIVER_CHANNEL: debug
        shell: bash
        run: |
          ./gradlew \
            :shared:generateSqlDelightInterface \
            :androidApp:assembleAlpha \
            -PversionSuffix=alpha \
            --no-daemon --max-workers=${{ env.GRADLE_MAX_WORKERS }} --console=plain

      - name: Locate alpha APK
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find compose/androidApp/build/outputs/apk/alpha -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          test -n "${APK}"
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"

      - name: Verify NetworkKMM curl runtime and pinned CA
        shell: bash
        run: |
          compose/androidApp/src/test/scripts/check_networkkmm_curl_runtime_package.sh \
            --self-test \
            "${{ steps.locate.outputs.apk }}"

      - name: Sign alpha APK with rotated release identity
        env:
          LEGACY_KEYSTORE_FILE_B64: ${{ secrets.SLOCK_KEYSTORE_FILE_BASE64 }}
          SLOCK_LEGACY_KEYSTORE_PASS: ${{ secrets.SLOCK_KEYSTORE_PASS }}
          SLOCK_LEGACY_KEY_ALIAS: ${{ secrets.SLOCK_KEY_ALIAS }}
          SLOCK_LEGACY_KEY_PASS: ${{ secrets.SLOCK_KEY_PASS }}
          ROTATED_KEYSTORE_FILE_B64: ${{ secrets.SLOCK_ROTATED_KEYSTORE_FILE_BASE64 }}
          SLOCK_ROTATED_KEYSTORE_PASS: ${{ secrets.SLOCK_ROTATED_KEYSTORE_PASS }}
          SLOCK_ROTATED_KEY_ALIAS: ${{ secrets.SLOCK_ROTATED_KEY_ALIAS }}
          SLOCK_ROTATED_KEY_PASS: ${{ secrets.SLOCK_ROTATED_KEY_PASS }}
          SIGNING_LINEAGE_B64: ${{ secrets.SLOCK_SIGNING_LINEAGE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            LEGACY_KEYSTORE_FILE_B64 \
            SLOCK_LEGACY_KEYSTORE_PASS \
            SLOCK_LEGACY_KEY_ALIAS \
            SLOCK_LEGACY_KEY_PASS \
            ROTATED_KEYSTORE_FILE_B64 \
            SLOCK_ROTATED_KEYSTORE_PASS \
            SLOCK_ROTATED_KEY_ALIAS \
            SLOCK_ROTATED_KEY_PASS \
            SIGNING_LINEAGE_B64; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required rotated Alpha signing secret: ${name}" >&2
              exit 1
            fi
          done
          SLOCK_LEGACY_KEYSTORE_FILE="$(mktemp -t raft-alpha-legacy-keystore-XXXXXX.jks)"
          SLOCK_ROTATED_KEYSTORE_FILE="$(mktemp -t raft-alpha-rotated-keystore-XXXXXX.jks)"
          SLOCK_SIGNING_LINEAGE_FILE="$(mktemp -t raft-alpha-signing-lineage-XXXXXX.bin)"
          export SLOCK_LEGACY_KEYSTORE_FILE SLOCK_ROTATED_KEYSTORE_FILE SLOCK_SIGNING_LINEAGE_FILE
          cleanup() {
            rm -f \
              "${SLOCK_LEGACY_KEYSTORE_FILE}" \
              "${SLOCK_ROTATED_KEYSTORE_FILE}" \
              "${SLOCK_SIGNING_LINEAGE_FILE}"
          }
          trap cleanup EXIT
          echo "${LEGACY_KEYSTORE_FILE_B64}" | base64 -d > "${SLOCK_LEGACY_KEYSTORE_FILE}"
          echo "${ROTATED_KEYSTORE_FILE_B64}" | base64 -d > "${SLOCK_ROTATED_KEYSTORE_FILE}"
          echo "${SIGNING_LINEAGE_B64}" | base64 -d > "${SLOCK_SIGNING_LINEAGE_FILE}"
          BT="${ANDROID_HOME}/build-tools/36.0.0"
          APK="${{ steps.locate.outputs.apk }}"
          scripts/sign_android_apk_with_rotation.sh \
            --input "${APK}" \
            --output "${APK}" \
            --build-tools-dir "${BT}" \
            --verify-log apksigner-verify.log

      - name: Verify alpha package
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.locate.outputs.apk }}"
          BT="${ANDROID_HOME}/build-tools/36.0.0"
          "${BT}/zipalign" -c -p 4 "$APK"
          "${BT}/apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee apksigner-verify.log
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner-verify.log
          if grep -q "CN=Android Debug" apksigner-verify.log; then
            echo "Alpha APK still uses the ephemeral Android Debug signer" >&2
            exit 1
          fi
          LEGACY_SIGNER_SHA256="$(sed -n 's/^Signer (minSdkVersion=[0-9][0-9]*, maxSdkVersion=32) certificate SHA-256 digest: //p' apksigner-verify.log | head -n 1)"
          ROTATED_SIGNER_SHA256="$(sed -n 's/^Signer (minSdkVersion=33, maxSdkVersion=[0-9][0-9]*) certificate SHA-256 digest: //p' apksigner-verify.log | head -n 1)"
          test -n "${LEGACY_SIGNER_SHA256}"
          test -n "${ROTATED_SIGNER_SHA256}"
          "${BT}/aapt" dump badging "$APK" | tee aapt-badging.log
          grep -q "package: name='build.raft.app.alpha'" aapt-badging.log
          grep -q "application-label:'Raft Alpha'" aapt-badging.log
          grep -q "versionName='[^']*-alpha'" aapt-badging.log
          SOURCE_SHA="${{ steps.source.outputs.sha }}"
          cp "$APK" androidApp-alpha-${SOURCE_SHA::9}.apk
          echo "apk=androidApp-alpha-${SOURCE_SHA::9}.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "androidApp-alpha-${SOURCE_SHA::9}.apk" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "legacy_signer_sha256=${LEGACY_SIGNER_SHA256}" >> "$GITHUB_OUTPUT"
          echo "rotated_signer_sha256=${ROTATED_SIGNER_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload alpha APK
        uses: actions/upload-artifact@v4
        with:
          name: android-alpha-${{ github.event.pull_request.number || github.run_number }}-${{ steps.source.outputs.sha }}
          path: |
            ${{ steps.verify.outputs.apk }}
            aapt-badging.log
            apksigner-verify.log
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Android .alpha validation package"
            echo "- Ref: \`${{ steps.source.outputs.sha }}\`"
            echo "- Package: \`build.raft.app.alpha\`"
            echo "- API 24-32 signer SHA-256: \`${{ steps.verify.outputs.legacy_signer_sha256 }}\`"
            echo "- API 33+ signer SHA-256: \`${{ steps.verify.outputs.rotated_signer_sha256 }}\`"
            echo "- APK SHA-256: \`${{ steps.verify.outputs.sha256 }}\`"
            echo "- Artifact retention: 7 days"
          } >> "$GITHUB_STEP_SUMMARY"
