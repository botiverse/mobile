name: Android Alpha Validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or commit to build; blank uses the selected workflow ref"
        required: false
        type: string
        default: ""
      version_patch:
        description: "Alpha patch component (0-99); advance after build 99 is consumed"
        required: false
        type: string
        default: "0"
      version_build:
        description: "Alpha build component (0-99); use a strictly increasing value for update testing"
        required: false
        type: string
        default: "1"
  pull_request:
    types: [labeled, synchronize]

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
  GRADLE_MAX_WORKERS: "1"

permissions:
  contents: read
  packages: read

jobs:
  build_alpha:
    name: Build .alpha APK
    # Fork pull requests never receive repository secrets (signing keystores below), so only
    # same-repository PRs may build; forks would only fail noisily once the repo is public.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (contains(github.event.pull_request.labels.*.name, 'build-alpha')
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout workflow base
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The requested artifact source may predate these local actions. Preserve
      # the workflow-owned implementations before checking out product source.
      - name: Stage workflow action implementations
        shell: bash
        run: |
          tar -C . -cf "$RUNNER_TEMP/android-alpha-workflow-actions.tar" \
            .github/actions/gradle-cache-policy \
            .github/actions/gradle-failure-diagnostics \
            .github/gradle-cache-epoch \
            .github/gradle-cache-quarantine \
            scripts/verify_android_apk_with_rotation.sh

      - name: Resolve source commit
        id: source
        env:
          REQUESTED_REF: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          sha="$(scripts/resolve_git_revision.sh "$REQUESTED_REF")"
          git checkout --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore workflow action implementations
        if: always()
        shell: bash
        run: |
          tar -C . -xf "$RUNNER_TEMP/android-alpha-workflow-actions.tar"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build alpha debug APK
        working-directory: compose
        env:
          SLOCK_HANDS_CHANNEL: debug
          ALPHA_VERSION_PATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.version_patch || '0' }}
          ALPHA_VERSION_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.version_build || '0' }}
        shell: bash
        run: |
          if ! [[ "${ALPHA_VERSION_PATCH}" =~ ^[0-9]{1,2}$ ]]; then
            echo "version_patch must be an integer from 0 to 99" >&2
            exit 1
          fi
          if ! [[ "${ALPHA_VERSION_BUILD}" =~ ^[0-9]{1,3}$ ]]; then
            echo "version_build must be an integer from 0 to 999" >&2
            exit 1
          fi
          ./gradlew \
            :shared:generateSqlDelightInterface \
            :androidApp:assembleAlpha \
            :androidApp:copyHandsNativeSymbols \
            "-PversionZ=${ALPHA_VERSION_PATCH}" \
            "-PversionBuild=${ALPHA_VERSION_BUILD}" \
            "-PversionCode=$(scripts/ci/version_code.sh 1 0 "${ALPHA_VERSION_PATCH}" "${ALPHA_VERSION_BUILD}")" \
            -PversionSuffix=alpha \
            --no-daemon --max-workers=${{ env.GRADLE_MAX_WORKERS }} --console=plain --stacktrace

      - name: Locate alpha APK
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find compose/androidApp/build/outputs/apk/alpha -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          test -n "${APK}"
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"

      - name: Sign alpha APK with rotated release identity
        env:
          LEGACY_KEYSTORE_FILE_B64: ${{ secrets.SLOCK_KEYSTORE_FILE_BASE64 }}
          SLOCK_LEGACY_KEYSTORE_PASS: ${{ secrets.SLOCK_KEYSTORE_PASS }}
          SLOCK_LEGACY_KEY_ALIAS: ${{ secrets.SLOCK_KEY_ALIAS }}
          SLOCK_LEGACY_KEY_PASS: ${{ secrets.SLOCK_KEY_PASS }}
          ROTATED_KEYSTORE_FILE_B64: ${{ secrets.SLOCK_ROTATED_KEYSTORE_FILE_BASE64 }}
          SLOCK_ROTATED_KEYSTORE_PASS: ${{ secrets.SLOCK_ROTATED_KEYSTORE_PASS }}
          SLOCK_ROTATED_KEY_ALIAS: ${{ secrets.SLOCK_ROTATED_KEY_ALIAS }}
          SLOCK_ROTATED_KEY_PASS: ${{ secrets.SLOCK_ROTATED_KEY_PASS }}
          SIGNING_LINEAGE_B64: ${{ secrets.SLOCK_SIGNING_LINEAGE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            LEGACY_KEYSTORE_FILE_B64 \
            SLOCK_LEGACY_KEYSTORE_PASS \
            SLOCK_LEGACY_KEY_ALIAS \
            SLOCK_LEGACY_KEY_PASS \
            ROTATED_KEYSTORE_FILE_B64 \
            SLOCK_ROTATED_KEYSTORE_PASS \
            SLOCK_ROTATED_KEY_ALIAS \
            SLOCK_ROTATED_KEY_PASS \
            SIGNING_LINEAGE_B64; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required rotated Alpha signing secret: ${name}" >&2
              exit 1
            fi
          done
          SLOCK_LEGACY_KEYSTORE_FILE="$(mktemp -t raft-alpha-legacy-keystore-XXXXXX.jks)"
          SLOCK_ROTATED_KEYSTORE_FILE="$(mktemp -t raft-alpha-rotated-keystore-XXXXXX.jks)"
          SLOCK_SIGNING_LINEAGE_FILE="$(mktemp -t raft-alpha-signing-lineage-XXXXXX.bin)"
          export SLOCK_LEGACY_KEYSTORE_FILE SLOCK_ROTATED_KEYSTORE_FILE SLOCK_SIGNING_LINEAGE_FILE
          cleanup() {
            rm -f \
              "${SLOCK_LEGACY_KEYSTORE_FILE}" \
              "${SLOCK_ROTATED_KEYSTORE_FILE}" \
              "${SLOCK_SIGNING_LINEAGE_FILE}"
          }
          trap cleanup EXIT
          echo "${LEGACY_KEYSTORE_FILE_B64}" | base64 -d > "${SLOCK_LEGACY_KEYSTORE_FILE}"
          echo "${ROTATED_KEYSTORE_FILE_B64}" | base64 -d > "${SLOCK_ROTATED_KEYSTORE_FILE}"
          echo "${SIGNING_LINEAGE_B64}" | base64 -d > "${SLOCK_SIGNING_LINEAGE_FILE}"
          BT="${ANDROID_HOME}/build-tools/36.0.0"
          APK="${{ steps.locate.outputs.apk }}"
          scripts/sign_android_apk_with_rotation.sh \
            --input "${APK}" \
            --output "${APK}" \
            --build-tools-dir "${BT}" \
            --verify-log apksigner-verify.log

      - name: Verify alpha package
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.locate.outputs.apk }}"
          BT="${ANDROID_HOME}/build-tools/36.0.0"
          scripts/verify_android_apk_with_rotation.sh \
            --apk "$APK" \
            --build-tools-dir "$BT" \
            --verify-log apksigner-verify.log
          if grep -q "CN=Android Debug" apksigner-verify.log; then
            echo "Alpha APK still uses the ephemeral Android Debug signer" >&2
            exit 1
          fi
          LEGACY_SIGNER_SHA256="$(sed -n 's/^Signer (minSdkVersion=[0-9][0-9]*, maxSdkVersion=32) certificate SHA-256 digest: //p' apksigner-verify.log | head -n 1)"
          ROTATED_SIGNER_SHA256="$(sed -n 's/^Signer (minSdkVersion=33, maxSdkVersion=[0-9][0-9]*) certificate SHA-256 digest: //p' apksigner-verify.log | head -n 1)"
          test -n "${LEGACY_SIGNER_SHA256}"
          test -n "${ROTATED_SIGNER_SHA256}"
          "${BT}/aapt" dump badging "$APK" | tee aapt-badging.log
          grep -q "package: name='build.raft.app.alpha'" aapt-badging.log
          grep -q "application-label:'Raft Alpha'" aapt-badging.log
          grep -q "versionName='[^']*-alpha[^']*'" aapt-badging.log
          SOURCE_SHA="${{ steps.source.outputs.sha }}"
          EXPECTED_MIN_SDK=29
          # The approved 1.7.0 QA source predates the API 29 floor. Keep this
          # exception pinned to its full immutable source identity rather than
          # weakening the current Alpha package contract for arbitrary refs.
          if [[ "$SOURCE_SHA" == "463fe882575ff702006076e9267acc9f2b4213a3" ]]; then
            EXPECTED_MIN_SDK=24
          fi
          grep -q "^sdkVersion:'${EXPECTED_MIN_SDK}'$" aapt-badging.log
          VERSION_CODE="$(sed -n "s/^package: .* versionCode='\([^']*\)'.*/\1/p" aapt-badging.log | head -n 1)"
          VERSION_NAME="$(sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p" aapt-badging.log | head -n 1)"
          test -n "${VERSION_CODE}"
          test -n "${VERSION_NAME}"
          cp "$APK" androidApp-alpha-${SOURCE_SHA::9}.apk
          echo "apk=androidApp-alpha-${SOURCE_SHA::9}.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "androidApp-alpha-${SOURCE_SHA::9}.apk" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "legacy_signer_sha256=${LEGACY_SIGNER_SHA256}" >> "$GITHUB_OUTPUT"
          echo "rotated_signer_sha256=${ROTATED_SIGNER_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Verify exact Hands native symbols
        id: native-symbols
        shell: bash
        run: |
          set -euo pipefail
          SYMBOLS_DIR="compose/androidApp/build/outputs/hands-native-symbols"
          if [ ! -d "${SYMBOLS_DIR}" ]; then
            echo "Hands native symbols output directory was not created" >&2
            exit 1
          fi
          mapfile -t ARCHIVES < <(find "${SYMBOLS_DIR}" -maxdepth 1 -type f -name '*-native-symbols.zip' | sort)
          if [ "${#ARCHIVES[@]}" -ne 1 ]; then
            echo "Expected exactly one Hands native symbols classifier, found ${#ARCHIVES[@]}" >&2
            printf '  %s\n' "${ARCHIVES[@]}" >&2
            exit 1
          fi
          ARCHIVE="${ARCHIVES[0]}"
          scripts/verify_android_native_symbols.sh \
            --apk "${{ steps.verify.outputs.apk }}" \
            --symbols "${ARCHIVE}"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${ARCHIVE}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload alpha APK
        uses: actions/upload-artifact@v6
        with:
          name: android-alpha-${{ github.event.pull_request.number || github.run_number }}-${{ steps.source.outputs.sha }}
          path: |
            ${{ steps.verify.outputs.apk }}
            aapt-badging.log
            apksigner-verify.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload exact Hands native symbols
        uses: actions/upload-artifact@v6
        with:
          name: android-alpha-native-symbols-${{ github.event.pull_request.number || github.run_number }}-${{ steps.source.outputs.sha }}
          path: ${{ steps.native-symbols.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Android .alpha validation package"
            echo "- Ref: \`${{ steps.source.outputs.sha }}\`"
            echo "- Package: \`build.raft.app.alpha\`"
            echo "- Version: \`${{ steps.verify.outputs.version_name }} (${{ steps.verify.outputs.version_code }})\`"
            echo "- Minimum Android: 10 (API 29)"
            echo "- API 29-32 signer SHA-256: \`${{ steps.verify.outputs.legacy_signer_sha256 }}\`"
            echo "- API 33+ signer SHA-256: \`${{ steps.verify.outputs.rotated_signer_sha256 }}\`"
            echo "- APK SHA-256: \`${{ steps.verify.outputs.sha256 }}\`"
            echo "- Hands native symbols SHA-256: \`${{ steps.native-symbols.outputs.sha256 }}\`"
            echo "- Artifact retention: 7 days"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics
