name: QA Provider Probe

# Measures review-panel provider reachability and minimal-completion latency
# from the SAME runner class that runs qa-review-panel.yml. The dispatcher can
# only pick a NAMED target from the reviewed allowlist frozen in
# scripts/qa/provider_probe.mjs (PROBE_TARGETS) — never a free-form URL — so
# the repo API key can never be pointed at an arbitrary authority. Adding a
# target (e.g. the CF proxy once its origin exists) is a reviewed PR that
# freezes the exact origin. Logs and the uploaded report contain latency,
# HTTP status, and error class only — never the API key.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Named probe target from the reviewed allowlist"
        required: false
        type: choice
        options:
          - direct-qwen
        default: direct-qwen
      model:
        description: "Model for the 1-token completion probe"
        required: false
        type: string
        default: "qwen3.8-max-preview"
      completion:
        description: "Run the authenticated 1-token completion probe"
        required: false
        type: boolean
        default: true
      completion_timeout_ms:
        description: "Completion probe hard timeout in ms"
        required: false
        type: string
        default: "90000"

permissions:
  contents: read

jobs:
  probe:
    name: Probe provider from panel runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout mobile
        uses: actions/checkout@v7

      - name: Probe provider
        env:
          QWEN_TOKEN_PLAN_CN_API_KEY: ${{ secrets.QWEN_TOKEN_PLAN_CN_API_KEY }}
          PROBE_TARGET: ${{ inputs.target }}
          PROBE_MODEL: ${{ inputs.model }}
          PROBE_COMPLETION: ${{ inputs.completion }}
          PROBE_COMPLETION_TIMEOUT_MS: ${{ inputs.completion_timeout_ms }}
        run: |
          set -euo pipefail
          args=(--out provider-probe.json --target "$PROBE_TARGET" --model "$PROBE_MODEL" --completion-timeout-ms "$PROBE_COMPLETION_TIMEOUT_MS")
          if [ "$PROBE_COMPLETION" != "true" ]; then args+=(--no-completion); fi
          node scripts/qa/provider_probe.mjs "${args[@]}"

      - name: Upload probe report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: provider-probe-report
          path: provider-probe.json
          if-no-files-found: error
