# task #232/#233: on-demand installable iOS Simulator app for acceptance.
#
# Why this exists: runtime acceptance (Jony's seat) needs an installable
# `.app` bound to an exact commit, but the repo had no per-exact publishing
# channel — the compile gate produces no app, and qa-acceptance-ios.yml only
# CONSUMES a frozen `ios-simulator-app-<run>` artifact from an earlier run.
# This workflow is that producer: dispatch it on any ref, download the
# artifact, install in a Simulator. The artifact name matches the
# `ios-simulator-app-<run_id>` convention qa-acceptance-ios.yml pins, so its
# runs can also consume these directly via `app_run_id` (task #247 added the
# metadata.json its pinned-app validator requires).
#
# Build steps mirror qa-acceptance-ios.yml's proven build phase (KSP hygiene,
# dummy framework, pod install, build-for-testing) minus simulator boot and
# the agent loop — build only, no tests, no signing.
name: iOS Simulator app (on demand)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional exact product commit to build with this workflow"
        required: false
        type: string
        default: ""
      archs:
        description: "Simulator slices to build (xcodebuild ARCHS). Default arm64 — see the ARCHS note on the build step before widening."
        required: false
        type: string
        default: "arm64"
  # workflow_dispatch only registers once this file reaches the default
  # branch; until then, pushing an edit of THIS FILE on a branch is the
  # trigger (scoped so ordinary source pushes never burn a macOS runner).
  push:
    paths:
      - ".github/workflows/ios-simulator-app.yml"

concurrency:
  group: ios-simulator-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-app:
    name: Build installable Simulator app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Record actual product source
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ -n "$REQUESTED_SOURCE" ]]; then
            [[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] && [[ "$actual" == "$REQUESTED_SOURCE" ]]
          fi
          echo "RAFT_GIT_COMMIT=$actual" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Raise Gradle/Kotlin heap for the iOS Simulator build (this runner only)
        shell: bash
        run: |
          set -euo pipefail
          # compose/gradle.properties caps the build JVM and Kotlin daemon at
          # 4g, which OOMs Kotlin/Native ObjC-framework generation for the shared
          # module during archive. Override it via $GRADLE_USER_HOME/gradle.properties
          # (higher precedence than the project file), scoped to THIS macOS
          # runner only — so Android CI (ubuntu) and local dev keep their 4g.
          # Two release archives exhausted the former 8g heap in Kotlin/Native's
          # devirtualization analysis. The runner has ~30GB RAM, so 12g still
          # leaves room for Xcode/clang while keeping Gradle at one worker.
          GUH="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$GUH"
          printf '%s\n' 'org.gradle.jvmargs=-Xmx12g -Xss4m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx12g,-Xss4m"' >> "$GUH/gradle.properties"

      - name: Verify complete immutable Kuikly release
        run: scripts/ci/verify_kuikly_release_manifest.sh

      # Same guard as qa-acceptance-ios.yml: stale KSP incremental caches on a
      # reused runner produce the FIR RAW_FIR->STATUS cast failure.
      - name: KSP incremental cache hygiene
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/compose/shared/build/generated/ksp" \
                 "$GITHUB_WORKSPACE/compose/shared/build/kotlin"

      - name: Generate shared framework placeholder
        working-directory: compose
        run: ./gradlew :shared:generateDummyFramework --no-daemon --console=plain --stacktrace

      - name: Pod install
        working-directory: compose/iosApp
        run: pod install

      # ARCHS is pinned (default arm64) because the generic Simulator destination
      # alone builds arm64 AND x86_64, and the CocoaPods "Build shared" phase then
      # links BOTH Kotlin/Native frameworks in one Gradle invocation under the
      # 4 GiB heap from compose/gradle.properties. Read from the uploaded logs of
      # main run 33805615758 (OOM: "Execution failed for task
      # ':shared:linkPodDebugFrameworkIosX64' ... java.lang.OutOfMemoryError:
      # Java heap space", BUILD FAILED in 55m 57s) and run 33805224692 (same
      # "Daemon will expire after running out of JVM heap space" during the
      # arm64 link, then a GC stall to the 60-minute timeout). qa-acceptance-ios
      # builds with a UDID destination, i.e. arm64 only, and finishes in ~12 min;
      # the arm64 slice is also the only one any of our Simulator seats execute
      # (task #246 seam measurement: executed arm64 slices byte-identical between
      # the fat producer build and the thin consumer build). Widen via the
      # `archs` input only for an Intel host, and expect the memory cost.
      - name: Build app for Simulator
        working-directory: compose/iosApp
        env:
          ARCHS_INPUT: ${{ inputs.archs }}
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/xcodebuild-ios.log"
          archs="${ARCHS_INPUT:-arm64}"
          echo "ARCHS=$archs"
          # A CONCRETE destination (id=UDID), not generic: with
          # "generic/platform=iOS Simulator" the Podfile
          # "[CP-User] Copy kmmresource MR bundle to app" script phase
          # (:shared:copyFrameworkResourcesToApp) re-runs the full
          # compileKotlinIosSimulatorArm64 instead of hitting the cache the
          # "Build shared" phase just produced — a second cold Kotlin/Native
          # compile that blew the 60-min cap (run 38906495675 stall log).
          # qa-acceptance-ios.yml builds with id=${UDID} and finishes in
          # ~12 min; resolve any iPhone simulator UDID to take the same path.
          # The simulator does NOT need to be booted for build-for-testing.
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(u for devs in d["devices"].values() for u in [x["udid"] for x in devs if "iPhone" in x["name"]]))')
          echo "destination UDID=$UDID"
          set +e
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosAppUITests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -derivedDataPath build/DerivedData \
            ARCHS="$archs" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing > "$log" 2>&1
          status=$?
          tail -60 "$log"
          if [ "$status" -ne 0 ]; then
            echo "===== iOS build FAILED (status=$status) — extracted errors ====="
            # `e: ` alone also matches every "Using response file: ..." line xcodebuild
            # prints, and `tail -100` then keeps only those — run 33781925404 failed with
            # status 65 and this block showed nothing but TEST BUILD FAILED. Anchor the
            # Kotlin `e: ` pattern and drop the response-file noise so the real errors
            # survive the tail; the full log is uploaded below for anything else.
            grep -nE "(^|[[:space:]])e: |: error:|error: |Unresolved|FAILURE:|Execution failed|BUILD FAILED|following build commands failed|PhaseScriptExecution" "$log" \
              | grep -v "Using response file" | tail -100 || true
          fi
          exit "$status"

      # `failure()` alone misses the timeout case: main run 33799197240 hit the
      # job's 60-minute limit inside the same "Build shared" phase and was
      # cancelled, and a cancelled job does not satisfy failure(), so the one
      # log that could explain the stall was never uploaded. Whether a job-level
      # timeout also makes cancelled() true for the remaining steps is not
      # documented unambiguously (@LiBai review), so this is always(): a few MB
      # of artifact on green runs buys a log that is never missing again, and
      # removes "why is there no log this time" as a question.
      - name: Upload xcodebuild log
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-app-build-log-${{ github.run_id }}
          path: xcodebuild-ios.log
          if-no-files-found: ignore
          retention-days: 7

      # task #247: the artifact must carry the metadata.json shape that
      # qa-acceptance-ios.yml's `app_run_id` consumer validates
      # (scripts/qa/prepare_pinned_ios_app.sh) — a zip with only a free-form
      # PROVENANCE.txt fails closed there. One script owns that shape and its
      # fail-closed identity checks (Simulator slice, real HandsBuildCommit);
      # PROVENANCE.txt stays as the human-readable twin.
      - name: Package app with source identity
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/ios-simulator-app"
          bash scripts/qa/export_ios_simulator_app.sh \
            "compose/iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator" \
            "$staging" "$RAFT_GIT_COMMIT" "$GITHUB_RUN_ID"
          {
            echo "source_commit=$RAFT_GIT_COMMIT"
            echo "workflow_commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$staging/PROVENANCE.txt"
          sha=$(awk '{print $1}' "$staging/raft-ios-simulator.app.zip.sha256")
          {
            echo "## Installable iOS Simulator carrier"
            echo '```json'
            cat "$staging/metadata.json"
            echo '```'
            echo "Pin it in qa-acceptance-ios.yml with: app_run_id=${GITHUB_RUN_ID} artifact_sha256=${sha}"
            echo ""
            echo "artifact_sha256/artifact_size describe the EXTRACTED raft-ios-simulator.app.zip,"
            echo "not the outer archive GitHub shows for the artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "STAGING=$staging" >> "$GITHUB_ENV"

      - name: Upload Simulator app artifact
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-app-${{ github.run_id }}
          path: ${{ env.STAGING }}
          if-no-files-found: error
          retention-days: 14
