# task #232/#233: on-demand installable iOS Simulator app for acceptance.
#
# Why this exists: runtime acceptance (Jony's seat) needs an installable
# `.app` bound to an exact commit, but the repo had no per-exact publishing
# channel — the compile gate produces no app, and qa-acceptance-ios.yml only
# CONSUMES a frozen `ios-simulator-app-<run>` artifact from an earlier run.
# This workflow is that producer: dispatch it on any ref, download the
# artifact, install in a Simulator. The artifact name matches the
# `ios-simulator-app-<run_id>` convention qa-acceptance-ios.yml pins, so its
# runs can also consume these directly via `app_run_id`.
#
# Build steps mirror qa-acceptance-ios.yml's proven build phase (KSP hygiene,
# dummy framework, pod install, build-for-testing) minus simulator boot and
# the agent loop — build only, no tests, no signing.
name: iOS Simulator app (on demand)

on:
  workflow_dispatch:

concurrency:
  group: ios-simulator-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-app:
    name: Build installable Simulator app
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify complete immutable Kuikly release
        run: scripts/ci/verify_kuikly_release_manifest.sh

      # Same guard as qa-acceptance-ios.yml: stale KSP incremental caches on a
      # reused runner produce the FIR RAW_FIR->STATUS cast failure.
      - name: KSP incremental cache hygiene
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/compose/shared/build/generated/ksp" \
                 "$GITHUB_WORKSPACE/compose/shared/build/kotlin"

      - name: Generate shared framework placeholder
        working-directory: compose
        run: ./gradlew :shared:generateDummyFramework --no-daemon --console=plain --stacktrace

      - name: Pod install
        working-directory: compose/iosApp
        run: pod install

      - name: Build app for Simulator
        working-directory: compose/iosApp
        run: |
          log="$GITHUB_WORKSPACE/xcodebuild-ios.log"
          set +e
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosAppUITests \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing > "$log" 2>&1
          status=$?
          tail -60 "$log"
          if [ "$status" -ne 0 ]; then
            echo "===== iOS build FAILED (status=$status) — extracted errors ====="
            grep -nE "e: |: error:|error: |Unresolved|BUILD FAILED|following build commands failed|PhaseScriptExecution" "$log" | tail -100 || true
          fi
          exit "$status"

      - name: Package app with source identity
        shell: bash
        run: |
          products="compose/iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator"
          app=$(find "$products" -maxdepth 1 -name '*.app' ! -name '*Runner*' | head -1)
          [ -n "$app" ] || { echo "no .app produced under $products"; exit 1; }
          echo "app: $app"
          staging="$RUNNER_TEMP/ios-simulator-app"
          mkdir -p "$staging"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$staging/raft-ios-simulator.app.zip"
          shasum -a 256 "$staging/raft-ios-simulator.app.zip" | tee "$staging/raft-ios-simulator.app.zip.sha256"
          {
            echo "source_commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$staging/PROVENANCE.txt"
          echo "STAGING=$staging" >> "$GITHUB_ENV"

      - name: Upload Simulator app artifact
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-app-${{ github.run_id }}
          path: ${{ env.STAGING }}
          if-no-files-found: error
          retention-days: 14
