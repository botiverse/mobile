# task #232/#233: on-demand installable iOS Simulator app for acceptance.
#
# Why this exists: runtime acceptance (Jony's seat) needs an installable
# `.app` bound to an exact commit, but the repo had no per-exact publishing
# channel — the compile gate produces no app, and qa-acceptance-ios.yml only
# CONSUMES a frozen `ios-simulator-app-<run>` artifact from an earlier run.
# This workflow is that producer: dispatch it on any ref, download the
# artifact, install in a Simulator. The artifact name matches the
# `ios-simulator-app-<run_id>` convention qa-acceptance-ios.yml pins, so its
# runs can also consume these directly via `app_run_id` (task #247 added the
# metadata.json its pinned-app validator requires).
#
# Build steps mirror qa-acceptance-ios.yml's proven build phase (KSP hygiene,
# dummy framework, pod install, build-for-testing) minus simulator boot and
# the agent loop — build only, no tests, no signing.
name: iOS Simulator app (on demand)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional exact product commit to build with this workflow"
        required: false
        type: string
        default: ""
      archs:
        description: "Simulator slices to build (xcodebuild ARCHS). Default arm64 — see the ARCHS note on the build step before widening."
        required: false
        type: string
        default: "arm64"
      xcode_app_path:
        description: "Xcode for this run. Empty = the pinned default /Applications/Xcode_27.1.app (iOS 27.1 SDK, iPhone Duo edge-to-edge; needs macos_runner=xcode-27*). Fallback: /Applications/Xcode_26.6.app with macos_runner=macos-latest (opt-in lane, letterboxed on iPhone Duo). Must be an installed, non-symlink /Applications/Xcode*.app."
        required: false
        type: string
        default: ""
      macos_runner:
        description: "xcode-27 (default; GitHub Xcode 27 image, 7GB, billed; enough for this Debug Simulator build) | xcode-27-xlarge (same image, more RAM/CPU, billed) | macos-latest (Xcode <= 26.6 only: pair with xcode_app_path=/Applications/Xcode_26.6.app)"
        required: false
        type: choice
        default: "xcode-27"
        options:
          - xcode-27
          - xcode-27-xlarge
          - macos-latest
  # github-release.yml builds the Simulator app of a release tag through this. Inside a call,
  # github.run_id / github.sha / github.ref are the CALLER's: the artifact is
  # ios-simulator-app-<caller run id>, the CI tools come from the caller's commit.
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: false
        default: ""
      archs:
        type: string
        required: false
        default: "arm64"
      xcode_app_path:
        type: string
        required: false
        default: ""
      macos_runner:
        type: string
        required: false
        default: "xcode-27"
      # Concurrency scope for callers. github.ref is the caller's (a tag, or the branch a
      # release was dispatched from), so without it a call would share, and could hold or
      # replace a pending run in, the on-demand group of that ref. Empty for dispatch/push.
      concurrency_scope:
        type: string
        required: false
        default: ""
  # workflow_dispatch only registers once this file reaches the default
  # branch; until then, pushing an edit of THIS FILE on a branch is the
  # trigger (scoped so ordinary source pushes never burn a macOS runner).
  push:
    paths:
      - ".github/workflows/ios-simulator-app.yml"

permissions:
  contents: read

concurrency:
  group: ios-simulator-app-${{ github.ref }}${{ inputs.concurrency_scope && format('-{0}', inputs.concurrency_scope) || '' }}
  cancel-in-progress: false

jobs:
  build-app:
    name: Build installable Simulator app
    # push has no inputs: xcode-27 + the pinned Xcode 27.1. workflow_call passes the same inputs.
    runs-on: ${{ inputs.macos_runner || 'xcode-27' }}
    timeout-minutes: 60
    steps:
      # Xcode 27 is only on the xcode-27 images, which carry no Xcode 26.x; the 26.6 fallback
      # needs macos-latest.
      - name: Check runner / Xcode pairing
        shell: bash
        env:
          RUNNER: ${{ inputs.macos_runner || 'xcode-27' }}
          XCODE_APP: ${{ inputs.xcode_app_path || '/Applications/Xcode_27.1.app' }}
        run: |
          case "${RUNNER}:${XCODE_APP}" in
            xcode-27*:/Applications/Xcode_27*) ;;
            xcode-27*:*)
              echo "::error::macos_runner=${RUNNER} has Xcode 27.x only; ${XCODE_APP##*/} is not installed there. Leave xcode_app_path empty (Xcode 27.1), or use macos_runner=macos-latest for the Xcode 26.6 fallback."
              exit 1 ;;
            *:/Applications/Xcode_27*)
              echo "::error::${XCODE_APP##*/} is not installed on ${RUNNER}. Xcode 27 needs macos_runner=xcode-27 (the default) or xcode-27-xlarge; on ${RUNNER} pass xcode_app_path=/Applications/Xcode_26.6.app."
              exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      # The workflow's own copy of the metadata lane stamper: source_sha can predate it, and an
      # opt-in-lane carrier must never be published without xcode_lane in its metadata.json.
      - name: Checkout workflow CI tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .workflow-ci-tools
          # Read-only copy of one script; nothing here talks to the remote again.
          persist-credentials: false
          sparse-checkout: scripts/ci/stamp_ios_xcode_lane.py
          sparse-checkout-cone-mode: false

      - name: Pin Xcode
        # Build with a chosen Xcode, not the runner image's default: the SDK decides how iOS
        # lays the app out (the iOS 27.1 SDK makes it edge-to-edge on iPhone Duo, status bar on
        # the right edge). Moving SDKs is a deliberate change (iPhone Duo audit, 2026-10-27).
        # `xcode_app_path` (workflow_dispatch / workflow_call only) runs a deliberate other-Xcode lane, e.g. the
        # /Applications/Xcode_26.6.app fallback on macos-latest; empty keeps the pinned 27.1.
        env:
          XCODE_APP_PATH: ${{ inputs.xcode_app_path || '/Applications/Xcode_27.1.app' }}
        shell: bash
        run: |
          bash scripts/ci/select_ios_xcode.sh || {
            echo "Xcode installs on this runner (pick a non-symlink path):"
            ls -ld /Applications/Xcode*.app || true
            exit 1
          }

      - name: Record Xcode and iOS SDK
        env:
          XCODE_APP_PATH: ${{ inputs.xcode_app_path || '/Applications/Xcode_27.1.app' }}
          RAFT_DEFAULT_XCODE_APP: /Applications/Xcode_27.1.app
        shell: bash
        # source_sha can predate the script; then log the bare versions.
        run: |
          set -euo pipefail
          if [ -f scripts/ci/record_ios_toolchain.sh ]; then
            bash scripts/ci/record_ios_toolchain.sh
          else
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
          fi

      - name: Record actual product source
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ -n "$REQUESTED_SOURCE" ]]; then
            [[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] && [[ "$actual" == "$REQUESTED_SOURCE" ]]
          fi
          echo "RAFT_GIT_COMMIT=$actual" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Shared Kotlin/Native Gradle settings
        uses: ./.github/actions/ios-kn-gradle
        with:
          # Kept at this job's previous, consistently green value; the other
          # hosted-macOS jobs use the 6g default.
          heap: 12g

      # Same guard as qa-acceptance-ios.yml: stale KSP incremental caches on a
      # reused runner produce the FIR RAW_FIR->STATUS cast failure.
      - name: KSP incremental cache hygiene
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/compose/shared/build/generated/ksp" \
                 "$GITHUB_WORKSPACE/compose/shared/build/kotlin"

      - name: Generate shared framework placeholder
        working-directory: compose
        run: ./gradlew :shared:generateDummyFramework --no-daemon --console=plain --stacktrace

      - name: Pod install
        working-directory: compose/iosApp
        run: pod install

      # Link the Debug simulator framework once, as its own visible step. Before,
      # the CocoaPods "Build shared" phase linked it inside xcodebuild (34 min,
      # run 39422105488) and the "Copy kmmresource MR bundle to app" phase then
      # relinked it (another 12 min). The build below skips the first phase
      # (OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED) and the second reuses this link
      # (RAFT_IOS_REUSE_LINKED_FRAMEWORK, compose/shared/build.gradle.kts).
      - name: Sync shared framework (simulator, Debug)
        working-directory: compose
        env:
          ARCHS_INPUT: ${{ inputs.archs }}
        run: |
          ./gradlew :shared:syncFramework \
            -Pkotlin.native.cocoapods.platform=iphonesimulator \
            -Pkotlin.native.cocoapods.archs="${ARCHS_INPUT:-arm64}" \
            -Pkotlin.native.cocoapods.configuration=Debug \
            --no-daemon \
            --console=plain \
            --stacktrace

      # ARCHS is pinned (default arm64) because the generic Simulator destination
      # alone builds arm64 AND x86_64, and the CocoaPods "Build shared" phase then
      # links BOTH Kotlin/Native frameworks in one Gradle invocation under the
      # 4 GiB heap from compose/gradle.properties. Read from the uploaded logs of
      # main run 33805615758 (OOM: "Execution failed for task
      # ':shared:linkPodDebugFrameworkIosX64' ... java.lang.OutOfMemoryError:
      # Java heap space", BUILD FAILED in 55m 57s) and run 33805224692 (same
      # "Daemon will expire after running out of JVM heap space" during the
      # arm64 link, then a GC stall to the 60-minute timeout). qa-acceptance-ios
      # builds with a UDID destination, i.e. arm64 only, and finishes in ~12 min;
      # the arm64 slice is also the only one any of our Simulator seats execute
      # (task #246 seam measurement: executed arm64 slices byte-identical between
      # the fat producer build and the thin consumer build). Widen via the
      # `archs` input only for an Intel host, and expect the memory cost.
      - name: Build app for Simulator
        working-directory: compose/iosApp
        env:
          ARCHS_INPUT: ${{ inputs.archs }}
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/xcodebuild-ios.log"
          archs="${ARCHS_INPUT:-arm64}"
          echo "ARCHS=$archs"
          # A CONCRETE destination (id=UDID), not generic: with
          # "generic/platform=iOS Simulator" the Podfile
          # "[CP-User] Copy kmmresource MR bundle to app" script phase
          # (:shared:copyFrameworkResourcesToApp) re-runs the full
          # compileKotlinIosSimulatorArm64 instead of hitting the cache the
          # "Build shared" phase just produced — a second cold Kotlin/Native
          # compile that blew the 60-min cap (run 38906495675 stall log).
          # qa-acceptance-ios.yml builds with id=${UDID} and finishes in
          # ~12 min; resolve any iPhone simulator UDID to take the same path.
          # The simulator does NOT need to be booted for build-for-testing.
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(u for devs in d["devices"].values() for u in [x["udid"] for x in devs if "iPhone" in x["name"]]))')
          echo "destination UDID=$UDID"
          set +e
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosAppUITests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -derivedDataPath build/DerivedData \
            ARCHS="$archs" \
            CODE_SIGNING_ALLOWED=NO \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            RAFT_IOS_REUSE_LINKED_FRAMEWORK=YES \
            build-for-testing > "$log" 2>&1
          status=$?
          tail -60 "$log"
          if [ "$status" -ne 0 ]; then
            echo "===== iOS build FAILED (status=$status) — extracted errors ====="
            # `e: ` alone also matches every "Using response file: ..." line xcodebuild
            # prints, and `tail -100` then keeps only those — run 33781925404 failed with
            # status 65 and this block showed nothing but TEST BUILD FAILED. Anchor the
            # Kotlin `e: ` pattern and drop the response-file noise so the real errors
            # survive the tail; the full log is uploaded below for anything else.
            grep -nE "(^|[[:space:]])e: |: error:|error: |Unresolved|FAILURE:|Execution failed|BUILD FAILED|following build commands failed|PhaseScriptExecution" "$log" \
              | grep -v "Using response file" | tail -100 || true
          fi
          exit "$status"

      # `failure()` alone misses the timeout case: main run 33799197240 hit the
      # job's 60-minute limit inside the same "Build shared" phase and was
      # cancelled, and a cancelled job does not satisfy failure(), so the one
      # log that could explain the stall was never uploaded. Whether a job-level
      # timeout also makes cancelled() true for the remaining steps is not
      # documented unambiguously (@LiBai review), so this is always(): a few MB
      # of artifact on green runs buys a log that is never missing again, and
      # removes "why is there no log this time" as a question.
      - name: Upload xcodebuild log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app-build-log-${{ github.run_id }}
          path: xcodebuild-ios.log
          if-no-files-found: ignore
          retention-days: 7

      # task #247: the artifact must carry the metadata.json shape that
      # qa-acceptance-ios.yml's `app_run_id` consumer validates
      # (scripts/qa/prepare_pinned_ios_app.sh) — a zip with only a free-form
      # PROVENANCE.txt fails closed there. One script owns that shape and its
      # fail-closed identity checks (Simulator slice, real HandsBuildCommit);
      # PROVENANCE.txt stays as the human-readable twin.
      # metadata.json also records the Xcode, iPhoneSimulator SDK and xcode_lane
      # (default | opt-in): qa-acceptance-ios.yml refuses an opt-in-lane carrier unless
      # allow_non_default_xcode_lane is set, so a 26.6-fallback build cannot pass as the release one.
      - name: Package app with source identity
        shell: bash
        env:
          XCODE_APP_PATH: ${{ inputs.xcode_app_path || '/Applications/Xcode_27.1.app' }}
          RAFT_DEFAULT_XCODE_APP: /Applications/Xcode_27.1.app
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/ios-simulator-app"
          bash scripts/qa/export_ios_simulator_app.sh \
            "compose/iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator" \
            "$staging" "$RAFT_GIT_COMMIT" "$GITHUB_RUN_ID"
          python3 .workflow-ci-tools/scripts/ci/stamp_ios_xcode_lane.py "$staging/metadata.json"
          {
            echo "source_commit=$RAFT_GIT_COMMIT"
            echo "workflow_commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "xcode=$(xcodebuild -version | head -1)"
            echo "iphonesimulator_sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)"
            echo "xcode_lane=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["xcode_lane"])' "$staging/metadata.json")"
          } | tee "$staging/PROVENANCE.txt"
          sha=$(awk '{print $1}' "$staging/raft-ios-simulator.app.zip.sha256")
          {
            echo "## Installable iOS Simulator carrier"
            echo '```json'
            cat "$staging/metadata.json"
            echo '```'
            echo "Pin it in qa-acceptance-ios.yml with: app_run_id=${GITHUB_RUN_ID} artifact_sha256=${sha}"
            echo ""
            echo "artifact_sha256/artifact_size describe the EXTRACTED raft-ios-simulator.app.zip,"
            echo "not the outer archive GitHub shows for the artifact."
            if [ "$XCODE_APP_PATH" != "$RAFT_DEFAULT_XCODE_APP" ]; then
              echo ""
              echo "**Opt-in Xcode lane (${XCODE_APP_PATH##*/}): not the release build.** qa-acceptance-ios.yml refuses this carrier unless allow_non_default_xcode_lane=true."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "STAGING=$staging" >> "$GITHUB_ENV"

      - name: Upload Simulator app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app-${{ github.run_id }}
          path: ${{ env.STAGING }}
          if-no-files-found: error
          retention-days: 14
