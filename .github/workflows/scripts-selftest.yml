name: Scripts Self-test

on:
  pull_request:
  push:
    branches:
      - main
      - "release-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: Merge tooling self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test merge tooling scripts
        shell: bash
        run: |
          scripts/test_validate_commit_message.sh
          scripts/test_validate_landed_commit_message.sh
          scripts/test_guarded_merge_preflight.sh
          scripts/test_guarded_rebase_merge.sh
          scripts/test_guarded_squash_merge.sh
          scripts/test_merge_command_policy.sh
          scripts/check-merge-command-policy.sh

      - name: Test raft-ui version watch
        run: python3 scripts/ci/test_raft_ui_version_watch.py

      - name: Test iOS capture runner resource ownership
        run: python3 scripts/ci/test_ios_visual_runner.py

      - name: Test full Xcode selection
        run: python3 scripts/ci/test_select_ios_xcode.py

      - name: Test iOS bootstrap dependency decisions
        run: python3 scripts/ci/test_bootstrap_ios_runner.py

      - name: Test bootstrap main-ref boundary
        run: python3 scripts/ci/test_ios_bootstrap_workflow.py

      - name: Test one-time Upterm inspection boundary
        run: python3 scripts/ci/test_ios_runner_upterm_workflow.py
