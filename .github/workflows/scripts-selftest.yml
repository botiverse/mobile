name: Scripts Self-test

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/**"
      # Also exercised below: assert_xctest_ran.py and print_xctest_failures.py.
      - "compose/iosApp/scripts/**"
  push:
    branches:
      - main
      - "release-*"
    paths:
      - "scripts/**"
      - ".github/**"
      - "compose/iosApp/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: Scripts self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test bootstrap main-ref boundary
        run: python3 scripts/ci/test_ios_bootstrap_workflow.py

      - name: Test interactive visual Testbox workflow boundary
        run: python3 scripts/qa/test_visual_testbox_contract.py

      # After #4806 (Argus): a credential in $GITHUB_ENV reaches every later step and process
      # of the job. Credentials go only to the step that needs them, via its env: from secrets.*.
      - name: No credentials in $GITHUB_ENV / $GITHUB_OUTPUT
        run: |
          python3 -I scripts/ci/check_workflow_secret_env.py --self-test
          python3 -I scripts/ci/check_workflow_secret_env.py

      # Script tests that no workflow ran before task #18. All are self-contained (temp dirs,
      # mocked tools, no network).
      - name: Test build and release helper scripts
        shell: bash
        run: |
          scripts/ci/test_version_code.sh
          scripts/ci/test_source_app_version.sh
          python3 -I scripts/ci/check_ios_profile_entitlements.py --self-test
          scripts/test_resolve_git_revision.sh

      - name: Test iOS device automation helpers
        shell: bash
        run: |
          python3 compose/iosApp/scripts/assert_xctest_ran.py --self-test
          python3 compose/iosApp/scripts/print_xctest_failures.py --self-test

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Test visual patrol fix queue and identity
        run: node --test scripts/patrol/*.test.mjs
