name: Scripts Self-test

on:
  pull_request:
  push:
    branches:
      - main
      - "release-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: Merge tooling self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test merge tooling scripts
        shell: bash
        run: |
          scripts/test_validate_commit_message.sh
          scripts/test_validate_landed_commit_message.sh
          scripts/test_guarded_merge_preflight.sh
          scripts/test_guarded_rebase_merge.sh
          scripts/test_guarded_squash_merge.sh
          scripts/test_merge_command_policy.sh
          scripts/check-merge-command-policy.sh

      - name: Test iOS capture runner resource ownership
        run: python3 scripts/ci/test_ios_visual_runner.py

      - name: Test full Xcode selection
        run: python3 scripts/ci/test_select_ios_xcode.py

      - name: Test iOS bootstrap dependency decisions
        run: python3 scripts/ci/test_bootstrap_ios_runner.py

      - name: Test bootstrap main-ref boundary
        run: python3 scripts/ci/test_ios_bootstrap_workflow.py

      - name: Test one-time Upterm inspection boundary
        run: python3 scripts/ci/test_ios_runner_upterm_workflow.py

      - name: Test interactive visual Testbox workflow boundary
        run: python3 scripts/qa/test_visual_testbox_contract.py

      # Script tests that no workflow ran before task #18. All are self-contained (temp dirs,
      # mocked tools, no network).
      - name: Test build and release helper scripts
        shell: bash
        run: |
          scripts/ci/test_version_code.sh
          scripts/test_resolve_git_revision.sh
          scripts/test_run_android_visual_capture.sh
          python3 scripts/test_collect_richtext_caps.py

      - name: Test iOS device automation helpers
        shell: bash
        run: |
          # The default ios-use driver is agent-device (an npm CLI); these cases cover the
          # qa-loop XCUITest path and mock xcodebuild/simctl, so pin that driver.
          IOS_USE_DRIVER=qa-loop python3 scripts/test_slock_ios_simctl.py
          PYTHONPATH=tools/mobile-use/src python3 tools/mobile-use/tests/test_ios_use.py
          python3 compose/iosApp/scripts/assert_xctest_ran.py --self-test

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Test WebView host bridge and feedback bootstrap scripts
        run: node --test scripts/tests/*.test.mjs

      - name: Test visual patrol fix queue and identity
        run: node --test scripts/patrol/*.test.mjs
