name: Scripts Self-test

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/**"
      # Also exercised below: the mobile-use iOS tests and assert_xctest_ran.py.
      - "tools/mobile-use/**"
      - "compose/iosApp/scripts/**"
  push:
    branches:
      - main
      - "release-*"
    paths:
      - "scripts/**"
      - ".github/**"
      - "tools/mobile-use/**"
      - "compose/iosApp/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: Scripts self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test bootstrap main-ref boundary
        run: python3 scripts/ci/test_ios_bootstrap_workflow.py

      - name: Test one-time Upterm inspection boundary
        run: python3 scripts/ci/test_ios_runner_upterm_workflow.py

      - name: Test interactive visual Testbox workflow boundary
        run: python3 scripts/qa/test_visual_testbox_contract.py

      # Script tests that no workflow ran before task #18. All are self-contained (temp dirs,
      # mocked tools, no network).
      - name: Test build and release helper scripts
        shell: bash
        run: |
          scripts/ci/test_version_code.sh
          scripts/test_resolve_git_revision.sh

      - name: Test iOS device automation helpers
        shell: bash
        run: |
          PYTHONPATH=tools/mobile-use/src python3 tools/mobile-use/tests/test_ios_use.py
          python3 compose/iosApp/scripts/assert_xctest_ran.py --self-test

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Test WebView host bridge and feedback bootstrap scripts
        run: node --test scripts/tests/*.test.mjs

      - name: Test visual patrol fix queue and identity
        run: node --test scripts/patrol/*.test.mjs
