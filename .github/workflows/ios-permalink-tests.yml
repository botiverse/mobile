name: iOS permalink transport tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'compose/iosApp/iosApp/SlockIosPermalink*.swift'
      - 'compose/iosApp/iosApp/ContentView.swift'
      - 'compose/iosApp/iosAppTests/SlockIosPermalinkIntakeTests.swift'
      - 'scripts/tests/SlockIosPermalinkSceneHostTests.swift'
      - 'scripts/test_ios_permalink_intake.sh'
      - '.github/workflows/ios-permalink-tests.yml'
permissions:
  contents: read
jobs:
  transport:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run production intake and NotificationCenter adapter tests
        run: scripts/test_ios_permalink_intake.sh
