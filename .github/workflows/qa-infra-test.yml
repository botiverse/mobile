name: QA infrastructure tests

on:
  pull_request:
    paths:
      - ".github/workflows/qa-acceptance.yml"
      - ".github/workflows/qa-acceptance-ios.yml"
      - ".github/workflows/android-alpha.yml"
      - ".github/workflows/qa-infra-test.yml"
      - "docs/qa-acceptance/case-schema.md"
      - "docs/qa-acceptance/cases/**"
      - "scripts/qa/**"
      - "scripts/sign_android_apk_with_rotation.sh"
      - "scripts/test_sign_android_apk_with_rotation.sh"
      - "scripts/test_hands_identifier_migration.sh"
      - "scripts/verify_android_apk_with_rotation.sh"
      - "scripts/visual_android_case_filter.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/qa-acceptance.yml"
      - ".github/workflows/qa-acceptance-ios.yml"
      - ".github/workflows/android-alpha.yml"
      - ".github/workflows/qa-infra-test.yml"
      - "docs/qa-acceptance/case-schema.md"
      - "docs/qa-acceptance/cases/**"
      - "scripts/qa/**"
      - "scripts/sign_android_apk_with_rotation.sh"
      - "scripts/test_sign_android_apk_with_rotation.sh"
      - "scripts/test_hands_identifier_migration.sh"
      - "scripts/verify_android_apk_with_rotation.sh"
      - "scripts/visual_android_case_filter.py"

permissions:
  contents: read

jobs:
  qa-infra:
    name: Frozen artifact and reporter contracts
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install strict YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Run QA contract tests
        run: node --test scripts/qa/*.test.mjs
      - name: Check canonical release acceptance cases
        run: |
          python3 scripts/qa/test_release_acceptance_contract.py
          python3 scripts/qa/check_release_acceptance_cases.py
          python3 scripts/qa/check_release_acceptance_cases.py --emit-plan > /tmp/release-acceptance-plan.json
      - name: Check shell syntax
        run: bash -n scripts/qa/stamp_report.sh scripts/qa/prepare_pinned_ios_app.sh scripts/sign_android_apk_with_rotation.sh scripts/test_sign_android_apk_with_rotation.sh scripts/test_hands_identifier_migration.sh scripts/verify_android_apk_with_rotation.sh
      - name: Check rotated Android APK signing contract
        run: scripts/test_sign_android_apk_with_rotation.sh
      - name: Check Hands identifier migration contract
        run: scripts/test_hands_identifier_migration.sh
      - name: Check Android visual case selection contract
        run: python3 scripts/visual_android_case_filter.py --self-test
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA" --
