name: Slock source path contract

# The invariant scans every Mobile file, so this lightweight job intentionally
# has no path filter. A new executable or dated document must not bypass the
# check simply by being outside an incident-specific path list.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-path-contract:
    name: Retired source path invariant
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Bind the invariant to the submitted PR head rather than GitHub's
          # synthetic merge ref; push/manual runs use the event SHA directly.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_SHA" "$actual"
          test "$actual" = "$EXPECTED_SHA"

      - name: Run checker self-test and gate
        shell: bash
        run: |
          scripts/check_slock_source_path_contract.sh --self-test
          scripts/check_slock_source_path_contract.sh
