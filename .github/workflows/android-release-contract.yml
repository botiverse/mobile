name: Android Release Contract

on:
  pull_request:
    paths:
      - ".github/workflows/android-release.yml"
      - ".github/workflows/android-update-qa.yml"
      - ".github/workflows/android-release-contract.yml"
      - "compose/androidApp/build.gradle.kts"
      - "compose/androidApp/src/main/AndroidManifest.xml"
      - "compose/androidApp/src/play/**"
      - "compose/androidApp/src/main/java/build/raft/app/shared/SlockCmpActivity.kt"
      - "compose/androidApp/src/main/java/build/raft/app/shared/HandsDeltaUpdateGate.kt"
      - "compose/androidApp/src/test/java/build/raft/app/shared/HandsDeltaUpdateGateTest.kt"
      - "compose/shared/src/commonMain/kotlin/build/raft/app/data/HomeDataSource.kt"
      - "compose/shared/src/commonTest/kotlin/build/raft/app/data/HomeDataSourceTest.kt"
      - "scripts/*android*hands*"
      - "scripts/*android*aab*"
      - "scripts/VerifyAndroidAab.java"
      - "scripts/release_android_preflight.sh"
      - "scripts/verify_android_dex_packaging.py"
      - "scripts/test_verify_android_dex_packaging.py"
      - "scripts/verify_android_elf_alignment.py"
      - "scripts/test_verify_android_elf_alignment.py"
      - "docs/android-hands-release-*"
      - "docs/android-release-sop.md"
      - "docs/qa-acceptance/android-app-update/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-release.yml"
      - ".github/workflows/android-update-qa.yml"
      - ".github/workflows/android-release-contract.yml"
      - "compose/androidApp/build.gradle.kts"
      - "compose/androidApp/src/main/AndroidManifest.xml"
      - "compose/androidApp/src/play/**"
      - "compose/androidApp/src/main/java/build/raft/app/shared/SlockCmpActivity.kt"
      - "compose/androidApp/src/main/java/build/raft/app/shared/HandsDeltaUpdateGate.kt"
      - "compose/androidApp/src/test/java/build/raft/app/shared/HandsDeltaUpdateGateTest.kt"
      - "compose/shared/src/commonMain/kotlin/build/raft/app/data/HomeDataSource.kt"
      - "compose/shared/src/commonTest/kotlin/build/raft/app/data/HomeDataSourceTest.kt"
      - "scripts/*android*hands*"
      - "scripts/*android*aab*"
      - "scripts/VerifyAndroidAab.java"
      - "scripts/release_android_preflight.sh"
      - "scripts/verify_android_dex_packaging.py"
      - "scripts/test_verify_android_dex_packaging.py"
      - "scripts/verify_android_elf_alignment.py"
      - "scripts/test_verify_android_elf_alignment.py"
      - "docs/android-hands-release-*"
      - "docs/android-release-sop.md"
      - "docs/qa-acceptance/android-app-update/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release-contract:
    name: Android Hands release contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify AAB signing and repair inputs
        run: |
          python3 scripts/test_android_aab_signing.py
          python3 scripts/test_download_android_aab_repair.py

      - name: Validate workflow contract
        run: scripts/test_android_hands_release_contract.sh

      - name: Validate Hands identifier migration
        run: scripts/test_hands_identifier_migration.sh
