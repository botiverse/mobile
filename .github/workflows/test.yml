name: Test

on:
  pull_request:
    paths:
      - ".github/workflows/test.yml"
      - "compose/**"
      - "scripts/check_commonmain_map_compat.sh"
      - "scripts/check_auth_session_writes.sh"
      - "scripts/check_attachment_mapper_formatting.sh"
      - "scripts/check_canonical_message_v2_reaction_vector.sh"
      - "scripts/check_read_state_behavior_vector.sh"
      - "scripts/check_read_state_sync_domain_registration.sh"
      - "scripts/audit_translucent_action_tokens.py"
      - "scripts/build_kuikly_fork.sh"
      - "scripts/prepare_*.sh"
      - "third_party/kuikly-ui"
      - "third_party/ktor-ohos/**"
      - "third_party/stately"
      - "third_party/sqliter"
      - "third_party/sqldelight"
      - "third_party/kuikly-compose-markdown/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test.yml"
      - "compose/**"
      - "scripts/check_commonmain_map_compat.sh"
      - "scripts/check_auth_session_writes.sh"
      - "scripts/check_attachment_mapper_formatting.sh"
      - "scripts/check_canonical_message_v2_reaction_vector.sh"
      - "scripts/check_read_state_behavior_vector.sh"
      - "scripts/check_read_state_sync_domain_registration.sh"
      - "scripts/audit_translucent_action_tokens.py"
      - "scripts/build_kuikly_fork.sh"
      - "scripts/prepare_*.sh"
      - "third_party/kuikly-ui"
      - "third_party/ktor-ohos/**"
      - "third_party/stately"
      - "third_party/sqliter"
      - "third_party/sqldelight"
      - "third_party/kuikly-compose-markdown/**"
  workflow_dispatch:
  # Nightly run so the (slow, macOS) iOS compile still runs on a schedule even
  # though it no longer gates pull requests. See the `ios` job's `if:` guard.
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read
  packages: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single upstream build of every fork artifact the platform jobs consume.
  # Kuikly android/foundation + OHOS klibs and the stately/sqliter/sqldelight/
  # ktor-ohos stack are published to mavenLocal ONCE here (ubuntu) and shared
  # through os-less cache keys — the artifacts are jvm jars / klibs / .module
  # metadata, all platform-neutral, so the platform host and container jobs
  # restore the same entries instead of rebuilding per (job, os) combination.
  kuikly-artifacts:
    name: Kuikly fork artifacts (prebuild)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
    outputs:
      kuikly-sha: ${{ steps.pins.outputs.kuikly }}
    steps:
      # The combined kuikly (android+ohos konan) + fork-deps build overflows the
      # hosted runner's ~14GB free disk. Drop preinstalled toolchains we never
      # touch (keep the Android SDK — the kuikly fork build needs it).
      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/graalvm \
            /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 8 for Ktor toolchain
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up OpenHarmony SDK
        id: setup-ohos-sdk
        uses: openharmony-rs/setup-ohos-sdk@v1.0.1
        with:
          version: "6.0"
          components: native
          cache: true

      - name: Export OpenHarmony SDK path
        shell: bash
        run: echo "OHOS_SDK_HOME=${{ steps.setup-ohos-sdk.outputs.ohos-base-sdk-home }}" >> "$GITHUB_ENV"

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      - name: Resolve fork pins
        id: pins
        shell: bash
        run: |
          kuikly="$(git rev-parse HEAD:third_party/kuikly-ui)"
          test -n "$kuikly"
          echo "kuikly=$kuikly" >> "$GITHUB_OUTPUT"

      # The android and ohos flavors publish OVERLAPPING coordinates (the ohos
      # pass rewrites :core/:compose common metadata), so they are built and
      # cached as two separate entries — never mixed in one directory.
      # os-less keys: the artifacts are jars/klibs, consumable on any OS.
      - name: Restore kuikly fork cache (android flavor)
        id: kuikly-android-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-android-${{ steps.pins.outputs.kuikly }}

      - name: Build kuikly fork (android flavor)
        if: steps.kuikly-android-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui
          scripts/build_kuikly_fork.sh --android-only

      - name: Save kuikly fork cache (android flavor)
        if: steps.kuikly-android-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-android-${{ steps.pins.outputs.kuikly }}

      # Legacy key kept warm so visual-testing.yml (separate workflow, android
      # flavor, Linux-keyed) keeps hitting without changes.
      - name: Save kuikly fork cache (legacy visual-testing key)
        if: steps.kuikly-android-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-android-Linux-${{ steps.pins.outputs.kuikly }}

      - name: Restore kuikly fork cache (ohos flavor)
        id: kuikly-ohos-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-ohos-${{ steps.pins.outputs.kuikly }}

      - name: Build kuikly fork (ohos flavor)
        if: steps.kuikly-ohos-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf ~/.m2/repository/com/tencent/kuikly-open
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui
          scripts/build_kuikly_fork.sh --ohos-only

      - name: Save kuikly fork cache (ohos flavor)
        if: steps.kuikly-ohos-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-ohos-${{ steps.pins.outputs.kuikly }}

  # Parallel sibling of kuikly-artifacts: the stately/sqliter/sqldelight/ktor
  # fork stack. Split per artin so neither job's disk/wall-clock includes the
  # other's build.
  fork-deps:
    name: Shared fork dependencies (prebuild)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
    outputs:
      forkdeps-key: ${{ steps.keys.outputs.forkdeps }}
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/graalvm \
            /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 8 for Ktor toolchain
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up OpenHarmony SDK
        id: setup-ohos-sdk
        uses: openharmony-rs/setup-ohos-sdk@v1.0.1
        with:
          version: "6.0"
          components: native
          cache: true

      - name: Export OpenHarmony SDK path
        shell: bash
        run: echo "OHOS_SDK_HOME=${{ steps.setup-ohos-sdk.outputs.ohos-base-sdk-home }}" >> "$GITHUB_ENV"

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      # The fork projects' settings list only CN mirrors (mirrors.tencent.com /
      # maven.eazytec-cloud.com), which are flaky from hosted runners. Fall back
      # to the canonical repositories without touching the pinned submodules.
      # Plugin repositories only: an allprojects{repositories{}} block here would
      # give every project PROJECT-level repositories, which makes Gradle ignore
      # the settings-level dependencyResolutionManagement repositories — i.e. it
      # would hide the CN mirrors that the KBA kotlin artifacts resolve from.
      - name: Add canonical repository fallbacks
        shell: bash
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle.kts <<'INIT'
          settingsEvaluated {
              pluginManagement {
                  repositories {
                      gradlePluginPortal()
                      mavenCentral()
                      google()
                  }
              }
          }
          INIT

      - name: Compose cache key
        id: keys
        shell: bash
        run: |
          stately="$(git rev-parse HEAD:third_party/stately)"
          sqliter="$(git rev-parse HEAD:third_party/sqliter)"
          sqldelight="$(git rev-parse HEAD:third_party/sqldelight)"
          test -n "$stately" && test -n "$sqliter" && test -n "$sqldelight"
          echo "forkdeps=forkdeps-mavenlocal-$stately-$sqliter-$sqldelight-${{ hashFiles('scripts/prepare_ktor_ohos_fork.sh', 'third_party/ktor-ohos/**') }}" >> "$GITHUB_OUTPUT"

      - name: Cache shared fork dependencies mavenLocal artifacts
        id: forkdeps-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/co/touchlab
            ~/.m2/repository/app/cash/sqldelight
            ~/.m2/repository/io/ktor
          key: ${{ steps.keys.outputs.forkdeps }}

      # Retried: the KBA artifacts resolve only from CN mirrors
      # (mirrors.tencent.com), whose reachability from hosted runners is
      # flaky — every fork-deps failure so far has been this. Once one run
      # succeeds, the os-less cache keeps everyone warm until pins change.
      # The attempt runs as its own `bash` process: a shell function called from
      # an `if` has errexit suppressed for its whole body, so one failing gradlew
      # would silently fall through to the next command and the step would pass
      # with a half-empty ~/.m2 (this shipped a 2.6MB ktor-only cache once).
      - name: Publish shared fork dependencies
        if: steps.forkdeps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cat > /tmp/publish-forkdeps.sh <<'SCRIPT'
          set -euo pipefail
          git submodule sync third_party/stately third_party/sqliter third_party/sqldelight
          git submodule update --init third_party/stately third_party/sqliter third_party/sqldelight

          pushd third_party/stately
          ./gradlew --no-daemon --console=plain \
            :stately-strict:publishKotlinMultiplatformPublicationToMavenLocal \
            :stately-strict:publishOhosArm64PublicationToMavenLocal \
            :stately-concurrency:publishKotlinMultiplatformPublicationToMavenLocal \
            :stately-concurrency:publishOhosArm64PublicationToMavenLocal
          popd

          pushd third_party/sqliter
          ./gradlew --no-daemon --console=plain \
            :sqliter-driver:publishKotlinMultiplatformPublicationToMavenLocal \
            :sqliter-driver:publishOhosArm64PublicationToMavenLocal
          popd

          pushd third_party/sqldelight
          ./gradlew --no-daemon --console=plain \
            :sqldelight-compiler:environment:publishMavenPublicationToMavenLocal \
            :sqldelight-compiler:dialect:publishMavenPublicationToMavenLocal \
            :sqldelight-compiler:publishMavenPublicationToMavenLocal \
            :sqlite-migrations:environment:publishMavenPublicationToMavenLocal \
            :sqlite-migrations:publishMavenPublicationToMavenLocal \
            :dialects:sqlite-3-18:publishMavenPublicationToMavenLocal \
            :sqldelight-gradle-plugin:publishToMavenLocal \
            :runtime:publishKotlinMultiplatformPublicationToMavenLocal \
            :runtime:publishOhosArm64PublicationToMavenLocal \
            :drivers:native-driver:publishOhosArm64PublicationToMavenLocal
          popd

          scripts/prepare_ktor_ohos_fork.sh --publish
          SCRIPT
          for i in 1 2 3; do
            if bash /tmp/publish-forkdeps.sh; then exit 0; fi
            echo "fork-deps publish attempt $i failed; retrying in $((i*30))s" >&2
            sleep $((i*30))
          done
          echo "fork-deps publish failed after 3 attempts" >&2
          exit 1

      # Guard against ever saving a half-empty cache again: assert the marker
      # artifacts from each fork are present before the post-job cache save.
      - name: Verify published fork dependencies
        shell: bash
        run: |
          repo="$HOME/.m2/repository"
          missing=0
          for probe in \
            "co/touchlab/stately-strict-ohosarm64" \
            "co/touchlab/stately-concurrency-ohosarm64" \
            "co/touchlab/sqliter-driver-ohosarm64" \
            "app/cash/sqldelight/app.cash.sqldelight.gradle.plugin" \
            "app/cash/sqldelight/runtime-ohosarm64" \
            "app/cash/sqldelight/native-driver-ohosarm64" \
            "io/ktor/ktor-client-core-ohosarm64"; do
            if ! find "$repo/$probe" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | grep -q .; then
              echo "MISSING: $probe" >&2
              missing=1
            fi
          done
          exit $missing

  android:
    name: Android compile & tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: kuikly-artifacts
    timeout-minutes: 40
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard commonMain Map compatibility imports
        shell: bash
        run: |
          scripts/check_commonmain_map_compat.sh --self-test
          scripts/check_commonmain_map_compat.sh

      - name: Guard atomic auth-session writes (#466 no-bypass)
        shell: bash
        run: |
          scripts/check_auth_session_writes.sh --self-test
          scripts/check_auth_session_writes.sh

      - name: Guard attachment mapper raw-size boundary
        shell: bash
        run: scripts/check_attachment_mapper_formatting.sh

      - name: Guard Web/mobile read-state authority vector
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SLOCK_SOURCE_REPO_TOKEN }}
        run: scripts/check_read_state_behavior_vector.sh

      - name: Guard Web/mobile canonical-message V2 reaction vector
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SLOCK_SOURCE_REPO_TOKEN }}
        run: scripts/check_canonical_message_v2_reaction_vector.sh

      - name: Guard read-state SyncCore registration boundary
        shell: bash
        run: scripts/check_read_state_sync_domain_registration.sh

      - name: Guard translucent semantic action fills
        run: |
          scripts/audit_translucent_action_tokens.py --self-test
          scripts/audit_translucent_action_tokens.py --strict

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      - name: Restore kuikly fork mavenLocal artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-android-${{ needs.kuikly-artifacts.outputs.kuikly-sha }}
          fail-on-cache-miss: true

      # Compiling the unit-test source set closes the gap where a broken
      # commonTest (or an API change that breaks tests) sailed through green
      # CI — main sources alone do not compile test code (#198 follow-up).
      # :androidApp:compileDebugKotlin gates the Android host too — #57 merged
      # green while breaking every local assembleDebug because only :shared
      # was compiled here (task #217 follow-up).
      - name: Compile shared + Android host and unit tests
        working-directory: compose
        run: |
          ./gradlew \
            :shared:compileDebugKotlinAndroid \
            :shared:compileDebugUnitTestKotlinAndroid \
            :androidApp:compileDebugKotlin \
            --no-daemon \
            --console=plain

      # Hard run gate since #215 cleared the legacy failures: the shared JVM
      # suite must pass. Run androidApp unit tests in the same gate so stale
      # Android host tests cannot stay hidden until a local developer run.
      - name: Run shared + Android app unit tests
        working-directory: compose
        run: ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest --continue --no-daemon --console=plain

      # Build once here, then let the emulator job below install the exact APKs
      # without paying for a second Gradle/Kotlin build. The visual fixture gives
      # the regression a deterministic empty Thread composer.
      - name: Build Android connected-test APKs
        working-directory: compose
        env:
          # HandsCrash installs from Application.onCreate, before the actual-host page can bind its dynamic
          # blackhole. Keep that SDK on loopback too so the target-UID non-loopback counter is a meaningful zero.
          SLOCK_HANDS_BASE_URL: https://127.0.0.1:1
        run: |
          ./gradlew \
            -PslockVisualFixtures=true \
            :androidApp:assembleConnectedTest \
            :androidApp:assembleConnectedTestAndroidTest \
            --no-daemon \
            --console=plain

      - name: Upload Android connected-test APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-connected-test-apks
          path: |
            compose/androidApp/build/outputs/apk/connectedTest/*.apk
            compose/androidApp/build/outputs/apk/androidTest/connectedTest/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            compose/shared/build/reports/tests/testDebugUnitTest/
            compose/shared/build/test-results/testDebugUnitTest/
            compose/androidApp/build/reports/tests/testDebugUnitTest/
            compose/androidApp/build/test-results/testDebugUnitTest/
          retention-days: 7

  android-device:
    name: Android first-character baseline (emulator)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: android
    timeout-minutes: 30
    steps:
      - name: Free runner disk space for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download connected-test APKs
        uses: actions/download-artifact@v4
        with:
          name: android-connected-test-apks
          path: android-connected-test-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run first-character baseline regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6_pro
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r "$(find android-connected-test-apks -type f -name '*connectedTest.apk' -not -name '*androidTest*' | head -n 1)"
            adb install -r "$(find android-connected-test-apks -type f -name '*androidTest.apk' | head -n 1)"
            adb shell am instrument -w -r -e class build.raft.app.shared.SlockComposerFirstCharacterBaselineTest build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner > first-character-baseline-instrumentation.txt
            cat first-character-baseline-instrumentation.txt
            grep -Fq 'OK (1 test)' first-character-baseline-instrumentation.txt

      - name: Upload instrumentation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-character-baseline-instrumentation
          path: first-character-baseline-instrumentation.txt
          if-no-files-found: warn
          retention-days: 7

  android-canonical-final-actual-host:
    name: Android canonical-final actual host (emulator)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: android
    timeout-minutes: 35
    steps:
      - name: Free runner disk space for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download connected-test APKs
        uses: actions/download-artifact@v4
        with:
          name: android-connected-test-apks
          path: android-connected-test-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare canonical-final actual-host regression script
        shell: bash
        run: |
            cat > "$RUNNER_TEMP/canonical-final-actual-host.sh" <<'BASH'
            set -euo pipefail
            PACKAGE=build.raft.app.connectedtest
            TEST_PACKAGE=build.raft.app.connectedtest.test
            TEST_CLASS=build.raft.app.shared.RealtimeCanonicalFinalActualHostConnectedTest
            CHAIN="CFH_${GITHUB_RUN_ID: -8}_${GITHUB_RUN_ATTEMPT}"
            TARGET_UID=""
            cleanup() {
              set +eu
              if test -n "${TARGET_UID:-}"; then
                adb shell iptables -w -D OUTPUT -m owner --uid-owner "$TARGET_UID" -j "$CHAIN"
                adb shell ip6tables -w -D OUTPUT -m owner --uid-owner "$TARGET_UID" -j "$CHAIN"
              fi
              adb shell iptables -w -F "$CHAIN"
              adb shell iptables -w -X "$CHAIN"
              adb shell ip6tables -w -F "$CHAIN"
              adb shell ip6tables -w -X "$CHAIN"
            }
            trap cleanup EXIT

            adb wait-for-device
            adb root
            adb wait-for-device
            test "$(adb shell id -u | tr -d '\r')" = 0
            adb install -r "$(find android-connected-test-apks -type f -name '*connectedTest.apk' -not -name '*androidTest*' | head -n 1)"
            adb install -r "$(find android-connected-test-apks -type f -name '*androidTest.apk' | head -n 1)"

            PID_BEFORE="$(adb shell pidof "$PACKAGE" | tr -d '\r' || true)"
            printf 'pid_before=%s\n' "$PID_BEFORE" > canonical-final-process.txt
            adb shell pm clear "$PACKAGE" | tee canonical-final-pm-clear.txt
            grep -Fxq Success canonical-final-pm-clear.txt
            PID_AFTER_CLEAR="$(adb shell pidof "$PACKAGE" | tr -d '\r' || true)"
            printf 'pid_after_clear=%s\n' "$PID_AFTER_CLEAR" >> canonical-final-process.txt
            test -z "$PID_AFTER_CLEAR"

            TARGET_UID="$(adb shell cmd package list packages -U | grep -F "package:$PACKAGE uid:" | head -n 1 | sed 's/.*uid://' | tr -d '\r')"
            test -n "$TARGET_UID"
            printf 'target_uid=%s\nchain=%s\n' "$TARGET_UID" "$CHAIN" > canonical-final-iptables-identity.txt
            adb shell iptables -w -N "$CHAIN"
            adb shell iptables -w -A "$CHAIN" -o lo -j RETURN
            adb shell iptables -w -A "$CHAIN" -d 127.0.0.0/8 -j RETURN
            adb shell iptables -w -A "$CHAIN" -j REJECT
            adb shell iptables -w -I OUTPUT 1 -m owner --uid-owner "$TARGET_UID" -j "$CHAIN"
            adb shell iptables -w -C OUTPUT -m owner --uid-owner "$TARGET_UID" -j "$CHAIN"
            adb shell ip6tables -w -N "$CHAIN"
            adb shell ip6tables -w -A "$CHAIN" -o lo -j RETURN
            adb shell ip6tables -w -A "$CHAIN" -d ::1/128 -j RETURN
            adb shell ip6tables -w -A "$CHAIN" -j REJECT
            adb shell ip6tables -w -I OUTPUT 1 -m owner --uid-owner "$TARGET_UID" -j "$CHAIN"
            adb shell ip6tables -w -C OUTPUT -m owner --uid-owner "$TARGET_UID" -j "$CHAIN"
            adb shell iptables -w -L "$CHAIN" -n -v -x > canonical-final-iptables-before.txt
            adb shell ip6tables -w -L "$CHAIN" -n -v -x > canonical-final-ip6tables-before.txt
            test "$(awk '$3 == "REJECT" { print $1 " " $2 }' canonical-final-iptables-before.txt)" = "0 0"
            test "$(awk '$3 == "REJECT" { print $1 " " $2 }' canonical-final-ip6tables-before.txt)" = "0 0"

            adb logcat -c
            adb shell am instrument -w -r -e class "$TEST_CLASS" "$TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" > canonical-final-instrumentation.txt &
            INSTRUMENT_PID=$!
            PID_DURING=""
            for attempt in $(seq 1 200); do
              PID_DURING="$(adb shell pidof "$PACKAGE" | tr -d '\r' || true)"
              if test -n "$PID_DURING"; then
                break
              fi
              sleep 0.1
            done
            test -n "$PID_DURING"
            printf 'pid_during=%s\n' "$PID_DURING" >> canonical-final-process.txt
            if test -n "$PID_BEFORE"; then
              test "$PID_DURING" != "$PID_BEFORE"
            fi
            set +e
            wait "$INSTRUMENT_PID"
            INSTRUMENT_STATUS=$?
            set -e
            cat canonical-final-instrumentation.txt
            adb shell iptables -w -L "$CHAIN" -n -v -x > canonical-final-iptables-after.txt
            adb shell ip6tables -w -L "$CHAIN" -n -v -x > canonical-final-ip6tables-after.txt
            adb logcat -d -v threadtime > canonical-final-logcat.txt
            grep 'canonical_final_actual_host_trace' canonical-final-logcat.txt > canonical-final-trace.txt
            test "$INSTRUMENT_STATUS" = 0
            grep -Fq 'OK (1 test)' canonical-final-instrumentation.txt
            if grep -Eiq '(^|[^0-9])0 tests|skipped|ignored|assumption.*fail' canonical-final-instrumentation.txt; then
              echo 'Instrumentation reported a skipped or zero-test run.' >&2
              exit 1
            fi
            test "$(awk '$3 == "REJECT" { print $1 " " $2 }' canonical-final-iptables-after.txt)" = "0 0"
            test "$(awk '$3 == "REJECT" { print $1 " " $2 }' canonical-final-ip6tables-after.txt)" = "0 0"

            python3 - <<'PY'
            import hashlib
            import json

            marker = "canonical_final_actual_host_trace payload="
            groups = {}
            with open("canonical-final-trace.txt", encoding="utf-8") as source:
                for raw in source:
                    start = raw.index(marker) + len(marker)
                    end = raw.rindex(" sha256=")
                    payload_text = raw[start:end]
                    digest = raw[end + len(" sha256="):].strip()
                    assert len(payload_text.encode("utf-8")) <= 3000
                    assert "host-access-" not in payload_text
                    assert "host-refresh-" not in payload_text
                    assert "authorization" not in payload_text.lower()
                    assert hashlib.sha256(payload_text.encode()).hexdigest() == digest
                    payload = json.loads(payload_text)
                    groups.setdefault(payload["runNonce"], []).append((payload, digest))
            assert len(groups) == 1, groups.keys()
            entries = next(iter(groups.values()))
            assert [entry[0]["seq"] for entry in entries] == list(range(1, len(entries) + 1))
            terminals = [entry for entry in entries if entry[0]["terminal"]]
            assert len(terminals) == 1 and entries[-1] == terminals[0]
            phases = entries[:-1]
            terminal = terminals[0][0]
            assert terminal["success"] is True
            assert terminal["phaseCount"] == len(phases)
            assert terminal["lastSeq"] == len(phases)
            chain = "|".join(entry[1] for entry in phases)
            assert hashlib.sha256(chain.encode()).hexdigest() == terminal["chainSha256"]
            PY
            BASH
            bash -n "$RUNNER_TEMP/canonical-final-actual-host.sh"

      - name: Run canonical-final actual-host regression under exact-zero egress gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6_pro
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash "$RUNNER_TEMP/canonical-final-actual-host.sh"

      - name: Upload canonical-final actual-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-final-actual-host-evidence
          path: |
            canonical-final-instrumentation.txt
            canonical-final-pm-clear.txt
            canonical-final-process.txt
            canonical-final-iptables-identity.txt
            canonical-final-iptables-before.txt
            canonical-final-iptables-after.txt
            canonical-final-ip6tables-before.txt
            canonical-final-ip6tables-after.txt
            canonical-final-trace.txt
            canonical-final-logcat.txt
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: iOS compile
    # The macOS iOS compile takes ~40min and was blocking/slowing PR merges.
    # Run it only on main pushes + the nightly schedule (and manual dispatch),
    # not on pull requests. iOS is a pure commonMain consumer, so Android +
    # OHOS shared compile on PRs already catch shared-code breaks; iOS-specific
    # regressions are caught on main/nightly. (artin, 2026-07-08.)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 75
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      # iOS cannot consume the linux prebuild: apple-target klibs only publish
      # from a mac host, so this job builds its own android-flavor artifacts.
      - name: Resolve kuikly fork submodule sha
        id: kuikly-fork
        shell: bash
        run: |
          sha="$(git rev-parse HEAD:third_party/kuikly-ui)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache kuikly fork mavenLocal artifacts
        id: kuikly-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-android-${{ runner.os }}-${{ steps.kuikly-fork.outputs.sha }}

      - name: Publish Kuikly fork artifacts
        if: steps.kuikly-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui
          scripts/build_kuikly_fork.sh --android-only

      - name: Compile shared iOS targets and unit tests
        working-directory: compose
        run: |
          ./gradlew \
            :shared:compileKotlinIosArm64 \
            :shared:compileKotlinIosSimulatorArm64 \
            :shared:compileKotlinIosX64 \
            :shared:compileTestKotlinIosSimulatorArm64 \
            --no-daemon \
            --console=plain

      # Swift-host gate (task #217 follow-up): the jobs above only cover the
      # KMP side; ContentView.swift / KuiklyExpand ObjC breaks sailed through.
      # The local kuikly pod needs the submodule worktree even on cache hit.
      - name: Ensure kuikly fork submodule for local pod
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui

      # shared.podspec guards against a missing framework dir; the IDE's
      # Gradle sync normally creates the placeholder — CI must do it manually.
      - name: Generate shared framework placeholder
        working-directory: compose
        run: ./gradlew :shared:generateDummyFramework --no-daemon --console=plain

      - name: Pod install
        working-directory: compose/iosApp
        run: pod install

      - name: Build iOS host app (simulator)
        working-directory: compose/iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -200

  ohos:
    name: OHOS shared compile
    # Runs on Linux, not macOS (#469): this job only consumes ohosArm64 klibs,
    # all built on Linux by the prebuilds and shared through Blacksmith's
    # colocated cache, which macOS runners do not participate in (the sibling
    # ohos-host container hits it). On top of that it runs in artin's
    # harmonyos-ci-image (task #240), which presets the full OHOS toolchain
    # (OHOS_SDK_HOME/LLVM from command-line-tools 6.1.1.280) — no per-run
    # setup-ohos-sdk download, and the SDK version matches ohos-host and the
    # KuiklyBase-components CI instead of the previous 6.0 pin.
    # 8vcpu: kspKotlinOhosArm64 (the heaviest K/N JVM step) OOM'd fleet-wide
    # on 4vcpu VMs after moving into the container — killed mid-task with no
    # compile error. The job sat too close to the VM memory ceiling; doubling
    # the VM beats per-daemon heap tuning (docker create shows no --memory
    # cap, so the VM itself is the boundary).
    runs-on: blacksmith-8vcpu-ubuntu-2404
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280-android.1
    needs: [kuikly-artifacts, fork-deps]
    timeout-minutes: 90
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      - name: Restore kuikly fork mavenLocal artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-ohos-${{ needs.kuikly-artifacts.outputs.kuikly-sha }}
          fail-on-cache-miss: true

      - name: Restore shared fork dependencies mavenLocal artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository/co/touchlab
            ~/.m2/repository/app/cash/sqldelight
            ~/.m2/repository/io/ktor
          key: ${{ needs.fork-deps.outputs.forkdeps-key }}
          fail-on-cache-miss: true

      # The prebuild saves ~/.m2 on ubuntu; actions/cache records the paths
      # relative to the save-time workspace (../../../.m2 from
      # /home/runner/work/mobile/mobile) and re-anchors them on the restore-time
      # workspace — on the container that is /.m2. Relocate to the mavenLocal
      # Gradle will actually consult: the BUILD JVM's user.home, which in the
      # container comes from passwd (/root for root), not $HOME, and is not
      # pinnable via GRADLE_OPTS (the forked daemon does not inherit client -D
      # flags). Ask java itself, then verify content.
      - name: Relocate restored mavenLocal caches
        shell: bash
        run: |
          src="$(cd "$GITHUB_WORKSPACE/../../.." && pwd)/.m2/repository"
          userhome="$(java -XshowSettings:properties -version 2>&1 | awk '/user.home/{print $3; exit}')"
          test -n "$userhome"
          dst="$userhome/.m2/repository"
          if [ -d "$src" ] && [ "$src" != "$dst" ]; then
            mkdir -p "$userhome/.m2"
            cp -a "$src" "$userhome/.m2/"
            echo "relocated $src -> $dst"
          else
            echo "no relocation needed (src=$src dst=$dst)"
          fi
          test -d "$dst/app/cash/sqldelight/app.cash.sqldelight.gradle.plugin" || {
            echo "restored cache is missing the sqldelight gradle plugin" >&2
            find "$dst" -maxdepth 3 -mindepth 3 -type d >&2 || true
            exit 1
          }

      - name: Compile shared OHOS target and unit tests
        working-directory: compose
        env:
          SLOCK_SKIP_OHOS_LOCAL_DEP_PREP: "true"
        run: |
          ./gradlew \
            -c settings.ohos.gradle.kts \
            :shared:compileKotlinOhosArm64 \
            :shared:compileTestKotlinOhosArm64 \
            :ohosBridge:compileKotlinOhosArm64 \
            --no-daemon \
            --console=plain

  # OHOS host (hvigor/ArkTS) gate — catches .ets compile errors that the
  # KMP-only ohos job cannot see. Runs in artin's harmonyos-ci-image, which
  # ships the full DevEco command-line-tools (ohpm/hvigorw/SDK/JDK17) that
  # hosted runners cannot download (Huawei-login-gated). The hvigor build's
  # kuikly plugin shells out to gradle to link the shared .so, so the same
  # fork-dependency mavenLocal set as the ohos job is published first.
  ohos-host:
    name: OHOS host (hvigor/ArkTS) compile
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [kuikly-artifacts, fork-deps]
    timeout-minutes: 90
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280-android.1
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      OHOS_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk/default/openharmony
      DEVECO_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk
      SLOCK_SKIP_OHOS_LOCAL_DEP_PREP: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The workspace is provisioned by the host runner user while steps run
      # as the container user, so git refuses it as "dubious ownership" ('*'
      # also covers the submodule checkouts below).
      - name: Mark workspace safe for git
        shell: bash
        run: git config --global --add safe.directory '*'

      # zstd (actions/cache compression fingerprint) and curl (the SQLite
      # amalgamation download in prepare_ohos_sqlite_provider.sh) are now baked
      # into harmonyos-ci-image, so the per-run apt-get install is gone.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      - name: Restore kuikly fork mavenLocal artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-ohos-${{ needs.kuikly-artifacts.outputs.kuikly-sha }}
          fail-on-cache-miss: true

      - name: Restore shared fork dependencies mavenLocal artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository/co/touchlab
            ~/.m2/repository/app/cash/sqldelight
            ~/.m2/repository/io/ktor
          key: ${{ needs.fork-deps.outputs.forkdeps-key }}
          fail-on-cache-miss: true

      # The prebuild saves ~/.m2 on ubuntu; actions/cache records the paths
      # relative to the save-time workspace (../../../.m2 from
      # /home/runner/work/mobile/mobile) and re-anchors them on the restore-time
      # workspace — on the container that is /.m2. Relocate to the mavenLocal
      # Gradle will actually consult: the BUILD JVM's user.home, which in the
      # container comes from passwd (/root for root), not $HOME, and is not
      # pinnable via GRADLE_OPTS (the forked daemon does not inherit client -D
      # flags). Ask java itself, then verify content.
      - name: Relocate restored mavenLocal caches
        shell: bash
        run: |
          src="$(cd "$GITHUB_WORKSPACE/../../.." && pwd)/.m2/repository"
          userhome="$(java -XshowSettings:properties -version 2>&1 | awk '/user.home/{print $3; exit}')"
          test -n "$userhome"
          dst="$userhome/.m2/repository"
          if [ -d "$src" ] && [ "$src" != "$dst" ]; then
            mkdir -p "$userhome/.m2"
            cp -a "$src" "$userhome/.m2/"
            echo "relocated $src -> $dst"
          else
            echo "no relocation needed (src=$src dst=$dst)"
          fi
          test -d "$dst/app/cash/sqldelight/app.cash.sqldelight.gradle.plugin" || {
            echo "restored cache is missing the sqldelight gradle plugin" >&2
            find "$dst" -maxdepth 3 -mindepth 3 -type d >&2 || true
            exit 1
          }

      # This gate compiles the host ArkTS/.ets — the layer the KMP-only jobs
      # cannot see (e.g. the tabbar host regression). It deliberately stops
      # short of the full unsigned-HAP assembleHap: that would require linking
      # the shared KMP libshared.so, whose konanc whole-program release -opt
      # link does not fit this 7.8 GiB / 2-CPU container. Every attempt hit a
      # hard wall — the konan compiler daemon has a large-enough thread stack
      # but a too-small heap that is not raisable (kotlin.native.jvmArgs is
      # ignored) and OOMs the -opt; running konanc in-process makes the heap
      # settable via -Xmx but then the deep IR-lowering recursion overflows the
      # worker thread's stack (which ignores -Xss); the debug variant instead
      # bloats codegen with -g until clang OOM-kills the whole runner. The
      # Kotlin content of libshared is already gated by the "OHOS shared
      # compile" job, so the unique coverage here is the ArkTS compile, which
      # needs no native link. (Revisit assembleHap if this job moves to a
      # larger runner or the image gains headroom.)
      - name: ohpm install
        working-directory: compose/ohosApp
        shell: bash
        run: ohpm install --all

      - name: hvigor sync
        working-directory: compose/ohosApp
        shell: bash
        run: hvigorw --sync -p product=default --analyze=normal --parallel --no-daemon

      - name: hvigor CompileArkTS (host .ets gate)
        working-directory: compose/ohosApp
        shell: bash
        run: |
          hvigorw --mode module \
            -p module=entry@default -p product=default -p requiredDeviceType=phone \
            default@CompileArkTS --analyze=normal --parallel --no-daemon
