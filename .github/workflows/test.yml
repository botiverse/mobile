name: Test

on:
  pull_request:
    # `labeled`/`unlabeled` make the full-ci escape hatch take effect without
    # requiring a source push. No path filter: the stable CI gate must report
    # even for docs-only pull requests if it is configured as required.
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - "release-*"
  workflow_dispatch:
    inputs:
      scope:
        description: "Task #37: pr (default) = PR-equivalent tier (Linux gates + Android compile, no iOS, no device suite); full = deliberate full readback (all platforms + device suite + canonical-final)."
        type: choice
        options:
          - pr
          - full
        default: pr
      attachment_authority_repeat:
        description: "Re-run the public-Downloads authority class N times per API level to reproduce the intermittent API 31 cross-UID SecurityException. Default 1."
        type: number
        default: 1
      attachment_authority_mode:
        description: "Public-download authority runner mode: ci (default), reboot, or ab-fresh (clear MediaProvider + reboot each iteration; odd iterations skip the readiness wait as a control)."
        type: string
        default: ci
      record_screenshots:
        description: "Record the screenshot goldens (:designsystem:recordRoborazziDesktop, :shared:recordRoborazziDebug) instead of verifying them; new or changed goldens are uploaded as the designsystem-screenshots-recorded and shared-screenshots-recorded artifacts (compose/designsystem/README.md, AGENTS.md \"Screenshot tests (:shared)\")."
        type: boolean
        default: false
      xcode_app_path:
        description: "Opt-in Xcode for the Blacksmith iOS compile lane only; requires scope=full (the plan fails otherwise). Empty = /Applications/Xcode_27.0.app (iOS 27.0 SDK) on Blacksmith macOS; symlinked bundles are resolved to their real path under /Applications. The extra 'iOS compile (Xcode 27.1)' lane (GitHub xcode-27, full tier and compose/iosApp changes) always uses /Applications/Xcode_27.1.app, like ios-release.yml."
        required: false
        type: string
        default: ""
  # Nightly run so the (slow, macOS) iOS compile still runs on a schedule even
  # though it no longer gates pull requests. See the `ios` job's `if:` guard.
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read
  packages: read

concurrency:
  # The nightly gets its own group. It runs on refs/heads/main, and in the shared
  # test-refs/heads/main group GitHub keeps only the newest pending run, so a main push
  # queued behind a running push replaced the pending nightly and the full readback
  # (device suite, canonical-final, attachment legs) silently did not run.
  group: test-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  # Preserve the running post-merge record on protected branches. GitHub still
  # coalesces multiple pending runs in the same group to the newest commit.
  # PR and merge-queue refs keep superseding stale work for that exact ref.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release-') }}

jobs:
  plan:
    name: CI path plan + contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The audit comment uses the GraphQL PullRequest surface because this
      # installation cannot access PR comments through the REST Issues API.
      pull-requests: write
    outputs:
      run_android: ${{ steps.plan.outputs.run_android }}
      run_ios: ${{ steps.plan.outputs.run_ios }}
      run_ios_xcode271: ${{ steps.plan.outputs.run_ios_xcode271 }}
      ios_lanes: ${{ steps.plan.outputs.ios_lanes }}
      run_device_suite: ${{ steps.plan.outputs.run_device_suite }}
      run_canonical_final: ${{ steps.plan.outputs.run_canonical_final }}
      attachment_api_levels: ${{ steps.plan.outputs.attachment_api_levels }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      # Full history for the PR merge-base / push before..after diffs below, but
      # blobless: `git diff --name-only` needs commits and trees only. The few
      # blobs a step reads at another commit (the gitlink gate's .gitmodules)
      # are fetched on demand with the persisted checkout credentials.
      - name: Checkout exact event source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Validate iOS Hands release notes contract
        run: scripts/ci/test_ios_hands_release_contract.sh

      - name: Validate Hands Android SDK Raft consumer contract
        run: python3 scripts/ci/test_hands_raft_consumer_contract.py

      - name: Validate no-local-Ktor dependency contract
        run: python3 scripts/ci/test_no_local_ktor_ci_contract.py

      - name: Validate fail-closed git diff consumers
        run: |
          .github/actions/git-safe-workspace/test_configure.sh
          scripts/ci/test_git_diff_path_state.sh

      - name: Resolve exact execution tier
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          DISPATCH_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || '' }}
          # The planner refuses a non-empty xcode_app_path when its plan skips the iOS compile.
          XCODE_APP_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.xcode_app_path || '' }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/test-changed-paths.txt"
          : > "$changed"
          write_changed_paths() {
            local base="$1"
            local head="$2"
            local comparison="$3"
            if test -n "$base" && test -n "$head" && \
                ! [[ "$base" =~ ^0+$ ]] && \
                git cat-file -e "$base^{commit}" 2>/dev/null && \
                git cat-file -e "$head^{commit}" 2>/dev/null; then
              # Disable rename collapsing so both the removed and added path
              # participate in classification. Moving a source file into an
              # irrelevant directory must still select its former platform.
              if test "$comparison" = merge-base; then
                range="$base...$head"
              else
                range="$base..$head"
              fi
              if ! git diff --name-only --no-renames "$range" > "$changed"; then
                printf '%s\n' '__CI_CHANGED_PATHS_UNKNOWN__' > "$changed"
              fi
            else
              # The planner treats this impossible repository path as a
              # fail-closed request for every platform.
              printf '%s\n' '__CI_CHANGED_PATHS_UNKNOWN__' > "$changed"
            fi
          }
          case "$EVENT_NAME" in
            pull_request)
              # Match GitHub's PR changed-file semantics. A base branch that
              # advanced after the topic fork must not inject unrelated main
              # changes into this PR's platform plan.
              write_changed_paths "$BASE_SHA" "$HEAD_SHA" merge-base
              ;;
            push)
              write_changed_paths "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA" direct
              ;;
          esac
          scripts/ci/plan_test_tier.sh "$EVENT_NAME" "$changed" "$FULL_CI" "$REF_NAME" "$DISPATCH_SCOPE" \
            "$XCODE_APP_PATH" | tee -a "$GITHUB_OUTPUT"

      - name: Self-test gitlink carry-in gate
        run: python3 scripts/ci/test_gitlink_carry_in_gate.py

      - name: Audit changed gitlink carry-in
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci/gitlink_carry_in_gate.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --manifest "$RUNNER_TEMP/gitlink-carry-in.json" \
            --markdown "$RUNNER_TEMP/gitlink-carry-in.md"

      - name: Publish gitlink carry-in audit to PR
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitlink-carry-in.md"
          manifest="$RUNNER_TEMP/gitlink-carry-in.json"
          test -s "$report" || exit 0
          test -s "$manifest"

          marker='<!-- gitlink-carry-in-gate -->'
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          comment_state="$(
            gh api graphql --paginate --slurp \
              -f owner="$owner" \
              -f repo="$repo" \
              -F number="$PR_NUMBER" \
              -f query='query($owner: String!, $repo: String!, $number: Int!, $endCursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    id
                    comments(first: 100, after: $endCursor) {
                      nodes { id body }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }'
          )"
          subject_id="$(jq -r '.[0].data.repository.pullRequest.id // empty' <<< "$comment_state")"
          test -n "$subject_id"
          existing="$(
            jq -r --arg marker "$marker" \
              '.[].data.repository.pullRequest.comments.nodes[] | select(.body | startswith($marker)) | .id' \
              <<< "$comment_state" | sed -n '1p'
          )"
          status="$(jq -r '.status' "$manifest")"
          if test "$status" = no_changes && test -z "$existing"; then
            exit 0
          fi

          if test -n "$existing"; then
            gh api graphql \
              -f id="$existing" \
              -F body=@"$report" \
              -f query='mutation($id: ID!, $body: String!) {
                updateIssueComment(input: {id: $id, body: $body}) { issueComment { id } }
              }' >/dev/null
          else
            gh api graphql \
              -f subjectId="$subject_id" \
              -F body=@"$report" \
              -f query='mutation($subjectId: ID!, $body: String!) {
                addComment(input: {subjectId: $subjectId, body: $body}) { commentEdge { node { id } } }
              }' >/dev/null
          fi

      - name: Summarize gitlink carry-in audit
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          report="$RUNNER_TEMP/gitlink-carry-in.md"
          test -s "$report" || exit 0
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gitlink carry-in audit
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: gitlink-carry-in-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/gitlink-carry-in.json
            ${{ runner.temp }}/gitlink-carry-in.md
          if-no-files-found: warn
          retention-days: 30

  android:
    name: Android compile & tests
    runs-on: ubuntu-latest
    needs: [plan]
    if: ${{ needs.plan.outputs.run_android == 'true' }}
    timeout-minutes: 40
    env:
      # A stable (not per-run) GRADLE_USER_HOME so the setup-gradle cache actually
      # restores across runs: its GitHub cache version hashes the resolved cache
      # paths, so a run_id-suffixed home would change the version every run and
      # never hit. #1478's poisoned-transform isolation is now provided by
      # gradle-home-cache-excludes below (transforms/instrumented-jars are never
      # restored), so the per-run home it used is no longer needed. Blacksmith
      # runners are fresh VMs and the step below rebuilds this dir clean, so only
      # setup-gradle's restore populates it.
      GRADLE_USER_HOME: /tmp/android-compile-gradle-home
      # Only the emulator jobs consume the connected-test APKs. PR and main-push
      # plans schedule none of them, so those runs skip the ~8 min APK build;
      # full-ci, nightly and scope=full dispatch runs still build and upload.
      BUILD_CONNECTED_APKS: ${{ needs.plan.outputs.run_device_suite == 'true' || needs.plan.outputs.run_canonical_final == 'true' || needs.plan.outputs.attachment_api_levels != '[]' }}
      # One visual-fixture value for every Gradle call in this job (read by
      # compose/shared/build.gradle.kts). The connected-test APKs need the
      # fixtures, and the flag adds source dirs to :shared commonMain, so a job
      # that mixed values compiled :shared twice. With it on, the fixture
      # sources compile on every tier and the fixture data reaches the unit
      # tests through commonMain instead of commonTest.
      SLOCK_VISUAL_FIXTURES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup CI environment
        uses: ./.github/actions/setup-env

      - name: Guard commonMain Map compatibility imports
        shell: bash
        run: |
          scripts/check_commonmain_map_compat.sh --self-test
          scripts/check_commonmain_map_compat.sh

      - name: Guard atomic auth-session writes (#466 no-bypass)
        shell: bash
        run: |
          scripts/check_auth_session_writes.sh --self-test
          scripts/check_auth_session_writes.sh

      # These fixture/vector guards verify the vendored copy against a digest pinned in
      # the script — fully local since task #18 (a pinned commit's content is
      # immutable, so the previous gh api fetch verified nothing and only added
      # a token/network failure surface).
      - name: Guard Web/mobile read-state authority vector
        shell: bash
        run: scripts/check_read_state_behavior_vector.sh

      - name: Guard Web/mobile canonical-message V2 reaction vector
        shell: bash
        run: scripts/check_canonical_message_v2_reaction_vector.sh

      - name: Guard Web/mobile search snippet vector
        shell: bash
        run: scripts/check_search_snippet_vector.sh

      - name: Guard Web/mobile action-card.v1 vector
        shell: bash
        run: scripts/check_action_card_v1_vector.sh

      - name: Guard server/mobile Activity-unread fixture
        shell: bash
        run: scripts/check_server_activity_unread_fixture.sh

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Start from a clean Gradle home (fail-closed)
        run: rm -rf "$GRADLE_USER_HOME" && mkdir -p "$GRADLE_USER_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Re-enable the Gradle cache so the local build cache (caches/build-cache-epoch-<epoch>,
          # see compose/gradle/build-cache-epoch.settings.gradle.kts)
          # and dependency bundles restore across runs — with cache-disabled the Android
          # compile job recompiled everything from scratch every run (~8m40s).
          #
          # #1478 disabled the cache because a corrupt instrumented AGP jar could poison
          # a shared run: `ExternalDependencyInstrumentingArtifactTransform` fails to build
          # `instrumented-gradle-<v>.jar` at root-project configuration. That poison lives
          # ONLY in the instrumentation cache families. Per the gradle/actions@v5
          # extractor (0723195856…, gradle-home-entry-extractor.ts), and re-checked against
          # the v6.4.0 bundled gradle-actions-caching (patterns caches/jars-*/*,
          # caches/transforms-4/*/, caches/*/transforms/*/), those families are:
          #   instrumented-jars -> caches/jars-*/
          #   transforms        -> caches/transforms-<N>/ (top-level) AND caches/<gradleVer>/transforms/
          # `gradle-home-cache-excludes` deletes matching paths after restore and before
          # save, so excluding these keeps them rebuilt-fresh while every other bundle
          # (build cache, modules-2, wrapper-zips, kotlin-dsl, generated-gradle-jars,
          # java-toolchains) is content-addressed and restores across runs. transforms-*
          # (not a pinned transforms-4) survives a Gradle metadata-version bump. Job-scoped
          # permanent replacement for the blunt cache-disabled; the fleet-wide
          # incident-response quarantine (.github/gradle-cache-quarantine) stays EMPTY.
          #
          # The stable GRADLE_USER_HOME (job env, rebuilt clean above) keeps the cache
          # version stable across runs; PRs (non-main refs) read the default-branch
          # cache seed read-only and never write back. The poison-guard writer/reader
          # jobs in gradle-cache-policy-lint.yml are the authority that these families
          # never restore while the build cache does; the build-cache epoch guard jobs there
          # prove an epoch bump drops the old build cache.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-excludes: |
            caches/jars-*
            caches/transforms-*
            caches/*/transforms
      # One Gradle invocation for the whole Android gate: one JVM start, one configuration phase
      # and one up-to-date pass. --continue keeps going past a failing task, so a red unit test
      # cannot hide a compile failure elsewhere (or the reverse), and every failure is reported in
      # the same run. No --parallel: :androidApp:generate*OssLicenses resolves :shared's
      # configurations at execution time, which Gradle rejects under parallel project execution
      # ("resolution ... was attempted without an exclusive lock", run 40073308446).
      #
      # - Compiling the unit-test source sets closes the gap where a broken commonTest (or an API
      #   change that breaks tests) sailed through green CI (#198 follow-up).
      #   :androidApp:compileDebugKotlin gates the Android host too: #57 merged green while breaking
      #   every local assembleDebug because only :shared was compiled here (task #217 follow-up).
      # - Hard run gate since #215 cleared the legacy failures: the shared JVM suite must pass, and
      #   the androidApp unit tests run in the same gate so stale Android host tests cannot stay
      #   hidden until a local developer run. :designsystem:verifyRoborazziDesktop is the CMP design system's
      #   unit tests plus its screenshot goldens in verify mode (compose/designsystem/README.md);
      #   it runs desktopTest and writes Roborazzi's HTML report. :shared:verifyRoborazziDebug is
      #   the same for :shared's Robolectric screenshots: it runs testDebugUnitTest (the whole
      #   shared suite, still a hard gate) in verify mode (AGENTS.md "Screenshot tests (:shared)").
      #   A dispatch with record_screenshots=true records both instead (recordRoborazziDesktop,
      #   recordRoborazziDebug); the rest of the suite still runs and must pass.
      # - Connected-test APKs (BUILD_CONNECTED_APKS above): built here so the emulator jobs below
      #   install the exact APKs without a second Gradle/Kotlin build. The visual fixture gives the
      #   regression a deterministic empty Thread composer.
      - name: Compile, test and package Android (one Gradle invocation)
        working-directory: compose
        env:
          RECORD_SCREENSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.record_screenshots }}
        run: |
          set -euo pipefail
          tasks=(
            :core:compileAndroidHostTest
            :shared:compileDebugKotlinAndroid
            :shared:compileDebugUnitTestKotlinAndroid
            :androidApp:compileDebugKotlin
          )
          if [ "$BUILD_CONNECTED_APKS" = true ]; then
            # HandsCrash installs from Application.onCreate, before the actual-host page can bind
            # its dynamic blackhole. Keep that SDK on loopback too so the target-UID non-loopback
            # counter is a meaningful zero. (defaultConfig, so the debug unit-test build sees it as
            # well on these tiers; no unit test reads BuildConfig.HANDS_BASE_URL.)
            export SLOCK_HANDS_BASE_URL=https://127.0.0.1:1
            # Assembling the three test APKs makes D8 merge their dex in the Gradle heap that
            # compose/gradle.properties sizes for a single Kotlin/Native link (4g). On 2026-10-18 it
            # died with "D8: java.lang.OutOfMemoryError: Java heap space" inside
            # :androidApp:mergeLibDexConnectedTest while the runner reported 12 GiB available.
            # Raised through $GRADLE_USER_HOME/gradle.properties, which outranks the project file
            # (ios-simulator-app.yml and ios-release.yml lift the same ceiling the same way).
            GUH="${GRADLE_USER_HOME:-$HOME/.gradle}"
            mkdir -p "$GUH"
            # Drop any previous line first: setup-gradle may restore this directory, and appending
            # blindly would stack duplicate org.gradle.jvmargs entries across runs.
            if [ -f "$GUH/gradle.properties" ]; then
              grep -v '^org\.gradle\.jvmargs=' "$GUH/gradle.properties" > "$GUH/gradle.properties.tmp" || true
              mv "$GUH/gradle.properties.tmp" "$GUH/gradle.properties"
            fi
            printf '%s\n' 'org.gradle.jvmargs=-Xmx6g -Xss4m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> "$GUH/gradle.properties"
            tasks+=(
              :shared:assembleDebugAndroidTest
              :androidApp:assembleConnectedTest
              :androidApp:assembleConnectedTestAndroidTest
            )
          fi
          tasks+=(
            :core:testAndroidHostTest
            :shared:testDebugUnitTest
            :androidApp:testDebugUnitTest
            :ui-cmp:testAndroidHostTest
          )
          if [ "$RECORD_SCREENSHOTS" = true ]; then
            tasks+=(:designsystem:recordRoborazziDesktop :shared:recordRoborazziDebug)
          else
            tasks+=(:designsystem:verifyRoborazziDesktop :shared:verifyRoborazziDebug)
          fi
          ./gradlew "${tasks[@]}" \
            --continue \
            --no-daemon \
            --console=plain \
            --stacktrace

      # The gate above compiles with the visual fixtures on (SLOCK_VISUAL_FIXTURES, job env), so it
      # never sees the configuration that ships: release, fixtures off (src/visualFixturesOff,
      # fixture data back in commonTest). On the full tier (nightly, full-ci, scope=full) compile
      # that configuration too, so a break shows up before release day. Its own invocation: the
      # fixture flag changes :shared's source sets.
      - name: Compile Android release configuration (fixtures off)
        if: ${{ env.BUILD_CONNECTED_APKS == 'true' }}
        working-directory: compose
        env:
          SLOCK_VISUAL_FIXTURES: "false"
        run: |
          ./gradlew \
            -PslockVisualFixtures=false \
            :shared:compileReleaseKotlinAndroid \
            :androidApp:compileReleaseKotlin \
            --no-daemon \
            --console=plain \
            --stacktrace

      # Gradle 9 does not run buildSrc's own tests as part of a build; the hang watchdog that every
      # JVM test task installs is only checked here.
      - name: Run buildSrc tests (hang watchdog)
        working-directory: compose
        run: |
          ./gradlew -p buildSrc test --no-daemon --console=plain --stacktrace
          grep -ho 'tests="[0-9]*"' buildSrc/build/test-results/test/*.xml | grep -qv 'tests="0"'

      # <name>_actual.png / <name>_compare.png and Roborazzi's HTML report (roborazzi/desktop/).
      - name: Upload design system screenshot diffs
        if: ${{ failure() || (github.event_name == 'workflow_dispatch' && inputs.record_screenshots) }}
        uses: actions/upload-artifact@v7
        with:
          name: designsystem-screenshot-diffs
          path: |
            compose/designsystem/build/reports/screenshots/
            compose/designsystem/build/reports/roborazzi/
          if-no-files-found: ignore

      # record_screenshots dispatch: the goldens recordRoborazziDesktop added or rewrote, to copy
      # into compose/designsystem/screenshots/ and commit (no local Gradle needed).
      - name: Collect recorded design system screenshots
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.record_screenshots }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/designsystem-screenshots-recorded"
          mkdir -p "$out"
          git ls-files --modified --others --exclude-standard -z -- compose/designsystem/screenshots \
            | xargs -0 -r cp -t "$out"
          echo "Recorded design system goldens: $(ls "$out" | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recorded design system screenshots
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.record_screenshots }}
        uses: actions/upload-artifact@v7
        with:
          name: designsystem-screenshots-recorded
          path: ${{ runner.temp }}/designsystem-screenshots-recorded/
          if-no-files-found: ignore

      # :shared's Robolectric screenshots (RaftRobolectricScreenshot): <name>_actual.png and
      # <name>_compare.png (golden, diff, actual) for every golden that is missing or differs,
      # under home-screenshots/ (thread-/shell-screenshots/ for a few tests), plus Roborazzi's HTML
      # report (roborazzi/debug/index.html). A new golden's image is its <name>_actual.png here.
      - name: Upload shared screenshot diffs
        if: ${{ failure() || (github.event_name == 'workflow_dispatch' && inputs.record_screenshots) }}
        uses: actions/upload-artifact@v7
        with:
          name: shared-home-screenshots
          path: |
            compose/shared/build/reports/home-screenshots/
            compose/shared/build/reports/thread-screenshots/
            compose/shared/build/reports/shell-screenshots/
            compose/shared/build/reports/roborazzi/
          if-no-files-found: ignore
          retention-days: 7

      # record_screenshots dispatch: the goldens recordRoborazziDebug added or rewrote, to copy
      # into compose/shared/src/androidUnitTest/screenshots/ and commit (no local Gradle needed).
      - name: Collect recorded shared screenshots
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.record_screenshots }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/shared-screenshots-recorded"
          mkdir -p "$out"
          git ls-files --modified --others --exclude-standard -z -- compose/shared/src/androidUnitTest/screenshots \
            | xargs -0 -r cp -t "$out"
          echo "Recorded shared goldens: $(ls "$out" | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recorded shared screenshots
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.record_screenshots }}
        uses: actions/upload-artifact@v7
        with:
          name: shared-screenshots-recorded
          path: ${{ runner.temp }}/shared-screenshots-recorded/
          if-no-files-found: ignore

      # Every tier: the merged debug manifest (written by the unit-test build) carries the same
      # defaultConfig minSdk the connected-test APK ships with.
      - name: Verify Android app min SDK (merged manifest)
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=compose/androidApp/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml
          test -s "${MANIFEST}"
          # AGP writes <uses-sdk> over several lines; print it, then assert the attribute.
          grep -A3 '<uses-sdk' "${MANIFEST}"
          grep -Fq 'android:minSdkVersion="29"' "${MANIFEST}"

      - name: Verify connected-test APK min SDK
        if: ${{ env.BUILD_CONNECTED_APKS == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find compose/androidApp/build/outputs/apk/connectedTest -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          test -n "${APK}"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "${AAPT}"
          "${AAPT}" dump badging "${APK}" | tee connectedtest-app-badging.txt
          grep -Fq "sdkVersion:'29'" connectedtest-app-badging.txt

      - name: Upload Android connected-test APKs
        if: ${{ env.BUILD_CONNECTED_APKS == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-connected-test-apks
          path: |
            compose/androidApp/build/outputs/apk/connectedTest/*.apk
            compose/androidApp/build/outputs/apk/androidTest/connectedTest/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload shared atomic-sink test APK
        if: ${{ env.BUILD_CONNECTED_APKS == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-shared-atomic-sink-test-apk
          path: compose/shared/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            compose/core/build/reports/tests/testDebugUnitTest/
            compose/core/build/test-results/testDebugUnitTest/
            compose/ui-cmp/build/reports/tests/testDebugUnitTest/
            compose/ui-cmp/build/test-results/testDebugUnitTest/
            compose/shared/build/reports/tests/testDebugUnitTest/
            compose/shared/build/test-results/testDebugUnitTest/
            compose/androidApp/build/reports/tests/testDebugUnitTest/
            compose/androidApp/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics

  android-device:
    name: Android first-character baseline (emulator)
    runs-on: ubuntu-latest
    needs: [plan, android]
    if: ${{ needs.plan.outputs.run_device_suite == 'true' }}
    timeout-minutes: 30
    steps:
      - name: Free runner disk space for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      # Checkout only exists to provide scripts/ci/assert-instrumentation-ok.sh
      # (the instrumentation gates were previously hardcoded `grep 'OK (N tests)'`
      # count pins that broke whenever a case was added to a gated class).
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Thread newer-pagination gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            run_gate=true
          else
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
            diff_rc=0
            scripts/ci/git-diff-path-state.sh "$PR_BASE_SHA" HEAD -- \
              compose/shared/src/commonMain/kotlin/build/raft/app/ThreadPage.kt \
              compose/shared/src/commonMain/kotlin/build/raft/app/LazyViewportController.kt \
              compose/shared/src/commonMain/kotlin/build/raft/app/ThreadNewerPagination.kt \
              compose/androidApp/src/androidTest/java/build/raft/app/shared/RaftThreadNewerAutoPaginationConnectedTest.kt \
              compose/shared/src/visualFixtures/kotlin/build/raft/app/ThreadNewerAutoPaginationVisualFixture.kt \
              || diff_rc=$?
            case "$diff_rc" in
              0) run_gate=false ;;
              1) run_gate=true ;;
              *)
                echo "::warning::git diff failed with exit $diff_rc; running Thread newer-pagination gate"
                run_gate=true
                ;;
            esac
          fi
          echo "THREAD_NEWER_PAGINATION_GATE_REQUIRED=$run_gate" >> "$GITHUB_ENV"
          echo "Thread newer-pagination gate required: $run_gate"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Download connected-test APKs
        uses: actions/download-artifact@v8
        with:
          name: android-connected-test-apks
          path: android-connected-test-apks

      - name: Download shared atomic-sink test APK
        uses: actions/download-artifact@v8
        with:
          name: android-shared-atomic-sink-test-apk
          path: android-shared-atomic-sink-test-apk

      - name: List downloaded APK members
        run: |
          find android-connected-test-apks -type f -name '*.apk' -print
          find android-shared-atomic-sink-test-apk -type f -name '*.apk' -print
          test "$(find android-shared-atomic-sink-test-apk -type f -name '*.apk' | wc -l)" -eq 1
          shared_test_apk="$(find android-shared-atomic-sink-test-apk -type f -name '*.apk' | head -n 1)"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          "$aapt_bin" dump badging "$shared_test_apk" | tee shared-atomic-sink-test-apk-badging.txt
          grep -Fq "package: name='build.raft.app.shared.test'" shared-atomic-sink-test-apk-badging.txt
          grep -Fq "targetSdkVersion:'34'" shared-atomic-sink-test-apk-badging.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validate first-character baseline regression script
        shell: bash
        run: bash -n scripts/ci/run-first-character-emulator-suite.sh

      - name: Run first-character baseline regression
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SOURCE_EXACT: ${{ github.event.pull_request.head.sha || github.sha }}
          ANDROID_EMULATOR_SYSTEM_IMAGE_PACKAGE: system-images;android-34;google_apis;x86_64
          RUNNER_LABEL: ubuntu-latest
          THREAD_NEWER_PAGINATION_GATE_REQUIRED: ${{ env.THREAD_NEWER_PAGINATION_GATE_REQUIRED }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6_pro
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash scripts/ci/run-first-character-emulator-suite.sh

      - name: Upload instrumentation output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: first-character-baseline-instrumentation
          path: |
            first-character-baseline-suite-summary.txt
            first-character-baseline-instrumentation.txt
            android-ime-environment.txt
            ime-visibility-probe-instrumentation.txt
            ime-visibility-probe-input-method.txt
            ime-visibility-probe-window.txt
            ime-visibility-probe-activity.txt
            ime-visibility-probe-power.txt
            ime-visibility-probe-policy.txt
            ime-visibility-probe-logcat.txt
            composer-session-retirement-instrumentation.txt
            composer-session-retirement-input-method.txt
            composer-session-retirement-window.txt
            composer-session-retirement-activity.txt
            composer-session-retirement-power.txt
