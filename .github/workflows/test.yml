  ios:
    # The default lane keeps the plain "iOS compile" name; only "CI gate" is a required
    # check (.github/rulesets/mobile-main-merge-queue.json), and it reads needs.ios.result,
    # which is success only when every planned lane succeeded.
    name: ${{ matrix.check_name }}
    # Path scoping downshifts the expensive (macOS) iOS compile on ordinary PR
    # pushes: changes touching commonMain run Linux fast gates only; the full iOS
    # host build runs when iOS-specific code is changed, on explicit full-ci PRs,
    # or on nightly/release readbacks.
    # Lanes come from the plan (`ios_lanes`):
    # - blacksmith-xcode27.0, every iOS run: Blacksmith with Xcode 27.0 (iOS 27 SDK). GitHub's
    #   Macs share one concurrency cap with ios-release.yml and ios-simulator-app.yml (27.1,
    #   xcode-27*), so routine checks stay off it and releases do not queue behind them.
    # - github-xcode27.1, only on the full tier (full-ci PR, release-* push, nightly, scope=full
    #   dispatch) or when compose/iosApp changed: GitHub xcode-27 with Xcode 27.1, so code using
    #   27.1-only SDK APIs (iPhone Duo: UIViewReservedRegion, UIHinge) compiles before release.
    # The simulator steps pick an iPhone on the newest iOS runtime not newer than the SDK, skipping
    # iPhone Duo (on xcode-27 the iOS 27.1 runtime only offers Duo; the tab-bar tests expect a phone).
    needs: [plan]
    if: ${{ needs.plan.outputs.run_ios == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.ios_lanes) }}
        include:
          - lane: blacksmith-xcode27.0
            check_name: iOS compile
            runner: blacksmith-12vcpu-macos-latest
            xcode_request: /Applications/Xcode_27.0.app
          - lane: github-xcode27.1
            check_name: iOS compile (Xcode 27.1)
            runner: xcode-27
            xcode_request: /Applications/Xcode_27.1.app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      # Blacksmith macOS starts its local Actions-results proxy with the job (see ios-release.yml).
      - name: Warm macOS artifact proxy
        if: ${{ startsWith(matrix.runner, 'blacksmith') }}
        shell: bash
        run: sleep 5

      - name: Checkout
        uses: actions/checkout@v7

      # Blacksmith exposes Xcode 27.0 only through symlinks (Xcode_27.0.app ->
      # Xcode_27_Release_Candidate.app), which select_ios_xcode.sh rejects. Resolve the
      # requested path to its real bundle directly under /Applications first (on GitHub
      # xcode-27, Xcode_27.1.app is already a real directory). The xcode_app_path dispatch
      # input overrides the Blacksmith lane only; the 27.1 lane stays pinned to 27.1.
      - name: Resolve Xcode bundle
        shell: bash
        env:
          XCODE_REQUEST: ${{ matrix.lane == 'blacksmith-xcode27.0' && inputs.xcode_app_path || matrix.xcode_request }}
        run: |
          set -euo pipefail
          real="$(realpath "$XCODE_REQUEST")"
          case "$real" in
            /Applications/Xcode*.app) ;;
            *) echo "::error::$XCODE_REQUEST resolves to $real, not an Xcode bundle directly under /Applications"; exit 1 ;;
          esac
          [ "$(dirname "$real")" = /Applications ] || { echo "::error::$real is not directly under /Applications"; exit 1; }
          echo "Xcode: $XCODE_REQUEST -> $real"
          echo "RAFT_IOS_COMPILE_XCODE=$real" >> "$GITHUB_ENV"

      - name: Pin Xcode
        # Build with a chosen Xcode, not the runner image's default: the SDK decides how iOS
        # lays the app out (the iOS 27.1 SDK makes it edge-to-edge on iPhone Duo, status bar on
        # the right edge). Moving SDKs is a deliberate change (iPhone Duo audit, 2026-10-27).
        # `xcode_app_path` (workflow_dispatch only) picks another Xcode for the Blacksmith lane;
        # empty keeps Xcode 27.0. The 27.1 lane and releases (ios-release.yml) build with 27.1.
        env:
          XCODE_APP_PATH: ${{ env.RAFT_IOS_COMPILE_XCODE }}
        run: bash scripts/ci/select_ios_xcode.sh

      - name: Record Xcode and iOS SDK
        env:
          XCODE_APP_PATH: ${{ env.RAFT_IOS_COMPILE_XCODE }}
          RAFT_DEFAULT_XCODE_APP: ${{ env.RAFT_IOS_COMPILE_XCODE }}
        run: bash scripts/ci/record_ios_toolchain.sh

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Shared Kotlin/Native Gradle settings
        uses: ./.github/actions/ios-kn-gradle
      # The device target (:shared:compileKotlinIosArm64, ~1.5 min on top of the simulator
      # compile) runs only on the full tier (full-ci PRs, nightly, scope=full dispatch) and on
      # release-* pushes. Main pushes and merge-queue runs compile the simulator targets only;
      # ios-release.yml still compiles and links the device target for every device release.
      - name: Compile shared and design system iOS targets and unit tests
        working-directory: compose
        env:
          IOS_DEVICE_COMPILE: ${{ needs.plan.outputs.run_device_suite == 'true' || startsWith(github.ref, 'refs/heads/release-') }}
        run: |
          set -euo pipefail
          tasks=(
            :shared:compileKotlinIosSimulatorArm64
            :shared:compileTestKotlinIosSimulatorArm64
            :designsystem:compileKotlinIosSimulatorArm64
            :ui-cmp:compileKotlinIosSimulatorArm64
          )
          if [ "$IOS_DEVICE_COMPILE" = true ]; then
            tasks+=(:shared:compileKotlinIosArm64)
          fi
          ./gradlew "${tasks[@]}" \
            --no-daemon \
            --console=plain \
            --stacktrace

      - name: Test adaptive navigation transaction fences
        run: bash compose/iosApp/scripts/test_adaptive_navigation_session.sh

      - name: Test iOS interactive pop gesture admission
        run: bash compose/iosApp/scripts/test_interactive_pop_gesture_admission.sh

      - name: Test iOS conversation forward gesture admission
        run: bash compose/iosApp/scripts/test_conversation_forward_gesture_admission.sh

      # shared.podspec guards against a missing framework dir; the IDE's
      # Gradle sync normally creates the placeholder — CI must do it manually.
      - name: Generate shared framework placeholder
        working-directory: compose
        run: ./gradlew :shared:generateDummyFramework --no-daemon --console=plain --stacktrace

      - name: Pod install
        working-directory: compose/iosApp
        run: pod install

      # Sync the K/N framework as its own step so Gradle gets proper caching
      # and failure diagnostics, instead of running nested inside xcodebuild's
      # [CP-User] Build shared script phase (which is also where tail-truncated
      # logs used to swallow the real linker error). xcodebuild then skips the
      # podspec script via OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES.
      # Every xcodebuild below also passes RAFT_IOS_REUSE_LINKED_FRAMEWORK=YES so
      # the app's "Copy kmmresource MR bundle" phase reuses this link instead of
      # relinking if Gradle sees it out of date (compose/shared/build.gradle.kts).
      - name: Sync shared framework (simulator arm64)
        working-directory: compose
        run: |
          ./gradlew :shared:syncFramework \
            -Pkotlin.native.cocoapods.platform=iphonesimulator \
            -Pkotlin.native.cocoapods.archs=arm64 \
            -Pkotlin.native.cocoapods.configuration=Debug \
            --no-daemon \
            --console=plain \
            --stacktrace

      - name: Build iOS host app (simulator)
        working-directory: compose/iosApp
        run: |
          set -o pipefail
          log="$GITHUB_WORKSPACE/xcodebuild-ios.log"
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            RAFT_IOS_REUSE_LINKED_FRAMEWORK=YES \
            build > "$log" 2>&1
          status=$?
          tail -200 "$log"
          if [ "$status" -ne 0 ]; then
            echo "===== iOS build FAILED (status=$status) — extracted errors ====="
            grep -nE "(^|[[:space:]])e: |: error:|error: |Unresolved|FAILURE:|Execution failed|BUILD FAILED|following build commands failed|PhaseScriptExecution" "$log" \
              | grep -v "Using response file" | tail -100 || true
          fi
          exit "$status"

      - name: Test adaptive editor snapshots (UIKit)
        working-directory: compose/iosApp
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)" python3 -c 'import json,os,re,sys; v=lambda s: tuple(int(p) for p in re.findall(r"\d+", s)); rs=sorted(((v(k.rsplit(".iOS-", 1)[1]), k, vs) for k, vs in json.load(sys.stdin)["devices"].items() if ".iOS-" in k), key=lambda t: t[0], reverse=True); rs=[t for t in rs if t[0] <= v(os.environ["SDK"])] or rs; ds=[(k, x) for _, k, vs in rs for x in vs if "iPhone" in x["name"]]; k, x=next((d for d in ds if "Duo" not in d[1]["name"]), ds[0]); print(x["name"], k, file=sys.stderr); print(x["udid"])')
          log="$GITHUB_WORKSPACE/xcodebuild-adaptive-editor-tests.log"
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme AdaptiveEditorTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            -only-testing:AdaptiveEditorTests/RaftAdaptiveEditorSnapshotTests \
            -parallel-testing-enabled NO \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            RAFT_IOS_REUSE_LINKED_FRAMEWORK=YES \
            test > "$log" 2>&1 || { tail -200 "$log"; exit 1; }
          tail -60 "$log"
          python3 "$GITHUB_WORKSPACE/compose/iosApp/scripts/assert_xctest_ran.py" "$log" RaftAdaptiveEditorSnapshotTests

      - name: Test iOS host XCTests (iosAppTests bundle, UIKit)
        working-directory: compose/iosApp
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)" python3 -c 'import json,os,re,sys; v=lambda s: tuple(int(p) for p in re.findall(r"\d+", s)); rs=sorted(((v(k.rsplit(".iOS-", 1)[1]), k, vs) for k, vs in json.load(sys.stdin)["devices"].items() if ".iOS-" in k), key=lambda t: t[0], reverse=True); rs=[t for t in rs if t[0] <= v(os.environ["SDK"])] or rs; ds=[(k, x) for _, k, vs in rs for x in vs if "iPhone" in x["name"]]; k, x=next((d for d in ds if "Duo" not in d[1]["name"]), ds[0]); print(x["name"], k, file=sys.stderr); print(x["udid"])')
          log="$GITHUB_WORKSPACE/xcodebuild-login-router-tests.log"
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosAppTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            -only-testing:iosAppTests \
            -parallel-testing-enabled NO \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            RAFT_IOS_REUSE_LINKED_FRAMEWORK=YES \
            test > "$log" 2>&1 || { tail -200 "$log"; exit 1; }
          tail -60 "$log"
          # Every class in the bundle must have run at least one case; xcodebuild itself
          # reports success when a selector matches nothing.
          python3 "$GITHUB_WORKSPACE/compose/iosApp/scripts/assert_xctest_ran.py" "$log" \
            RaftRouterLoginTransitionTests \
            RaftCmpBridgeSelectorTests \
            RaftIosTabBarItemMappingTests \
            RaftInteractivePopGestureTests \
            RaftIosAdaptivePanePublisherTests \
            RaftIosAvatarCacheProviderTests \
            RaftIosNetworkRequestLifetimeAdapterTests \
            RaftIosRealtimeLifecyclePolicyTests \
            RaftIosOpenAttachmentTests \
            RaftShareControllerFailureReasonTests

      # The UI-test bundle is only compiled here; its one case (QaAcceptanceLoopTests) is a
      # driver loop run by qa-acceptance-ios.yml, which does its own build-for-testing
      # before test-without-building. So on pull requests we build just the host
      # app -- which is what actually proves shared/iOS integration still
      # compiles -- and leave the harness compile to non-PR runs.
      - name: Build iOS UI-test harness (simulator)
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: compose/iosApp
        run: |
          set -o pipefail
          log="$GITHUB_WORKSPACE/xcodebuild-ios.log"
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosAppUITests \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            RAFT_IOS_REUSE_LINKED_FRAMEWORK=YES \
            build-for-testing > "$log" 2>&1
          status=$?
          tail -200 "$log"
          if [ "$status" -ne 0 ]; then
            echo "===== iOS build FAILED (status=$status) — extracted errors ====="
            grep -nE "(^|[[:space:]])e: |: error:|error: |Unresolved|FAILURE:|Execution failed|BUILD FAILED|following build commands failed|PhaseScriptExecution" "$log" \
              | grep -v "Using response file" | tail -100 || true
          fi
          exit "$status"

      # compose/shared/src/iosTest used to be compiled only. Run the iOS-specific classes
      # (*IosTest / *IosSmokeTest) on a simulator; commonTest already runs on the JVM in the
      # android job. Gradle fails if the filters match no test, and the report check below
      # fails on zero executed cases. It runs after the XCTest steps so a red iosTest does not
      # hide their results.
      - name: Run shared iosTest on the simulator
        working-directory: compose
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          device_id=$(xcrun simctl list devices available -j | SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)" python3 -c 'import json,os,re,sys; v=lambda s: tuple(int(p) for p in re.findall(r"\d+", s)); rs=sorted(((v(k.rsplit(".iOS-", 1)[1]), k, vs) for k, vs in json.load(sys.stdin)["devices"].items() if ".iOS-" in k), key=lambda t: t[0], reverse=True); rs=[t for t in rs if t[0] <= v(os.environ["SDK"])] or rs; ds=[(k, x) for _, k, vs in rs for x in vs if "iPhone" in x["name"]]; k, x=next((d for d in ds if "Duo" not in d[1]["name"]), ds[0]); print(x["name"], k, file=sys.stderr); print(x["udid"])')
          # The XCTest steps above leave this simulator booted; the Kotlin test task boots it itself.
          xcrun simctl shutdown "$device_id" 2>/dev/null || true
          gradle_rc=0
          ./gradlew :shared:iosSimulatorArm64Test \
            -Praft.iosSimulatorTestDevice="$device_id" \
            --tests '*IosTest' \
            --tests '*IosSmokeTest' \
            --no-daemon \
            --console=plain \
            --stacktrace || gradle_rc=$?
          python3 - <<'PY'
          import pathlib, re, sys, xml.etree.ElementTree as ET
          reports = sorted(pathlib.Path("shared/build/test-results/iosSimulatorArm64Test").glob("*.xml"))
          total = 0
          ran = {}
          for report in reports:
              suite = ET.parse(report).getroot()
              count = int(suite.get("tests", "0"))
              total += count
              simple = suite.get("name", "").split("[")[0].strip().rsplit(".", 1)[-1]
              ran[simple] = ran.get(simple, 0) + count
              print(f"{suite.get('name')}: {count} tests, {suite.get('failures')} failures, {suite.get('skipped')} skipped")
              for case in suite.iter("testcase"):
                  for problem in list(case.iter("failure")) + list(case.iter("error")):
                      print(f"  FAILED {case.get('name')}: {problem.get('message')}")
                      print("    " + (problem.text or "").strip()[:2000].replace("\n", "\n    "))
          print(f"iosTest total: {total} tests in {len(reports)} classes")
          # Every top-level class in an iosTest file with @Test must have run at least one case:
          # a class the --tests filters above miss (Hands 1b6dd022: RaftDarwinUploadProgressTest
          # compiled but never ran) fails here instead of passing silently.
          declared = set()
          for source in pathlib.Path("shared/src/iosTest").rglob("*.kt"):
              text = source.read_text()
              if "@Test" in text:
                  declared.update(re.findall(r"^(?:(?:internal|public|open) )*class (\w+)", text, re.M))
          missing = sorted(name for name in declared if ran.get(name, 0) == 0)
          for name in missing:
              print(f"NOT RUN: {name} has @Test cases but executed 0 (name must match *IosTest or *IosSmokeTest)")
          print(f"iosTest classes declared: {len(declared)}, not run: {len(missing)}")
          sys.exit(0 if total > 0 and not missing else 1)
          PY
          summary_rc=$?
          [ "$gradle_rc" -eq 0 ] && [ "$summary_rc" -eq 0 ]

      - name: Upload xcodebuild log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-compile-xcodebuild-log-${{ github.run_id }}-${{ matrix.lane }}
          path: |
            xcodebuild-ios.log
            xcodebuild-adaptive-editor-tests.log
            xcodebuild-login-router-tests.log
            compose/shared/build/test-results/iosSimulatorArm64Test/
            compose/shared/build/reports/tests/iosSimulatorArm64Test/
          if-no-files-found: ignore
          retention-days: 7

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics

  # The only Test context intended for the main-branch required-check rule.
  # It always reports, including docs-only PRs, and mechanically verifies that
  # exactly the jobs selected by the checked-in plan passed. Emulator jobs are
  # intentionally absent from merge_group until their bounded infra-abort
  # retry contract has landed and has fresh flake evidence.
  ci-gate:
    name: CI gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - plan
      - android
      - android-device
      - android-minimum-supported-attachment-runtime
      - android-canonical-final-actual-host
      - ios
    steps:
      - name: Checkout aggregate verifier
        uses: actions/checkout@v7

      # Runs in the SAME job as the gate on purpose. The verifier carries a selfTest behind
      # `--self-test`, and nothing invoked it — so the expectation table could drift from
      # test.yml and no CI job would go red. That is exactly how a job-dependency/iOS
      # mismatch survived 18 days (#2294). Every other scripts/ci self-test in this repo is
      # called by CI; this one was the sole omission (@LiBai). Putting it beside the gate,
      # rather than in a paths-filtered lint workflow, means it cannot fall out of coverage
      # when someone edits the verifier without touching whatever paths that lint watches.
      - name: Self-test the tier verifier
        run: node scripts/ci/verify_test_tier_results.mjs --self-test

      - name: Verify exact selected tier results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/verify_test_tier_results.mjs
