name: Test

on:
  pull_request:
    # `labeled`/`unlabeled` make the full-ci escape hatch take effect without
    # requiring a source push. No path filter: the stable CI gate must report
    # even for docs-only pull requests if it is configured as required.
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - "release-*"
  workflow_dispatch:
    inputs:
      ohos_receipt_specimen:
        description: "Task #91: force a controlled nonzero OHOS shared-compile exit to prove the resource-receipt artifact still uploads on RED. Does not affect normal runs."
        type: boolean
        default: false
  # Nightly run so the (slow, macOS) iOS compile still runs on a schedule even
  # though it no longer gates pull requests. See the `ios` job's `if:` guard.
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read
  packages: read

concurrency:
  group: test-${{ github.ref }}
  # Preserve the running post-merge record on protected branches. GitHub still
  # coalesces multiple pending runs in the same group to the newest commit.
  # PR and merge-queue refs keep superseding stale work for that exact ref.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release-') }}

env:
  # Cache-path format + immutable Harmony image epoch. Bump whenever either
  # changes so migration runs prove a cold container publish/save/restore.
  HARMONY_CACHE_EPOCH: hci-v6.1.1.280-333681267bdf-r2

jobs:
  plan:
    name: CI plan + contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      run_basic: ${{ steps.plan.outputs.run_basic }}
      run_full: ${{ steps.plan.outputs.run_full }}
      run_emulators: ${{ steps.plan.outputs.run_emulators }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate checked-in CI tiering contract
        run: scripts/ci/test_ci_tiering_contract.sh

      - name: Validate iOS Kotlin/Native optimizer contract
        run: scripts/ci/test_ios_native_optimizer_contract.sh

      - name: Validate OHOS attachment-open diagnostic production wiring
        run: node compose/ohosApp/scripts/test_attachment_open_diagnostics_source_contract.mjs

      # Incident-born gate (task #976): PR #1920 imported kotlinx.coroutines.test
      # into commonTest; the OHOS test targets have no such KLIB, so only the
      # post-merge OHOS shared compile went red. This contract runs on every PR.
      # Denylist form: seals the listed dependencies, not the general class.
      - name: Validate commonTest cross-platform test dependency contract
        run: |
          python3 scripts/ci/check_commontest_crossplatform_deps.py --self-test
          python3 scripts/ci/check_commontest_crossplatform_deps.py

      - name: Resolve exact execution tier
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/test-changed-paths.txt"
          : > "$changed"
          if test "$EVENT_NAME" = pull_request; then
            git cat-file -e "$BASE_SHA^{commit}"
            git cat-file -e "$HEAD_SHA^{commit}"
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed"
          fi
          scripts/ci/plan_test_tier.sh "$EVENT_NAME" "$changed" "$FULL_CI" \
            | tee -a "$GITHUB_OUTPUT"

      - name: Self-test gitlink carry-in gate
        run: python3 scripts/ci/test_gitlink_carry_in_gate.py

      - name: Audit changed gitlink carry-in
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci/gitlink_carry_in_gate.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --manifest "$RUNNER_TEMP/gitlink-carry-in.json" \
            --markdown "$RUNNER_TEMP/gitlink-carry-in.md"

      - name: Publish gitlink carry-in audit to PR
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitlink-carry-in.md"
          manifest="$RUNNER_TEMP/gitlink-carry-in.json"
          test -s "$report" || exit 0
          test -s "$manifest"

          marker='<!-- gitlink-carry-in-gate -->'
          existing="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              --jq ".[] | select(.body | startswith(\"$marker\")) | .id" \
              | sed -n '1p'
          )"
          status="$(jq -r '.status' "$manifest")"
          if test "$status" = no_changes && test -z "$existing"; then
            exit 0
          fi

          payload="$RUNNER_TEMP/gitlink-carry-in-comment.json"
          jq -n --rawfile body "$report" '{body: $body}' > "$payload"
          if test -n "$existing"; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input "$payload" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$payload" >/dev/null
          fi

      - name: Summarize gitlink carry-in audit
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          report="$RUNNER_TEMP/gitlink-carry-in.md"
          test -s "$report" || exit 0
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gitlink carry-in audit
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: gitlink-carry-in-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/gitlink-carry-in.json
            ${{ runner.temp }}/gitlink-carry-in.md
          if-no-files-found: warn
          retention-days: 30

  # Single upstream build of every fork artifact the platform jobs consume.
  # Kuikly android/foundation + OHOS klibs and the stately/sqliter/sqldelight/
  # ktor-ohos stack are published to mavenLocal ONCE here (ubuntu) and shared
  # through os-less cache keys — the artifacts are jvm jars / klibs / .module
  # metadata, all platform-neutral, so the platform host and container jobs
  # restore the same entries instead of rebuilding per (job, os) combination.
  kuikly-artifacts:
    name: Kuikly fork artifacts (prebuild)
    needs: [plan]
    if: ${{ needs.plan.outputs.run_basic == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Keep the Harmony SDK/LLVM and Android SDK in the immutable image layer.
    # Pin the verified linux/amd64 manifest so the release tag cannot drift;
    # do not download OpenHarmony tooling at workflow runtime.
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280-android.1@sha256:333681267bdf66eaba96d311d34eada49cfd86621f33c21cdf9a19fed343f5e5
    timeout-minutes: 60
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      OHOS_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk/default/openharmony
      DEVECO_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk
    outputs:
      kuikly-sha: ${{ steps.pins.outputs.kuikly }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Mark workspace safe for git
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Set up JDK 8 for Ktor toolchain
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      - name: Resolve fork pins
        id: pins
        shell: bash
        run: |
          kuikly="$(git rev-parse HEAD:third_party/kuikly-ui)"
          test -n "$kuikly"
          echo "kuikly=$kuikly" >> "$GITHUB_OUTPUT"

      # The android and ohos flavors publish OVERLAPPING coordinates (the ohos
      # pass rewrites :core/:compose common metadata), so they are built and
      # cached as two separate entries — never mixed in one directory.
      # os-less keys: the artifacts are jars/klibs, consumable on any OS.
      - name: Restore kuikly fork cache (android flavor)
        id: kuikly-android-cache
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/maven/kuikly-android
          key: kuikly-fork-mavenlocal-android-${{ env.HARMONY_CACHE_EPOCH }}-${{ steps.pins.outputs.kuikly }}

      - name: Build kuikly fork (android flavor)
        if: steps.kuikly-android-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui
          scripts/build_kuikly_fork.sh --android-only

      - name: Stage kuikly fork cache (android flavor)
        if: steps.kuikly-android-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          userhome="$(java -XshowSettings:properties -version 2>&1 | awk '/user.home/{print $3; exit}')"
          test -n "$userhome"
          src="$userhome/.m2/repository/com/tencent/kuikly-open"
          dst="$GITHUB_WORKSPACE/.ci-cache/maven/kuikly-android"
          test -d "$src/core"
          test -d "$src/compose"
          rm -rf "$dst"
          mkdir -p "$dst"
          cp -a "$src/." "$dst/"

      - name: Verify staged kuikly fork cache (android flavor)
        shell: bash
        run: |
          stage="$GITHUB_WORKSPACE/.ci-cache/maven/kuikly-android"
          test -d "$stage/core"
          test -d "$stage/compose"

      - name: Save kuikly fork cache (android flavor)
        if: steps.kuikly-android-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ci-cache/maven/kuikly-android
          key: kuikly-fork-mavenlocal-android-${{ env.HARMONY_CACHE_EPOCH }}-${{ steps.pins.outputs.kuikly }}

      - name: Restore kuikly fork cache (ohos flavor)
        id: kuikly-ohos-cache
        if: ${{ needs.plan.outputs.run_full == 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/maven/kuikly-ohos
          key: kuikly-fork-mavenlocal-ohos-${{ env.HARMONY_CACHE_EPOCH }}-${{ steps.pins.outputs.kuikly }}

      - name: Build kuikly fork (ohos flavor)
        if: ${{ needs.plan.outputs.run_full == 'true' && steps.kuikly-ohos-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          userhome="$(java -XshowSettings:properties -version 2>&1 | awk '/user.home/{print $3; exit}')"
          test -n "$userhome"
          rm -rf "$userhome/.m2/repository/com/tencent/kuikly-open"
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui
          scripts/build_kuikly_fork.sh --ohos-only

      - name: Stage kuikly fork cache (ohos flavor)
        if: ${{ needs.plan.outputs.run_full == 'true' && steps.kuikly-ohos-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          userhome="$(java -XshowSettings:properties -version 2>&1 | awk '/user.home/{print $3; exit}')"
          test -n "$userhome"
          src="$userhome/.m2/repository/com/tencent/kuikly-open"
          dst="$GITHUB_WORKSPACE/.ci-cache/maven/kuikly-ohos"
          test -d "$src/core-ohosarm64"
          test -d "$src/compose-ohosarm64"
          rm -rf "$dst"
          mkdir -p "$dst"
          cp -a "$src/." "$dst/"

      - name: Verify staged kuikly fork cache (ohos flavor)
        if: ${{ needs.plan.outputs.run_full == 'true' }}
        shell: bash
        run: |
          stage="$GITHUB_WORKSPACE/.ci-cache/maven/kuikly-ohos"
          test -d "$stage/core-ohosarm64"
          test -d "$stage/compose-ohosarm64"

      - name: Save kuikly fork cache (ohos flavor)
        if: ${{ needs.plan.outputs.run_full == 'true' && steps.kuikly-ohos-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .ci-cache/maven/kuikly-ohos
          key: kuikly-fork-mavenlocal-ohos-${{ env.HARMONY_CACHE_EPOCH }}-${{ steps.pins.outputs.kuikly }}

      - name: Set up Node.js for pinned HAR contract
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify OHOS image decode policy and pinned HAR
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui
          node compose/ohosApp/scripts/test_image_decode_policy_source_contract.mjs

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics

  # Parallel sibling of kuikly-artifacts: the stately/sqliter/sqldelight/ktor
  # fork stack. Split per artin so neither job's disk/wall-clock includes the
  # other's build.
  fork-deps:
    name: Shared fork dependencies (prebuild)
    needs: [plan]
    if: ${{ needs.plan.outputs.run_full == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280-android.1@sha256:333681267bdf66eaba96d311d34eada49cfd86621f33c21cdf9a19fed343f5e5
    timeout-minutes: 60
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      OHOS_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk/default/openharmony
      DEVECO_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk
    outputs:
      forkdeps-key: ${{ steps.keys.outputs.forkdeps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Mark workspace safe for git
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Set up JDK 8 for Ktor toolchain
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      # The fork projects' settings list only CN mirrors (mirrors.tencent.com /
      # maven.eazytec-cloud.com), which are flaky from hosted runners. Fall back
      # to the canonical repositories without touching the pinned submodules.
      # Plugin repositories only: an allprojects{repositories{}} block here would
      # give every project PROJECT-level repositories, which makes Gradle ignore
      # the settings-level dependencyResolutionManagement repositories — i.e. it
      # would hide the CN mirrors that the KBA kotlin artifacts resolve from.
      - name: Add canonical repository fallbacks
        shell: bash
        run: |
          userhome="$(java -XshowSettings:properties -version 2>&1 | awk '/user.home/{print $3; exit}')"
          test -n "$userhome"
          mkdir -p "$userhome/.gradle"
          cat > "$userhome/.gradle/init.gradle.kts" <<'INIT'
          settingsEvaluated {
              pluginManagement {
                  repositories {
                      gradlePluginPortal()
                      mavenCentral()
                      google()
                  }
              }
          }
          INIT

      - name: Compose cache key
        id: keys
        shell: bash
        run: |
          stately="$(git rev-parse HEAD:third_party/stately)"
          sqliter="$(git rev-parse HEAD:third_party/sqliter)"
          sqldelight="$(git rev-parse HEAD:third_party/sqldelight)"
          test -n "$stately" && test -n "$sqliter" && test -n "$sqldelight"
          echo "forkdeps=forkdeps-mavenlocal-${HARMONY_CACHE_EPOCH}-$stately-$sqliter-$sqldelight-${{ hashFiles('scripts/prepare_ktor_ohos_fork.sh', 'third_party/ktor-ohos/**') }}" >> "$GITHUB_OUTPUT"

      - name: Cache shared fork dependencies mavenLocal artifacts
        id: forkdeps-cache
        uses: actions/cache@v5
        with:
          path: .ci-cache/maven/fork-deps
          key: ${{ steps.keys.outputs.forkdeps }}

      - name: Hydrate shared fork dependencies from staged cache
        if: steps.forkdeps-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          userhome="$(java -XshowSettings:properties -version 2>&1 | awk '/user.home/{print $3; exit}')"
          test -n "$userhome"
          stage="$GITHUB_WORKSPACE/.ci-cache/maven/fork-deps"
          dst="$userhome/.m2/repository"
          test -d "$stage/co/touchlab"
          test -d "$stage/app/cash/sqldelight"
          test -d "$stage/io/ktor"
          mkdir -p "$dst"
          cp -a "$stage/." "$dst/"

      # Retried: the KBA artifacts resolve only from CN mirrors
      # (mirrors.tencent.com), whose reachability from hosted runners is
      # flaky — every fork-deps failure so far has been this. Once one run
      # succeeds, the os-less cache keeps everyone warm until pins change.
      # The attempt runs as its own `bash` process: a shell function called from
      # an `if` has errexit suppressed for its whole body, so one failing gradlew
      # would silently fall through to the next command and the step would pass
      # with a half-empty ~/.m2 (this shipped a 2.6MB ktor-only cache once).
      - name: Publish shared fork dependencies
        if: steps.forkdeps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cat > /tmp/publish-forkdeps.sh <<'SCRIPT'
          set -euo pipefail
          git submodule sync third_party/stately third_party/sqliter third_party/sqldelight
          git submodule update --init third_party/stately third_party/sqliter third_party/sqldelight

          pushd third_party/stately
          ./gradlew --no-daemon --console=plain \
            --stacktrace \
            :stately-strict:publishKotlinMultiplatformPublicationToMavenLocal \
            :stately-strict:publishOhosArm64PublicationToMavenLocal \
            :stately-concurrency:publishKotlinMultiplatformPublicationToMavenLocal \
            :stately-concurrency:publishOhosArm64PublicationToMavenLocal
          popd

          pushd third_party/sqliter
          ./gradlew --no-daemon --console=plain \
            --stacktrace \
            :sqliter-driver:publishKotlinMultiplatformPublicationToMavenLocal \
            :sqliter-driver:publishOhosArm64PublicationToMavenLocal
          popd

          pushd third_party/sqldelight
          ./gradlew --no-daemon --console=plain \
            --stacktrace \
            :sqldelight-compiler:environment:publishMavenPublicationToMavenLocal \
            :sqldelight-compiler:dialect:publishMavenPublicationToMavenLocal \
            :sqldelight-compiler:publishMavenPublicationToMavenLocal \
            :sqlite-migrations:environment:publishMavenPublicationToMavenLocal \
            :sqlite-migrations:publishMavenPublicationToMavenLocal \
            :dialects:sqlite-3-18:publishMavenPublicationToMavenLocal \
            :sqldelight-gradle-plugin:publishToMavenLocal \
            :runtime:publishKotlinMultiplatformPublicationToMavenLocal \
            :runtime:publishOhosArm64PublicationToMavenLocal \
            :drivers:native-driver:publishOhosArm64PublicationToMavenLocal
          popd

          scripts/prepare_ktor_ohos_fork.sh --publish
          SCRIPT
          for i in 1 2 3; do
            if bash /tmp/publish-forkdeps.sh; then exit 0; fi
            echo "fork-deps publish attempt $i failed; retrying in $((i*30))s" >&2
            sleep $((i*30))
          done
          echo "fork-deps publish failed after 3 attempts" >&2
          exit 1

      # Guard against ever saving a half-empty cache again: assert the marker
      # artifacts from each fork are present before the post-job cache save.
      - name: Verify published fork dependencies
        shell: bash
        run: |
          userhome="$(java -XshowSettings:properties -version 2>&1 | awk '/user.home/{print $3; exit}')"
          test -n "$userhome"
          repo="$userhome/.m2/repository"
          missing=0
          for probe in \
            "co/touchlab/stately-strict-ohosarm64" \
            "co/touchlab/stately-concurrency-ohosarm64" \
            "co/touchlab/sqliter-driver-ohosarm64" \
            "app/cash/sqldelight/app.cash.sqldelight.gradle.plugin" \
            "app/cash/sqldelight/runtime-ohosarm64" \
            "app/cash/sqldelight/native-driver-ohosarm64" \
            "io/ktor/ktor-client-core-ohosarm64"; do
            if ! find "$repo/$probe" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | grep -q .; then
              echo "MISSING: $probe" >&2
              missing=1
            fi
          done
          exit $missing

      - name: Stage shared fork dependencies for cache
        if: steps.forkdeps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          userhome="$(java -XshowSettings:properties -version 2>&1 | awk '/user.home/{print $3; exit}')"
          test -n "$userhome"
          repo="$userhome/.m2/repository"
          stage="$GITHUB_WORKSPACE/.ci-cache/maven/fork-deps"
          rm -rf "$stage"
          mkdir -p "$stage/co" "$stage/app/cash" "$stage/io"
          cp -a "$repo/co/touchlab" "$stage/co/"
          cp -a "$repo/app/cash/sqldelight" "$stage/app/cash/"
          cp -a "$repo/io/ktor" "$stage/io/"
          test -d "$stage/co/touchlab/stately-strict-ohosarm64"
          test -d "$stage/app/cash/sqldelight/app.cash.sqldelight.gradle.plugin"
          test -d "$stage/io/ktor/ktor-client-core-ohosarm64"

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics

  android:
    name: Android compile & tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [plan, kuikly-artifacts]
    if: ${{ needs.plan.outputs.run_basic == 'true' }}
    timeout-minutes: 40
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      # A stable (not per-run) GRADLE_USER_HOME so the setup-gradle cache actually
      # restores across runs: its GitHub cache version hashes the resolved cache
      # paths, so a run_id-suffixed home would change the version every run and
      # never hit. #1478's poisoned-transform isolation is now provided by
      # gradle-home-cache-excludes below (transforms/instrumented-jars are never
      # restored), so the per-run home it used is no longer needed. Blacksmith
      # runners are fresh VMs and the step below rebuilds this dir clean, so only
      # setup-gradle's restore populates it.
      GRADLE_USER_HOME: /tmp/android-compile-gradle-home
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard commonMain Map compatibility imports
        shell: bash
        run: |
          scripts/check_commonmain_map_compat.sh --self-test
          scripts/check_commonmain_map_compat.sh

      - name: Guard SlockMarkdownSpike println gate (task #20)
        shell: bash
        run: |
          scripts/check_markdown_spike_println_gate.sh --self-test
          scripts/check_markdown_spike_println_gate.sh

      - name: Guard atomic auth-session writes (#466 no-bypass)
        shell: bash
        run: |
          scripts/check_auth_session_writes.sh --self-test
          scripts/check_auth_session_writes.sh

      - name: Guard attachment mapper raw-size boundary
        shell: bash
        run: scripts/check_attachment_mapper_formatting.sh

      # Both vector guards verify the vendored copy against a digest pinned in
      # the script — fully local since task #18 (a pinned commit's content is
      # immutable, so the previous gh api fetch verified nothing and only added
      # a token/network failure surface).
      - name: Guard Web/mobile read-state authority vector
        shell: bash
        run: scripts/check_read_state_behavior_vector.sh

      - name: Guard Web/mobile canonical-message V2 reaction vector
        shell: bash
        run: scripts/check_canonical_message_v2_reaction_vector.sh

      - name: Guard read-state SyncCore registration boundary
        shell: bash
        run: scripts/check_read_state_sync_domain_registration.sh

      - name: Guard translucent semantic action fills
        run: |
          scripts/audit_translucent_action_tokens.py --self-test
          scripts/audit_translucent_action_tokens.py --strict

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Start from a clean Gradle home (fail-closed)
        run: rm -rf "$GRADLE_USER_HOME" && mkdir -p "$GRADLE_USER_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Re-enable the Gradle cache so the local build cache (caches/build-cache-1)
          # and dependency bundles restore across runs — with cache-disabled the Android
          # compile job recompiled everything from scratch every run (~8m40s).
          #
          # #1478 disabled the cache because a corrupt instrumented AGP jar could poison
          # a shared run: `ExternalDependencyInstrumentingArtifactTransform` fails to build
          # `instrumented-gradle-<v>.jar` at root-project configuration. That poison lives
          # ONLY in the instrumentation cache families. Per the pinned gradle/actions@v5
          # extractor (0723195856…, gradle-home-entry-extractor.ts), those families are:
          #   instrumented-jars -> caches/jars-*/
          #   transforms        -> caches/transforms-<N>/ (top-level) AND caches/<gradleVer>/transforms/
          # `gradle-home-cache-excludes` deletes matching paths after restore and before
          # save, so excluding these keeps them rebuilt-fresh while every other bundle
          # (build-cache-1, modules-2, wrapper-zips, kotlin-dsl, generated-gradle-jars,
          # java-toolchains) is content-addressed and restores across runs. transforms-*
          # (not a pinned transforms-4) survives a Gradle metadata-version bump. Job-scoped
          # permanent replacement for the blunt cache-disabled; the fleet-wide
          # incident-response quarantine (.github/gradle-cache-quarantine) stays EMPTY.
          #
          # The stable GRADLE_USER_HOME (job env, rebuilt clean above) keeps the cache
          # version stable across runs; PRs (non-main refs) read the default-branch
          # cache seed read-only and never write back. The poison-guard writer/reader
          # jobs in gradle-cache-policy-lint.yml are the authority that these families
          # never restore while build-cache-1 does.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-excludes: |
            caches/jars-*
            caches/transforms-*
            caches/*/transforms

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      - name: Restore kuikly fork mavenLocal artifacts
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/maven/kuikly-android
          key: kuikly-fork-mavenlocal-android-${{ env.HARMONY_CACHE_EPOCH }}-${{ needs.kuikly-artifacts.outputs.kuikly-sha }}
          fail-on-cache-miss: true

      - name: Hydrate kuikly fork mavenLocal artifacts
        shell: bash
        run: |
          userhome="$(java -XshowSettings:properties -version 2>&1 | awk '/user.home/{print $3; exit}')"
          test -n "$userhome"
          stage="$GITHUB_WORKSPACE/.ci-cache/maven/kuikly-android"
          dst="$userhome/.m2/repository/com/tencent/kuikly-open"
          test -d "$stage/core"
          test -d "$stage/compose"
          rm -rf "$dst"
          mkdir -p "$dst"
          cp -a "$stage/." "$dst/"
          test -d "$dst/core"
          test -d "$dst/compose"

      # Compiling the unit-test source set closes the gap where a broken
      # commonTest (or an API change that breaks tests) sailed through green
      # CI — main sources alone do not compile test code (#198 follow-up).
      # :androidApp:compileDebugKotlin gates the Android host too — #57 merged
      # green while breaking every local assembleDebug because only :shared
      # was compiled here (task #217 follow-up).
      # task #26: file-content-hash-keyed build output cache. Gradle's own build
      # cache key for :shared:kspDebugKotlinAndroid / compileDebugKotlinAndroid is
      # non-deterministic across same-commit CI runs (input set identical, order
      # varies), so unchanged modules miss the build cache and recompile fully.
      # This caches the build output keyed by a deterministic hash of the input
      # files; on a hit the compile step is skipped entirely (~3m saved). The
      # unit-test step may still recompile (~1m) because .gradle incremental state
      # is machine-local and intentionally not cached; route B (reproducible jars
      # -> stable build-cache key) is tracked as a follow-up.
      - name: Compute build input file hash
        id: build-input-hash
        working-directory: compose
        run: |
          HASH=$(git ls-files -s \
            shared/src androidApp/src \
            shared/build.gradle.kts androidApp/build.gradle.kts \
            gradle/libs.versions.toml gradle/wrapper/gradle-wrapper.properties \
            gradle.properties buildSrc \
            build.gradle.kts settings.gradle.kts \
            | git hash-object --stdin)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "build input file hash: $HASH"

      - name: Restore build output cache (file hash key)
        id: build-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            compose/shared/build
            compose/androidApp/build
          key: build-output-${{ steps.build-input-hash.outputs.hash }}

      - name: Compile shared + Android host and unit tests
        if: steps.build-cache-restore.outputs.cache-hit != 'true'
        working-directory: compose
        run: |
          ./gradlew \
            :shared:compileDebugKotlinAndroid \
            :shared:compileDebugUnitTestKotlinAndroid \
            :androidApp:compileDebugKotlin \
            --no-daemon \
            --console=plain \
            --stacktrace

      - name: Save build output cache (file hash key)
        if: steps.build-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            compose/shared/build
            compose/androidApp/build
          key: build-output-${{ steps.build-input-hash.outputs.hash }}

      # Hard run gate since #215 cleared the legacy failures: the shared JVM
      # suite must pass. Run androidApp unit tests in the same gate so stale
      # Android host tests cannot stay hidden until a local developer run.
      - name: Run shared + Android app unit tests
        working-directory: compose
        run: ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest --continue --no-daemon --console=plain --stacktrace

      # Build once here, then let the emulator job below install the exact APKs
      # without paying for a second Gradle/Kotlin build. The visual fixture gives
      # the regression a deterministic empty Thread composer.
      - name: Build Android connected-test APKs
        working-directory: compose
        env:
          # HandsCrash installs from Application.onCreate, before the actual-host page can bind its dynamic
          # blackhole. Keep that SDK on loopback too so the target-UID non-loopback counter is a meaningful zero.
          SLOCK_HANDS_BASE_URL: https://127.0.0.1:1
        run: |
          ./gradlew \
            -PslockVisualFixtures=true \
            :shared:assembleDebugAndroidTest \
            :androidApp:assembleConnectedTest \
            :androidApp:assembleConnectedTestAndroidTest \
            --no-daemon \
            --console=plain \
            --stacktrace

      - name: Verify NetworkKMM curl runtime and pinned CA
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find compose/androidApp/build/outputs/apk/connectedTest -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          test -n "${APK}"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "${AAPT}"
          "${AAPT}" dump badging "${APK}" | tee connectedtest-app-badging.txt
          grep -Fq "sdkVersion:'29'" connectedtest-app-badging.txt
          compose/androidApp/src/test/scripts/check_networkkmm_curl_runtime_package.sh \
            --self-test \
            "${APK}"

      - name: Upload Android connected-test APKs
        uses: actions/upload-artifact@v6
        with:
          name: android-connected-test-apks
          path: |
            compose/androidApp/build/outputs/apk/connectedTest/*.apk
            compose/androidApp/build/outputs/apk/androidTest/connectedTest/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload shared atomic-sink test APK
        uses: actions/upload-artifact@v6
        with:
          name: android-shared-atomic-sink-test-apk
          path: compose/shared/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-unit-test-reports
          path: |
            compose/shared/build/reports/tests/testDebugUnitTest/
            compose/shared/build/test-results/testDebugUnitTest/
            compose/androidApp/build/reports/tests/testDebugUnitTest/
            compose/androidApp/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics

  android-device:
    name: Android first-character baseline (emulator)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [plan, android]
    if: ${{ needs.plan.outputs.run_emulators == 'true' }}
    timeout-minutes: 30
    steps:
      - name: Free runner disk space for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      # Checkout only exists to provide scripts/ci/assert-instrumentation-ok.sh
      # (the instrumentation gates were previously hardcoded `grep 'OK (N tests)'`
      # count pins that broke whenever a case was added to a gated class).
      - name: Checkout
        uses: actions/checkout@v5

      - name: Self-test instrumentation assertion helper
        shell: bash
        run: |
          scripts/ci/test_assert_instrumentation_ok.sh
          scripts/ci/test_instrumentation_retry_classification.sh

      - name: Select Thread newer-pagination gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run_gate=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            run_gate=false
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
            if git diff --name-only "$PR_BASE_SHA" HEAD | grep -Eq '^(compose/shared/src/commonMain/kotlin/build/raft/app/(ThreadPage|LazyViewportController|ThreadNewerPagination)\.kt|compose/androidApp/src/androidTest/java/build/raft/app/shared/SlockThreadNewerAutoPaginationConnectedTest\.kt)$'; then
              run_gate=true
            fi
          fi
          echo "THREAD_NEWER_PAGINATION_GATE_REQUIRED=$run_gate" >> "$GITHUB_ENV"
          echo "Thread newer-pagination gate required: $run_gate"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Download connected-test APKs
        uses: actions/download-artifact@v7
        with:
          name: android-connected-test-apks
          path: android-connected-test-apks

      - name: Download shared atomic-sink test APK
        uses: actions/download-artifact@v7
        with:
          name: android-shared-atomic-sink-test-apk
          path: android-shared-atomic-sink-test-apk

      - name: List downloaded APK members
        run: |
          find android-connected-test-apks -type f -name '*.apk' -print
          find android-shared-atomic-sink-test-apk -type f -name '*.apk' -print
          test "$(find android-shared-atomic-sink-test-apk -type f -name '*.apk' | wc -l)" -eq 1
          shared_test_apk="$(find android-shared-atomic-sink-test-apk -type f -name '*.apk' | head -n 1)"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          "$aapt_bin" dump badging "$shared_test_apk" | tee shared-atomic-sink-test-apk-badging.txt
          grep -Fq "package: name='build.raft.app.shared.test'" shared-atomic-sink-test-apk-badging.txt
          grep -Fq "targetSdkVersion:'34'" shared-atomic-sink-test-apk-badging.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run first-character baseline regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6_pro
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            adb wait-for-device
            # Keep the display awake for the whole job. Several screenshot-based
            # connected tests below (first-character baseline, child-page
            # visibility, pager scroll, thread align-right) poll for rendered
            # colors and would read all-black frames if the emulator sleeps
            # mid-test (stay_on_while_plugged_in=0 + a finite screen_off_timeout,
            # confirmed to reproduce redRatio=0/blueRatio=0). An effectively
            # infinite timeout prevents that sleep deterministically.
            adb shell settings put system screen_off_timeout 2147483647
            adb install -r "$(find android-connected-test-apks -type f -name '*connectedTest.apk' -not -name '*androidTest*' | head -n 1)"
            adb install -r "$(find android-connected-test-apks -type f -name '*androidTest.apk' | head -n 1)"
            scripts/ci/run-instrumentation-with-retry.sh first-character-baseline-instrumentation.txt 1 -- adb shell am instrument -w -r -e class build.raft.app.shared.SlockComposerFirstCharacterBaselineTest build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner
            scripts/ci/run-instrumentation-with-retry.sh composer-session-retirement-instrumentation.txt 1 -- adb shell am instrument -w -r -e class build.raft.app.shared.SlockThreadImePaintConnectedTest#sendRetiresEditorSessionWithoutLosingFocusImeOrFirstComposition build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner
            grep -Fq 'SLOCK_COMPOSER_SESSION_RETIREMENT_PASS replacementFocused=true firstComposition=true firstSelection=true requestCount=1 imeSetupFailureDiagnostics=true' composer-session-retirement-instrumentation.txt
            scripts/ci/run-instrumentation-with-retry.sh multiline-text-field-value-instrumentation.txt 1 -- adb shell am instrument -w -r -e class build.raft.app.shared.SlockMultilineTextFieldValueConnectedTest build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner
            scripts/ci/run-instrumentation-with-retry.sh kuikly-profiler-runtime-smoke-instrumentation.txt 1 -- adb shell am instrument -w -r -e class build.raft.app.shared.KuiklyProfilerRuntimeSmokeTest build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner
            adb logcat -c
            scripts/ci/run-instrumentation-with-retry.sh attachment-private-file-provider-instrumentation.txt 1 -- adb shell am instrument -w -r -e class build.raft.app.shared.AndroidAttachmentPrivateFileProviderConnectedTest build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner; RC=$?; adb logcat -d -v threadtime 'AndroidRuntime:E' 'ActivityTaskManager:I' 'TestRunner:E' '*:S' > attachment-private-file-provider-logcat.txt; exit $RC
            adb install -r "$(find android-shared-atomic-sink-test-apk -type f -name '*.apk' | head -n 1)"
            adb shell pm list instrumentation | tee attachment-atomic-sink-receipt.txt
            grep -Fq 'instrumentation:build.raft.app.shared.test/androidx.test.runner.AndroidJUnitRunner' attachment-atomic-sink-receipt.txt
            scripts/ci/run-instrumentation-with-retry.sh attachment-atomic-sink-instrumentation.txt 2 -- adb shell am instrument -w -r -e class build.raft.app.network.AndroidAttachmentDownloadAtomicSinkTest build.raft.app.shared.test/androidx.test.runner.AndroidJUnitRunner
            scripts/ci/run-instrumentation-with-retry.sh attachment-download-runtime-instrumentation.txt 6 -- adb shell am instrument -w -r -e class build.raft.app.network.AndroidAttachmentDownloadCoordinatorRuntimeTest build.raft.app.shared.test/androidx.test.runner.AndroidJUnitRunner
            grep -Fq 'TASK2_RUNTIME scenario=slow_complete' attachment-download-runtime-instrumentation.txt
            grep -Fq 'TASK2_RUNTIME scenario=cancel_paths' attachment-download-runtime-instrumentation.txt
            grep -Fq 'TASK2_RUNTIME scenario=pause_resume' attachment-download-runtime-instrumentation.txt
            grep -Fq 'TASK2_RUNTIME scenario=whole_timeout' attachment-download-runtime-instrumentation.txt
            grep -Fq 'TASK2_RUNTIME scenario=publishing_replacement' attachment-download-runtime-instrumentation.txt
            grep -Fq 'TASK2_RUNTIME scenario=generation_safety' attachment-download-runtime-instrumentation.txt
            scripts/ci/run-instrumentation-with-retry.sh performance-trace-feedback-instrumentation.txt 1 -- adb shell am instrument -w -r -e class build.raft.app.core.data.diagnostics.PerformanceTraceFeedbackArchiveConnectedTest build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner
            # Promoted from never-run to gating by the task #19 triage: deterministic
            # invariants that regressed repeatedly or guard fork/data-integrity paths.
            # (AndroidShellTaskReuseConnectedTest is NOT promoted: its first CI run
            # showed its normalization expectation predates #1152's multi-shell
            # gating — pending the shell lane's behavior decision, see
            # docs/instrumented-manual-harnesses.md.)
            adb logcat -c
            # The accepted frame does not exist on readiness failure. Keep its extraction best-effort so terminal evidence and the real instrumentation assertion still run. The retry wrapper runs am instrument + assert first (bounded-retrying infra-abort only); its exit is deferred through RC so terminal evidence is still captured on a real failure before the line exits non-zero.
            scripts/ci/run-instrumentation-with-retry.sh child-page-visibility-instrumentation.txt 1 -- adb shell am instrument -w -r -e class build.raft.app.shared.SlockChildPageVisibilityConnectedTest build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner; RC=$?; adb exec-out run-as build.raft.app.connectedtest cat files/child-page-visibility-accepted.png > child-page-visibility-accepted.png || rm -f child-page-visibility-accepted.png; adb exec-out screencap -p > child-page-visibility-terminal.png; adb logcat -d -v threadtime > child-page-visibility-logcat.txt; exit $RC
            scripts/ci/run-instrumentation-with-retry.sh pager-scroll-probe-instrumentation.txt 1 -- adb shell am instrument -w -r -e class build.raft.app.shared.SlockPagerScrollProbeConnectedTest build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner
            scripts/ci/run-instrumentation-with-retry.sh release-notes-section-gap-instrumentation.txt 1 -- adb shell am instrument -w -r -e class build.raft.app.shared.SlockReleaseNotesSectionGapConnectedTest build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner
            scripts/ci/run-instrumentation-with-retry.sh thread-align-right-bounds-instrumentation.txt 1 -- adb shell am instrument -w -r -e class build.raft.app.shared.SlockThreadAlignRightBoundsConnectedTest build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner
            # task #800: the five measured geometry lines are the auditable
            # rendering evidence — a green test without them is not evidence.
            # Single line: this runner executes each script line as its own
            # `sh -c`, so a multi-line for-loop is a syntax error.
            for band in long sent sending failed retry; do grep -Fq "ALIGN_RIGHT_GEOMETRY_${band}" thread-align-right-bounds-instrumentation.txt; done
            scripts/ci/run-instrumentation-with-retry.sh diagnostics-caller-pipeline-instrumentation.txt 1 -- adb shell am instrument -w -r -e class build.raft.app.core.data.diagnostics.DiagnosticsCallerPipelineConnectedTest build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner
            scripts/ci/run-instrumentation-with-retry.sh durable-partition-migration-instrumentation.txt 2 -- adb shell am instrument -w -r -e class build.raft.app.data.DurablePartitionAndroidDriverMigrationTest build.raft.app.shared.test/androidx.test.runner.AndroidJUnitRunner
            # Run the slow gesture gate on main/nightly and on PRs that touch its
            # Thread viewport or pagination boundary.
            if [ "${THREAD_NEWER_PAGINATION_GATE_REQUIRED}" = "true" ]; then scripts/ci/run-instrumentation-with-retry.sh thread-newer-auto-pagination-instrumentation.txt 1 -- adb shell am instrument -w -r -e class build.raft.app.shared.SlockThreadNewerAutoPaginationConnectedTest build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner; fi
            # Thread-open budget TELEMETRY (Raft task #20 t2): harvest the frozen-v3
            # perf markers the pagination run just produced. Baseline collection
            # only — currently 3/3 runs fail the 100ms draw budget, so this must
            # NOT gate until the budget or the render path is fixed. `|| true`
            # keeps collection failures from failing the nightly job.
            if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then adb logcat -d -v threadtime | grep -E "thread_first_content_budget|kuikly_perf_snapshot|thread_payload_ready_gate|thread_host_traversal|thread_first_content_ready|thread_content_compose_start|thread_refresh_result|thread_markdown_body_recompose" > thread-open-budget-telemetry.txt || true; fi

      - name: Upload instrumentation output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: first-character-baseline-instrumentation
          path: |
            first-character-baseline-instrumentation.txt
            composer-session-retirement-instrumentation.txt
            multiline-text-field-value-instrumentation.txt
            kuikly-profiler-runtime-smoke-instrumentation.txt
            attachment-private-file-provider-instrumentation.txt
            attachment-private-file-provider-logcat.txt
            attachment-atomic-sink-instrumentation.txt
            attachment-atomic-sink-receipt.txt
            attachment-download-runtime-instrumentation.txt
            performance-trace-feedback-instrumentation.txt
            child-page-visibility-instrumentation.txt
            child-page-visibility-accepted.png
            child-page-visibility-terminal.png
            child-page-visibility-logcat.txt
            pager-scroll-probe-instrumentation.txt
            release-notes-section-gap-instrumentation.txt
            thread-align-right-bounds-instrumentation.txt
            diagnostics-caller-pipeline-instrumentation.txt
            durable-partition-migration-instrumentation.txt
            thread-newer-auto-pagination-instrumentation.txt
            thread-open-budget-telemetry.txt
            *-instrumentation.txt.attempt-*
          if-no-files-found: warn
          retention-days: 7

  android-minimum-supported-attachment-runtime:
    name: Android attachment authority (API ${{ matrix.api-level }} emulator)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [plan, android]
    if: ${{ needs.plan.outputs.run_emulators == 'true' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 31, 34]
    steps:
      - name: Free runner disk space for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v5

      - name: Self-test instrumentation assertion helper
        shell: bash
        run: |
          scripts/ci/test_assert_instrumentation_ok.sh
          scripts/ci/test_instrumentation_retry_classification.sh

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Download connected-test APKs
        uses: actions/download-artifact@v7
        with:
          name: android-connected-test-apks
          path: android-connected-test-apks

      - name: Verify minimum-supported app artifact
        shell: bash
        run: |
          set -euo pipefail
          app_apk="$(find android-connected-test-apks -type f -name '*connectedTest.apk' -not -name '*androidTest*' | head -n 1)"
          test_apk="$(find android-connected-test-apks -type f -name '*androidTest.apk' | head -n 1)"
          test -n "${app_apk}"
          test -n "${test_apk}"
          aapt_bin="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "${aapt_bin}"
          "${aapt_bin}" dump badging "${app_apk}" | tee api29-connectedtest-app-badging.txt
          grep -Fq "sdkVersion:'29'" api29-connectedtest-app-badging.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run exact public-download authority on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6_pro
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r "$(find android-connected-test-apks -type f -name '*connectedTest.apk' -not -name '*androidTest*' | head -n 1)"
            adb install -r "$(find android-connected-test-apks -type f -name '*androidTest.apk' | head -n 1)"
            scripts/ci/run-instrumentation-with-retry.sh attachment-public-downloads-api${{ matrix.api-level }}-instrumentation.txt 1 -- adb shell am instrument -w -r -e class build.raft.app.shared.AndroidAttachmentPublicDownloadsConnectedTest build.raft.app.connectedtest.test/androidx.test.runner.AndroidJUnitRunner

      - name: Upload API ${{ matrix.api-level }} attachment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: attachment-public-downloads-api${{ matrix.api-level }}-evidence
          path: |
            api29-connectedtest-app-badging.txt
            attachment-public-downloads-api${{ matrix.api-level }}-instrumentation.txt
            *-instrumentation.txt.attempt-*
          if-no-files-found: warn
          retention-days: 7

  android-canonical-final-actual-host:
    name: Android canonical-final actual host (emulator)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [plan, android]
    if: ${{ needs.plan.outputs.run_emulators == 'true' }}
    timeout-minutes: 35
    steps:
      - name: Free runner disk space for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      # Checkout provides scripts/ci/canonical-final-actual-host.sh (previously
      # embedded in this workflow as a 160-line heredoc because the job had no
      # checkout).
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Download connected-test APKs
        uses: actions/download-artifact@v7
        with:
          name: android-connected-test-apks
          path: android-connected-test-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The regression script lives in scripts/ci/canonical-final-actual-host.sh
      # (extracted from an inline YAML heredoc in task #18 so it can be
      # shellchecked, reviewed as a normal diff, and run locally).
      - name: Validate canonical-final actual-host regression script
        shell: bash
        run: |
          bash -n \
            scripts/ci/canonical-final-actual-host.sh \
            scripts/ci/canonical-final-pre-attempt-guard.sh \
            scripts/ci/test_canonical_final_pre_attempt_guard.sh
          scripts/ci/test_canonical_final_pre_attempt_guard.sh

      - name: Run canonical-final actual-host regression under exact-zero egress gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6_pro
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash scripts/ci/canonical-final-actual-host.sh

      - name: Upload canonical-final actual-host evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: canonical-final-actual-host-evidence
          path: |
            canonical-final-instrumentation.txt
            canonical-final-instrumentation-status.txt
            canonical-final-instrumentation-list.txt
            canonical-final-instrumentation-list-after.txt
            canonical-final-retry-receipt.txt
            canonical-final-pre-attempt-*.txt
            canonical-final-*.attempt-*
            canonical-final-pm-clear-retry-*.txt
            canonical-final-iptables-reset-*.txt
            canonical-final-ip6tables-reset-*.txt
            canonical-final-iptables-postclear-*.txt
            canonical-final-ip6tables-postclear-*.txt
            canonical-final-app-apk-badging.txt
            canonical-final-test-apk-badging.txt
            canonical-final-target-package-path.txt
            canonical-final-test-package-path.txt
            canonical-final-target-package.txt
            canonical-final-test-package.txt
            canonical-final-pm-clear.txt
            canonical-final-process.txt
            canonical-final-process-list.txt
            canonical-final-iptables-identity.txt
            canonical-final-iptables-before.txt
            canonical-final-iptables-after.txt
            canonical-final-ip6tables-before.txt
            canonical-final-ip6tables-after.txt
            canonical-final-trace.txt
            canonical-final-logcat.txt
            canonical-final-logcat-live.txt
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: iOS compile
    # The macOS compile does not run on ordinary PR pushes. It runs once in the
    # merge queue's deterministic full tier, on an explicit full-ci PR, and on
    # main/release/nightly/manual full readbacks.
    needs: [plan]
    if: ${{ needs.plan.outputs.run_full == 'true' }}
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 75
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      # iOS cannot consume the linux prebuild: apple-target klibs only publish
      # from a mac host, so this job builds its own android-flavor artifacts.
      - name: Resolve kuikly fork submodule sha
        id: kuikly-fork
        shell: bash
        run: |
          sha="$(git rev-parse HEAD:third_party/kuikly-ui)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache kuikly fork mavenLocal artifacts
        id: kuikly-cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-android-${{ runner.os }}-${{ steps.kuikly-fork.outputs.sha }}

      - name: Publish Kuikly fork artifacts
        if: steps.kuikly-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui
          scripts/build_kuikly_fork.sh --android-only

      - name: Compile shared iOS targets and unit tests
        working-directory: compose
        run: |
          ./gradlew \
            :shared:compileKotlinIosArm64 \
            :shared:compileKotlinIosSimulatorArm64 \
            :shared:compileKotlinIosX64 \
            :shared:compileTestKotlinIosSimulatorArm64 \
            --no-daemon \
            --console=plain \
            --stacktrace

      # Swift-host gate (task #217 follow-up): the jobs above only cover the
      # KMP side; ContentView.swift / KuiklyExpand ObjC breaks sailed through.
      # The local kuikly pod needs the submodule worktree even on cache hit.
      - name: Ensure kuikly fork submodule for local pod
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui

      # shared.podspec guards against a missing framework dir; the IDE's
      # Gradle sync normally creates the placeholder — CI must do it manually.
      - name: Generate shared framework placeholder
        working-directory: compose
        run: ./gradlew :shared:generateDummyFramework --no-daemon --console=plain --stacktrace

      - name: Pod install
        working-directory: compose/iosApp
        run: pod install

      - name: Build iOS host app and UI-test harness (simulator)
        working-directory: compose/iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosAppUITests \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing | tail -200

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics

  # Task #91: checked-in teeth for the OHOS resource receipt — proves the
  # crash-artifact inventory is secret-safe (allowlist extraction + mechanical
  # redaction) and the classifier fails closed (indeterminate(no_phase)) on a
  # missing compile-phase receipt. Fast bash-only self-test that runs the real
  # scripts against controlled fixtures; gates on any leak or wrong verdict.
  ohos-receipt-selftest:
    name: OHOS resource receipt self-test
    needs: [plan]
    if: ${{ needs.plan.outputs.run_basic == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Crash-artifact sanitization + classifier no-phase fixture
        run: bash .github/actions/ohos-resource-receipt/test_crash_artifacts.sh

  ohos:
    name: OHOS shared compile
    # Runs on Linux, not macOS (#469): this job consumes ohosArm64 klibs,
    # all built on Linux by the prebuilds and shared through Blacksmith's
    # colocated cache, which macOS runners do not participate in (the sibling
    # ohos-host container hits it). Native-bridge changes additionally link the
    # debug K/N library here and compile the NAPI C++ boundary against its generated
    # header; the 8-vCPU runner has the headroom the 4-vCPU ArkTS job lacks.
    # On top of that it runs in artin's
    # harmonyos-ci-image (task #240), which presets the full OHOS toolchain
    # (OHOS_SDK_HOME/LLVM from command-line-tools 6.1.1.280) — no per-run
    # setup-ohos-sdk download, and the SDK version matches ohos-host and the
    # KuiklyBase-components CI instead of the previous 6.0 pin.
    # 8vcpu: kspKotlinOhosArm64 (the heaviest K/N JVM step) OOM'd fleet-wide
    # on 4vcpu VMs after moving into the container — killed mid-task with no
    # compile error. The job sat too close to the VM memory ceiling; doubling
    # the VM beats per-daemon heap tuning (docker create shows no --memory
    # cap, so the VM itself is the boundary).
    runs-on: blacksmith-8vcpu-ubuntu-2404
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280-android.1@sha256:333681267bdf66eaba96d311d34eada49cfd86621f33c21cdf9a19fed343f5e5
    needs: [plan, kuikly-artifacts, fork-deps]
    if: ${{ needs.plan.outputs.run_full == 'true' }}
    timeout-minutes: 90
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      # Task #91: fail-close resource receipt scratch dir (memory/cgroup snapshots,
      # compile-phase exit/signal, crash inventory, classifier verdict). Uploaded
      # as a diagnostic artifact; never influences the gate result. Uses
      # github.workspace (allowed in job-level env; the `runner` context is not).
      OHOS_RECEIPT_DIR: ${{ github.workspace }}/ohos-resource-receipt
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      - name: Restore kuikly fork mavenLocal artifacts
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/maven/kuikly-ohos
          key: kuikly-fork-mavenlocal-ohos-${{ env.HARMONY_CACHE_EPOCH }}-${{ needs.kuikly-artifacts.outputs.kuikly-sha }}
          fail-on-cache-miss: true

      - name: Restore shared fork dependencies mavenLocal artifacts
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/maven/fork-deps
          key: ${{ needs.fork-deps.outputs.forkdeps-key }}
          fail-on-cache-miss: true

      - name: Hydrate staged mavenLocal caches
        shell: bash
        run: |
          userhome="$(java -XshowSettings:properties -version 2>&1 | awk '/user.home/{print $3; exit}')"
          test -n "$userhome"
          dst="$userhome/.m2/repository"
          kuikly="$GITHUB_WORKSPACE/.ci-cache/maven/kuikly-ohos"
          forkdeps="$GITHUB_WORKSPACE/.ci-cache/maven/fork-deps"
          test -d "$kuikly/core-ohosarm64"
          test -d "$kuikly/compose-ohosarm64"
          test -d "$forkdeps/co/touchlab/stately-strict-ohosarm64"
          test -d "$forkdeps/app/cash/sqldelight/app.cash.sqldelight.gradle.plugin"
          test -d "$forkdeps/io/ktor/ktor-client-core-ohosarm64"
          rm -rf "$dst/com/tencent/kuikly-open" "$dst/co/touchlab" "$dst/app/cash/sqldelight" "$dst/io/ktor"
          mkdir -p "$dst/com/tencent/kuikly-open" "$dst/co" "$dst/app/cash" "$dst/io"
          cp -a "$kuikly/." "$dst/com/tencent/kuikly-open/"
          cp -a "$forkdeps/co/touchlab" "$dst/co/"
          cp -a "$forkdeps/app/cash/sqldelight" "$dst/app/cash/"
          cp -a "$forkdeps/io/ktor" "$dst/io/"

      - name: Detect OHOS native-bridge changes
        id: ohos_native
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- \
            .github/workflows/test.yml \
            compose/build.ohos.gradle.kts \
            compose/ohosBridge \
            compose/ohosApp/hvigor \
            compose/ohosApp/entry/src/main/cpp \
            compose/ohosApp/entry/src/main/ets/entryability \
            compose/ohosApp/scripts \
            compose/shared/src/commonMain/kotlin/build/raft/app/network/SlockNetworkRequestLifetime.kt \
            compose/shared/src/commonTest/kotlin/build/raft/app/network/SlockNetworkRequestLifetimeCoordinatorTest.kt; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js for OHOS native contract checks
        if: steps.ohos_native.outputs.required == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Task #91: capture the runner's cgroup memory accounting before the
      # heaviest K/N step so a no-diagnostic kspKotlinOhosArm64 kill can later be
      # classified fail-close. Collection only; never affects the gate.
      - name: OHOS resource receipt — pre-compile snapshot
        uses: ./.github/actions/ohos-resource-receipt
        with:
          phase: pre

      - name: Compile shared OHOS target and unit tests
        id: compile_shared_ohos
        working-directory: compose
        env:
          SLOCK_SKIP_OHOS_LOCAL_DEP_PREP: "true"
          OHOS_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk/default/openharmony
          DEVECO_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk
        run: |
          set +e
          ./gradlew \
            -c settings.ohos.gradle.kts \
            :shared:compileKotlinOhosArm64 \
            :shared:compileTestKotlinOhosArm64 \
            :ohosBridge:compileKotlinOhosArm64 \
            --no-daemon \
            --console=plain \
            --stacktrace
          rc=$?

          # Task #91 controlled nonzero specimen: when dispatched with
          # ohos_receipt_specimen=true and the real compile passed, force a
          # nonzero exit so the always() resource-receipt upload is proven to run
          # on a RED job. Normal runs leave the input unset and are unaffected.
          specimen="${{ github.event.inputs.ohos_receipt_specimen }}"
          if [ "$specimen" = "true" ] && [ "$rc" -eq 0 ]; then
            echo "ohos_receipt_specimen=true: forcing controlled nonzero exit to exercise the resource-receipt upload path"
            rc=42
          fi

          # Record the real compile phase/exit/signal; the post step classifies it.
          receipt_dir="${OHOS_RECEIPT_DIR:-${RUNNER_TEMP:-/tmp}/ohos-resource-receipt}"
          mkdir -p "$receipt_dir"
          # rc>128 only SUGGESTS a signal via the 128+N convention; it is not
          # proof the process was killed by signal N, so record it as a candidate.
          sig_candidate="none"
          if [ "$rc" -gt 128 ]; then sig_candidate=$((rc - 128)); fi
          {
            printf 'phase=compile_shared_ohos\n'
            printf 'exit_code=%s\n' "$rc"
            printf 'signal_candidate=%s\n' "$sig_candidate"
            if [ "$specimen" = "true" ]; then printf 'specimen_forced=true\n'; else printf 'specimen_forced=false\n'; fi
          } > "$receipt_dir/compile-phase.env"
          echo "----- ohos-resource-receipt [compile-phase] -----"
          cat "$receipt_dir/compile-phase.env"
          echo "-------------------------------------------------"
          # Re-exit with the real (or specimen-forced) code: never swallow a RED.
          exit "$rc"

      - name: Link and stage the generated OHOS Kotlin Native bridge
        if: steps.ohos_native.outputs.required == 'true'
        working-directory: compose
        env:
          SLOCK_SKIP_OHOS_LOCAL_DEP_PREP: "true"
          OHOS_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk/default/openharmony
          DEVECO_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk
        run: |
          ./gradlew \
            -c settings.ohos.gradle.kts \
            copyNetworkOhosRuntimeLibs \
            :ohosBridge:linkDebugSharedOhosArm64 \
            --no-daemon \
            --console=plain \
            --stacktrace

          shared_output="ohosBridge/build/bin/ohosArm64/debugShared"
          test -s "$shared_output/libshared.so"
          test -s "$shared_output/libshared_api.h"
          grep -q 'raftUpdateProcessNetworkVisibility' "$shared_output/libshared_api.h"
          test "$(wc -l < "$shared_output/libshared_api.h")" -le 500
          node ohosApp/scripts/test_kuikly_plugin_source_contract.mjs
          node ohosApp/scripts/test_mr_resource_staging_source_contract.mjs

          mkdir -p ohosApp/entry/libs/arm64-v8a ohosApp/entry/src/main/cpp
          install -m 755 "$shared_output/libshared.so" ohosApp/entry/libs/arm64-v8a/libshared.so
          install -m 644 "$shared_output/libshared_api.h" ohosApp/entry/src/main/cpp/libshared_api.h
          node ohosApp/scripts/test_process_network_lifecycle_source_contract.mjs

      - name: Compile OHOS NAPI against the generated Kotlin Native bridge
        if: steps.ohos_native.outputs.required == 'true'
        working-directory: compose/ohosApp
        shell: bash
        env:
          OHOS_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk/default/openharmony
          DEVECO_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk
        run: |
          ohpm install --all
          hvigorw --sync -p product=default --analyze=normal --no-daemon
          hvigorw --mode module \
            -p module=entry@default -p product=default -p requiredDeviceType=phone \
            default@BuildNativeWithNinja --analyze=normal --no-daemon

      # DevEco's Linux CLI has no previewer callback for GenerateUnitTestResult;
      # compile the LocalUnit bundle here while Darwin/local covers execution.
      - name: Compile OHOS LocalUnit sources
        if: steps.ohos_native.outputs.required == 'true'
        working-directory: compose/ohosApp
        shell: bash
        env:
          OHOS_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk/default/openharmony
          DEVECO_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk
        run: |
          hvigorw --mode module \
            -p module=entry@default -p product=default -p requiredDeviceType=phone \
            default@UnitTestArkTS --analyze=normal --no-daemon

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics

      # Task #91: always() resource receipt — post snapshot, crash inventory,
      # always_executed marker, fail-close classifier, and artifact upload. Runs
      # on success AND failure so a no-diagnostic kill still leaves evidence.
      # Never changes the gate result.
      - name: OHOS resource receipt — post-compile + classify + upload
        if: always()
        uses: ./.github/actions/ohos-resource-receipt
        with:
          phase: post

  # OHOS host (hvigor/ArkTS) gate — catches .ets compile errors that the
  # KMP-only ohos job cannot see. Runs in artin's harmonyos-ci-image, which
  # ships the full DevEco command-line-tools (ohpm/hvigorw/SDK/JDK17) that
  # hosted runners cannot download (Huawei-login-gated). The hvigor build's
  # kuikly plugin shells out to gradle to link the shared .so, so the same
  # fork-dependency mavenLocal set as the ohos job is published first.
  ohos-host:
    name: OHOS host (hvigor/ArkTS) compile
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [plan, kuikly-artifacts, fork-deps]
    if: ${{ needs.plan.outputs.run_full == 'true' }}
    timeout-minutes: 90
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280-android.1@sha256:333681267bdf66eaba96d311d34eada49cfd86621f33c21cdf9a19fed343f5e5
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      OHOS_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk/default/openharmony
      DEVECO_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk
      SLOCK_SKIP_OHOS_LOCAL_DEP_PREP: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The workspace is provisioned by the host runner user while steps run
      # as the container user, so git refuses it as "dubious ownership" ('*'
      # also covers the submodule checkouts below).
      - name: Mark workspace safe for git
        shell: bash
        run: git config --global --add safe.directory '*'

      # zstd (actions/cache compression fingerprint) and curl (the SQLite
      # amalgamation download in prepare_ohos_sqlite_provider.sh) are now baked
      # into harmonyos-ci-image, so the per-run apt-get install is gone.
      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      - name: Restore kuikly fork mavenLocal artifacts
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/maven/kuikly-ohos
          key: kuikly-fork-mavenlocal-ohos-${{ env.HARMONY_CACHE_EPOCH }}-${{ needs.kuikly-artifacts.outputs.kuikly-sha }}
          fail-on-cache-miss: true

      - name: Restore shared fork dependencies mavenLocal artifacts
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/maven/fork-deps
          key: ${{ needs.fork-deps.outputs.forkdeps-key }}
          fail-on-cache-miss: true

      - name: Hydrate staged mavenLocal caches
        shell: bash
        run: |
          userhome="$(java -XshowSettings:properties -version 2>&1 | awk '/user.home/{print $3; exit}')"
          test -n "$userhome"
          dst="$userhome/.m2/repository"
          kuikly="$GITHUB_WORKSPACE/.ci-cache/maven/kuikly-ohos"
          forkdeps="$GITHUB_WORKSPACE/.ci-cache/maven/fork-deps"
          test -d "$kuikly/core-ohosarm64"
          test -d "$kuikly/compose-ohosarm64"
          test -d "$forkdeps/co/touchlab/stately-strict-ohosarm64"
          test -d "$forkdeps/app/cash/sqldelight/app.cash.sqldelight.gradle.plugin"
          test -d "$forkdeps/io/ktor/ktor-client-core-ohosarm64"
          rm -rf "$dst/com/tencent/kuikly-open" "$dst/co/touchlab" "$dst/app/cash/sqldelight" "$dst/io/ktor"
          mkdir -p "$dst/com/tencent/kuikly-open" "$dst/co" "$dst/app/cash" "$dst/io"
          cp -a "$kuikly/." "$dst/com/tencent/kuikly-open/"
          cp -a "$forkdeps/co/touchlab" "$dst/co/"
          cp -a "$forkdeps/app/cash/sqldelight" "$dst/app/cash/"
          cp -a "$forkdeps/io/ktor" "$dst/io/"

      # This gate compiles the host ArkTS/.ets — the layer the KMP-only jobs
      # cannot see (e.g. the tabbar host regression). It deliberately stops
      # short of the full unsigned-HAP assembleHap: that would require linking
      # the shared KMP libshared.so, whose konanc whole-program release -opt
      # link does not fit this 7.8 GiB / 2-CPU container. Every attempt hit a
      # hard wall — the konan compiler daemon has a large-enough thread stack
      # but a too-small heap that is not raisable (kotlin.native.jvmArgs is
      # ignored) and OOMs the -opt; running konanc in-process makes the heap
      # settable via -Xmx but then the deep IR-lowering recursion overflows the
      # worker thread's stack (which ignores -Xss); the debug variant instead
      # bloats codegen with -g until clang OOM-kills the whole runner. The
      # Kotlin content of libshared is already gated by the "OHOS shared
      # compile" job, so the unique coverage here is the ArkTS compile, which
      # needs no native link. (Revisit assembleHap if this job moves to a
      # larger runner or the image gains headroom.)
      - name: ohpm install
        working-directory: compose/ohosApp
        shell: bash
        run: ohpm install --all

      - name: hvigor sync
        working-directory: compose/ohosApp
        shell: bash
        run: hvigorw --sync -p product=default --analyze=normal --parallel --no-daemon

      - name: hvigor CompileArkTS (host .ets gate)
        working-directory: compose/ohosApp
        shell: bash
        run: |
          hvigorw --mode module \
            -p module=entry@default -p product=default -p requiredDeviceType=phone \
            default@CompileArkTS --analyze=normal --parallel --no-daemon

  # The only Test context intended for the main-branch required-check rule.
  # It always reports, including docs-only PRs, and mechanically verifies that
  # exactly the jobs selected by the checked-in plan passed. Emulator jobs are
  # intentionally absent from merge_group until their bounded infra-abort
  # retry contract has landed and has fresh flake evidence.
  ci-gate:
    name: CI gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - plan
      - kuikly-artifacts
      - fork-deps
      - android
      - android-device
      - android-minimum-supported-attachment-runtime
      - android-canonical-final-actual-host
      - ios
      - ohos-receipt-selftest
      - ohos
      - ohos-host
    steps:
      - name: Checkout aggregate verifier
        uses: actions/checkout@v5

      - name: Verify exact selected tier results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/verify_test_tier_results.mjs
