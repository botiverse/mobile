name: Test

on:
  pull_request:
    paths:
      - ".github/workflows/test.yml"
      - "compose/**"
      - "scripts/build_kuikly_fork.sh"
      - "scripts/prepare_*.sh"
      - "third_party/kuikly-ui"
      - "third_party/ktor-ohos/**"
      - "third_party/stately"
      - "third_party/sqliter"
      - "third_party/sqldelight"
      - "third_party/kuikly-compose-markdown/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test.yml"
      - "compose/**"
      - "scripts/build_kuikly_fork.sh"
      - "scripts/prepare_*.sh"
      - "third_party/kuikly-ui"
      - "third_party/ktor-ohos/**"
      - "third_party/stately"
      - "third_party/sqliter"
      - "third_party/sqldelight"
      - "third_party/kuikly-compose-markdown/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single upstream build of every fork artifact the platform jobs consume.
  # Kuikly android/foundation + OHOS klibs and the stately/sqliter/sqldelight/
  # ktor-ohos stack are published to mavenLocal ONCE here (ubuntu) and shared
  # through os-less cache keys — the artifacts are jvm jars / klibs / .module
  # metadata, all platform-neutral, so macos and container jobs restore the
  # same entries instead of rebuilding per (job, os) combination.
  kuikly-artifacts:
    name: Kuikly fork artifacts (prebuild)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
    outputs:
      kuikly-sha: ${{ steps.pins.outputs.kuikly }}
      forkdeps-key: ${{ steps.keys.outputs.forkdeps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 8 for Ktor toolchain
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up OpenHarmony SDK
        id: setup-ohos-sdk
        uses: openharmony-rs/setup-ohos-sdk@v1.0.1
        with:
          version: "6.0"
          components: native
          cache: true

      - name: Export OpenHarmony SDK path
        shell: bash
        run: echo "OHOS_SDK_HOME=${{ steps.setup-ohos-sdk.outputs.ohos-base-sdk-home }}" >> "$GITHUB_ENV"

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      - name: Resolve fork pins
        id: pins
        shell: bash
        run: |
          kuikly="$(git rev-parse HEAD:third_party/kuikly-ui)"
          stately="$(git rev-parse HEAD:third_party/stately)"
          sqliter="$(git rev-parse HEAD:third_party/sqliter)"
          sqldelight="$(git rev-parse HEAD:third_party/sqldelight)"
          test -n "$kuikly" && test -n "$stately" && test -n "$sqliter" && test -n "$sqldelight"
          {
            echo "kuikly=$kuikly"
            echo "stately=$stately"
            echo "sqliter=$sqliter"
            echo "sqldelight=$sqldelight"
          } >> "$GITHUB_OUTPUT"

      - name: Compose cache keys
        id: keys
        shell: bash
        run: |
          echo "forkdeps=forkdeps-mavenlocal-${{ steps.pins.outputs.stately }}-${{ steps.pins.outputs.sqliter }}-${{ steps.pins.outputs.sqldelight }}-${{ hashFiles('scripts/prepare_ktor_ohos_fork.sh', 'third_party/ktor-ohos/**') }}" >> "$GITHUB_OUTPUT"

      # os-less keys: consumed as-is by every downstream job on any OS.
      - name: Cache kuikly fork mavenLocal artifacts (all flavors)
        id: kuikly-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-all-${{ steps.pins.outputs.kuikly }}

      # Legacy key kept warm so visual-testing.yml (separate workflow, android
      # flavor, Linux-keyed) keeps hitting without changes.
      - name: Cache kuikly fork mavenLocal artifacts (legacy visual-testing key)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-android-Linux-${{ steps.pins.outputs.kuikly }}

      - name: Build kuikly fork (android + ohos)
        if: steps.kuikly-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui
          scripts/build_kuikly_fork.sh --all

      - name: Cache shared fork dependencies mavenLocal artifacts
        id: forkdeps-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/co/touchlab
            ~/.m2/repository/app/cash/sqldelight
            ~/.m2/repository/io/ktor
          key: ${{ steps.keys.outputs.forkdeps }}

      - name: Publish shared fork dependencies
        if: steps.forkdeps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git submodule sync third_party/stately third_party/sqliter third_party/sqldelight
          git submodule update --init third_party/stately third_party/sqliter third_party/sqldelight

          pushd third_party/stately
          ./gradlew --no-daemon --console=plain \
            :stately-strict:publishKotlinMultiplatformPublicationToMavenLocal \
            :stately-strict:publishOhosArm64PublicationToMavenLocal \
            :stately-concurrency:publishKotlinMultiplatformPublicationToMavenLocal \
            :stately-concurrency:publishOhosArm64PublicationToMavenLocal
          popd

          pushd third_party/sqliter
          ./gradlew --no-daemon --console=plain \
            :sqliter-driver:publishKotlinMultiplatformPublicationToMavenLocal \
            :sqliter-driver:publishOhosArm64PublicationToMavenLocal
          popd

          pushd third_party/sqldelight
          ./gradlew --no-daemon --console=plain \
            :sqldelight-compiler:environment:publishMavenPublicationToMavenLocal \
            :sqldelight-compiler:dialect:publishMavenPublicationToMavenLocal \
            :sqldelight-compiler:publishMavenPublicationToMavenLocal \
            :sqlite-migrations:environment:publishMavenPublicationToMavenLocal \
            :sqlite-migrations:publishMavenPublicationToMavenLocal \
            :dialects:sqlite-3-18:publishMavenPublicationToMavenLocal \
            :sqldelight-gradle-plugin:publishToMavenLocal \
            :runtime:publishKotlinMultiplatformPublicationToMavenLocal \
            :runtime:publishOhosArm64PublicationToMavenLocal \
            :drivers:native-driver:publishOhosArm64PublicationToMavenLocal
          popd

          scripts/prepare_ktor_ohos_fork.sh --publish

  android:
    name: Android compile & tests
    runs-on: ubuntu-latest
    needs: kuikly-artifacts
    timeout-minutes: 30
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      - name: Restore kuikly fork mavenLocal artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-all-${{ needs.kuikly-artifacts.outputs.kuikly-sha }}
          fail-on-cache-miss: true

      # Compiling the unit-test source set closes the gap where a broken
      # commonTest (or an API change that breaks tests) sailed through green
      # CI — main sources alone do not compile test code (#198 follow-up).
      # :androidApp:compileDebugKotlin gates the Android host too — #57 merged
      # green while breaking every local assembleDebug because only :shared
      # was compiled here (task #217 follow-up).
      - name: Compile shared + Android host and unit tests
        working-directory: compose
        run: |
          ./gradlew \
            :shared:compileDebugKotlinAndroid \
            :shared:compileDebugUnitTestKotlinAndroid \
            :androidApp:compileDebugKotlin \
            --no-daemon \
            --console=plain

      # Hard run gate since #215 cleared the legacy failures: the shared JVM
      # suite must pass. Reports upload on failure for diagnosis.
      - name: Run shared unit tests
        working-directory: compose
        run: ./gradlew :shared:testDebugUnitTest --continue --no-daemon --console=plain

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-unit-test-reports
          path: |
            compose/shared/build/reports/tests/testDebugUnitTest/
            compose/shared/build/test-results/testDebugUnitTest/
          retention-days: 7

  ios:
    name: iOS compile
    runs-on: macos-latest
    needs: kuikly-artifacts
    timeout-minutes: 75
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      - name: Restore kuikly fork mavenLocal artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-all-${{ needs.kuikly-artifacts.outputs.kuikly-sha }}
          fail-on-cache-miss: true

      - name: Compile shared iOS targets and unit tests
        working-directory: compose
        run: |
          ./gradlew \
            :shared:compileKotlinIosArm64 \
            :shared:compileKotlinIosSimulatorArm64 \
            :shared:compileKotlinIosX64 \
            :shared:compileTestKotlinIosSimulatorArm64 \
            --no-daemon \
            --console=plain

      # Swift-host gate (task #217 follow-up): the jobs above only cover the
      # KMP side; ContentView.swift / KuiklyExpand ObjC breaks sailed through.
      # The local kuikly pod needs the submodule worktree even on cache hit.
      - name: Ensure kuikly fork submodule for local pod
        shell: bash
        run: |
          git submodule sync third_party/kuikly-ui
          git submodule update --init third_party/kuikly-ui

      # shared.podspec guards against a missing framework dir; the IDE's
      # Gradle sync normally creates the placeholder — CI must do it manually.
      - name: Generate shared framework placeholder
        working-directory: compose
        run: ./gradlew :shared:generateDummyFramework --no-daemon --console=plain

      - name: Pod install
        working-directory: compose/iosApp
        run: pod install

      - name: Build iOS host app (simulator)
        working-directory: compose/iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -200

  ohos:
    name: OHOS shared compile
    runs-on: macos-latest
    needs: kuikly-artifacts
    timeout-minutes: 90
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up OpenHarmony SDK
        id: setup-ohos-sdk
        uses: openharmony-rs/setup-ohos-sdk@v1.0.1
        with:
          version: "6.0"
          components: native
          cache: true

      - name: Export OpenHarmony SDK path
        shell: bash
        run: echo "OHOS_SDK_HOME=${{ steps.setup-ohos-sdk.outputs.ohos-base-sdk-home }}" >> "$GITHUB_ENV"

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      - name: Restore kuikly fork mavenLocal artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-all-${{ needs.kuikly-artifacts.outputs.kuikly-sha }}
          fail-on-cache-miss: true

      - name: Restore shared fork dependencies mavenLocal artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository/co/touchlab
            ~/.m2/repository/app/cash/sqldelight
            ~/.m2/repository/io/ktor
          key: ${{ needs.kuikly-artifacts.outputs.forkdeps-key }}
          fail-on-cache-miss: true

      - name: Compile shared OHOS target and unit tests
        working-directory: compose
        env:
          SLOCK_SKIP_OHOS_LOCAL_DEP_PREP: "true"
        run: |
          ./gradlew \
            -c settings.ohos.gradle.kts \
            :shared:compileKotlinOhosArm64 \
            :shared:compileTestKotlinOhosArm64 \
            --no-daemon \
            --console=plain

  # OHOS host (hvigor/ArkTS) gate — catches .ets compile errors that the
  # KMP-only ohos job cannot see. Runs in artin's harmonyos-ci-image, which
  # ships the full DevEco command-line-tools (ohpm/hvigorw/SDK/JDK17) that
  # hosted runners cannot download (Huawei-login-gated). The hvigor build's
  # kuikly plugin shells out to gradle to link the shared .so, so the same
  # fork-dependency mavenLocal set as the ohos job is published first.
  ohos-host:
    name: OHOS host (hvigor/ArkTS) compile
    runs-on: ubuntu-latest
    needs: kuikly-artifacts
    timeout-minutes: 90
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:latest
    env:
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || 'bytemain' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      OHOS_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk/default/openharmony
      DEVECO_SDK_HOME: /opt/harmonyos-tools/command-line-tools/sdk
      SLOCK_SKIP_OHOS_LOCAL_DEP_PREP: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The workspace is provisioned by the host runner user while steps run
      # as the container user, so git refuses it as "dubious ownership" ('*'
      # also covers the submodule checkouts below).
      - name: Mark workspace safe for git
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write GitHub Packages credentials
        shell: bash
        run: |
          {
            echo "githubPackagesUsername=${GITHUB_PACKAGES_USERNAME}"
            echo "githubPackagesToken=${GITHUB_PACKAGES_TOKEN}"
          } > compose/github-packages.properties

      - name: Restore kuikly fork mavenLocal artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/tencent/kuikly-open
          key: kuikly-fork-mavenlocal-all-${{ needs.kuikly-artifacts.outputs.kuikly-sha }}
          fail-on-cache-miss: true

      - name: Restore shared fork dependencies mavenLocal artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository/co/touchlab
            ~/.m2/repository/app/cash/sqldelight
            ~/.m2/repository/io/ktor
          key: ${{ needs.kuikly-artifacts.outputs.forkdeps-key }}
          fail-on-cache-miss: true

      # entry/src/main/cpp links pbcurlwrapper; the runtime .so set is not
      # committed — it is copied out of the NetworkKMM ohos-runtime artifact.
      - name: Copy NetworkKMM OHOS runtime libs
        working-directory: compose
        shell: bash
        run: |
          ./gradlew -c settings.ohos.gradle.kts \
            copyNetworkOhosRuntimeLibs \
            --no-daemon --console=plain

      - name: ohpm install
        working-directory: compose/ohosApp
        shell: bash
        run: ohpm install --all

      - name: hvigor sync
        working-directory: compose/ohosApp
        shell: bash
        run: hvigorw --sync -p product=default --analyze=normal --parallel --no-daemon

      - name: hvigor assembleHap (unsigned)
        working-directory: compose/ohosApp
        shell: bash
        run: |
          hvigorw --mode module \
            -p module=entry@default -p product=default -p requiredDeviceType=phone \
            assembleHap --analyze=normal --parallel --no-daemon

      - name: Assert unsigned HAP produced
        shell: bash
        run: |
          hap="compose/ohosApp/entry/build/default/outputs/default/entry-default-unsigned.hap"
          test -f "$hap" || { echo "unsigned HAP not produced at $hap" >&2; exit 1; }
          ls -la "$(dirname "$hap")"
