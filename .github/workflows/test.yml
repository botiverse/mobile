name: Test

on:
  pull_request:
    # `labeled`/`unlabeled` make the full-ci escape hatch take effect without
    # requiring a source push. No path filter: the stable CI gate must report
    # even for docs-only pull requests if it is configured as required.
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - "release-*"
    # Stamp merge queue (2026-11-19): Stamp squashes each approved PR of a batch (up to 10)
    # onto main's tip, pushes it to stamp-mq/<batch> and opens a managed draft PR into main;
    # this workflow's pull_request run on it is the pre-merge check (planner:
    # merge-queue-candidate). Main fast-forwards to that head only when every job of the run
    # succeeded. Stamp then marks the SHA with the `stamp/queue-tested` status, and the main
    # push run reuses the result (planner: main-push-queue-tested-reuse, job queue-ci-reuse).
  workflow_dispatch:
    inputs:
      scope:
        description: "Task #37: pr (default) = PR-equivalent tier (Linux gates + Android compile and plain JVM / UI logic unit tests: no Robolectric class, no Roborazzi/vcase screenshot goldens, design system non-screenshot unit and Compose UI tests included; no iOS, no device suite); ios = deliberate one-off iOS check (plan + 'iOS compile' only; no Android, no Xcode 27.1 lane, no device suite); premerge = Stamp's ready-to-merge check (no iOS and no Android rerun into main: the merge queue batch on stamp-mq/* compiles iOS; a diff Stamp cannot read reruns Android; a release/* or release-* base_ref runs the full tier); full = release-candidate / deliberate full readback (all platforms + Roborazzi goldens + device suite; the Xcode 27.1 lane stays nightly/release-*/merge-queue only)."
        type: choice
        options:
          - pr
          - ios
          - premerge
          - full
        default: pr
      base_ref:
        description: "scope=premerge only: the PR's base branch as a plain name (main, release/1.23.0). The changed paths are the dispatched head vs its merge-base with origin/<base_ref>; a release/* or release-* base selects the full tier. Ignored by other scopes."
        required: false
        type: string
        default: main
      attachment_authority_repeat:
        description: "Re-run the public-Downloads authority class N times per API level to reproduce the intermittent API 31 cross-UID SecurityException. Default 1."
        type: number
        default: 1
      attachment_authority_mode:
        description: "Public-download authority runner mode: ci (default), reboot, or ab-fresh (clear MediaProvider + reboot each iteration; odd iterations skip the readiness wait as a control)."
        type: string
        default: ci
      record_screenshots:
        description: "Record the screenshot goldens (:designsystem:recordRoborazziDesktop, :shared:recordRoborazziDebug) instead of verifying them, with the whole Android unit suite whatever the scope (Android runs on scope=pr, full or a release premerge); new or changed goldens are uploaded as the designsystem-screenshots-recorded and shared-screenshots-recorded artifacts (compose/designsystem/README.md, AGENTS.md \"Screenshot tests (:shared)\")."
        type: boolean
        default: false
      xcode_app_path:
        description: "Opt-in Xcode for the default iOS compile lane only; requires a plan that runs iOS: scope=ios, scope=full, or a premerge into a release base (the plan fails otherwise). Empty = /Applications/Xcode_27.0.app (iOS 27.0 SDK); symlinked bundles are resolved to their real path under /Applications. The 'iOS compile (Xcode 27.1)' lane (GitHub xcode-27: nightly, release-* pushes and the stamp-mq/* merge queue, never on dispatch) always uses /Applications/Xcode_27.1.app, like ios-release.yml."
        required: false
        type: string
        default: ""
  # Nightly run so the (slow, macOS) iOS compile still runs on a schedule even
  # though it no longer gates pull requests. See the `ios` job's `if:` guard.
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read
  packages: read

concurrency:
  # The nightly and manual dispatches get their own groups. They run on refs/heads/main
  # (or release branches), and in the shared test-refs/heads/main group GitHub keeps only
  # the newest pending run, so a main push queued behind a running push replaced the pending
  # nightly, and a manual `scope=ios` dispatch on main could collide with a main push run.
  group: test-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || (github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', inputs.scope) || '') }}
  # Preserve the running post-merge record on protected branches. GitHub still
  # coalesces multiple pending runs in the same group to the newest commit.
  # PR and merge-queue refs keep superseding stale work for that exact ref.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release-') && !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  plan:
    name: CI path plan + contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # check_queue_tested.py (main pushes): read the stamp/queue-tested commit status and
      # re-read the merge-queue candidate run and its jobs.
      statuses: read
      actions: read
    outputs:
      run_android: ${{ steps.plan.outputs.run_android }}
      run_ios: ${{ steps.plan.outputs.run_ios }}
      run_ios_xcode270: ${{ steps.plan.outputs.run_ios_xcode270 }}
      run_ios_xcode271: ${{ steps.plan.outputs.run_ios_xcode271 }}
      ios_lanes: ${{ steps.plan.outputs.ios_lanes }}
      run_ios_tests: ${{ steps.plan.outputs.run_ios_tests }}
      queue_candidate: ${{ steps.plan.outputs.queue_candidate }}
      queue_reuse: ${{ steps.plan.outputs.queue_reuse }}
      queue_tested_run: ${{ steps.queue_tested.outputs.queue_tested_run }}
      run_device_suite: ${{ steps.plan.outputs.run_device_suite }}
      attachment_api_levels: ${{ steps.plan.outputs.attachment_api_levels }}
      android_unit_scope: ${{ steps.plan.outputs.android_unit_scope }}
      run_designsystem_tests: ${{ steps.plan.outputs.run_designsystem_tests }}
      run_roborazzi: ${{ steps.plan.outputs.run_roborazzi }}
      changed_status_b64: ${{ steps.plan.outputs.changed_status_b64 }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      # Full history for the PR merge-base / push before..after diffs below, but
      # blobless: `git diff --name-only` needs commits and trees only.
      - name: Checkout exact event source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Validate iOS Hands release notes contract
        run: scripts/ci/test_ios_hands_release_contract.sh

      - name: Validate Hands Android SDK Raft consumer contract
        run: python3 scripts/ci/test_hands_raft_consumer_contract.py

      # CMP-10674: the patched Compose UI iOS klibs (third_party/compose-ui-1.12.2/README.md) only
      # apply while Compose Multiplatform is the version they patch.
      - name: Validate Compose UI patch pin matches Compose Multiplatform
        run: |
          python3 -I scripts/ci/check_compose_ui_patch_pin.py --self-test
          python3 -I scripts/ci/check_compose_ui_patch_pin.py

      # The realtime event names live in compose/realtime-contract/realtime_contract.json; the
      # Kotlin (compose/core) and Swift (compose/iosApp) constants are generated from it
      # (skill raft-realtime-event). Regenerate on every run and fail if a checked-in output
      # differs, so an edited JSON without a regenerate, or a hand edit of a generated file,
      # cannot merge. Python only, about a second.
      - name: Check generated realtime contract matches realtime_contract.json
        run: |
          set -euo pipefail
          python3 compose/realtime-contract/generate_realtime_contract.py
          generated=(
            compose/core/src/commonMain/kotlin/build/raft/app/data/realtime/GeneratedRealtimeContract.kt
            compose/iosApp/iosApp/GeneratedRealtimeContract.swift
            compose/realtime-socket/src/commonMain/kotlin/build/raft/realtime/socket/GeneratedSocketHandshakeErrors.kt
          )
          if ! git diff --exit-code -- "${generated[@]}" || test -n "$(git status --porcelain -- "${generated[@]}")"; then
            echo "::error::Generated realtime contract files are out of date with compose/realtime-contract/realtime_contract.json. Run: python3 compose/realtime-contract/generate_realtime_contract.py and commit the result."
            exit 1
          fi

      - name: Self-test the execution tier planner
        run: scripts/ci/test_plan_test_tier.sh

      - name: Self-test the changed-file test selector
        run: python3 -I scripts/ci/select_changed_tests.py --self-test

      - name: Self-test the queue-tested reuse check
        run: python3 -I scripts/ci/check_queue_tested.py --self-test

      # Stamp merge queue: a main push that is exactly a tested queue fast-forward reuses that
      # run instead of re-running every tier on the same SHA. Fails to queue_tested=false
      # (full main-push tier) on any doubt. Nightly and release-* never consult it.
      # The token stays in this step; it writes only a result file (queue_tested=true|false and
      # the run id), which the next, credential-free step publishes as step outputs.
      - name: Check Stamp queue-tested status
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          QUEUE_TESTED_RESULT: ${{ runner.temp }}/queue-tested.txt
        run: python3 -I scripts/ci/check_queue_tested.py

      - name: Publish queue-tested result
        id: queue_tested
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          QUEUE_TESTED_RESULT: ${{ runner.temp }}/queue-tested.txt
        run: |
          set -euo pipefail
          if grep -qx 'queue_tested=true' "$QUEUE_TESTED_RESULT" 2>/dev/null; then
            run_id="$(sed -n 's/^queue_tested_run=\([0-9][0-9]*\)$/\1/p' "$QUEUE_TESTED_RESULT")"
            test -n "$run_id"
            printf 'queue_tested=true\nqueue_tested_run=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
          else
            printf 'queue_tested=false\nqueue_tested_run=\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve exact execution tier
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          # pull_request: the PR head branch (stamp-mq/<batch> = Stamp merge-queue candidate);
          # otherwise the pushed/dispatched ref.
          REF_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          QUEUE_TESTED: ${{ steps.queue_tested.outputs.queue_tested == 'true' }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          DISPATCH_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || '' }}
          # The planner refuses a non-empty xcode_app_path when its plan skips the iOS compile.
          XCODE_APP_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.xcode_app_path || '' }}
          PREMERGE_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'premerge' && inputs.base_ref || '' }}
          # Recording goldens runs the whole Android unit suite (android_unit_scope=all) whatever the scope.
          RECORD_SCREENSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.record_screenshots }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/test-changed-paths.txt"
          changed_status="$RUNNER_TEMP/test-changed-status.txt"
          : > "$changed"
          : > "$changed_status"
          write_changed_paths() {
            local base="$1"
            local head="$2"
            local comparison="$3"
            if test -n "$base" && test -n "$head" && \
                ! [[ "$base" =~ ^0+$ ]] && \
                git cat-file -e "$base^{commit}" 2>/dev/null && \
                git cat-file -e "$head^{commit}" 2>/dev/null; then
              # Disable rename collapsing so both the removed and added path
              # participate in classification. Moving a source file into an
              # irrelevant directory must still select its former platform.
              if test "$comparison" = merge-base; then
                range="$base...$head"
              else
                range="$base..$head"
              fi
              if ! git diff --name-only --no-renames "$range" > "$changed"; then
                printf '%s\n' '__CI_CHANGED_PATHS_UNKNOWN__' > "$changed"
              fi
              if ! git diff --name-status --no-renames "$range" > "$changed_status"; then
                : > "$changed_status"
              fi
            else
              # The planner treats this impossible repository path as a
              # fail-closed request for every platform.
              printf '%s\n' '__CI_CHANGED_PATHS_UNKNOWN__' > "$changed"
              : > "$changed_status"
            fi
          }
          case "$EVENT_NAME" in
            pull_request)
              # Match GitHub's PR changed-file semantics. A base branch that
              # advanced after the topic fork must not inject unrelated main
              # changes into this PR's platform plan.
              write_changed_paths "$BASE_SHA" "$HEAD_SHA" merge-base
              ;;
            push)
              write_changed_paths "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA" direct
              ;;
            workflow_dispatch)
              if test "$DISPATCH_SCOPE" = premerge; then
                # Same merge-base semantics as pull_request, against the PR's
                # base branch. The fetch-depth: 0 checkout already has every
                # origin/* branch; an unknown or malformed base leaves the
                # base empty, which writes the fail-closed sentinel.
                PREMERGE_BASE_REF="${PREMERGE_BASE_REF#refs/heads/}"
                premerge_base_sha=""
                if git check-ref-format --branch "$PREMERGE_BASE_REF" >/dev/null 2>&1; then
                  premerge_base_sha="$(git rev-parse --verify -q "refs/remotes/origin/${PREMERGE_BASE_REF}^{commit}" || true)"
                fi
                echo "premerge base_ref=${PREMERGE_BASE_REF} base_sha=${premerge_base_sha:-unresolved} head_sha=${PUSH_HEAD_SHA}"
                write_changed_paths "$premerge_base_sha" "$PUSH_HEAD_SHA" merge-base
                echo "premerge changed paths ($(wc -l < "$changed")):"
                head -n 50 "$changed"
              fi
              ;;
          esac
          scripts/ci/plan_test_tier.sh "$EVENT_NAME" "$changed" "$FULL_CI" "$REF_NAME" "$DISPATCH_SCOPE" \
            "$XCODE_APP_PATH" "$PREMERGE_BASE_REF" "$QUEUE_TESTED" "$RECORD_SCREENSHOTS" | tee -a "$GITHUB_OUTPUT"
          # Pass base64-encoded changed-status lines to the Android job on ordinary PRs (<= 200 files)
          # so select_changed_tests.py can select impacted unit test classes without extra git fetches.
          # Empty on non-PR events or oversized diffs -> Android job fails closed to the full jvm tier.
          changed_status_b64=""
          if test "$EVENT_NAME" = pull_request && test -s "$changed_status" && \
              test "$(wc -l < "$changed_status")" -le 200; then
            changed_status_b64="$(base64 < "$changed_status" | tr -d '\n')"
          fi
          printf 'changed_status_b64=%s\n' "$changed_status_b64" >> "$GITHUB_OUTPUT"

  android:
    name: Android compile & tests
    runs-on: ubuntu-latest
    needs: [plan]
    if: ${{ needs.plan.outputs.run_android == 'true' }}
    # 40 min for the ordinary PR tier (android_unit_scope=jvm), 60 for the full suite: on
    # scope=full run 45013092044 "Compile, test and package Android" took 34 min and the 40-min
    # limit cancelled the fixtures-off release compile and the uploads after it.
    timeout-minutes: ${{ needs.plan.outputs.android_unit_scope == 'jvm' && 40 || 60 }}
    env:
      # A stable (not per-run) GRADLE_USER_HOME so the setup-gradle cache actually
      # restores across runs: its GitHub cache version hashes the resolved cache
      # paths, so a run_id-suffixed home would change the version every run and
      # never hit. #1478's poisoned-transform isolation is now provided by
      # gradle-home-cache-excludes below (transforms/instrumented-jars are never
      # restored), so the per-run home it used is no longer needed. Blacksmith
      # runners are fresh VMs and the step below rebuilds this dir clean, so only
      # setup-gradle's restore populates it.
      GRADLE_USER_HOME: /tmp/android-compile-gradle-home
      # Only the emulator jobs consume the connected-test APKs. PR and main-push
      # plans schedule none of them, so those runs skip the ~8 min APK build;
      # full-ci, nightly and scope=full dispatch runs still build and upload.
      BUILD_CONNECTED_APKS: ${{ needs.plan.outputs.run_device_suite == 'true' || needs.plan.outputs.attachment_api_levels != '[]' }}
      # One visual-fixture value for every Gradle call in this job (read by
      # compose/shared/build.gradle.kts). The connected-test APKs need the
      # fixtures, and the flag adds source dirs to :shared commonMain, so a job
      # that mixed values compiled :shared twice. With it on, the fixture
      # sources compile on every tier and the fixture data reaches the unit
      # tests through commonMain instead of commonTest.
      SLOCK_VISUAL_FIXTURES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup CI environment
        uses: ./.github/actions/setup-env

      - name: Guard atomic auth-session writes (#466 no-bypass)
        shell: bash
        run: |
          scripts/check_auth_session_writes.sh --self-test
          scripts/check_auth_session_writes.sh

      # These fixture/vector guards verify the vendored copy against a digest pinned in
      # the script — fully local since task #18 (a pinned commit's content is
      # immutable, so the previous gh api fetch verified nothing and only added
      # a token/network failure surface).
      - name: Guard Web/mobile read-state authority vector
        shell: bash
        run: scripts/check_read_state_behavior_vector.sh

      - name: Guard Web/mobile canonical-message V2 reaction vector
        shell: bash
        run: scripts/check_canonical_message_v2_reaction_vector.sh

      - name: Guard Web/mobile human pixel-avatar vector
        shell: bash
        run: scripts/check_human_pixel_avatar_vector.sh

      - name: Guard server/Android notification copy keys
        shell: bash
        run: scripts/check_notification_copy_vector.sh

      - name: Guard Web/mobile action-card.v1 vector
        shell: bash
        run: scripts/check_action_card_v1_vector.sh

      - name: Guard Web/mobile message-card.v1 vector
        shell: bash
        run: scripts/check_message_card_v1_vector.sh

      - name: Guard server/mobile Activity-unread fixture
        shell: bash
        run: scripts/check_server_activity_unread_fixture.sh

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Start from a clean Gradle home (fail-closed)
        run: rm -rf "$GRADLE_USER_HOME" && mkdir -p "$GRADLE_USER_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Re-enable the Gradle cache so the local build cache (caches/build-cache-epoch-<epoch>,
          # see compose/gradle/build-cache-epoch.settings.gradle.kts)
          # and dependency bundles restore across runs — with cache-disabled the Android
          # compile job recompiled everything from scratch every run (~8m40s).
          #
          # #1478 disabled the cache because a corrupt instrumented AGP jar could poison
          # a shared run: `ExternalDependencyInstrumentingArtifactTransform` fails to build
          # `instrumented-gradle-<v>.jar` at root-project configuration. That poison lives
          # ONLY in the instrumentation cache families. Per the gradle/actions@v5
          # extractor (0723195856…, gradle-home-entry-extractor.ts), and re-checked against
          # the v6.4.0 bundled gradle-actions-caching (patterns caches/jars-*/*,
          # caches/transforms-4/*/, caches/*/transforms/*/), those families are:
          #   instrumented-jars -> caches/jars-*/
          #   transforms        -> caches/transforms-<N>/ (top-level) AND caches/<gradleVer>/transforms/
          # `gradle-home-cache-excludes` deletes matching paths after restore and before
          # save, so excluding these keeps them rebuilt-fresh while every other bundle
          # (build cache, modules-2, wrapper-zips, kotlin-dsl, generated-gradle-jars,
          # java-toolchains) is content-addressed and restores across runs. transforms-*
          # (not a pinned transforms-4) survives a Gradle metadata-version bump. Job-scoped
          # permanent replacement for the blunt cache-disabled; the fleet-wide
          # incident-response quarantine (.github/gradle-cache-quarantine) stays EMPTY.
          #
          # The stable GRADLE_USER_HOME (job env, rebuilt clean above) keeps the cache
          # version stable across runs; PRs (non-main refs) read the default-branch
          # cache seed read-only and never write back.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-excludes: |
            caches/jars-*
            caches/transforms-*
            caches/*/transforms
      # Memory budget for the 16 GB ubuntu-latest runner. Two big JVMs must never be live at once.
      # With the project defaults (compose/gradle.properties) a Gradle build forks a separate
      # Kotlin compile daemon (BuildToolsApiCompilationWork) that stays up, heap still grown,
      # until that Gradle invocation ends. When compile and tests ran in one invocation that was
      # Gradle 4g + Kotlin daemon 4g + three Robolectric test forks, and the kernel OOM killer took
      # the Gradle daemon ("Gradle build daemon disappeared unexpectedly" in :shared:testDebugUnitTest
      # / compile, runs 42516165273, 42559441881, 42569489997). And 4g is too small for the Kotlin
      # compile itself: run 42571118161 (job 129008585080) GC-thrashed 31 min in
      # :shared:compileDebugKotlinAndroid and died with "e: java.lang.OutOfMemoryError: Java heap
      # space"; a local build needed a 6g Kotlin heap. On the APK tier the $GRADLE_USER_HOME
      # jvmargs line dropped the project's -Dkotlin.daemon.jvm.options, so the Kotlin daemon
      # inherited Gradle's -Xmx6g: 6g + 6g in one invocation.
      #
      # So: Kotlin compiles in-process (kotlin.compiler.execution.strategy=in-process, as
      # android-release.yml and android-testbox.yml already do) and the Gradle heap is sized per
      # invocation through $GRADLE_USER_HOME/gradle.properties, which outranks the project file:
      #   compile (+ APK) invocation: Gradle -Xmx8g, one JVM (~9.5 GB RSS with metaspace/code cache)
      #   test invocation:            Gradle -Xmx4g (compiles up to date) + 3 test forks at Gradle's
      #                               default 512m maxHeapSize (~1.5 GB RSS each) = ~10 GB
      # gradle-heap.sh rewrites the jvmargs line (setup-gradle may restore this directory, and
      # appending blindly would stack duplicate entries) and stops any Kotlin daemon a previous
      # invocation left behind (buildSrc / included builds), so the next one starts alone.
      - name: Configure Gradle memory budget
        run: |
          set -euo pipefail
          GUH="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$GUH"
          script="$RUNNER_TEMP/gradle-heap.sh"
          cat > "$script" <<'EOF'
          #!/usr/bin/env bash
          # Usage: gradle-heap.sh <Xmx>. Sets the Gradle JVM heap for the next ./gradlew call.
          set -euo pipefail
          props="${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
          touch "$props"
          grep -v -e '^org\.gradle\.jvmargs=' -e '^kotlin\.compiler\.execution\.strategy=' "$props" > "$props.tmp" || true
          mv "$props.tmp" "$props"
          printf '%s\n' \
            "org.gradle.jvmargs=-Xmx$1 -Xss4m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            'kotlin.compiler.execution.strategy=in-process' >> "$props"
          if pkill -f 'org\.jetbrains\.kotlin\.daemon\.KotlinCompileDaemon'; then
            echo "Stopped a leftover Kotlin compile daemon"
            for _ in $(seq 1 30); do
              pgrep -f 'org\.jetbrains\.kotlin\.daemon\.KotlinCompileDaemon' >/dev/null || break
              sleep 1
            done
            pkill -9 -f 'org\.jetbrains\.kotlin\.daemon\.KotlinCompileDaemon' || true
          fi
          echo "== $props"; cat "$props"
          free -m
          EOF
          chmod +x "$script"
          echo "GRADLE_HEAP=$script" >> "$GITHUB_ENV"

      # Two Gradle invocations for the Android gate, compile first (memory budget above): the
      # Kotlin compile peak and the test JVMs never share the runner. --continue keeps each going
      # past a failing task, so one broken module cannot hide a compile failure elsewhere, and a
      # red unit test cannot hide another; a compile failure stops the step before the tests. No
      # --parallel: :androidApp:generate*OssLicenses resolves :shared's configurations at execution
      # time, which Gradle rejects under parallel project execution ("resolution ... was attempted
      # without an exclusive lock", run 40073308446).
      #
      # - Compiling the unit-test source sets closes the gap where a broken commonTest (or an API
      #   change that breaks tests) sailed through green CI (#198 follow-up).
      #   :androidApp:compileDebugKotlin gates the Android host too: #57 merged green while breaking
      #   every local assembleDebug because only :shared was compiled here (task #217 follow-up).
      #   Every test source set the test invocation needs is compiled here, so that invocation only
      #   finds up-to-date compile outputs.
      # - Hard run gate since #215 cleared the legacy failures: the shared JVM suite must pass, and
      #   the androidApp unit tests run in the same gate so stale Android host tests cannot stay
      #   hidden until a local developer run. :designsystem:verifyRoborazziDesktop is the CMP design system's
      #   unit tests plus its screenshot goldens in verify mode (compose/designsystem/README.md);
      #   it runs desktopTest and writes Roborazzi's HTML report. :shared:verifyRoborazziDebug is
      #   the same for :shared's Robolectric screenshots: it runs testDebugUnitTest (the whole
      #   shared suite, still a hard gate) in verify mode (AGENTS.md "Screenshot tests (:shared)").
      #   A dispatch with record_screenshots=true records both instead (recordRoborazziDesktop,
      #   recordRoborazziDebug); the rest of the suite still runs and must pass.
      # - Unit & Roborazzi tier (plan android_unit_scope & run_roborazzi; artin 2026-11-22 &
      #   2026-11-24 #proj-mobile:#340: "PRs run only a little, like slock" and screenshot golden
      #   verification moves post-merge):
      #   - run_roborazzi=false (all ordinary PRs including compose/designsystem/ and build/deps
      #     PRs, scope=pr, and main premerge with an unreadable diff): -Praft.unitTest.skipScreenshots=true
      #     skips every screenshot golden test (DesignSystemVCases in :designsystem, RaftRobolectricScreenshot
      #     classes in :shared; compose/build.gradle.kts) and runs :designsystem:desktopTest (unit +
      #     Compose UI logic tests only) when run_designsystem_tests=true instead of
      #     verifyRoborazziDesktop. On android_unit_scope=jvm, -Praft.unitTest.skipRobolectric=true
      #     also skips every Robolectric class in :shared and :androidApp.
      #   - run_roborazzi=true (main and release-* pushes, nightly schedule, full-ci PRs, scope=full,
      #     premerge into a release base, the merge-queue candidate, merge_group, record_screenshots):
      #     runs the whole suite and both golden sets (:designsystem:verifyRoborazziDesktop and
      #     :shared:verifyRoborazziDebug, or record* when record_screenshots=true).
      # - Connected-test APKs (BUILD_CONNECTED_APKS above): built here so the emulator jobs below
      #   install the exact APKs without a second Gradle/Kotlin build. The visual fixture gives the
      #   regression a deterministic empty Thread composer.
      # On ordinary PRs (`android_unit_scope=jvm`, no connected APKs, no screenshot recording),
      # narrow unit test execution to test classes impacted by changed files + the always-run smoke
      # set (`scripts/ci/always_run_smoke_tests.txt`), and skip untouched leaf/upstream module test
      # tasks. Strictly fail-closed to `mode=full` on any global/build/resource/deletion/wide-hub diff.
      - name: Select changed Android JVM unit tests
        id: test_selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          ANDROID_UNIT_SCOPE: ${{ needs.plan.outputs.android_unit_scope }}
          RECORD_SCREENSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.record_screenshots }}
          CHANGED_STATUS_B64: ${{ needs.plan.outputs.changed_status_b64 }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ] && \
             [ "$ANDROID_UNIT_SCOPE" = jvm ] && \
             [ "$BUILD_CONNECTED_APKS" != true ] && \
             [ "$RECORD_SCREENSHOTS" != true ] && \
             [ -n "$CHANGED_STATUS_B64" ]; then
            python3 -I scripts/ci/select_changed_tests.py \
              --changed-status-b64 "$CHANGED_STATUS_B64" \
              --output-dir "$RUNNER_TEMP/test-selection" \
              --github-output "$GITHUB_OUTPUT"
          else
            cat >> "$GITHUB_OUTPUT" <<'EOF'
          selection_mode=full
          selection_reason=tier-runs-full-suite
          include_classes_file=
          run_core_tests=true
          run_realtime_socket_tests=true
          run_ui_cmp_tests=true
          run_web_container_tests=true
          run_shared_tests=true
          run_android_app_tests=true
          need_socketio_server=true
          selected_shared_count=0
          selected_android_app_count=0
          EOF
            echo "select_changed_tests: mode=full reason=tier-runs-full-suite"
          fi

      # :realtime-socket's conformance suite (RaftSocketIoInteropTest) talks to a real socket.io
      # 4.8.3 server: two instances (non-default heartbeat / maxPayload; connection state recovery with
      # per-message deflate). Started here, used by :realtime-socket:testAndroidHostTest below. A third
      # (Raft realtime behaviour) serves the realtime client's interop suite on the common client
      # (SocketIoRealtimeClientInteropTest in :androidApp:testDebugUnitTest).
      - name: Start the socket.io interop server
        if: ${{ steps.test_selection.outputs.need_socketio_server != 'false' }}
        working-directory: scripts/socketio-interop
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          nohup node server.mjs > "$RUNNER_TEMP/socketio-interop.log" 2>&1 &
          for _ in $(seq 1 50); do
            grep -q '^READY ' "$RUNNER_TEMP/socketio-interop.log" && break
            sleep 0.2
          done
          grep '^READY ' "$RUNNER_TEMP/socketio-interop.log" || { cat "$RUNNER_TEMP/socketio-interop.log"; exit 1; }
          echo "RAFT_SOCKETIO_INTEROP_URL=http://127.0.0.1:3901" >> "$GITHUB_ENV"
          echo "RAFT_SOCKETIO_INTEROP_RECOVERY_URL=http://127.0.0.1:3902" >> "$GITHUB_ENV"
          echo "RAFT_SOCKETIO_INTEROP_RAFT_URL=http://127.0.0.1:3903" >> "$GITHUB_ENV"

      - name: Compile, test and package Android
        working-directory: compose
        env:
          RECORD_SCREENSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.record_screenshots }}
          ANDROID_UNIT_SCOPE: ${{ needs.plan.outputs.android_unit_scope }}
          RUN_DESIGNSYSTEM_TESTS: ${{ needs.plan.outputs.run_designsystem_tests }}
          RUN_ROBORAZZI: ${{ needs.plan.outputs.run_roborazzi }}
          SELECTION_MODE: ${{ steps.test_selection.outputs.selection_mode }}
          SELECTION_REASON: ${{ steps.test_selection.outputs.selection_reason }}
          INCLUDE_CLASSES_FILE: ${{ steps.test_selection.outputs.include_classes_file }}
          RUN_CORE_TESTS: ${{ steps.test_selection.outputs.run_core_tests }}
          RUN_REALTIME_SOCKET_TESTS: ${{ steps.test_selection.outputs.run_realtime_socket_tests }}
          RUN_UI_CMP_TESTS: ${{ steps.test_selection.outputs.run_ui_cmp_tests }}
          RUN_WEB_CONTAINER_TESTS: ${{ steps.test_selection.outputs.run_web_container_tests }}
          RUN_SHARED_TESTS: ${{ steps.test_selection.outputs.run_shared_tests }}
          RUN_ANDROID_APP_TESTS: ${{ steps.test_selection.outputs.run_android_app_tests }}
        run: |
          set -euo pipefail
          tasks=(
            # Fails unless the Android classpaths resolve the patched foundation AAR
            # (compose/build.gradle.kts; every Android preBuild of :androidApp and :shared runs it too).
            :verifyComposeFoundationPatch
            :shared:compileDebugKotlinAndroid
            :androidApp:compileDebugKotlin
            # App identity receipt: the store variants' merged manifests declare
            # AppIdentityReceiptProvider enabled + DUMP-protected (manifest merge only, no R8).
            :androidApp:verifyReleaseIdentityReceiptProvider
            :androidApp:verifyPlayIdentityReceiptProvider
          )
          test_tasks=(
            :shared-data:verifySqlDelightMigration
          )
          if [ "$SELECTION_MODE" = selected ]; then
            if [ "$RUN_CORE_TESTS" = true ]; then
              tasks+=(:core:compileAndroidHostTest)
              test_tasks+=(:core:testAndroidHostTest)
            fi
            if [ "$RUN_REALTIME_SOCKET_TESTS" = true ]; then
              tasks+=(:realtime-socket:compileAndroidHostTest)
              test_tasks+=(:realtime-socket:testAndroidHostTest)
            fi
            if [ "$RUN_UI_CMP_TESTS" = true ]; then
              tasks+=(:ui-cmp:compileAndroidHostTest)
              test_tasks+=(:ui-cmp:testAndroidHostTest)
            fi
            if [ "$RUN_WEB_CONTAINER_TESTS" = true ]; then
              tasks+=(:web-container:compileAndroidHostTest :web-container:compileTestKotlinDesktop)
              test_tasks+=(:web-container:testAndroidHostTest :web-container:desktopTest)
            fi
            if [ "$RUN_SHARED_TESTS" = true ]; then
              tasks+=(:shared:compileDebugUnitTestKotlinAndroid)
              test_tasks+=(:shared:testDebugUnitTest)
            fi
            if [ "$RUN_ANDROID_APP_TESTS" = true ]; then
              tasks+=(:androidApp:compileDebugUnitTestKotlin)
              test_tasks+=(:androidApp:testDebugUnitTest)
            fi
          else
            tasks+=(
              :core:compileAndroidHostTest
              :realtime-socket:compileAndroidHostTest
              :shared:compileDebugUnitTestKotlinAndroid
              :androidApp:compileDebugUnitTestKotlin
              :ui-cmp:compileAndroidHostTest
              :web-container:compileAndroidHostTest
              :web-container:compileTestKotlinDesktop
            )
            test_tasks+=(
              :core:testAndroidHostTest
              :realtime-socket:testAndroidHostTest
              :shared:testDebugUnitTest
              :androidApp:testDebugUnitTest
              :ui-cmp:testAndroidHostTest
              :web-container:testAndroidHostTest
              :web-container:desktopTest
            )
          fi
          # Compile :designsystem's desktopTest source set only when its desktop tests will run
          # (touches compose/designsystem/, full tier, or record_screenshots); non-designsystem
          # ordinary PRs skip desktop Skiko/Roborazzi test compilation.
          if [ "$RECORD_SCREENSHOTS" = true ] || [ "$ANDROID_UNIT_SCOPE" != jvm ] || [ "$RUN_DESIGNSYSTEM_TESTS" != false ]; then
            tasks+=(:designsystem:compileTestKotlinDesktop)
          fi
          # Unit & Roborazzi tier (comment above):
          # - record_screenshots=true: record both golden sets with the full suite.
          # - run_roborazzi=true: verify both golden sets with the full suite.
          # - run_roborazzi=false: PR CI never runs Roborazzi/vcase golden verification
          #   (-Praft.unitTest.skipScreenshots=true); run :designsystem:desktopTest (unit +
          #   Compose UI logic tests only) when selected, and skip Robolectric when scope=jvm.
          unit_tier=()
          if [ "$RECORD_SCREENSHOTS" = true ]; then
            test_tasks+=(:designsystem:recordRoborazziDesktop :shared:recordRoborazziDebug)
          elif [ "$RUN_ROBORAZZI" = true ]; then
            test_tasks+=(:designsystem:verifyRoborazziDesktop :shared:verifyRoborazziDebug)
          else
            unit_tier+=(-Praft.unitTest.skipScreenshots=true)
            if [ "$ANDROID_UNIT_SCOPE" = jvm ]; then
              unit_tier+=(-Praft.unitTest.skipRobolectric=true)
              if [ "$SELECTION_MODE" = selected ] && [ -n "$INCLUDE_CLASSES_FILE" ]; then
                unit_tier+=("-Praft.unitTest.includeClassesFile=${INCLUDE_CLASSES_FILE}")
              fi
            fi
            if [ "$RUN_DESIGNSYSTEM_TESTS" != false ]; then
              test_tasks+=(:designsystem:desktopTest)
            fi
          fi
          echo "Android unit tier: ${ANDROID_UNIT_SCOPE} (selection: ${SELECTION_MODE}/${SELECTION_REASON}, design system tests: ${RUN_DESIGNSYSTEM_TESTS}, roborazzi: ${RUN_ROBORAZZI}) ${unit_tier[*]}"
          if [ "$BUILD_CONNECTED_APKS" != true ] && [ "$ANDROID_UNIT_SCOPE" = jvm ] && [ "$RECORD_SCREENSHOTS" != true ]; then
            # Ordinary PR tier (no connected APKs, no Robolectric/Roborazzi forks): run compile
            # and plain JVM tests in one Gradle invocation to skip a second cold JVM boot and
            # 9-project configuration pass (~45-75 s). 7g in-process compile heap + at most 2
            # plain JVM test forks (512m each) stays well within the 16 GB runner memory budget.
            "$GRADLE_HEAP" 7g
            ./gradlew "${tasks[@]}" "${test_tasks[@]}" "${unit_tier[@]}" \
              -Praft.unitTest.maxParallelForks=2 \
              --continue \
              --no-daemon \
              --console=plain \
              --stacktrace
          else
            compile=("${tasks[@]}")
            if [ "$BUILD_CONNECTED_APKS" = true ]; then
              # HandsCrash installs from Application.onCreate; keep that SDK on loopback in the
              # connected-test APKs so the emulator suites never report to a real Hands host.
              # (defaultConfig, so the debug unit-test build sees it as well on these tiers; no unit
              # test reads BuildConfig.HANDS_BASE_URL.)
              export SLOCK_HANDS_BASE_URL=https://127.0.0.1:1
              # Assembling the three test APKs makes D8 merge their dex in the Gradle heap. On
              # 2026-10-18 it died at 4g with "D8: java.lang.OutOfMemoryError: Java heap space" inside
              # :androidApp:mergeLibDexConnectedTest while the runner reported 12 GiB available; the
              # 8g compile heap covers it. Built in the compile invocation, before the tests: run
              # together, the APK build's D8/R8 work overlapped the :shared test JVMs and the runner
              # killed the job ~2 min into :shared:testDebugUnitTest (task #proj-mobile#74; runs
              # 41812394919, 41825428986).
              compile+=(
                :shared:assembleDebugAndroidTest
                :androidApp:assembleConnectedTest
                :androidApp:assembleConnectedTestAndroidTest
              )
            fi
            "$GRADLE_HEAP" 8g
            ./gradlew "${compile[@]}" \
              --continue \
              --no-daemon \
              --console=plain \
              --stacktrace
            "$GRADLE_HEAP" 4g
            # :shared:verifySqlDelightMigration applies every checked-in migration (.sqm) to each
            # schema snapshot (src/commonMain/sqldelight/databases/<n>.db) and fails if the result
            # differs from the current RaftDatabase.sq schema (verifyMigrations is on in
            # compose/shared/build.gradle.kts). CI never runs `check`, the only thing depending on
            # verifySqlDelightMigration, so it is invoked explicitly.
            ./gradlew "${tasks[@]}" "${test_tasks[@]}" "${unit_tier[@]}" \
              --continue \
              --no-daemon \
              --console=plain \
              --stacktrace
          fi

      # 1.25.1 (#4802): RaftAppShellReadyContent grew past the JVM's 64 KB method limit and the
      # release compile failed with "Method too large". Read the class files the compile above wrote
      # and fail at 50 KiB of bytecode in any one :shared method, while it can still be split calmly.
      # Prints the largest methods on every run. Runs even when a test failed (it only needs the
      # compile); fails closed when the class directory is missing.
      - name: Check :shared JVM method sizes
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check_jvm_method_size.py compose/shared/build/tmp/kotlin-classes/debug

      # What the unit tier ran: test classes and cases per test task, from the JUnit XML reports
      # (log and job summary). On the jvm tier :shared and :androidApp list no Robolectric class;
      # when run_roborazzi=false :designsystem and :shared list no screenshot golden class.
      - name: Summarize Android unit test results
        if: ${{ !cancelled() }}
        env:
          ANDROID_UNIT_SCOPE: ${{ needs.plan.outputs.android_unit_scope }}
          RUN_ROBORAZZI: ${{ needs.plan.outputs.run_roborazzi }}
          SELECTION_MODE: ${{ steps.test_selection.outputs.selection_mode }}
          SELECTION_REASON: ${{ steps.test_selection.outputs.selection_reason }}
        run: |
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          rows = []
          for results in sorted(pathlib.Path("compose").glob("*/build/test-results/*")):
              suites = []
              for report in sorted(results.glob("*.xml")):
                  try:
                      suites.append(ET.parse(report).getroot())
                  except ET.ParseError as error:
                      print(f"::warning::{report}: {error}")
              if suites:
                  count = lambda key: sum(int(suite.get(key, "0")) for suite in suites)
                  rows.append(f"| :{results.parts[1]}:{results.name} | {len(suites)} | {count('tests')} | {count('skipped')} | {count('failures') + count('errors')} |")
          lines = [
              f"### Android unit tests ({os.environ['ANDROID_UNIT_SCOPE']} tier, selection={os.environ['SELECTION_MODE']} ({os.environ['SELECTION_REASON']}), roborazzi={os.environ['RUN_ROBORAZZI']})",
              "",
              "| Task | Classes | Tests | Skipped | Failed |",
              "| --- | ---: | ---: | ---: | ---: |",
              *rows,
          ]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      # The gate above compiles with the visual fixtures on (SLOCK_VISUAL_FIXTURES, job env), so it
      # never sees the configuration that ships: release, fixtures off (src/visualFixturesOff,
      # fixture data back in commonTest). On the full tier (nightly, full-ci, scope=full) compile
      # that configuration too, so a break shows up before release day. Its own invocation: the
      # fixture flag changes :shared's source sets. A full :shared Kotlin compile, so it gets the
      # 8g in-process compile heap (memory budget above).
      - name: Compile Android release configuration (fixtures off)
        if: ${{ env.BUILD_CONNECTED_APKS == 'true' }}
        working-directory: compose
        env:
          SLOCK_VISUAL_FIXTURES: "false"
        run: |
          set -euo pipefail
          "$GRADLE_HEAP" 8g
          ./gradlew \
            -PslockVisualFixtures=false \
            :shared:compileReleaseKotlinAndroid \
            :androidApp:compileReleaseKotlin \
            --no-daemon \
            --console=plain \
            --stacktrace

      # <name>_actual.png / <name>_compare.png and Roborazzi's HTML report (roborazzi/desktop/).
      - name: Upload design system screenshot diffs
        if: ${{ failure() || (github.event_name == 'workflow_dispatch' && inputs.record_screenshots) }}
        uses: actions/upload-artifact@v7
        with:
          name: designsystem-screenshot-diffs
          path: |
            compose/designsystem/build/reports/screenshots/
            compose/designsystem/build/reports/roborazzi/
          if-no-files-found: ignore

      # record_screenshots dispatch: the goldens recordRoborazziDesktop added or rewrote, to copy
      # into compose/designsystem/screenshots/ and commit (no local Gradle needed).
      - name: Collect recorded design system screenshots
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.record_screenshots }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/designsystem-screenshots-recorded"
          mkdir -p "$out"
          git ls-files --modified --others --exclude-standard -z -- compose/designsystem/screenshots \
            | xargs -0 -r cp -t "$out"
          echo "Recorded design system goldens: $(ls "$out" | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recorded design system screenshots
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.record_screenshots }}
        uses: actions/upload-artifact@v7
        with:
          name: designsystem-screenshots-recorded
          path: ${{ runner.temp }}/designsystem-screenshots-recorded/
          if-no-files-found: ignore

      # :shared's Robolectric screenshots (RaftRobolectricScreenshot): <name>_actual.png and
      # <name>_compare.png (golden, diff, actual) for every golden that is missing or differs,
      # under home-screenshots/ (thread-/shell-screenshots/ for a few tests), plus Roborazzi's HTML
      # report (roborazzi/debug/index.html). A new golden's image is its <name>_actual.png here.
      - name: Upload shared screenshot diffs
        if: ${{ failure() || (github.event_name == 'workflow_dispatch' && inputs.record_screenshots) }}
        uses: actions/upload-artifact@v7
        with:
          name: shared-home-screenshots
          path: |
            compose/shared/build/reports/home-screenshots/
            compose/shared/build/reports/thread-screenshots/
            compose/shared/build/reports/shell-screenshots/
            compose/shared/build/reports/roborazzi/
          if-no-files-found: ignore
          retention-days: 7

      # record_screenshots dispatch: the goldens recordRoborazziDebug added or rewrote, to copy
      # into compose/shared/src/androidUnitTest/screenshots/ and commit (no local Gradle needed).
      - name: Collect recorded shared screenshots
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.record_screenshots }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/shared-screenshots-recorded"
          mkdir -p "$out"
          git ls-files --modified --others --exclude-standard -z -- compose/shared/src/androidUnitTest/screenshots \
            | xargs -0 -r cp -t "$out"
          echo "Recorded shared goldens: $(ls "$out" | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recorded shared screenshots
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.record_screenshots }}
        uses: actions/upload-artifact@v7
        with:
          name: shared-screenshots-recorded
          path: ${{ runner.temp }}/shared-screenshots-recorded/
          if-no-files-found: ignore

      - name: Upload Android connected-test APKs
        if: ${{ env.BUILD_CONNECTED_APKS == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-connected-test-apks
          path: |
            compose/androidApp/build/outputs/apk/connectedTest/*.apk
            compose/androidApp/build/outputs/apk/androidTest/connectedTest/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload shared atomic-sink test APK
        if: ${{ env.BUILD_CONNECTED_APKS == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-shared-atomic-sink-test-apk
          path: compose/shared/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            compose/core/build/reports/tests/testDebugUnitTest/
            compose/core/build/test-results/testDebugUnitTest/
            compose/realtime-socket/build/reports/tests/
            compose/realtime-socket/build/test-results/
            ${{ runner.temp }}/socketio-interop.log
            compose/ui-cmp/build/reports/tests/testDebugUnitTest/
            compose/ui-cmp/build/test-results/testDebugUnitTest/
            compose/web-container/build/reports/tests/
            compose/web-container/build/test-results/
            compose/shared/build/reports/tests/testDebugUnitTest/
            compose/shared/build/test-results/testDebugUnitTest/
            compose/androidApp/build/reports/tests/testDebugUnitTest/
            compose/androidApp/build/test-results/testDebugUnitTest/
            compose/designsystem/build/reports/tests/desktopTest/
            compose/designsystem/build/test-results/desktopTest/
          retention-days: 7

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics

  android-device:
    name: Android first-character baseline (emulator)
    runs-on: ubuntu-latest
    needs: [plan, android]
    # Stamp's queue accepts a candidate only when every job of its run succeeded, so on the
    # merge-queue candidate this job runs as a no-op success when the plan does not select it
    # (every step is gated on RAFT_JOB_ACTIVE).
    if: ${{ needs.plan.outputs.run_device_suite == 'true' || needs.plan.outputs.queue_candidate == 'true' }}
    timeout-minutes: 30
    env:
      RAFT_JOB_ACTIVE: ${{ needs.plan.outputs.run_device_suite == 'true' }}
    steps:
      - name: Free runner disk space for emulator
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      # Checkout only exists to provide scripts/ci/assert-instrumentation-ok.sh
      # (the instrumentation gates were previously hardcoded `grep 'OK (N tests)'`
      # count pins that broke whenever a case was added to a gated class).
      - name: Checkout
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' }}
        uses: actions/checkout@v7

      - name: Select Thread newer-pagination gate
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            run_gate=true
          else
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
            diff_rc=0
            scripts/ci/git-diff-path-state.sh "$PR_BASE_SHA" HEAD -- \
              compose/shared/src/commonMain/kotlin/build/raft/app/thread/ThreadPage.kt \
              compose/shared/src/commonMain/kotlin/build/raft/app/thread/LazyViewportController.kt \
              compose/shared/src/commonMain/kotlin/build/raft/app/thread/ThreadNewerPagination.kt \
              compose/androidApp/src/androidTest/java/build/raft/app/shared/RaftThreadNewerAutoPaginationConnectedTest.kt \
              compose/shared/src/visualFixtures/kotlin/build/raft/app/ThreadNewerAutoPaginationVisualFixture.kt \
              compose/shared/src/commonMain/kotlin/build/raft/app/thread/ThreadMessagesList.kt \
              compose/shared/src/commonMain/kotlin/build/raft/app/thread/ThreadMessagesListItems.kt \
              compose/shared/src/commonMain/kotlin/build/raft/app/thread/ThreadViewportScroll.kt \
              compose/shared/src/commonMain/kotlin/build/raft/app/thread/ThreadMessagesListModel.kt \
              compose/shared/src/commonMain/kotlin/build/raft/app/thread/ThreadTimelineRows.kt \
              compose/shared/src/commonMain/kotlin/build/raft/app/thread/ThreadPageContent.kt \
              compose/shared/src/commonMain/kotlin/build/raft/app/thread/ThreadPageTabs.kt \
              || diff_rc=$?
            case "$diff_rc" in
              0) run_gate=false ;;
              1) run_gate=true ;;
              *)
                echo "::warning::git diff failed with exit $diff_rc; running Thread newer-pagination gate"
                run_gate=true
                ;;
            esac
          fi
          echo "THREAD_NEWER_PAGINATION_GATE_REQUIRED=$run_gate" >> "$GITHUB_ENV"
          echo "Thread newer-pagination gate required: $run_gate"

      - name: Setup Android SDK
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' }}
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Download connected-test APKs
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: android-connected-test-apks
          path: android-connected-test-apks

      - name: Download shared atomic-sink test APK
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: android-shared-atomic-sink-test-apk
          path: android-shared-atomic-sink-test-apk

      - name: List downloaded APK members
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' }}
        run: |
          find android-connected-test-apks -type f -name '*.apk' -print
          find android-shared-atomic-sink-test-apk -type f -name '*.apk' -print
          test "$(find android-shared-atomic-sink-test-apk -type f -name '*.apk' | wc -l)" -eq 1
          shared_test_apk="$(find android-shared-atomic-sink-test-apk -type f -name '*.apk' | head -n 1)"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          "$aapt_bin" dump badging "$shared_test_apk" | tee shared-atomic-sink-test-apk-badging.txt
          grep -Fq "package: name='build.raft.app.shared.test'" shared-atomic-sink-test-apk-badging.txt
          grep -Fq "targetSdkVersion:'34'" shared-atomic-sink-test-apk-badging.txt

      - name: Enable KVM
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run first-character baseline regression
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SOURCE_EXACT: ${{ github.event.pull_request.head.sha || github.sha }}
          ANDROID_EMULATOR_SYSTEM_IMAGE_PACKAGE: system-images;android-34;google_apis;x86_64
          RUNNER_LABEL: ubuntu-latest
          THREAD_NEWER_PAGINATION_GATE_REQUIRED: ${{ env.THREAD_NEWER_PAGINATION_GATE_REQUIRED }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6_pro
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash scripts/ci/run-first-character-emulator-suite.sh

      - name: Upload instrumentation output
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' && (always()) }}
        uses: actions/upload-artifact@v7
        with:
          name: first-character-baseline-instrumentation
          path: |
            first-character-baseline-suite-summary.txt
            first-character-baseline-instrumentation.txt
            android-ime-environment.txt
            composer-session-retirement-instrumentation.txt
            composer-session-retirement-input-method.txt
            composer-session-retirement-window.txt
            composer-session-retirement-activity.txt
            composer-session-retirement-power.txt
            composer-session-retirement-policy.txt
            composer-session-retirement-logcat.txt
            thread-composer-suggestion-interaction-*
            multiline-text-field-value-instrumentation.txt
            composer-text-selection-instrumentation.txt
            attachment-private-file-provider-instrumentation.txt
            attachment-private-file-provider-logcat.txt
            attachment-atomic-sink-instrumentation.txt
            attachment-atomic-sink-receipt.txt
            attachment-download-runtime-instrumentation.txt
            child-page-visibility-instrumentation.txt
            child-page-visibility-accepted.png
            child-page-visibility-terminal.png
            child-page-visibility-logcat.txt
            durable-partition-migration-instrumentation.txt
            thread-newer-auto-pagination-instrumentation.txt
            qa-session-bootstrap-inbox-instrumentation.txt
            composed-character-boundary-instrumentation.txt
            webview-renderer-gone-instrumentation.txt
            thread-open-budget-telemetry.txt
            *-instrumentation.txt.attempt-*
          if-no-files-found: warn
          retention-days: 7

  android-minimum-supported-attachment-runtime:
    name: Android attachment authority (API ${{ matrix.api-level }} emulator)
    runs-on: ubuntu-latest
    needs: [plan, android]
    # Stamp's queue accepts a candidate only when every job of its run succeeded, so on the
    # merge-queue candidate this job runs as a no-op success when the plan does not select it
    # (every step is gated on RAFT_JOB_ACTIVE).
    if: ${{ needs.plan.outputs.attachment_api_levels != '[]' || needs.plan.outputs.queue_candidate == 'true' }}
    timeout-minutes: 20
    env:
      RAFT_JOB_ACTIVE: ${{ needs.plan.outputs.attachment_api_levels != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        # ["none"]: the no-op leg on a merge-queue candidate that plans no attachment legs.
        api-level: ${{ fromJSON(needs.plan.outputs.attachment_api_levels != '[]' && needs.plan.outputs.attachment_api_levels || '["none"]') }}
    steps:
      - name: Free runner disk space for emulator
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' }}
        uses: actions/checkout@v7

      - name: Setup Android SDK
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' }}
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Download connected-test APKs
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: android-connected-test-apks
          path: android-connected-test-apks

      - name: Enable KVM
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run exact public-download authority on API ${{ matrix.api-level }}
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6_pro
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r "$(find android-connected-test-apks -type f -name '*connectedTest.apk' -not -name '*androidTest*' | head -n 1)"
            adb install -r "$(find android-connected-test-apks -type f -name '*androidTest.apk' | head -n 1)"
            scripts/ci/run-public-downloads-authority.sh ${{ matrix.api-level }} ${{ inputs.attachment_authority_repeat || 1 }} ${{ inputs.attachment_authority_mode || 'ci' }}

      - name: Upload API ${{ matrix.api-level }} attachment evidence
        if: ${{ env.RAFT_JOB_ACTIVE == 'true' && (always()) }}
        uses: actions/upload-artifact@v7
        with:
          name: attachment-public-downloads-api${{ matrix.api-level }}-evidence
          path: |
            attachment-public-downloads-api${{ matrix.api-level }}-instrumentation*.txt
            attachment-public-downloads-api${{ matrix.api-level }}-logcat*.txt
            attachment-public-downloads-api${{ matrix.api-level }}-repeat-summary.txt
            *-instrumentation.txt.attempt-*
          if-no-files-found: warn
          retention-days: 7

  ios:
    # The default lane keeps the plain "iOS compile" name; only "CI gate" is a required
    # check (.github/rulesets/mobile-main-merge-queue.json), and it reads needs.ios.result,
    # which is success only when every planned lane succeeded.
    name: ${{ matrix.lane == 'github-xcode27.1' && 'iOS compile (Xcode 27.1)' || 'iOS compile' }}
    # Pull requests never compile iOS (only the full-ci label does). Stamp merge queue
    # (2026-11-19): the pre-merge iOS compile runs on the queue candidate (draft PR from stamp-mq/*),
    # once per batch of up to 10 PRs, on the Xcode 27.1 lane; main pushes compile iOS when
    # the push can affect iOS; nightly and release-* pushes run the full readback.
    # Lanes come from the plan (`ios_lanes`, pinned by run_ios_xcode270 / run_ios_xcode271):
    # - github-xcode27.0, every iOS run but the merge queue: GitHub's standard `xcode-27` image (3-core M1, 7 GB,
    #   free on this public repo; free runners first, 2026-11-18) with Xcode 27.0 (iOS 27 SDK).
    #   Was blacksmith-6vcpu-macos-latest, billed per minute. GitHub caps standard + larger
    #   macOS at 5 concurrent jobs per org (Free/Team), shared with ios-release.yml's
    #   xcode-27-xlarge IPA build, ios-simulator-app.yml and qa-acceptance-ios.yml. The lane
    #   averages about one Mac; if the queue backs up, the run waits for a free Mac. There is
    #   no billed fallback: the ios_runner dispatch input (blacksmith-6vcpu-macos-latest) was
    #   removed on 2026-11-22.
    # - github-xcode27.1: GitHub xcode-27 with Xcode 27.1 (the release SDK, a real directory on
    #   that image), so code using 27.1-only SDK APIs (iPhone Duo: UIViewReservedRegion, UIHinge)
    #   compiles before it lands. Beside the 27.0 lane on the nightly schedule and release-*
    #   pushes; alone on the merge-queue batch (stamp-mq/*). Full-ci PRs, main pushes and every
    #   dispatch scope skip it. Always xcode-27, never Blacksmith: on blacksmith-*-macos-27
    #   Xcode_27.1.app/Contents/Developer resolves through a symlink and select_ios_xcode.sh
    #   refuses it (run 44274101639), and blacksmith-*-macos-latest has no 27.1.
    # workflow_dispatch scope=ios runs plan + this job's Xcode 27.0 lane only (no Android jobs):
    # a deliberate one-off iOS check. The CI gate expects android and the emulator jobs skipped.
    # workflow_dispatch scope=premerge (Stamp's ready-to-merge check) into main never runs this
    # job (the merge queue does); into a release base it runs the full tier.
    # iOS tests (planner output `run_ios_tests`): the K/N commonTest compile
    # (compileTestKotlinIosSimulatorArm64), adaptive editor snapshots, the iosAppTests XCTest
    # bundle and the shared iosTest simulator run happen only on the full tier: nightly schedule,
    # release-* pushes, scope=full, premerge into a release base and full-ci PRs. The UI-test
    # bundle (QaAcceptanceLoopTests) is built by qa-acceptance-ios.yml, which runs it. scope=ios, main pushes and the merge queue compile the iOS targets,
    # link the framework and build the host app only (mobile test prune step 1, 2026-11-13:
    # ~5 of ~13 min per job were tests); iOS-only behaviour regressions surface in the nightly.
    # The simulator steps pick an iPhone on the newest iOS runtime not newer than the SDK, skipping
    # iPhone Duo (on xcode-27 the iOS 27.1 runtime only offers Duo; the tab-bar tests expect a phone).
    needs: [plan]
    if: ${{ needs.plan.outputs.run_ios == 'true' }}
    strategy:
      fail-fast: false
      # Only `lane` is a matrix key; per-lane values are derived from it below. Do not move
      # them back into `matrix.include`: an include entry whose lane is not in ios_lanes is
      # ADDED as an extra combination, so the 27.1 lane ran on every iOS run regardless of
      # the plan (found 2026-11-05 on the first scope=ios dispatch).
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.ios_lanes) }}
    env:
      IOS_LANE_XCODE_REQUEST: ${{ matrix.lane == 'github-xcode27.1' && '/Applications/Xcode_27.1.app' || '/Applications/Xcode_27.0.app' }}
    runs-on: xcode-27
    # The 3-core GitHub Mac is slow: the 27.1 lane takes ~48 min there with the iOS tests,
    # so keep headroom.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Xcode 27.0 is a symlink on GitHub xcode-27 (Xcode_27.0.app -> Xcode_27.app), which
      # select_ios_xcode.sh rejects. Resolve the requested path to its real bundle directly under /Applications
      # first (on GitHub xcode-27, Xcode_27.1.app is already a real directory). The
      # xcode_app_path dispatch input overrides the 27.0 lane only; the 27.1 lane stays on 27.1.
      - name: Resolve Xcode bundle
        shell: bash
        env:
          XCODE_REQUEST: ${{ matrix.lane == 'github-xcode27.0' && inputs.xcode_app_path || env.IOS_LANE_XCODE_REQUEST }}
        run: |
          set -euo pipefail
          real="$(realpath "$XCODE_REQUEST")"
          case "$real" in
            /Applications/Xcode*.app) ;;
            *) echo "::error::$XCODE_REQUEST resolves to $real, not an Xcode bundle directly under /Applications"; exit 1 ;;
          esac
          [ "$(dirname "$real")" = /Applications ] || { echo "::error::$real is not directly under /Applications"; exit 1; }
          echo "Xcode: $XCODE_REQUEST -> $real"
          echo "RAFT_IOS_COMPILE_XCODE=$real" >> "$GITHUB_ENV"

      - name: Pin Xcode
        # Build with a chosen Xcode, not the runner image's default: the SDK decides how iOS
        # lays the app out (the iOS 27.1 SDK makes it edge-to-edge on iPhone Duo, status bar on
        # the right edge). Moving SDKs is a deliberate change (iPhone Duo audit, 2026-10-27).
        # `xcode_app_path` (workflow_dispatch only) picks another Xcode for the 27.0 lane;
        # empty keeps Xcode 27.0. The 27.1 lane and releases (ios-release.yml) build with 27.1.
        env:
          XCODE_APP_PATH: ${{ env.RAFT_IOS_COMPILE_XCODE }}
        run: bash scripts/ci/select_ios_xcode.sh

      - name: Record Xcode and iOS SDK
        env:
          XCODE_APP_PATH: ${{ env.RAFT_IOS_COMPILE_XCODE }}
          RAFT_DEFAULT_XCODE_APP: ${{ env.RAFT_IOS_COMPILE_XCODE }}
        run: bash scripts/ci/record_ios_toolchain.sh

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Gradle cache policy
        uses: ./.github/actions/gradle-cache-policy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Shared Kotlin/Native Gradle settings
        uses: ./.github/actions/ios-kn-gradle
      # The device target (:shared:compileKotlinIosArm64, ~1.5 min on top of the simulator
      # compile) runs only on the full tier (full-ci PRs, nightly, scope=full dispatch) and on
      # release-* pushes. Main pushes and merge-queue runs compile the simulator targets only;
      # ios-release.yml still compiles and links the device target for every device release.
      # The commonTest K/N compile (:shared:compileTestKotlinIosSimulatorArm64) runs only when
      # the plan runs the iOS tests (run_ios_tests).
      - name: Compile shared and design system iOS targets (and unit tests on the full tier)
        working-directory: compose
        env:
          IOS_DEVICE_COMPILE: ${{ needs.plan.outputs.run_device_suite == 'true' || startsWith(github.ref, 'refs/heads/release-') }}
          IOS_TESTS: ${{ needs.plan.outputs.run_ios_tests }}
        run: |
          set -euo pipefail
          tasks=(
            # CMP-10674: fails unless the iOS klibs are the patched Compose UI (compose/build.gradle.kts).
            :verifyComposeUiPatch
            :shared:compileKotlinIosSimulatorArm64
            :designsystem:compileKotlinIosSimulatorArm64
            :ui-cmp:compileKotlinIosSimulatorArm64
            :realtime-socket:compileKotlinIosSimulatorArm64
            :web-container:compileKotlinIosSimulatorArm64
          )
          if [ "$IOS_TESTS" = true ]; then
            tasks+=(:shared:compileTestKotlinIosSimulatorArm64 :realtime-socket:iosSimulatorArm64Test :web-container:iosSimulatorArm64Test)
          fi
          if [ "$IOS_DEVICE_COMPILE" = true ]; then
            tasks+=(:shared:compileKotlinIosArm64 :web-container:compileKotlinIosArm64)
          fi
          ./gradlew "${tasks[@]}" \
            --no-daemon \
            --console=plain \
            --stacktrace

      - name: Test adaptive navigation transaction fences
        run: bash compose/iosApp/scripts/test_adaptive_navigation_session.sh

      - name: Test iOS interactive pop gesture admission
        run: bash compose/iosApp/scripts/test_interactive_pop_gesture_admission.sh

      - name: Test iOS conversation forward gesture admission
        run: bash compose/iosApp/scripts/test_conversation_forward_gesture_admission.sh

      - name: Test iOS QA session bootstrap contract
        run: bash compose/iosApp/scripts/test_qa_session_bootstrap_contract.sh

      # shared.podspec guards against a missing framework dir; the IDE's
      # Gradle sync normally creates the placeholder — CI must do it manually.
      - name: Generate shared framework placeholder
        working-directory: compose
        run: ./gradlew :shared:generateDummyFramework --no-daemon --console=plain --stacktrace

      - name: Pod install
        working-directory: compose/iosApp
        run: pod install

      # Sync the K/N framework as its own step so Gradle gets proper caching
      # and failure diagnostics, instead of running nested inside xcodebuild's
      # [CP-User] Build shared script phase (which is also where tail-truncated
      # logs used to swallow the real linker error). xcodebuild then skips the
      # podspec script via OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES.
      # Every xcodebuild below also passes RAFT_IOS_REUSE_LINKED_FRAMEWORK=YES so
      # the app's "Copy kmmresource MR bundle" phase reuses this link instead of
      # relinking if Gradle sees it out of date (compose/shared/build.gradle.kts).
      - name: Sync shared framework (simulator arm64)
        working-directory: compose
        run: |
          ./gradlew :shared:syncFramework \
            -Pkotlin.native.cocoapods.platform=iphonesimulator \
            -Pkotlin.native.cocoapods.archs=arm64 \
            -Pkotlin.native.cocoapods.configuration=Debug \
            --no-daemon \
            --console=plain \
            --stacktrace

      - name: Build iOS host app (simulator)
        working-directory: compose/iosApp
        run: |
          set -o pipefail
          log="$GITHUB_WORKSPACE/xcodebuild-ios.log"
          # Actions runs this under `bash -e`: without `set +e` a failing xcodebuild ends the step
          # here and the error extraction below never prints (run 45068037934: exit 65, no errors
          # in the job log). The step still fails with xcodebuild's status via `exit "$status"`.
          set +e
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            RAFT_IOS_REUSE_LINKED_FRAMEWORK=YES \
            build > "$log" 2>&1
          status=$?
          tail -200 "$log"
          if [ "$status" -ne 0 ]; then
            echo "===== iOS build FAILED (status=$status) — extracted errors ====="
            grep -nE "(^|[[:space:]])e: |: error:|error: |Unresolved|FAILURE:|Execution failed|BUILD FAILED|following build commands failed|PhaseScriptExecution" "$log" \
              | grep -v "Using response file" | tail -100 || true
          fi
          exit "$status"

      - name: Test adaptive editor snapshots (UIKit)
        if: ${{ needs.plan.outputs.run_ios_tests == 'true' }}
        working-directory: compose/iosApp
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)" python3 -c 'import json,os,re,sys; v=lambda s: tuple(int(p) for p in re.findall(r"\d+", s)); rs=sorted(((v(k.rsplit(".iOS-", 1)[1]), k, vs) for k, vs in json.load(sys.stdin)["devices"].items() if ".iOS-" in k), key=lambda t: t[0], reverse=True); rs=[t for t in rs if t[0] <= v(os.environ["SDK"])] or rs; ds=[(k, x) for _, k, vs in rs for x in vs if "iPhone" in x["name"]]; k, x=next((d for d in ds if "Duo" not in d[1]["name"]), ds[0]); print(x["name"], k, file=sys.stderr); print(x["udid"])')
          log="$GITHUB_WORKSPACE/xcodebuild-adaptive-editor-tests.log"
          # assert_xctest_ran.py reads the result bundle: in the log the host app's stderr is cut
          # into XCTest's lines (run 44830456744). xcodebuild refuses a bundle path that exists.
          bundle="$RUNNER_TEMP/adaptive-editor-tests.xcresult"
          rm -rf "$bundle"
          # Retries once, after rebooting the simulator, only when the test runner never connected.
          bash "$GITHUB_WORKSPACE/compose/iosApp/scripts/xctest_retry_on_runner_hang.sh" "$log" "$bundle" "$device_id" -- \
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme AdaptiveEditorTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            -resultBundlePath "$bundle" \
            -only-testing:AdaptiveEditorTests/RaftAdaptiveEditorSnapshotTests \
            -parallel-testing-enabled NO \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            RAFT_IOS_REUSE_LINKED_FRAMEWORK=YES \
            test || { python3 "$GITHUB_WORKSPACE/compose/iosApp/scripts/print_xctest_failures.py" "$log"; tail -200 "$log"; exit 1; }
          tail -60 "$log"
          python3 "$GITHUB_WORKSPACE/compose/iosApp/scripts/assert_xctest_ran.py" --xcresult "$bundle" "$log" RaftAdaptiveEditorSnapshotTests

      - name: Test iOS host XCTests (iosAppTests bundle, UIKit)
        if: ${{ needs.plan.outputs.run_ios_tests == 'true' }}
        working-directory: compose/iosApp
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)" python3 -c 'import json,os,re,sys; v=lambda s: tuple(int(p) for p in re.findall(r"\d+", s)); rs=sorted(((v(k.rsplit(".iOS-", 1)[1]), k, vs) for k, vs in json.load(sys.stdin)["devices"].items() if ".iOS-" in k), key=lambda t: t[0], reverse=True); rs=[t for t in rs if t[0] <= v(os.environ["SDK"])] or rs; ds=[(k, x) for _, k, vs in rs for x in vs if "iPhone" in x["name"]]; k, x=next((d for d in ds if "Duo" not in d[1]["name"]), ds[0]); print(x["name"], k, file=sys.stderr); print(x["udid"])')
          log="$GITHUB_WORKSPACE/xcodebuild-login-router-tests.log"
          # The result bundle is what assert_xctest_ran.py reads (see the adaptive editor step).
          bundle="$RUNNER_TEMP/ios-app-tests.xcresult"
          rm -rf "$bundle"
          # Retries once, after rebooting the simulator, only when the test runner never connected.
          bash "$GITHUB_WORKSPACE/compose/iosApp/scripts/xctest_retry_on_runner_hang.sh" "$log" "$bundle" "$device_id" -- \
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosAppTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            -resultBundlePath "$bundle" \
            -only-testing:iosAppTests \
            -parallel-testing-enabled NO \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            RAFT_IOS_REUSE_LINKED_FRAMEWORK=YES \
            test || { python3 "$GITHUB_WORKSPACE/compose/iosApp/scripts/print_xctest_failures.py" "$log"; tail -200 "$log"; exit 1; }
          tail -60 "$log"
          # Every class in the bundle must have run at least one case; xcodebuild itself
          # reports success when a selector matches nothing.
          python3 "$GITHUB_WORKSPACE/compose/iosApp/scripts/assert_xctest_ran.py" --xcresult "$bundle" "$log" \
            RaftRouterLoginTransitionTests \
            RaftIosComposeScrollEdgeEffectsTests \
            RaftCmpBridgeSelectorTests \
            RaftIosTabBarItemMappingTests \
            RaftInteractivePopGestureTests \
            RaftIosAdaptivePanePublisherTests \
            RaftIosAvatarCacheProviderTests \
            RaftIosNetworkRequestLifetimeAdapterTests \
            RaftIosRealtimeLifecyclePolicyTests \
            RaftIosOpenAttachmentTests \
            RaftIosComposerPasteTests \
            RaftIosNotificationRetractionTests \
            RaftIosPageOpenGateTests \
            RaftShareControllerFailureReasonTests \
            RaftExternalShareEnvelopeStorageTests \
            RaftIosShareSuggestionsHostTests \
            RaftIosToastOverlayTests

      # compose/shared/src/iosTest used to be compiled only. Run the iOS-specific classes
      # (*IosTest / *IosSmokeTest) on a simulator; commonTest already runs on the JVM in the
      # android job. Gradle fails if the filters match no test, and the report check below
      # fails on zero executed cases. It runs after the XCTest steps so a red iosTest does not
      # hide their results.
      - name: Run shared iosTest on the simulator
        working-directory: compose
        if: ${{ !cancelled() && needs.plan.outputs.run_ios_tests == 'true' }}
        run: |
          set -uo pipefail
          device_id=$(xcrun simctl list devices available -j | SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)" python3 -c 'import json,os,re,sys; v=lambda s: tuple(int(p) for p in re.findall(r"\d+", s)); rs=sorted(((v(k.rsplit(".iOS-", 1)[1]), k, vs) for k, vs in json.load(sys.stdin)["devices"].items() if ".iOS-" in k), key=lambda t: t[0], reverse=True); rs=[t for t in rs if t[0] <= v(os.environ["SDK"])] or rs; ds=[(k, x) for _, k, vs in rs for x in vs if "iPhone" in x["name"]]; k, x=next((d for d in ds if "Duo" not in d[1]["name"]), ds[0]); print(x["name"], k, file=sys.stderr); print(x["udid"])')
          # The XCTest steps above leave this simulator booted; the Kotlin test task boots it itself.
          xcrun simctl shutdown "$device_id" 2>/dev/null || true
          gradle_rc=0
          ./gradlew :shared:iosSimulatorArm64Test \
            -Praft.iosSimulatorTestDevice="$device_id" \
            --tests '*IosTest' \
            --tests '*IosSmokeTest' \
            --no-daemon \
            --console=plain \
            --stacktrace || gradle_rc=$?
          python3 - <<'PY'
          import pathlib, re, sys, xml.etree.ElementTree as ET
          reports = sorted(pathlib.Path("shared/build/test-results/iosSimulatorArm64Test").glob("*.xml"))
          total = 0
          ran = {}
          for report in reports:
              suite = ET.parse(report).getroot()
              count = int(suite.get("tests", "0"))
              total += count
              simple = suite.get("name", "").split("[")[0].strip().rsplit(".", 1)[-1]
              ran[simple] = ran.get(simple, 0) + count
              print(f"{suite.get('name')}: {count} tests, {suite.get('failures')} failures, {suite.get('skipped')} skipped")
              for case in suite.iter("testcase"):
                  for problem in list(case.iter("failure")) + list(case.iter("error")):
                      print(f"  FAILED {case.get('name')}: {problem.get('message')}")
                      print("    " + (problem.text or "").strip()[:2000].replace("\n", "\n    "))
          print(f"iosTest total: {total} tests in {len(reports)} classes")
          # Every top-level class in an iosTest file with @Test must have run at least one case:
          # a class the --tests filters above miss (Hands 1b6dd022: RaftDarwinUploadProgressTest
          # compiled but never ran) fails here instead of passing silently.
          declared = set()
          for source in pathlib.Path("shared/src/iosTest").rglob("*.kt"):
              text = source.read_text()
              if "@Test" in text:
                  declared.update(re.findall(r"^(?:(?:internal|public|open) )*class (\w+)", text, re.M))
          missing = sorted(name for name in declared if ran.get(name, 0) == 0)
          for name in missing:
              print(f"NOT RUN: {name} has @Test cases but executed 0 (name must match *IosTest or *IosSmokeTest)")
          print(f"iosTest classes declared: {len(declared)}, not run: {len(missing)}")
          sys.exit(0 if total > 0 and not missing else 1)
          PY
          summary_rc=$?
          [ "$gradle_rc" -eq 0 ] && [ "$summary_rc" -eq 0 ]

      - name: Upload xcodebuild log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-compile-xcodebuild-log-${{ github.run_id }}-${{ matrix.lane }}
          path: |
            xcodebuild-ios.log
            xcodebuild-adaptive-editor-tests.log
            xcodebuild-login-router-tests.log
            compose/shared/build/test-results/iosSimulatorArm64Test/
            compose/shared/build/reports/tests/iosSimulatorArm64Test/
          if-no-files-found: ignore
          retention-days: 7

      - name: Gradle failure diagnostics
        if: failure()
        uses: ./.github/actions/gradle-failure-diagnostics

  # Stamp merge queue CI reuse (2026-11-19): on a main push that is exactly a tested queue
  # fast-forward (check_queue_tested.py verified the stamp/queue-tested status, the candidate
  # run and the push's before SHA), this is the only job besides plan and the CI gate. It
  # records which candidate run proved the SHA. The name is Stamp's contract: on the
  # candidate run itself this job is skipped, and Stamp allows exactly this name to skip.
  queue-ci-reuse:
    name: queue-ci-reuse
    runs-on: ubuntu-latest
    needs: [plan]
    if: ${{ needs.plan.outputs.queue_reuse == 'true' }}
    timeout-minutes: 5
    steps:
      - name: Record merge-queue CI reuse
        env:
          TESTED_RUN: ${{ needs.plan.outputs.queue_tested_run }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${TESTED_RUN}"
          echo "Reusing Stamp merge-queue run ${TESTED_RUN} for ${PUSH_SHA} (base ${PUSH_BEFORE_SHA}): ${url}"
          {
            echo "### Merge-queue CI reuse"
            echo ""
            echo "\`${PUSH_SHA}\` is the merge-queue candidate that [run ${TESTED_RUN}](${url}) tested on base \`${PUSH_BEFORE_SHA}\`"
            echo "(every job green, first attempt, verified against the \`stamp/queue-tested\` status)."
            echo "Android, iOS and the emulator jobs are not re-run on this push."
          } >> "$GITHUB_STEP_SUMMARY"

  # The only Test context intended for the main-branch required-check rule.
  # It always reports, including docs-only PRs, and mechanically verifies that
  # exactly the jobs selected by the checked-in plan passed. Emulator jobs are
  # intentionally absent from merge_group until their bounded infra-abort
  # retry contract has landed and has fresh flake evidence.
  # Stamp merge queue (2026-11-19): this is the queue's single required check on
  # the candidate (draft PR from stamp-mq/*). It needs every job, iOS included, so a
  # red or skipped-but-planned "iOS compile (Xcode 27.1)" or "Android compile & tests"
  # turns it red and the batch does not land. (Stamp additionally requires every job of
  # the candidate run to succeed; only queue-ci-reuse may skip.)
  ci-gate:
    name: CI gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - plan
      - android
      - android-device
      - android-minimum-supported-attachment-runtime
      - ios
      - queue-ci-reuse
    steps:
      - name: Checkout aggregate verifier
        uses: actions/checkout@v7

      # Runs in the SAME job as the gate on purpose. The verifier carries a selfTest behind
      # `--self-test`, and nothing invoked it — so the expectation table could drift from
      # test.yml and no CI job would go red. That is exactly how a job-dependency/iOS
      # mismatch survived 18 days (#2294). Every other scripts/ci self-test in this repo is
      # called by CI; this one was the sole omission (@LiBai). Putting it beside the gate,
      # rather than in a paths-filtered lint workflow, means it cannot fall out of coverage
      # when someone edits the verifier without touching whatever paths that lint watches.
      - name: Self-test the tier verifier
        run: node scripts/ci/verify_test_tier_results.mjs --self-test

      - name: Verify exact selected tier results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/verify_test_tier_results.mjs
