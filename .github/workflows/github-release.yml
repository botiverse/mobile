name: GitHub Release

# One GitHub Release per shipped version, built from what Hands shipped:
# - Android: the signed APK from the published `main` release (SHA-256 checked against
#   Hands) and, as a backup, the signed AAB the same android-release.yml run kept as an
#   artifact (`*-aab`, 90 days; matched to the APK by run id, APK SHA-256 and version).
#   Not the Google Play build. Missing or expired: APK only, with a warning.
# - iOS: the TestFlight build number, no IPA.
# - macOS: the unsigned, not notarized desktop dmg built here from the tag's commit
#   (desktop-macos-dmg.yml on a Blacksmith Mac), with first-launch steps.
# Notes are the three-language notes on the Hands releases. See
# scripts/github_release_from_hands.py.
#
# The `v*` tag is pushed at release closeout, after the Hands release is published.
# If it was pushed earlier, rerun with workflow_dispatch once the release is live; a
# rerun also fills in a dmg or AAB that was missing the first time.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, e.g. v1.16.1"
        required: true

permissions:
  contents: write
  # Read android-release.yml runs and download their signed AAB artifact.
  actions: read

concurrency:
  group: github-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    name: Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Resolve version and commit
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # vX.Y.Z with X > 0 (the macOS bundle version needs MAJOR > 0).
          if [[ ! "${TAG}" =~ ^v([1-9][0-9]*\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag ${TAG} is not vX.Y.Z (X > 0)"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          # commits/tags/<tag> peels annotated tags to the commit.
          COMMIT="$(gh api "repos/${REPOSITORY}/commits/tags/${TAG}" --jq .sha)"
          [[ "${COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve ${TAG}"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "${TAG} -> ${VERSION} @ ${COMMIT}"

  dmg:
    name: macOS dmg
    needs: tag
    uses: ./.github/workflows/desktop-macos-dmg.yml
    with:
      source_sha: ${{ needs.tag.outputs.commit }}
      version: ${{ needs.tag.outputs.version }}
      runner: blacksmith-12vcpu-macos-latest
      artifact_name: raft-desktop-macos-dmg

  release:
    name: Create or update GitHub Release
    needs: [tag, dmg]
    # A failed dmg build must not hold back the Android/iOS release: attach what exists and
    # warn; a later workflow_dispatch rerun adds the dmg.
    if: ${{ !cancelled() && needs.tag.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      # JDK for scripts/verify_android_aab.sh (strict AAB signature check).
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Download macOS dmg
        if: ${{ needs.dmg.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: raft-desktop-macos-dmg
          path: dmg/

      - name: Prepare notes, APK, AAB and dmg
        env:
          HANDS_API: ${{ secrets.HANDS_API || 'https://hands.build' }}
          HANDS_ANDROID_APP_ID: ${{ secrets.HANDS_ANDROID_APP_ID }}
          HANDS_ANDROID_BEARER_TOKEN: ${{ secrets.QUIVER_BEARER_TOKEN }}
          HANDS_IOS_BEARER_TOKEN: ${{ secrets.QUIVER_IOS_BEARER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DMG_RESULT: ${{ needs.dmg.result }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--tag "${TAG}" --out release-out --aab-repo "${REPOSITORY}")
          mapfile -t DMGS < <(find dmg -maxdepth 1 -type f -name '*.dmg' 2>/dev/null | sort)
          if [ "${#DMGS[@]}" -eq 1 ]; then
            ARGS+=(--dmg "${DMGS[0]}")
          else
            echo "::warning::no macOS dmg (dmg job: ${DMG_RESULT}, files: ${#DMGS[@]}); releasing without it"
            mkdir -p release-out
            echo "macOS dmg missing (dmg job: ${DMG_RESULT})" > release-out/dmg-warning.txt
          fi
          python3 scripts/github_release_from_hands.py "${ARGS[@]}"

      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t ASSETS < <(jq -r '.assets[]' release-out/manifest.json)
          VERSION="$(jq -r .version release-out/manifest.json)"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "Raft ${VERSION}" --notes-file release-out/body.md
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            gh release create "${TAG}" --verify-tag --title "Raft ${VERSION}" \
              --notes-file release-out/body.md "${ASSETS[@]}"
          fi
          {
            echo "### GitHub Release ${TAG}"
            echo
            echo "$(gh release view "${TAG}" --json url -q .url)"
            echo
            printf -- '- `%s`\n' "${ASSETS[@]##*/}"
            jq -r '.warnings[] | "- :warning: " + .' release-out/manifest.json
            if [ -f release-out/dmg-warning.txt ]; then
              echo "- :warning: $(cat release-out/dmg-warning.txt)"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
