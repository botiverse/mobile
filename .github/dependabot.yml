# Dependency update PRs (artin, #wg-mobile 2c500bfc). Weekly, grouped, minor/patch only:
# majors and the Kotlin toolchain move by hand because they need coordinated migrations.
# CocoaPods (compose/iosApp/Podfile) is not supported by Dependabot; compose/package.json is
# the unused Kuikly-era static server and is left out.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /compose
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    # full-ci: the iOS compile and emulator jobs only run with this label.
    labels: [dependencies, full-ci]
    commit-message:
      prefix: build(deps)
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Kotlin, KSP and Compose Multiplatform are released against each other; bump together by hand.
      # (exact prefixes: a bare "org.jetbrains.kotlin*" would also swallow org.jetbrains.kotlinx)
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "org.jetbrains.kotlin.*"
      - dependency-name: com.google.devtools.ksp*
      - dependency-name: org.jetbrains.compose*
      - dependency-name: androidx.compose.runtime:runtime
      - dependency-name: "org.jetbrains.androidx.*"
      # Raft-published artifacts (maven.artifacts.botiverse.dev): released from their own repos.
      - dependency-name: build.raft.*
      - dependency-name: build.hands*
      - dependency-name: com.tencent.kuiklybase*
      # R8 is pinned to a version that verifies RaftAppShellReadyContent (settings.gradle.kts).
      - dependency-name: com.android.tools:r8
    groups:
      # AGP gets its own PR: its R8/D8 changes have broken release dexing before.
      agp:
        patterns: ["com.android.*"]
      androidx:
        patterns: ["androidx.*", "com.google.android.*", "com.google.firebase*", "com.google.gms*"]
      kotlinx-ktor:
        patterns: ["org.jetbrains.kotlinx*", "io.ktor*"]
      test:
        patterns: ["junit*", "org.robolectric*"]
      # okhttp and mockwebserver3 share one catalog version (okhttpTransport): one PR.
      okhttp:
        patterns: ["com.squareup.okhttp3*"]
      libraries:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
